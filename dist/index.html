\"第14章 人格过程\", \"locator\": \"PDF 第 1098–1099 页\", \"pdfPages\": [1098, 1099]}, {\"book\": \"personality\", \"chapter\": \"第14章 人格过程\", \"locator\": \"PDF 第 1142–1143 页\", \"pdfPages\": [1142, 1143]}]\ncandidateRelated: [{\"concept\": \"人与情境交互作用\", \"reason\": \"同样重视环境选择与改变\"}, {\"concept\": \"陈述性自我\", \"reason\": \"包含对自身能力的判断\"}]\n---\n\n## 核心解释\n\n教材介绍班杜拉时，把对自身能力的期待、观察学习与交互决定论联系起来。个体怎样理解自身能力，会影响愿意尝试的行动；行动带来反馈并改变接触到的环境，新的条件又影响学习与期待。这种循环补充了只用外在奖励和惩罚解释行为的思路，突出人的主动参与。\n\n## 一个例子\n\n理解用例：你相信自己能学会讲解，于是主动参加讨论；参与带来练习和同伴反馈，又改变你对能力的看法。用例展示行动、期待和环境之间的循环。\n\n## 理解边界\n\n循环影响不意味着每个环节同样强，也不能用相关性直接确定所有方向。需要具体追踪行动与反馈发生的条件。\n"}, {"id": "personality-rejection-sensitivity", "title": "拒绝敏感性", "english": "Rejection Sensitivity", "kind": "概念", "domain": "personality", "subdomain": "关系中的人格", "summary": "拒绝敏感性指对可能遭到拒绝的线索反应特别强烈。教材在亲密关系中讨论这一倾向，提醒关系困难有时与如何理解含混信号有关。", "aliases": [], "keywords": ["拒绝", "敏感性", "关系", "伴侣", "担忧", "含混线索", "反应", "解释"], "questions": ["为什么回复变慢会让不同人产生不同担忧？", "拒绝敏感与关系中真的出现拒绝怎样区分？"], "sources": [{"book": "personality", "chapter": "第16章 关系与工作", "locator": "PDF 第 1263 页", "pdfPages": [1263]}], "candidateRelated": [{"concept": "成人依恋的焦虑与回避", "reason": "讨论亲近关系中的焦虑与回避"}, {"concept": "情境解释", "reason": "不同解释改变关系反应"}], "sections": [{"heading": "核心解释", "text": "教材把拒绝敏感性描述为对伴侣可能失去兴趣的迹象过度反应的倾向。它关注的既是关系线索，也包括个体如何解释并回应这些线索。反应强弱未必与线索的确定程度相称，因此理解关系问题时，需要把真实互动、预期的拒绝及由此产生的行动区别开来。"}, {"heading": "一个例子", "text": "理解用例：伴侣一天回复较慢，有人把它视为忙碌，有人马上担心对方失去兴趣并强烈追问。用例帮助理解对含混关系线索的不同敏感程度。"}, {"heading": "理解边界", "text": "拒绝敏感性不是临床诊断，也不意味着所有担忧都不合理。必须同时检查现实关系与具体线索，不能将问题全部归于个人。"}], "markdown": "---\nid: \"personality-rejection-sensitivity\"\ntitle: \"拒绝敏感性\"\nenglish: \"Rejection Sensitivity\"\nkind: \"概念\"\ndomain: \"personality\"\nsubdomain: \"关系中的人格\"\nsummary: \"拒绝敏感性指对可能遭到拒绝的线索反应特别强烈。教材在亲密关系中讨论这一倾向，提醒关系困难有时与如何理解含混信号有关。\"\naliases: []\nkeywords: [\"拒绝\", \"敏感性\", \"关系\", \"伴侣\", \"担忧\", \"含混线索\", \"反应\", \"解释\"]\nquestions: [\"为什么回复变慢会让不同人产生不同担忧？\", \"拒绝敏感与关系中真的出现拒绝怎样区分？\"]\nsources: [{\"book\": \"personality\", \"chapter\": \"第16章 关系与工作\", \"locator\": \"PDF 第 1263 页\", \"pdfPages\": [1263]}]\ncandidateRelated: [{\"concept\": \"成人依恋的焦虑与回避\", \"reason\": \"讨论亲近关系中的焦虑与回避\"}, {\"concept\": \"情境解释\", \"reason\": \"不同解释改变关系反应\"}]\n---\n\n## 核心解释\n\n教材把拒绝敏感性描述为对伴侣可能失去兴趣的迹象过度反应的倾向。它关注的既是关系线索，也包括个体如何解释并回应这些线索。反应强弱未必与线索的确定程度相称，因此理解关系问题时，需要把真实互动、预期的拒绝及由此产生的行动区别开来。\n\n## 一个例子\n\n理解用例：伴侣一天回复较慢，有人把它视为忙碌，有人马上担心对方失去兴趣并强烈追问。用例帮助理解对含混关系线索的不同敏感程度。\n\n## 理解边界\n\n拒绝敏感性不是临床诊断，也不意味着所有担忧都不合理。必须同时检查现实关系与具体线索，不能将问题全部归于个人。\n"}, {"id": "personality-relative-consistency", "title": "相对一致性", "english": "Relative Consistency", "kind": "概念", "domain": "personality", "subdomain": "特质与情境", "summary": "人格稳定不要求一个人在所有场合表现完全相同。相对一致性关注人与人之间的相对差异能否保留，因此共同随情境变化与个体差异稳定可以并存。", "aliases": [], "keywords": ["一致性", "相对", "稳定", "个体差异", "情境", "特质", "比较", "行为"], "questions": ["行为随场合改变为什么不必否定人格稳定？", "绝对不变与相对一致有什么不同？"], "sources": [{"book": "personality", "chapter": "第4章 人与情境", "locator": "PDF 第 329 页", "pdfPages": [329]}, {"book": "personality", "chapter": "第18章 我们学到了什么", "locator": "PDF 第 1393 页", "pdfPages": [1393]}], "candidateRelated": [{"concept": "人与情境交互作用", "reason": "解释条件变化与个人模式"}, {"concept": "累积连续性原则", "reason": "关注随年龄变化的稳定程度"}], "sections": [{"heading": "核心解释", "text": "教材区分绝对不变的行为与相对稳定的个体差异。如果在多个情境中，大多数人都改变表现，但某人仍比其他人更爱交谈或更谨慎，跨情境差异就可能具有一致性。这样的理解避免把任何行为变化当成特质不存在，也提醒研究者用多次、合适的观察判断稳定模式。"}, {"heading": "一个例子", "text": "理解用例：两位朋友在聚会上都比图书馆更爱说话，但其中一人在两个场合都更健谈。行为水平变了，两人之间的相对位置却可能保持一致。"}, {"heading": "理解边界", "text": "相对一致不是所有特质都高度稳定，更不能由两个片段推断终身人格。要明确比较的是哪些人、情境、时间和指标。"}], "markdown": "---\nid: \"personality-relative-consistency\"\ntitle: \"相对一致性\"\nenglish: \"Relative Consistency\"\nkind: \"概念\"\ndomain: \"personality\"\nsubdomain: \"特质与情境\"\nsummary: \"人格稳定不要求一个人在所有场合表现完全相同。相对一致性关注人与人之间的相对差异能否保留，因此共同随情境变化与个体差异稳定可以并存。\"\naliases: []\nkeywords: [\"一致性\", \"相对\", \"稳定\", \"个体差异\", \"情境\", \"特质\", \"比较\", \"行为\"]\nquestions: [\"行为随场合改变为什么不必否定人格稳定？\", \"绝对不变与相对一致有什么不同？\"]\nsources: [{\"book\": \"personality\", \"chapter\": \"第4章 人与情境\", \"locator\": \"PDF 第 329 页\", \"pdfPages\": [329]}, {\"book\": \"personality\", \"chapter\": \"第18章 我们学到了什么\", \"locator\": \"PDF 第 1393 页\", \"pdfPages\": [1393]}]\ncandidateRelated: [{\"concept\": \"人与情境交互作用\", \"reason\": \"解释条件变化与个人模式\"}, {\"concept\": \"累积连续性原则\", \"reason\": \"关注随年龄变化的稳定程度\"}]\n---\n\n## 核心解释\n\n教材区分绝对不变的行为与相对稳定的个体差异。如果在多个情境中，大多数人都改变表现，但某人仍比其他人更爱交谈或更谨慎，跨情境差异就可能具有一致性。这样的理解避免把任何行为变化当成特质不存在，也提醒研究者用多次、合适的观察判断稳定模式。\n\n## 一个例子\n\n理解用例：两位朋友在聚会上都比图书馆更爱说话，但其中一人在两个场合都更健谈。行为水平变了，两人之间的相对位置却可能保持一致。\n\n## 理解边界\n\n相对一致不是所有特质都高度稳定，更不能由两个片段推断终身人格。要明确比较的是哪些人、情境、时间和指标。\n"}, {"id": "personality-replication-open-science", "title": "复制与开放科学", "english": "Replication and Open Science", "kind": "方法", "domain": "foundations", "subdomain": "研究可靠性", "summary": "单次研究不足以确定一个结论能否依赖。复制研究重新检验发现，开放科学推动完整报告方法、结果和资料，让他人能够检查并延伸已有证据。", "aliases": [], "keywords": ["复制", "重复", "开放科学", "透明", "报告", "数据", "可靠性", "发表偏差"], "questions": ["为什么没有得到预期结果也值得完整报告？", "一次复制失败应怎样影响对原结论的看法？"], "sources": [{"book": "personality", "chapter": "第3章 人格评估与开放科学", "locator": "PDF 第 255–256 页", "pdfPages": [255, 256]}], "candidateRelated": [{"concept": "效应量", "reason": "重复研究也需比较结果幅度"}, {"concept": "构念效度", "reason": "复制仍依赖合适测量"}], "sections": [{"heading": "核心解释", "text": "教材把复制视为评估研究发现可靠性的关键步骤，并提醒单个研究不能独自建立结论。开放科学强调透明报告方法与全部结果，包括不符合预期的发现，并尽可能让他人检查数据。这些做法共同减少只看到成功结果的偏差，也帮助研究者辨别结论在哪些条件下成立。"}, {"heading": "一个例子", "text": "理解用例：一个小组发现某种反馈提高任务坚持，另一个小组按同样程序重做并公开结果。即便没有得到相同模式，这份结果仍能帮助界定原发现的条件。"}, {"heading": "理解边界", "text": "一次复制成功或失败都不能代替全面判断。需要看方法差异、测量和证据积累；公开资料本身也不保证原结论正确。"}], "markdown": "---\nid: \"personality-replication-open-science\"\ntitle: \"复制与开放科学\"\nenglish: \"Replication and Open Science\"\nkind: \"方法\"\ndomain: \"foundations\"\nsubdomain: \"研究可靠性\"\nsummary: \"单次研究不足以确定一个结论能否依赖。复制研究重新检验发现，开放科学推动完整报告方法、结果和资料，让他人能够检查并延伸已有证据。\"\naliases: []\nkeywords: [\"复制\", \"重复\", \"开放科学\", \"透明\", \"报告\", \"数据\", \"可靠性\", \"发表偏差\"]\nquestions: [\"为什么没有得到预期结果也值得完整报告？\", \"一次复制失败应怎样影响对原结论的看法？\"]\nsources: [{\"book\": \"personality\", \"chapter\": \"第3章 人格评估与开放科学\", \"locator\": \"PDF 第 255–256 页\", \"pdfPages\": [255, 256]}]\ncandidateRelated: [{\"concept\": \"效应量\", \"reason\": \"重复研究也需比较结果幅度\"}, {\"concept\": \"构念效度\", \"reason\": \"复制仍依赖合适测量\"}]\n---\n\n## 核心解释\n\n教材把复制视为评估研究发现可靠性的关键步骤，并提醒单个研究不能独自建立结论。开放科学强调透明报告方法与全部结果，包括不符合预期的发现，并尽可能让他人检查数据。这些做法共同减少只看到成功结果的偏差，也帮助研究者辨别结论在哪些条件下成立。\n\n## 一个例子\n\n理解用例：一个小组发现某种反馈提高任务坚持，另一个小组按同样程序重做并公开结果。即便没有得到相同模式，这份结果仍能帮助界定原发现的条件。\n\n## 理解边界\n\n一次复制成功或失败都不能代替全面判断。需要看方法差异、测量和证据积累；公开资料本身也不保证原结论正确。\n"}, {"id": "personality-rogerian-humanism", "title": "罗杰斯的人本取向", "english": "Rogerian Humanism", "kind": "理论", "domain": "personality", "subdomain": "人本心理学", "summary": "罗杰斯强调理解个人的主观经验，并以成长和自我实现理解人的发展。无条件积极关注与价值条件的区别，是教材说明自我接纳和充分发挥功能的重要线索。", "aliases": ["无条件积极关注"], "keywords": ["罗杰斯", "人本", "自我实现", "积极关注", "价值条件", "自我接纳", "主观经验", "成长"], "questions": ["有条件的自我价值会怎样改变对经验的理解？", "接纳一个人与赞同他的全部行为有什么区别？"], "sources": [{"book": "personality", "chapter": "第12章 人本积极心理与幸福", "locator": "PDF 第 912 页", "pdfPages": [912]}, {"book": "personality", "chapter": "第12章 人本积极心理与幸福", "locator": "PDF 第 918–920 页", "pdfPages": [918, 919, 920]}, {"book": "general", "chapter": "第14章 · 人格", "locator": "PDF 第 1218 页", "pdfPages": [1218]}], "candidateRelated": [{"concept": "自我差异理论", "reason": "同样关注现实与理想自我"}, {"concept": "个人建构理论", "reason": "共享对主观经验的关注"}], "sections": [{"heading": "核心解释", "text": "罗杰斯认为，人具有维持并发展自身的倾向，成长需要支持性环境，其方向仍来自个人的主观经验与选择。若只在满足外界标准时才感到有价值，便可能形成价值条件，扭曲经验以保护自我。无条件积极关注则支持更开放地认识感受与现实，成为能够选择并承担责任的人。"}, {"heading": "一个例子", "text": "理解用例：一次任务失败后，重要他人仍表达对你这个人的关心，同时讨论需要修改的做法。用例用于区分接纳人的价值与要求某项表现才能获得接纳。"}, {"heading": "理解边界", "text": "无条件积极关注不等于赞同一切行为。这里介绍教材中的人本理论，不应把理想的充分功能状态当作对现实个人的硬性标准。"}], "markdown": "---\nid: \"personality-rogerian-humanism\"\ntitle: \"罗杰斯的人本取向\"\nenglish: \"Rogerian Humanism\"\nkind: \"理论\"\ndomain: \"personality\"\nsubdomain: \"人本心理学\"\nsummary: \"罗杰斯强调理解个人的主观经验，并以成长和自我实现理解人的发展。无条件积极关注与价值条件的区别，是教材说明自我接纳和充分发挥功能的重要线索。\"\naliases: [\"无条件积极关注\"]\nkeywords: [\"罗杰斯\", \"人本\", \"自我实现\", \"积极关注\", \"价值条件\", \"自我接纳\", \"主观经验\", \"成长\"]\nquestions: [\"有条件的自我价值会怎样改变对经验的理解？\", \"接纳一个人与赞同他的全部行为有什么区别？\"]\nsources: [{\"book\": \"personality\", \"chapter\": \"第12章 人本积极心理与幸福\", \"locator\": \"PDF 第 912 页\", \"pdfPages\": [912]}, {\"book\": \"personality\", \"chapter\": \"第12章 人本积极心理与幸福\", \"locator\": \"PDF 第 918–920 页\", \"pdfPages\": [918, 919, 920]}, {\"book\": \"general\", \"chapter\": \"第14章 · 人格\", \"locator\": \"PDF 第 1218 页\", \"pdfPages\": [1218]}]\ncandidateRelated: [{\"concept\": \"自我差异理论\", \"reason\": \"同样关注现实与理想自我\"}, {\"concept\": \"个人建构理论\", \"reason\": \"共享对主观经验的关注\"}]\n---\n\n## 核心解释\n\n罗杰斯认为，人具有维持并发展自身的倾向，成长需要支持性环境，其方向仍来自个人的主观经验与选择。若只在满足外界标准时才感到有价值，便可能形成价值条件，扭曲经验以保护自我。无条件积极关注则支持更开放地认识感受与现实，成为能够选择并承担责任的人。\n\n## 一个例子\n\n理解用例：一次任务失败后，重要他人仍表达对你这个人的关心，同时讨论需要修改的做法。用例用于区分接纳人的价值与要求某项表现才能获得接纳。\n\n## 理解边界\n\n无条件积极关注不等于赞同一切行为。这里介绍教材中的人本理论，不应把理想的充分功能状态当作对现实个人的硬性标准。\n"}, {"id": "personality-self-efficacy", "title": "自我效能", "english": "Self-Efficacy", "kind": "概念", "domain": "personality", "subdomain": "社会学习与动机", "summary": "自我效能是相信自己尝试后能够完成某项行动或目标的程度。教材强调，这种能力期待会影响愿意尝试什么及能否坚持，并可在实际行动中改变。", "aliases": [], "keywords": ["自我效能", "能力期待", "班杜拉", "尝试", "坚持", "行动经验", "信念", "学习"], "questions": ["为什么实际做成一次能改变以后尝试的意愿？", "自我效能与觉得自己有价值有什么不同？"], "sources": [{"book": "personality", "chapter": "第14章 人格过程", "locator": "PDF 第 1098–1099 页", "pdfPages": [1098, 1099]}, {"book": "personality", "chapter": "第14章 人格过程", "locator": "PDF 第 1102 页", "pdfPages": [1102]}], "candidateRelated": [{"concept": "交互决定论", "reason": "能力期待在行动与反馈中变化"}, {"concept": "控制点", "reason": "关注行动与结果是否相连"}], "sections": [{"heading": "核心解释", "text": "班杜拉的自我效能概念关注对自身行动能力的信念。认为自己做不到时，即便存在机会，也可能不愿开始或很快放弃；成功执行、观察他人及他人的鼓励则可能改变能力期待。教材特别强调实际行动提供的经验，但也区分这种信念与客观能力，二者并不总是一致。"}, {"heading": "一个例子", "text": "理解用例：你原本觉得自己不能清楚讲解一道题，在准备后成功向同伴说明，便更愿意接受下一次讲解任务。用例展示行动经验如何改变能力期待。"}, {"heading": "理解边界", "text": "自我效能不是笼统自尊，也不等于实际技能。信念有助于理解尝试与坚持，但不能把相信自己当作能力和条件的替代品。"}], "markdown": "---\nid: \"personality-self-efficacy\"\ntitle: \"自我效能\"\nenglish: \"Self-Efficacy\"\nkind: \"概念\"\ndomain: \"personality\"\nsubdomain: \"社会学习与动机\"\nsummary: \"自我效能是相信自己尝试后能够完成某项行动或目标的程度。教材强调，这种能力期待会影响愿意尝试什么及能否坚持，并可在实际行动中改变。\"\naliases: []\nkeywords: [\"自我效能\", \"能力期待\", \"班杜拉\", \"尝试\", \"坚持\", \"行动经验\", \"信念\", \"学习\"]\nquestions: [\"为什么实际做成一次能改变以后尝试的意愿？\", \"自我效能与觉得自己有价值有什么不同？\"]\nsources: [{\"book\": \"personality\", \"chapter\": \"第14章 人格过程\", \"locator\": \"PDF 第 1098–1099 页\", \"pdfPages\": [1098, 1099]}, {\"book\": \"personality\", \"chapter\": \"第14章 人格过程\", \"locator\": \"PDF 第 1102 页\", \"pdfPages\": [1102]}]\ncandidateRelated: [{\"concept\": \"交互决定论\", \"reason\": \"能力期待在行动与反馈中变化\"}, {\"concept\": \"控制点\", \"reason\": \"关注行动与结果是否相连\"}]\n---\n\n## 核心解释\n\n班杜拉的自我效能概念关注对自身行动能力的信念。认为自己做不到时，即便存在机会，也可能不愿开始或很快放弃；成功执行、观察他人及他人的鼓励则可能改变能力期待。教材特别强调实际行动提供的经验，但也区分这种信念与客观能力，二者并不总是一致。\n\n## 一个例子\n\n理解用例：你原本觉得自己不能清楚讲解一道题，在准备后成功向同伴说明，便更愿意接受下一次讲解任务。用例展示行动经验如何改变能力期待。\n\n## 理解边界\n\n自我效能不是笼统自尊，也不等于实际技能。信念有助于理解尝试与坚持，但不能把相信自己当作能力和条件的替代品。\n"}, {"id": "personality-self-monitoring", "title": "自我监控", "english": "Self-Monitoring", "kind": "概念", "domain": "personality", "subdomain": "人格与社会呈现", "summary": "自我监控描述人会在多大程度上依据场合线索调整外在表现。高低倾向可以分别带来灵活或一致等特点，教材提醒不能直接把其中一端当作更好的人格。", "aliases": [], "keywords": ["自我监控", "自我呈现", "场合", "线索", "灵活", "一致", "内在倾向", "社会行为"], "questions": ["为什么有些人更容易随着场合改变表现？", "自我监控高低是否能直接判断一个人的真诚程度？"], "sources": [{"book": "personality", "chapter": "第6章 特质与类型", "locator": "PDF 第 416 页", "pdfPages": [416]}, {"book": "personality", "chapter": "第6章 特质与类型", "locator": "PDF 第 419 页", "pdfPages": [419]}], "candidateRelated": [{"concept": "人与情境交互作用", "reason": "场合与个人特征共同形成表现"}, {"concept": "相对一致性", "reason": "提醒稳定不要求行为完全相同"}], "sections": [{"heading": "核心解释", "text": "高自我监控者较留意场合中怎样表现才合适，并据此调整言谈和行动；低自我监控者则更多依照内在倾向，在不同场合保持较一致的表现。教材把它作为单一特质研究的例子，同时说明两端均能从优点或局限理解，不能把灵活等同于虚伪，或把一致等同于诚实。"}, {"heading": "一个例子", "text": "理解用例：有人在热闹活动中十分活跃，在正式研讨中很严肃；另一个人则在两种场合都保持相近风格。用例说明表现随场合调整的个体差异。"}, {"heading": "理解边界", "text": "自我监控不是自我控制的同义词，也不能从一次角色变化判断人格。高低都不是道德等级，应结合多种情境中的模式理解。"}], "markdown": "---\nid: \"personality-self-monitoring\"\ntitle: \"自我监控\"\nenglish: \"Self-Monitoring\"\nkind: \"概念\"\ndomain: \"personality\"\nsubdomain: \"人格与社会呈现\"\nsummary: \"自我监控描述人会在多大程度上依据场合线索调整外在表现。高低倾向可以分别带来灵活或一致等特点，教材提醒不能直接把其中一端当作更好的人格。\"\naliases: []\nkeywords: [\"自我监控\", \"自我呈现\", \"场合\", \"线索\", \"灵活\", \"一致\", \"内在倾向\", \"社会行为\"]\nquestions: [\"为什么有些人更容易随着场合改变表现？\", \"自我监控高低是否能直接判断一个人的真诚程度？\"]\nsources: [{\"book\": \"personality\", \"chapter\": \"第6章 特质与类型\", \"locator\": \"PDF 第 416 页\", \"pdfPages\": [416]}, {\"book\": \"personality\", \"chapter\": \"第6章 特质与类型\", \"locator\": \"PDF 第 419 页\", \"pdfPages\": [419]}]\ncandidateRelated: [{\"concept\": \"人与情境交互作用\", \"reason\": \"场合与个人特征共同形成表现\"}, {\"concept\": \"相对一致性\", \"reason\": \"提醒稳定不要求行为完全相同\"}]\n---\n\n## 核心解释\n\n高自我监控者较留意场合中怎样表现才合适，并据此调整言谈和行动；低自我监控者则更多依照内在倾向，在不同场合保持较一致的表现。教材把它作为单一特质研究的例子，同时说明两端均能从优点或局限理解，不能把灵活等同于虚伪，或把一致等同于诚实。\n\n## 一个例子\n\n理解用例：有人在热闹活动中十分活跃，在正式研讨中很严肃；另一个人则在两种场合都保持相近风格。用例说明表现随场合调整的个体差异。\n\n## 理解边界\n\n自我监控不是自我控制的同义词，也不能从一次角色变化判断人格。高低都不是道德等级，应结合多种情境中的模式理解。\n"}, {"id": "personality-structural-conflict", "title": "本我自我与超我", "english": "Id Ego and Superego", "kind": "模型", "domain": "personality", "subdomain": "精神分析", "summary": "经典精神分析用本我、自我和超我描述欲望、现实要求与内化标准之间的冲突。它是一种历史性的理论模型，应与直接可观察的脑结构区分开来。", "aliases": [], "keywords": ["本我", "自我", "超我", "冲突", "欲望", "规范", "现实", "精神分析"], "questions": ["经典精神分析怎样描述内在要求之间的冲突？", "本我自我与超我是具体脑区吗？"], "sources": [{"book": "personality", "chapter": "第10章 精神分析基础", "locator": "PDF 第 741–742 页", "pdfPages": [741, 742]}, {"book": "personality", "chapter": "第10章 精神分析基础", "locator": "PDF 第 745 页", "pdfPages": [745]}, {"book": "personality", "chapter": "第10章 精神分析基础", "locator": "PDF 第 812–814 页", "pdfPages": [812, 813, 814]}], "candidateRelated": [{"concept": "防御机制", "reason": "在冲突与焦虑中发挥作用"}, {"concept": "人格研究取向的互补性", "reason": "说明精神分析的特定问题意识"}], "sections": [{"heading": "核心解释", "text": "在经典精神分析框架中，本我代表驱力与立即满足的要求，自我需要处理现实约束，超我涉及内化的规范和要求。行为可被解释为这些力量之间的协调与冲突，焦虑则可能出现在难以调和之时。教材同时介绍这一模型的解释雄心与概念定义、检验方式等方面的批评。"}, {"heading": "一个例子", "text": "理解用例：你很想立刻休息，却知道必须完成承诺，也意识到精力有限。这个用例借不同要求的拉扯帮助理解模型，并不是将三个独立实体放进头脑。"}, {"heading": "理解边界", "text": "这些概念不是已被直接观察到的脑部部件。经典模型的可检验性与证据限制需要保留，不能据此随意解释他人内心。"}], "markdown": "---\nid: \"personality-structural-conflict\"\ntitle: \"本我自我与超我\"\nenglish: \"Id Ego and Superego\"\nkind: \"模型\"\ndomain: \"personality\"\nsubdomain: \"精神分析\"\nsummary: \"经典精神分析用本我、自我和超我描述欲望、现实要求与内化标准之间的冲突。它是一种历史性的理论模型，应与直接可观察的脑结构区分开来。\"\naliases: []\nkeywords: [\"本我\", \"自我\", \"超我\", \"冲突\", \"欲望\", \"规范\", \"现实\", \"精神分析\"]\nquestions: [\"经典精神分析怎样描述内在要求之间的冲突？\", \"本我自我与超我是具体脑区吗？\"]\nsources: [{\"book\": \"personality\", \"chapter\": \"第10章 精神分析基础\", \"locator\": \"PDF 第 741–742 页\", \"pdfPages\": [741, 742]}, {\"book\": \"personality\", \"chapter\": \"第10章 精神分析基础\", \"locator\": \"PDF 第 745 页\", \"pdfPages\": [745]}, {\"book\": \"personality\", \"chapter\": \"第10章 精神分析基础\", \"locator\": \"PDF 第 812–814 页\", \"pdfPages\": [812, 813, 814]}]\ncandidateRelated: [{\"concept\": \"防御机制\", \"reason\": \"在冲突与焦虑中发挥作用\"}, {\"concept\": \"人格研究取向的互补性\", \"reason\": \"说明精神分析的特定问题意识\"}]\n---\n\n## 核心解释\n\n在经典精神分析框架中，本我代表驱力与立即满足的要求，自我需要处理现实约束，超我涉及内化的规范和要求。行为可被解释为这些力量之间的协调与冲突，焦虑则可能出现在难以调和之时。教材同时介绍这一模型的解释雄心与概念定义、检验方式等方面的批评。\n\n## 一个例子\n\n理解用例：你很想立刻休息，却知道必须完成承诺，也意识到精力有限。这个用例借不同要求的拉扯帮助理解模型，并不是将三个独立实体放进头脑。\n\n## 理解边界\n\n这些概念不是已被直接观察到的脑部部件。经典模型的可检验性与证据限制需要保留，不能据此随意解释他人内心。\n"}, {"id": "personality-traits-types", "title": "特质与类型的区别", "english": "Traits and Types", "kind": "概念", "domain": "personality", "subdomain": "人格结构", "summary": "特质描述人在某个方面差多少，类型则把人归入不同类别。教材提醒，按分数切割类型可能把相近的人分开，也可能掩盖同类内部的大幅差异。", "aliases": [], "keywords": ["特质", "类型", "连续", "分类", "阈值", "差异", "预测", "人格测量"], "questions": ["为什么被分到不同类型的人反而可能很相似？", "人格分类何时比连续分数提供更多信息？"], "sources": [{"book": "personality", "chapter": "第6章 特质与类型", "locator": "PDF 第 480–481 页", "pdfPages": [480, 481]}], "candidateRelated": [{"concept": "大五人格", "reason": "常用连续维度描述差异"}, {"concept": "构念效度", "reason": "检验类型标签是否有依据"}], "sections": [{"heading": "核心解释", "text": "特质取向通常关注连续程度，类型取向则寻找质的类别差别。若把连续得分按门槛分成两类，门槛两侧的人可能非常相似，同类中距离较远的人反而差异更大。教材据此检查类型是否真正增加预测和理解，并提醒流行程度不能代替可靠性与效度证据。"}, {"heading": "一个例子", "text": "理解用例：某量表规定五十分以上叫外向型，四十九分与五十一分便被分到两类，但五十一分与九十分却属于同类。这个用例展示人为阈值可能产生的信息损失。"}, {"heading": "理解边界", "text": "这不是预先否定所有分类。关键是类别是否有可靠依据，能否提供超出连续维度的解释或预测，而不只是名字易记。"}], "markdown": "---\nid: \"personality-traits-types\"\ntitle: \"特质与类型的区别\"\nenglish: \"Traits and Types\"\nkind: \"概念\"\ndomain: \"personality\"\nsubdomain: \"人格结构\"\nsummary: \"特质描述人在某个方面差多少，类型则把人归入不同类别。教材提醒，按分数切割类型可能把相近的人分开，也可能掩盖同类内部的大幅差异。\"\naliases: []\nkeywords: [\"特质\", \"类型\", \"连续\", \"分类\", \"阈值\", \"差异\", \"预测\", \"人格测量\"]\nquestions: [\"为什么被分到不同类型的人反而可能很相似？\", \"人格分类何时比连续分数提供更多信息？\"]\nsources: [{\"book\": \"personality\", \"chapter\": \"第6章 特质与类型\", \"locator\": \"PDF 第 480–481 页\", \"pdfPages\": [480, 481]}]\ncandidateRelated: [{\"concept\": \"大五人格\", \"reason\": \"常用连续维度描述差异\"}, {\"concept\": \"构念效度\", \"reason\": \"检验类型标签是否有依据\"}]\n---\n\n## 核心解释\n\n特质取向通常关注连续程度，类型取向则寻找质的类别差别。若把连续得分按门槛分成两类，门槛两侧的人可能非常相似，同类中距离较远的人反而差异更大。教材据此检查类型是否真正增加预测和理解，并提醒流行程度不能代替可靠性与效度证据。\n\n## 一个例子\n\n理解用例：某量表规定五十分以上叫外向型，四十九分与五十一分便被分到两类，但五十一分与九十分却属于同类。这个用例展示人为阈值可能产生的信息损失。\n\n## 理解边界\n\n这不是预先否定所有分类。关键是类别是否有可靠依据，能否提供超出连续维度的解释或预测，而不只是名字易记。\n"}, {"id": "social-affective-forecasting", "title": "情感预测", "english": "Affective Forecasting", "kind": "心理过程", "domain": "emotion", "subdomain": "情绪与判断", "summary": "情感预测是估计未来事件将怎样影响自己的感受。人有时过度聚焦某件事，忽略日常生活的其他部分，因此高估快乐或难过会持续多久。", "aliases": [], "keywords": ["预测", "情绪", "幸福", "未来", "焦点偏差", "focalism", "免疫忽视", "immune neglect", "持续时间", "适应"], "questions": ["为什么我们会高估某件事对未来心情的影响？", "预测情绪时忽略了哪些生活内容？"], "sources": [{"book": "social", "chapter": "第5章 情绪与幸福", "locator": "PDF 第 255–257 页", "pdfPages": [255, 256, 257]}, {"book": "social", "chapter": "第5章 情绪与幸福", "locator": "PDF 第 261 页", "pdfPages": [261]}], " cial", "chapter": "第9章 关系与吸引", "locator": "PDF 第 450 页", "pdfPages": [450]}], "candidateRelated": [{"concept": "拒绝敏感性", "reason": "同样关注关系威胁"}, {"concept": "关系承诺投资模型", "reason": "从另一角度解释关系维持"}, {"title": "儿童依恋与安全基地", "reason": "成人关系模式与早期安全经验相关，但两者不是同一测量"}], "sections": [{"heading": "核心解释", "text": "成人依恋研究用依恋焦虑与依恋回避两个维度描述亲密关系差异：前者涉及对拒绝的担心，后者涉及对亲近的不自在。这些倾向影响信任与关系反应。早期照料经验可以参与其形成，但相对稳定并不等于终身固定，后续经历和不同伴侣也可能改变关系模式。"}, {"heading": "一个例子", "text": "理解用例：面对朋友暂时没有回复，有人能安心等候，有人很快担心关系变差，也有人干脆不愿继续靠近。这个用例展示关系反应的不同，不是给人物作诊断。"}, {"heading": "理解边界", "text": "不能凭一次互动给人贴固定依恋类型，也不能把成年关系全部归因于童年。应同时考察当前关系、经历和具体情境。"}], "markdown": "---\nid: \"social-attachment\"\ntitle: \"成人依恋的焦虑与回避\"\nenglish: \"Adult Attachment Anxiety and Avoidance\"\nkind: \"理论\"\ndomain: \"development\"\nsubdomain: \"依恋与关系\"\nsummary: \"成人依恋用焦虑与回避描述亲密关系中的差异：一者涉及担心被拒绝，另一者涉及对亲近的不自在；两种倾向也可能随关系经历变化。\"\naliases: [\"成人依恋\", \"Adult Attachment\"]\nkeywords: [\"成人依恋\", \"依恋焦虑\", \"依恋回避\", \"亲密关系\", \"拒绝担忧\", \"安全感\", \"信任\", \"关系变化\", \"Adult Attachment\"]\nquestions: [\"担心被拒绝与不愿亲近他人是同一类关系倾向吗？\", \"为什么相对稳定的成人依恋仍可能随关系经历变化？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"第9章 关系与吸引\", \"locator\": \"PDF 第 450 页\", \"pdfPages\": [450]}]\ncandidateRelated: [{\"concept\": \"拒绝敏感性\", \"reason\": \"同样关注关系威胁\"}, {\"concept\": \"关系承诺投资模型\", \"reason\": \"从另一角度解释关系维持\"}, {\"title\": \"儿童依恋与安全基地\", \"reason\": \"成人关系模式与早期安全经验相关，但两者不是同一测量\"}]\n---\n\n## 核心解释\n\n成人依恋研究用依恋焦虑与依恋回避两个维度描述亲密关系差异：前者涉及对拒绝的担心，后者涉及对亲近的不自在。这些倾向影响信任与关系反应。早期照料经验可以参与其形成，但相对稳定并不等于终身固定，后续经历和不同伴侣也可能改变关系模式。\n\n## 一个例子\n\n理解用例：面对朋友暂时没有回复，有人能安心等候，有人很快担心关系变差，也有人干脆不愿继续靠近。这个用例展示关系反应的不同，不是给人物作诊断。\n\n## 理解边界\n\n不能凭一次互动给人贴固定依恋类型，也不能把成年关系全部归因于童年。应同时考察当前关系、经历和具体情境。\n"}, {"id": "social-attitude-inoculation", "title": "态度接种", "english": "Attitude Inoculation", "kind": "心理过程", "domain": "social", "subdomain": "说服与态度", "summary": "先接触较弱的反对意见并尝试回应，可能增强抵抗后续说服的能力。态度接种强调反驳准备，区别于只反复听到支持自己立场的信息。", "aliases": ["说服接种"], "keywords": ["态度接种", "反驳", "说服", "抵抗", "反方论点", "准备", "态度", "知识"], "que ages": [556]}], "candidateRelated": [{"concept": "基本归因错误", "reason": "同属行为原因判断问题"}, {"concept": "刻板印象威胁", "reason": "偏见线索可能造成另一类负担"}], "sections": [{"heading": "核心解释", "text": "归因模糊性是对待遇原因难以确定的处境：负面反馈可能来自真实表现，也可能来自偏见；正面反馈可能是真诚肯定，也可能与群体身份有关。教材把这一问题放在污名及偏见的后果中讨论，说明个体不仅承受待遇本身，还要额外判断评价是否可信、究竟说明了什么。"}, {"heading": "一个例子", "text": "理解用例：一位学生得到积极评价后仍犹豫：这是作品确实出色，还是评阅者因为自己的群体身份刻意宽容？这里的不确定来自原因难分，而非评价一定虚假。"}, {"heading": "理解边界", "text": "怀疑评价受到偏见影响，不等于已经证明偏见存在。应区分客观歧视、对歧视的判断以及归因原因尚不明确。"}], "markdown": "---\nid: \"social-attributional-ambiguity\"\ntitle: \"归因模糊性\"\nenglish: \"Attributional Ambiguity\"\nkind: \"心理过程\"\ndomain: \"social\"\nsubdomain: \"偏见的影响\"\nsummary: \"处于受污名化群体的人，可能难以判断他人的评价源于真实表现还是偏见。归因模糊性揭示正面和负面反馈都可能伴随解释上的不确定。\"\naliases: []\nkeywords: [\"归因模糊\", \"污名\", \"偏见\", \"反馈\", \"评价\", \"不确定\", \"身份\", \"待遇\"]\nquestions: [\"为什么正面反馈也可能让人难以安心？\", \"无法确定评价原因与已经证实偏见有什么区别？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"第11章 生活在偏见世界中\", \"locator\": \"PDF 第 556 页\", \"pdfPages\": [556]}]\ncandidateRelated: [{\"concept\": \"基本归因错误\", \"reason\": \"同属行为原因判断问题\"}, {\"concept\": \"刻板印象威胁\", \"reason\": \"偏见线索可能造成另一类负担\"}]\n---\n\n## 核心解释\n\n归因模糊性是对待遇原因难以确定的处境：负面反馈可能来自真实表现，也可能来自偏见；正面反馈可能是真诚肯定，也可能与群体身份有关。教材把这一问题放在污名及偏见的后果中讨论，说明个体不仅承受待遇本身，还要额外判断评价是否可信、究竟说明了什么。\n\n## 一个例子\n\n理解用例：一位学生得到积极评价后仍犹豫：这是作品确实出色，还是评阅者因为自己的群体身份刻意宽容？这里的不确定来自原因难分，而非评价一定虚假。\n\n## 理解边界\n\n怀疑评价受到偏见影响，不等于已经证明偏见存在。应区分客观歧视、对歧视的判断以及归因原因尚不明确。\n"}, {"id": "social-automatic-controlled-processing", "title": "自动与受控加工", "english": "Automatic and Controlled Processing", "kind": "心理过程", "domain": "social", "subdomain": "社会认知", "summary": "社会判断既可能迅速、无意地发生，也可能依赖有意识的检查与推敲。区分自动和受控加工，有助于理解人为何未必能报告判断形成的全部过程。", "aliases": [], "keywords": ["自动", "受控", "意识", "无意识", "加工", "判断", "注意", "认知资源"], "questions": ["为什么人有时说不清自己的判断从何而来？", "认真思考与快速印象会怎样共同影响判断？"], "sources": [{"book": "social", "chapter": "第1章 社会心理学导论", "locator": "PDF 第 45–48 页", "pdfPages": [45, 46, 47, 48]}, {"book": "social", "chapter": "第1章 社会心理学导论", "locator": "PDF 第 73 页", "pdfPages": [73]}], "candidateRelated": [{"concept": "精细加工可能性模型", "reason": "在说服领域区分加工方式"}, {"concept": "情境解释", "reason": "可由不同加工方式产生"}], "sections": [{"heading": "核心解释", "text": "教材区分较少需要意识参与的自动加工与较为主动、需要认知资源的受控加工。自动加工可以迅速提供解释与反应，人却未必知道其中哪些线索发挥了作用。受控加工则支持进一步检查、比较和修正。理解社会行为需要考虑两类过程如何共同参与，而非只听事后的理由。"}, {"heading": "一个例子", "text": "理解用例：第一次见面时，你很快觉得某位同学可靠；随后共同完成作业时，你再认真核对他是否守约。前一个印象与后一个判断动用了不同程度的思考。"}, {"heading": "理解边界", "text": "自动不等于必然错误，受控也不保证结论准确。不能仅根据回答快慢，就确定某个判断完全来自其中一种加工。"}], "markdown": "---\nid: \"social-automatic-controlled-processing\"\ntitle: \"自动与受控加工\"\nenglish: \"Automatic and Controlled Processing\"\nkind: \"心理过程\"\ndomain: \"social\"\nsubdomain: \"社会认知\"\nsummary: \"社会判断既可能迅速、无意地发生，也可能依赖有意识的检查与推敲。区分自动和受控加工，有助于理解人为何未必能报告判断形成的全部过程。\"\naliases: []\nkeywords: [\"自动\", \"受控\", \"意识\", \"无意识\", \"加工\", \"判断\", \"注意\", \"认知资源\"]\nquestions: [\"为什么人有时说不清自己的判断从何而来？\", \"认真思考与快速印象会怎样共同影响判断？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"第1章 社会心理学导论\", \"locator\": \"PDF 第 45–48 页\", \"pdfPages\": [45, 46, 47, 48]}, {\"book\": \"social\", \"chapter\": \"第1章 社会心理学导论\", \"locator\": \"PDF 第 73 页\", \"pdfPages\": [73]}]\ncandidateRelated: [{\"concept\": \"精细加工可能性模型\", \"reason\": \"在说服领域区分加工方式\"}, {\"concept\": \"情境解释\", \"reason\": \"可由不同加工方式产生\"}]\n---\n\n## 核心解释\n\n教材区分较少需要意识参与的自动加工与较为主动、需要认知资源的受控加工。自动加工可以迅速提供解释与反应，人却未必知道其中哪些线索发挥了作用。受控加工则支持进一步检查、比较和修正。理解社会行为需要考虑两类过程如何共同参与，而非只听事后的理由。\n\n## 一个例子\n\n理解用例：第一次见面时，你很快觉得某位同学可靠；随后共同完成作业时，你再认真核对他是否守约。前一个印象与后一个判断动用了不同程度的思考。\n\n## 理解边界\n\n自动不等于必然错误，受控也不保证结论准确。不能仅根据回答快慢，就确定某个判断完全来自其中一种加工。\n"}, {"id": "social-broaden-build", "title": "拓展与建构假说", "english": "Broaden-and-Build Hypothesis", "kind": "理论", "domain": "emotion", "subdomain": "积极情绪", "summary": "积极情绪可能扩展当下的思考与行动范围，并通过探索和联系积累后续资源。拓展与建构假说关注情绪的延续影响，而不仅是瞬时愉快感。", "aliases": [], "keywords": ["积极情绪", "拓展", "建构", "资源", "关系", "探索", "注意", "行动"], "questions": ["积极情绪怎样可能影响之后的社会关系？", "短暂愉快如何与长期资源联系起来？"], "sources": [{"book": "social", "chapter": "第5章 情绪与幸福", "locator": "PDF 第 261 页", "pdfPages": [261]}], "candidateRelated": [{"concept": "情感预测", "reason": "关注人如何预想未来情绪"}, {"concept": "情绪的社会功能", "reason": "关注情绪与关系的联系"}], "sections": [{"heading": "核心解释", "text": "拓展与建构假说认为，某些积极情绪能使人的注意和行动倾向更加开放，促使人接触新的想法、活动与关系。这样的短期拓展可以逐步形成以后能够使用的资源。教材特别联系社会理解说明，积极情绪可帮助人看见彼此相似之处，并为更强的社会联系创造条件。"}, {"heading": "一个例子", "text": "理解用例：小组合作顺利后，成员心情轻松，愿意尝试新的分工，也更容易发现彼此共同的兴趣。这里用扩展探索与联系来说明假说，而非报告真实实验。"}, {"heading": "理解边界", "text": "积极情绪并不保证所有判断或表现更好。假说讨论的是特定心理过程，不能简单推成越开心就越有效率。"}], "markdown": "---\nid: \"social-broaden-build\"\ntitle: \"拓展与建构假说\"\nenglish: \"Broaden-and-Build Hypothesis\"\nkind: \"理论\"\ndomain: \"emotion\"\nsubdomain: \"积极情绪\"\nsummary: \"积极情绪可能扩展当下的思考与行动范围，并通过探索和联系积累后续资源。拓展与建构假说关注情绪的延续影响，而不仅是瞬时愉快感。\"\naliases: []\nkeywords: [\"积极情绪\", \"拓展\", \"建构\", \"资源\", \"关系\", \"探索\", \"注意\", \"行动\"]\nquestions: [\"积极情绪怎样可能影响之后的社会关系？\", \"短暂愉快如何与长期资源联系起来？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"第5章 情绪与幸福\", \"locator\": \"PDF 第 261 页\", \"pdfPages\": [261]}]\ncandidateRelated: [{\"concept\": \"情感预测\", \"reason\": \"关注人如何预想未来情绪\"}, {\"concept\": \"情绪的社会功能\", \"reason\": \"关注情绪与关系的联系\"}]\n---\n\n## 核心解释\n\n拓展与建构假说认为，某些积极情绪能使人的注意和行动倾向更加开放，促使人接触新的想法、活动与关系。这样的短期拓展可以逐步形成以后能够使用的资源。教材特别联系社会理解说明，积极情绪可帮助人看见彼此相似之处，并为更强的社会联系创造条件。\n\n## 一个例子\n\n理解用例：小组合作顺利后，成员心情轻松，愿意尝试新的分工，也更容易发现彼此共同的兴趣。这里用扩展探索与联系来说明假说，而非报告真实实验。\n\n## 理解边界\n\n积极情绪并不保证所有判断或表现更好。假说讨论的是特定心理过程，不能简单推成越开心就越有效率。\n"}, {"id": "social-bystander-diffusion", "title": "旁观者效应与责任分散", "english": "Bystander Effect and Diffusion of Responsibility", "kind": "效应", "domain": "social", "subdomain": "帮助与合作", "summary": "目睹需要帮助的情境时，他人在场有时反而降低个人出手的可能。责任分散是一种解释：每个人都可能认为别人会采取行动，从而减少自己必须负责的感受。", "aliases": ["旁观者效应", "责任分散"], "keywords": ["旁观者", "责任分散", "帮助", "人数", "紧急情境", "介入", "责任", "知情"], "questions": ["为什么看到的人更多时，个人反而可能不行动？", "责任分散与没有发现需要帮助有什么区别？"], "sources": [{"book": "social", "chapter": "第14章 道德利他与合作", "locator": "PDF 第 675–676 页", "pdfPages": [675, 676]}], "candidateRelated": [{"concept": "多元无知", "reason": "解释为何误以为没有紧急情况"}, {"concept": "社会惰化", "reason": "同样关注群体中个人责任与投入"}], "sections": [{"heading": "核心解释", "text": "教材讨论旁观者介入如何受在场人数影响。知道其他人也看见困难时，个体可能认为他人更适合或已经准备帮助，因而觉得自身责任较小。研究通过改变参与者认为有多少人知情来检验这一过程。理解时要同时考察事件是否清楚，因为未识别紧急情况也会阻止行动。"}, {"heading": "一个例子", "text": "理解用例：群聊里有人请求一项急需的协助，大家都看到消息，却各自以为另一位成员会回应。用例展示多人知情可能减少个人责任感的情形。"}, {"heading": "理解边界", "text": "有旁观者并不保证无人帮助，明确的需要与具体情境都很重要。责任分散也不同于根本没有意识到对方需要帮助。"}], "markdown": "---\nid: \"social-bystander-diffusion\"\ntitle: \"旁观者效应与责任分散\"\nenglish: \"Bystander Effect and Diffusion of Responsibility\"\nkind: \"效应\"\ndomain: \"social\"\nsubdomain: \"帮助与合作\"\nsummary: \"目睹需要帮助的情境时，他人在场有时反而降低个人出手的可能。责任分散是一种解释：每个人都可能认为别人会采取行动，从而减少自己必须负责的感受。\"\naliases: [\"旁观者效应\", \"责任分散\"]\nkeywords: [\"旁观者\", \"责任分散\", \"帮助\", \"人数\", \"紧急情境\", \"介入\", \"责任\", \"知情\"]\nquestions: [\"为什么看到的人更多时，个人反而可能不行动？\", \"责任分散与没有发现需要帮助有什么区别？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"第14章 道德利他与合作\", \"locator\": \"PDF 第 675–676 页\", \"pdfPages\": [675, 676]}]\ncandidateRelated: [{\"concept\": \"多元无知\", \"reason\": \"解释为何误以为没有紧急情况\"}, {\"concept\": \"社会惰化\", \"reason\": \"同样关注群体中个人责任与投入\"}]\n---\n\n## 核心解释\n\n教材讨论旁观者介入如何受在场人数影响。知道其他人也看见困难时，个体可能认为他人更适合或已经准备帮助，因而觉得自身责任较小。研究通过改变参与者认为有多少人知情来检验这一过程。理解时要同时考察事件是否清楚，因为未识别紧急情况也会阻止行动。\n\n## 一个例子\n\n理解用例：群聊里有人请求一项急需的协助，大家都看到消息，却各自以为另一位成员会回应。用例展示多人知情可能减少个人责任感的情形。\n\n## 理解边界\n\n有旁观者并不保证无人帮助，明确的需要与具体情境都很重要。责任分散也不同于根本没有意识到对方需要帮助。\n"}, {"id": "social-cognitive-dissonance", "title": "认知失调理论", "english": "Cognitive Dissonance Theory", "kind": "理论", "domain": "social", "subdomain": "态度与行为", "summary": "当想法、价值与自己的行动难以相容时，人可能感到不舒服，并试图恢复一致。认知失调理论解释了为什么行为有时会反过来改变原来的态度。", "aliases": ["认知不协调", "Cognitive dissonance theory", "认知失调理论"], "keywords": ["失调", "一致性", "合理化", "态度", "行为", "选择", "努力辩护", "外在理由", "认知失调理论", "Cognitive dissonance theory", "态度与自我", "不一致", "辩护", "后悔", "信念"], "questions": ["为什么付出很多之后会更难承认结果普通？", "行为改变了态度一定意味着认知失调吗？", "做出选择后，为什么我会变得更相信自己的选择？", "认知失调理论在什么条件下适用，有什么局限？"], "sources": [{"book": "social", "chapter": "第6章 态度行为与合理化", "locator": "PDF 第 277–278 页", "pdfPages": [277, 278]}, {"book": "social", "chapter": "第6章 态度行为与合理化", "locator": "PDF 第 287–288 页", "pdfPages": [287, 288]}, {"book": "social", "chapter": "第6章 态度行为与合理化", "locator": "PDF 第 305 页", "pdfPages": [305]}, {"book": "general", "chapter": "第13章 · 社会心理学", "locator": "PDF 第 1090–1092 页", "pdfPages": [1090, 1091, 1092]}], "candidateRelated": [{"concept": "自我知觉理论", "reason": "提供行为影响态度的另一解释"}, {"concept": "自我差异理论", "reason": "讨论不同类型的不一致"}, {"title": "确认偏误", "reason": "回避反对信息可能有助于维护一致"}, {"title": "决策的社会功能观点", "reason": "自我与社会辩护会影响决策理由"}], "sections": [{"heading": "核心解释", "text": "认知失调指不一致引发的令人不适的状态，这种不适推动个体调整解释或态度，使自己的行为更容易被接受。教材讨论了困难选择、努力辩护和诱导顺从等情境，并强调自由选择、外在理由是否充分及行为后果等条件会影响这种过程，而非只要出现矛盾就必然改变态度。"}, {"heading": "一个例子", "text": "理解用例：你花很多时间组装一个效果普通的书架，随后越想越觉得它特别合适。这个理解用例说明，人可能通过提高对结果的评价，让自己的投入显得值得。"}, {"heading": "理解边界", "text": "行为后的态度变化不必都来自失调。原有态度较模糊时，自我知觉也能提供解释，不能仅凭结果就确定动机。"}], "markdown": "---\nid: \"social-cognitive-dissonance\"\ntitle: \"认知失调理论\"\nenglish: \"Cognitive Dissonance Theory\"\nkind: \"理论\"\ndomain: \"social\"\nsubdomain: \"态度与行为\"\nsummary: \"当想法、价值与自己的行动难以相容时，人可能感到不舒服，并试图恢复一致。认知失调理论解释了为什么行为有时会反过来改变原来的态度。\"\naliases: [\"认知不协调\", \"Cognitive dissonance theory\", \"认知失调理论\"]\nkeywords: [\"失调\", \"一致性\", \"合理化\", \"态度\", \"行为\", \"选择\", \"努力辩护\", \"外在理由\", \"认知失调理论\", \"Cognitive dissonance theory\", \"态度与自我\", \"不一致\", \"辩护\", \"后悔\", \"信念\"]\nquestions: [\"为什么付出很多之后会更难承认结果普通？\", \"行为改变了态度一定意味着认知失调吗？\", \"做出选择后，为什么我会变得更相信自己的选择？\", \"认知失调理论在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"第6章 态度行为与合理化\", \"locator\": \"PDF 第 277–278 页\", \"pdfPages\": [277, 278]}, {\"book\": \"social\", \"chapter\": \"第6章 态度行为与合理化\", \"locator\": \"PDF 第 287–288 页\", \"pdfPages\": [287, 288]}, {\"book\": \"social\", \"chapter\": \"第6章 态度行为与合理化\", \"locator\": \"PDF 第 305 页\", \"pdfPages\": [305]}, {\"book\": \"general\", \"chapter\": \"第13章 · 社会心理学\", \"locator\": \"PDF 第 1090–1092 页\", \"pdfPages\": [1090, 1091, 1092]}]\ncandidateRelated: [{\"concept\": \"自我知觉理论\", \"reason\": \"提供行为影响态度的另一解释\"}, {\"concept\": \"自我差异理论\", \"reason\": \"讨论不同类型的不一致\"}, {\"title\": \"确认偏误\", \"reason\": \"回避反对信息可能有助于维护一致\"}, {\"title\": \"决策的社会功能观点\", \"reason\": \"自我与社会辩护会影响决策理由\"}]\n---\n\n## 核心解释\n\n认知失调指不一致引发的令人不适的状态，这种不适推动个体调整解释或态度，使自己的行为更容易被接受。教材讨论了困难选择、努力辩护和诱导顺从等情境，并强调自由选择、外在理由是否充分及行为后果等条件会影响这种过程，而非只要出现矛盾就必然改变态度。\n\n## 一个例子\n\n理解用例：你花很多时间组装一个效果普通的书架，随后越想越觉得它特别合适。这个理解用例说明，人可能通过提高对结果的评价，让自己的投入显得值得。\n\n## 理解边界\n\n行为后的态度变化不必都来自失调。原有态度较模糊时，自我知觉也能提供解释，不能仅凭结果就确定动机。\n"}, {"id": "social-confirmation-bias", "title": "确认偏差", "english": "Confirmation Bias", "kind": "效应", "domain": "cognition", "subdomain": "判断与推理", "summary": "人在检验想法时，容易寻找与原有判断相符的信息。确认偏差可能使看似有证据的结论越来越牢固，却缺少真正能区分不同解释的反面检验。", "aliases": ["证实偏差", "Confirmation bias", "确认偏误"], "keywords": ["确认偏差", "证实", "搜索", "证据", "反例", "假设", "动机", "判断", "确认偏误", "Confirmation bias", "推理与信念", "偏见", "反证", "选择信息", "信念"], "questions": ["为什么真实的例子也可能支持错误印象？", "怎样识别只寻找支持材料的检验方式？", "为什么我总能找到支持自己想法的证据？", "确认偏误在什么条件下适用，有什么局限？"], "sources": [{"book": "social", "chapter": "第4章 社会认知", "locator": "PDF 第 215 页", "pdfPages": [215]}, {"book": "cognitive", "chapter": "第14章 · 推理与假设检验", "locator": "PDF 第 736–736 页", "pdfPages": [736]}, {"book": "general", "chapter": "第10章 · 问题解决：推理与智力", "locator": "PDF 第 805–805 页", "pdfPages": [805]}], "candidateRelated": [{"concept": "情境解释", "reason": "已有解释会引导后续信息搜索"}, {"concept": "态度接种", "reason": "涉及对反方论点的加工"}, {"title": "自上而下与自下而上加工", "reason": "先前期待会影响材料解释"}, {"title": "心智模型理论", "reason": "寻找反例有助于检查初始模型"}], "sections": [{"heading": "核心解释", "text": "确认偏差表现为，人在判断某个命题是否成立时，偏向寻找符合该命题的实例，而较少检查能够推翻它的信息。如果任何说法都能找到一些相符事例，这种搜索方式就容易积累单向支持。教材还区分了希望某个结论成立时更主动、选择性收集支持材料的动机性过程。"}, {"heading": "一个例子", "text": "理解用例：你怀疑一位同学不守时，于是只回想他迟到的几次，却没有记录准时到场的次数。即使记住的例子都是真的，整体判断仍可能偏离实际。"}, {"heading": "理解边界", "text": "找到支持材料本身不是偏差；关键是检验是否系统地忽略其他可能。确认偏差也不要求当事人故意歪曲事实。"}], "markdown": "---\nid: \"social-confirmation-bias\"\ntitle: \"确认偏差\"\nenglish: \"Confirmation Bias\"\nkind: \"效应\"\ndomain: \"cognition\"\nsubdomain: \"判断与推理\"\nsummary: \"人在检验想法时，容易寻找与原有判断相符的信息。确认偏差可能使看似有证据的结论越来越牢固，却缺少真正能区分不同解释的反面检验。\"\naliases: [\"证实偏差\", \"Confirmation bias\", \"确认偏误\"]\nkeywords: [\"确认偏差\", \"证实\", \"搜索\", \"证据\", \"反例\", \"假设\", \"动机\", \"判断\", \"确认偏误\", \"Confirmation bias\", \"推理与信念\", \"偏见\", \"反证\", \"选择信息\", \"信念\"]\nquestions: [\"为什么真实的例子也可能支持错误印象？\", \"怎样识别只寻找支持材料的检验方式？\", \"为什么我总能找到支持自己想法的证据？\", \"确认偏误在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"第4章 社会认知\", \"locator\": \"PDF 第 215 页\", \"pdfPages\": [215]}, {\"book\": \"cognitive\", \"chapter\": \"第14章 · 推理与假设检验\", \"locator\": \"PDF 第 736–736 页\", \"pdfPages\": [736]}, {\"book\": \"general\", \"chapter\": \"第10章 · 问题解决：推理与智力\", \"locator\": \"PDF 第 805–805 页\", \"pdfPages\": [805]}]\ncandidateRelated: [{\"concept\": \"情境解释\", \"reason\": \"已有解释会引导后续信息搜索\"}, {\"concept\": \"态度接种\", \"reason\": \"涉及对反方论点的加工\"}, {\"title\": \"自上而下与自下而上加工\", \"reason\": \"先前期待会影响材料解释\"}, {\"title\": \"心智模型理论\", \"reason\": \"寻找反例有助于检查初始模型\"}]\n---\n\n## 核心解释\n\n确认偏差表现为，人在判断某个命题是否成立时，偏向寻找符合该命题的实例，而较少检查能够推翻它的信息。如果任何说法都能找到一些相符事例，这种搜索方式就容易积累单向支持。教材还区分了希望某个结论成立时更主动、选择性收集支持材料的动机性过程。\n\n## 一个例子\n\n理解用例：你怀疑一位同学不守时，于是只回想他迟到的几次，却没有记录准时到场的次数。即使记住的例子都是真的，整体判断仍可能偏离实际。\n\n## 理解边界\n\n找到支持材料本身不是偏差；关键是检验是否系统地忽略其他可能。确认偏差也不要求当事人故意歪曲事实。\n"}, {"id": "social-construal", "title": "情境解释", "english": "Construal", "kind": "心理过程", "domain": "social", "subdomain": "社会认知", "summary": "同一个情境可以被不同的人理解为不同的事件。社会心理学关注人如何赋予情境意义，以及这种解释如何连接外部环境与随后的感受和行为。", "aliases": ["建构"], "keywords": ["情境", "解释", "意义", "知觉", "图式", "期待", "社会认知", "误会"], "questions": ["为什么同一件事会让两个人有不同反应？", "怎样区分情境本身与我们对情境的理解？"], "sources": [{"book": "social", "chapter": "第1章 社会心理学导论", "locator": "PDF 第 73 页", "pdfPages": [73]}], "candidateRelated": [{"concept": "图式", "reason": "为情境解释提供已有知识"}, {"concept": "基本归因错误", "reason": "展示情境原因被忽视的后果"}], "sections": [{"heading": "核心解释", "text": "情境解释是个体对事件、他人行动及所处环境形成意义的过程。人并非直接读取情境的全部客观属性，而会借助已有知识、期待与图式来理解正在发生什么。因此，同样的互动可能被理解成友善、敷衍或竞争，而这些不同解释又会改变情绪和后续行动。"}, {"heading": "一个例子", "text": "理解用例：同学在走廊没有回应招呼，你可以理解为他故意冷淡，也可以认为他正在专心找教室。这两种解释可能让你分别选择回避或再次联系。"}, {"heading": "理解边界", "text": "解释不同不等于所有解释同样准确。理解行为时需要同时查看客观情境和解释依据，不能把实际约束一概归结为个人想法。"}], "markdown": "---\nid: \"social-construal\"\ntitle: \"情境解释\"\nenglish: \"Construal\"\nkind: \"心理过程\"\ndomain: \"social\"\nsubdomain: \"社会认知\"\nsummary: \"同一个情境可以被不同的人理解为不同的事件。社会心理学关注人如何赋予情境意义，以及这种解释如何连接外部环境与随后的感受和行为。\"\naliases: [\"建构\"]\nkeywords: [\"情境\", \"解释\", \"意义\", \"知觉\", \"图式\", \"期待\", \"社会认知\", \"误会\"]\nquestions: [\"为什么同一件事会让两个人有不同反应？\", \"怎样区分情境本身与我们对情境的理解？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"第1章 社会心理学导论\", \"locator\": \"PDF 第 73 页\", \"pdfPages\": [73]}]\ncandidateRelated: [{\"concept\": \"图式\", \"reason\": \"为情境解释提供已有知识\"}, {\"concept\": \"基本归因错误\", \"reason\": \"展示情境原因被忽视的后果\"}]\n---\n\n## 核心解释\n\n情境解释是个体对事件、他人行动及所处环境形成意义的过程。人并非直接读取情境的全部客观属性，而会借助已有知识、期待与图式来理解正在发生什么。因此，同样的互动可能被理解成友善、敷衍或竞争，而这些不同解释又会改变情绪和后续行动。\n\n## 一个例子\n\n理解用例：同学在走廊没有回应招呼，你可以理解为他故意冷淡，也可以认为他正在专心找教室。这两种解释可能让你分别选择回避或再次联系。\n\n## 理解边界\n\n解释不同不等于所有解释同样准确。理解行为时需要同时查看客观情境和解释依据，不能把实际约束一概归结为个人想法。\n"}, {"id": "social-dehumanization", "title": "去人性化", "english": "Dehumanization", "kind": "心理过程", "domain": "social", "subdomain": "攻击与冲突", "summary": "把他人理解成缺少通常赋予人的感受与品质，可能削弱对其处境的顾及。去人性化是教材讨论攻击与群际伤害时关注的一种解释过程。", "aliases": [], "keywords": ["去人性化", "攻击", "外群体", "伤害", "解释", "忠诚", "感受", "冲突"], "questions": ["把对方看成不像人为什么可能改变对伤害的顾虑？", "去人性化与普通的负面评价有什么不同？"], "sources": [{"book": "social", "chapter": "第13章 攻击", "locator": "PDF 第 653 页", "pdfPages": [653]}], "candidateRelated": [{"concept": "社会认同理论", "reason": "群体界限与自我联系"}, {"concept": "现实群体冲突理论", "reason": "从目标关系解释冲突"}], "sections": [{"heading": "核心解释", "text": "去人性化是以低于完整人的方式看待他人或群体，例如把对方描绘成缺少人类品质。教材将这种解释与攻击和暴力的容许联系起来，并讨论群体忠诚如何可能与外群体去人性化相连。这里关注的不是单次辱骂本身，而是他人在认知中被剥夺哪些值得顾及的感受和地位。"}, {"heading": "一个例子", "text": "理解用例：争执中，小组成员不再讨论对方的具体行为，而反复把对方说成没有感受的东西。这个用例用来观察解释方式怎样改变对伤害的顾虑。"}, {"heading": "理解边界", "text": "不能从一句难听的话直接推定完整心理过程，更不能把去人性化当作一切攻击的原因。教材也讨论情境与文化因素。"}], "markdown": "---\nid: \"social-dehumanization\"\ntitle: \"去人性化\"\nenglish: \"Dehumanization\"\nkind: \"心理过程\"\ndomain: \"social\"\nsubdomain: \"攻击与冲突\"\nsummary: \"把他人理解成缺少通常赋予人的感受与品质，可能削弱对其处境的顾及。去人性化是教材讨论攻击与群际伤害时关注的一种解释过程。\"\naliases: []\nkeywords: [\"去人性化\", \"攻击\", \"外群体\", \"伤害\", \"解释\", \"忠诚\", \"感受\", \"冲突\"]\nquestions: [\"把对方看成不像人为什么可能改变对伤害的顾虑？\", \"去人性化与普通的负面评价有什么不同？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"第13章 攻击\", \"locator\": \"PDF 第 653 页\", \"pdfPages\": [653]}]\ncandidateRelated: [{\"concept\": \"社会认同理论\", \"reason\": \"群体界限与自我联系\"}, {\"concept\": \"现实群体冲突理论\", \"reason\": \"从目标关系解释冲突\"}]\n---\n\n## 核心解释\n\n去人性化是以低于完整人的方式看待他人或群体，例如把对方描绘成缺少人类品质。教材将这种解释与攻击和暴力的容许联系起来，并讨论群体忠诚如何可能与外群体去人性化相连。这里关注的不是单次辱骂本身，而是他人在认知中被剥夺哪些值得顾及的感受和地位。\n\n## 一个例子\n\n理解用例：争执中，小组成员不再讨论对方的具体行为，而反复把对方说成没有感受的东西。这个用例用来观察解释方式怎样改变对伤害的顾虑。\n\n## 理解边界\n\n不能从一句难听的话直接推定完整心理过程，更不能把去人性化当作一切攻击的原因。教材也讨论情境与文化因素。\n"}, {"id": "social-elaboration-likelihood", "title": "精细加工可能性模型", "english": "Elaboration Likelihood Model", "kind": "模型", "domain": "social", "subdomain": "说服与态度", "summary": "说服既可能依赖对论据的仔细检查，也可能依赖容易处理的周边线索。精细加工可能性模型把两类路径与受众的思考动机及加工能力联系起来。", "aliases": ["详尽可能性模型", "ELM"], "keywords": ["说服", "精细加工", "中央路径", "外周路径", "动机", "能力", "论据", "线索"], "questions": ["什么情况下论据质量更容易影响态度？", "为什么同一个专家身份能通过不同路径发挥作用？"], "sources": [{"book": "social", "chapter": "第7章 说服", "locator": "PDF 第 312–314 页", "pdfPages": [312, 313, 314]}, {"book": "social", "chapter": "第7章 说服", "locator": "PDF 第 344 页", "pdfPages": [344]}], "candidateRelated": [{"concept": "自动与受控加工", "reason": "提供双加工的相邻框架"}, {"concept": "态度接种", "reason": "说明对反方论点的主动加工"}], "sections": [{"heading": "核心解释", "text": "模型区分中央路径与外周路径。中央路径下，人认真比较论证质量、证据和已有知识；外周路径下，人更多借助可信度、吸引力或信息长度等易处理线索。是否深入加工取决于动机和能力：议题是否切身相关、时间和知识是否足够都会影响加工；同一种线索也可能通过不同路径发挥作用。"}, {"heading": "一个例子", "text": "理解用例：买电脑时，你可能认真比较性能测试和自己的使用需求；疲劳时浏览一则陌生产品广告，则可能更注意代言者。用例说明加工方式会随任务条件变化。"}, {"heading": "理解边界", "text": "中央路径不保证被说服，外周线索也不等于虚假信息。专家身份可以是简单线索，也可以成为经过审查的证据。"}], "markdown": "---\nid: \"social-elaboration-likelihood\"\ntitle: \"精细加工可能性模型\"\nenglish: \"Elaboration Likelihood Model\"\nkind: \"模型\"\ndomain: \"social\"\nsubdomain: \"说服与态度\"\nsummary: \"说服既可能依赖对论据的仔细检查，也可能依赖容易处理的周边线索。精细加工可能性模型把两类路径与受众的思考动机及加工能力联系起来。\"\naliases: [\"详尽可能性模型\", \"ELM\"]\nkeywords: [\"说服\", \"精细加工\", \"中央路径\", \"外周路径\", \"动机\", \"能力\", \"论据\", \"线索\"]\nquestions: [\"什么情况下论据质量更容易影响态度？\", \"为什么同一个专家身份能通过不同路径发挥作用？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"第7章 说服\", \"locator\": \"PDF 第 312–314 页\", \"pdfPages\": [312, 313, 314]}, {\"book\": \"social\", \"chapter\": \"第7章 说服\", \"locator\": \"PDF 第 344 页\", \"pdfPages\": [344]}]\ncandidateRelated: [{\"concept\": \"自动与受控加工\", \"reason\": \"提供双加工的相邻框架\"}, {\"concept\": \"态度接种\", \"reason\": \"说明对反方论点的主动加工\"}]\n---\n\n## 核心解释\n\n模型区分中央路径与外周路径。中央路径下，人认真比较论证质量、证据和已有知识；外周路径下，人更多借助可信度、吸引力或信息长度等易处理线索。是否深入加工取决于动机和能力：议题是否切身相关、时间和知识是否足够都会影响加工；同一种线索也可能通过不同路径发挥作用。\n\n## 一个例子\n\n理解用例：买电脑时，你可能认真比较性能测试和自己的使用需求；疲劳时浏览一则陌生产品广告，则可能更注意代言者。用例说明加工方式会随任务条件变化。\n\n## 理解边界\n\n中央路径不保证被说服，外周线索也不等于虚假信息。专家身份可以是简单线索，也可以成为经过审查的证据。\n"}, {"id": "social-empathy-altruism", "title": "共情关怀与利他", "english": "Empathic Concern and Altruism", "kind": "理论", "domain": "social", "subdomain": "帮助与合作", "summary": "帮助他人既可能为了减轻自己的不适，也可能出于对他人处境的关切。共情关怀的解释强调以改善对方福祉为目标，而不只关注自己的获益。", "aliases": [], "keywords": ["共情", "关怀", "利他", "帮助", "个人痛苦", "动机", "需要", "福祉"], "questions": ["帮助别人是在改善对方处境还是减轻自己不适？", "同样的帮助行为为什么可能有不同动机？"], "sources": [{"book": "social", "chapter": "第14章 道德利他与合作", "locator": "PDF 第 700 页", "pdfPages": [700]}], "candidateRelated": [{"concept": "责任分散", "reason": "情境也会影响帮助"}, {"concept": "互惠利他", "reason": "从未来回报解释合作"}], "sections": [{"heading": "核心解释", "text": "教材区分个人痛苦、社会奖励等自利动机与面向他人需要的共情关怀。看到他人困境后产生关切，可以使改善对方处境本身成为行动目标。这一区分提示，相同的帮助行为可能来自不同动机；理解帮助不能只记录有没有行动，还要考虑当事人如何体验对方的需要及自身不适。"}, {"heading": "一个例子", "text": "理解用例：同学遇到困难时，你可以为了停止自己的难受而尽快离开，也可以继续了解他的需要并提供合适帮助。用例用目标差异说明两种可能动机。"}, {"heading": "理解边界", "text": "观察到帮助不等于已证明纯粹利他，奖励与关怀也可能并存。动机的区分需要额外信息，不能仅凭自我陈述。"}], "markdown": "---\nid: \"social-empathy-altruism\"\ntitle: \"共情关怀与利他\"\nenglish: \"Empathic Concern and Altruism\"\nkind: \"理论\"\ndomain: \"social\"\nsubdomain: \"帮助与合作\"\nsummary: \"帮助他人既可能为了减轻自己的不适，也可能出于对他人处境的关切。共情关怀的解释强调以改善对方福祉为目标，而不只关注自己的获益。\"\naliases: []\nkeywords: [\"共情\", \"关怀\", \"利他\", \"帮助\", \"个人痛苦\", \"动机\", \"需要\", \"福祉\"]\nquestions: [\"帮助别人是在改善对方处境还是减轻自己不适？\", \"同样的帮助行为为什么可能有不同动机？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"第14章 道德利他与合作\", \"locator\": \"PDF 第 700 页\", \"pdfPages\": [700]}]\ncandidateRelated: [{\"concept\": \"责任分散\", \"reason\": \"情境也会影响帮助\"}, {\"concept\": \"互惠利他\", \"reason\": \"从未来回报解释合作\"}]\n---\n\n## 核心解释\n\n教材区分个人痛苦、社会奖励等自利动机与面向他人需要的共情关怀。看到他人困境后产生关切，可以使改善对方处境本身成为行动目标。这一区分提示，相同的帮助行为可能来自不同动机；理解帮助不能只记录有没有行动，还要考虑当事人如何体验对方的需要及自身不适。\n\n## 一个例子\n\n理解用例：同学遇到困难时，你可以为了停止自己的难受而尽快离开，也可以继续了解他的需要并提供合适帮助。用例用目标差异说明两种可能动机。\n\n## 理解边界\n\n观察到帮助不等于已证明纯粹利他，奖励与关怀也可能并存。动机的区分需要额外信息，不能仅凭自我陈述。\n"}, {"id": "social-eyewitness-memory", "title": "目击记忆的可错性", "english": "Eyewitness Memory Fallibility", "kind": "效应", "domain": "social", "subdomain": "记忆与判断", "summary": "目击者即使真诚报告，也可能错误地辨认人物或回忆事件。教材借司法情境说明，记忆的主观确信与客观准确性需要分别检查。", "aliases": [], "keywords": ["目击", "记忆", "证言", "辨认", "准确性", "确信", "提问", "线索"], "questions": ["诚实报告为什么仍可能出现记忆错误？", "一个人很有把握是否足以证明回忆准确？"], "sources": [{"book": "social", "chapter": "应用模块3 社会心理学与法律", "locator": "PDF 第 738 页", "pdfPages": [738]}, {"book": "social", "chapter": "应用模块3 社会心理学与法律", "locator": "PDF 第 753 页", "pdfPages": [753]}], "candidateRelated": [{"concept": "确认偏差", "reason": "询问与检验可能受到既有判断影响"}, {"concept": "信度、效度与操作化", "reason": "一致与准确需要分别检查"}], "sections": [{"heading": "核心解释", "text": "教材把目击证言作为记忆与社会判断可能出错的应用情境。一个人认真且诚实，并不能排除知觉、记忆或辨认过程中的错误；听者对哪些因素影响准确性的直觉也可能不可靠。因此，评估证言需要关注信息如何获得、后来如何被询问，以及辨认程序是否引入额外线索。"}, {"heading": "一个例子", "text": "理解用例：两位同学短暂看见同一位陌生人，之后各自回忆衣着却不一致。即便双方都确信自己没说谎，也仍需把诚实程度与记忆准确性分开检查。"}, {"heading": "理解边界", "text": "记忆可能出错不表示所有证言无用。卡片仅概括教材中的心理过程，不能由此判断某个真实案件或特定证人的可靠性。"}], "markdown": "---\nid: \"social-eyewitness-memory\"\ntitle: \"目击记忆的可错性\"\nenglish: \"Eyewitness Memory Fallibility\"\nkind: \"效应\"\ndomain: \"social\"\nsubdomain: \"记忆与判断\"\nsummary: \"目击者即使真诚报告，也可能错误地辨认人物或回忆事件。教材借司法情境说明，记忆的主观确信与客观准确性需要分别检查。\"\naliases: []\nkeywords: [\"目击\", \"记忆\", \"证言\", \"辨认\", \"准确性\", \"确信\", \"提问\", \"线索\"]\nquestions: [\"诚实报告为什么仍可能出现记忆错误？\", \"一个人很有把握是否足以证明回忆准确？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"应用模块3 社会心理学与法律\", \"locator\": \"PDF 第 738 页\", \"pdfPages\": [738]}, {\"book\": \"social\", \"chapter\": \"应用模块3 社会心理学与法律\", \"locator\": \"PDF 第 753 页\", \"pdfPages\": [753]}]\ncandidateRelated: [{\"concept\": \"确认偏差\", \"reason\": \"询问与检验可能受到既有判断影响\"}, {\"concept\": \"信度、效度与操作化\", \"reason\": \"一致与准确需要分别检查\"}]\n---\n\n## 核心解释\n\n教材把目击证言作为记忆与社会判断可能出错的应用情境。一个人认真且诚实，并不能排除知觉、记忆或辨认过程中的错误；听者对哪些因素影响准确性的直觉也可能不可靠。因此，评估证言需要关注信息如何获得、后来如何被询问，以及辨认程序是否引入额外线索。\n\n## 一个例子\n\n理解用例：两位同学短暂看见同一位陌生人，之后各自回忆衣着却不一致。即便双方都确信自己没说谎，也仍需把诚实程度与记忆准确性分开检查。\n\n## 理解边界\n\n记忆可能出错不表示所有证言无用。卡片仅概括教材中的心理过程，不能由此判断某个真实案件或特定证人的可靠性。\n"}, {"id": "social-fundamental-attribution-error", "title": "基本归因错误", "english": "Fundamental Attribution Error", "kind": "效应", "domain": "social", "subdomain": "归因", "summary": "解释他人行为时，人可能高估性格或能力，低估情境的推动与限制。基本归因错误提醒我们，把一次表现看作稳定特征之前，需要检查角色和环境。", "aliases": [], "keywords": ["归因", "性格", "情境", "角色", "偏差", "内因", "外因", "观察者"], "questions": ["为什么我们容易把他人的失误归结为性格？", "角色带来的优势怎样被误认为个人能力？"], "sources": [{"book": "social", "chapter": "第4章 社会认知", "locator": "PDF 第 175–180 页", "pdfPages": [175, 176, 177, 178, 179, 180]}], "candidateRelated": [{"concept": "情境解释", "reason": "决定行为被赋予的意义"}, {"concept": "人与情境交互作用", "reason": "同时考虑人的特征与环境"}], "sections": [{"heading": "核心解释", "text": "归因是在判断行为由什么造成。基本归因错误指观察者过度强调人的内在特征，却没有充分考虑显著的情境力量。教材指出，行动者通常比情境更引人注意，社会规范又不总是直接可见，所以人格解释容易占优势；对情境的注意也会随着文化背景及观察位置而变化。"}, {"heading": "一个例子", "text": "理解用例：问答活动中，出题者只提自己熟悉的问题，看起来比答题者知识丰富。如果旁观者忽略两人角色带来的机会差异，就可能把表现差距全算成能力差距。"}, {"heading": "理解边界", "text": "强调情境并不表示人格毫无作用。这种偏差也有文化与任务边界，不能把任何性格判断都叫作归因错误。"}], "markdown": "---\nid: \"social-fundamental-attribution-error\"\ntitle: \"基本归因错误\"\nenglish: \"Fundamental Attribution Error\"\nkind: \"效应\"\ndomain: \"social\"\nsubdomain: \"归因\"\nsummary: \"解释他人行为时，人可能高估性格或能力，低估情境的推动与限制。基本归因错误提醒我们，把一次表现看作稳定特征之前，需要检查角色和环境。\"\naliases: []\nkeywords: [\"归因\", \"性格\", \"情境\", \"角色\", \"偏差\", \"内因\", \"外因\", \"观察者\"]\nquestions: [\"为什么我们容易把他人的失误归结为性格？\", \"角色带来的优势怎样被误认为个人能力？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"第4章 社会认知\", \"locator\": \"PDF 第 175–180 页\", \"pdfPages\": [175, 176, 177, 178, 179, 180]}]\ncandidateRelated: [{\"concept\": \"情境解释\", \"reason\": \"决定行为被赋予的意义\"}, {\"concept\": \"人与情境交互作用\", \"reason\": \"同时考虑人的特征与环境\"}]\n---\n\n## 核心解释\n\n归因是在判断行为由什么造成。基本归因错误指观察者过度强调人的内在特征，却没有充分考虑显著的情境力量。教材指出，行动者通常比情境更引人注意，社会规范又不总是直接可见，所以人格解释容易占优势；对情境的注意也会随着文化背景及观察位置而变化。\n\n## 一个例子\n\n理解用例：问答活动中，出题者只提自己熟悉的问题，看起来比答题者知识丰富。如果旁观者忽略两人角色带来的机会差异，就可能把表现差距全算成能力差距。\n\n## 理解边界\n\n强调情境并不表示人格毫无作用。这种偏差也有文化与任务边界，不能把任何性格判断都叫作归因错误。\n"}, {"id": "social-group-polarization", "title": "群体极化", "english": "Group Polarization", "kind": "效应", "domain": "social", "subdomain": "群体决策", "summary": "讨论之后，群体原有的倾向有时会变得更强。群体极化既可能来自接触更多同方向论据，也可能来自成员比较自己的立场与群体立场。", "aliases": [], "keywords": ["群体极化", "讨论", "极端", "论据", "比较", "意见", "决策", "群体"], "questions": ["为什么讨论可能让原有倾向变得更强？", "群体极化与群体成员本来就意见极端有什么区别？"], "sources": [{"book": "social", "chapter": "第12章 群体", "locator": "PDF 第 606 页", "pdfPages": [606]}], "candidateRelated": [{"concept": "信息性社会影响", "reason": "新论据可改变判断"}, {"concept": "规范性社会影响", "reason": "社会比较与群体接纳可能参与"}], "sections": [{"heading": "核心解释", "text": "群体极化指群体讨论使原有倾向朝更极端方向移动。教材讨论两条解释：成员听到自己先前没有想到、支持原有方向的新论据；成员也会通过社会比较，调整立场以符合或突出群体重视的方向。因此，讨论未必产生折中意见，其影响取决于讨论前的分布及过程中出现的信息。"}, {"heading": "一个例子", "text": "理解用例：一个原本略偏好冒险路线的旅行小组，讨论时不断补充这条路线的优点，最后比讨论前更愿意冒险。这里展示的是原有方向加强，而非意见从零形成。"}, {"heading": "理解边界", "text": "群体极化不是任何意见分歧，也不等于群体思维。需要比较讨论前后倾向，不能只看最终意见强烈就作判断。"}], "markdown": "---\nid: \"social-group-polarization\"\ntitle: \"群体极化\"\nenglish: \"Group Polarization\"\nkind: \"效应\"\ndomain: \"social\"\nsubdomain: \"群体决策\"\nsummary: \"讨论之后，群体原有的倾向有时会变得更强。群体极化既可能来自接触更多同方向论据，也可能来自成员比较自己的立场与群体立场。\"\naliases: []\nkeywords: [\"群体极化\", \"讨论\", \"极端\", \"论据\", \"比较\", \"意见\", \"决策\", \"群体\"]\nquestions: [\"为什么讨论可能让原有倾向变得更强？\", \"群体极化与群体成员本来就意见极端有什么区别？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"第12章 群体\", \"locator\": \"PDF 第 606 页\", \"pdfPages\": [606]}]\ncandidateRelated: [{\"concept\": \"信息性社会影响\", \"reason\": \"新论据可改变判断\"}, {\"concept\": \"规范性社会影响\", \"reason\": \"社会比较与群体接纳可能参与\"}]\n---\n\n## 核心解释\n\n群体极化指群体讨论使原有倾向朝更极端方向移动。教材讨论两条解释：成员听到自己先前没有想到、支持原有方向的新论据；成员也会通过社会比较，调整立场以符合或突出群体重视的方向。因此，讨论未必产生折中意见，其影响取决于讨论前的分布及过程中出现的信息。\n\n## 一个例子\n\n理解用例：一个原本略偏好冒险路线的旅行小组，讨论时不断补充这条路线的优点，最后比讨论前更愿意冒险。这里展示的是原有方向加强，而非意见从零形成。\n\n## 理解边界\n\n群体极化不是任何意见分歧，也不等于群体思维。需要比较讨论前后倾向，不能只看最终意见强烈就作判断。\n"}, {"id": "social-groupthink", "title": "群体迷思", "english": "Groupthink", "kind": "理论", "domain": "social", "subdomain": "群体决策", "summary": "群体追求一致时，可能压制异议、缩窄备选方案并过早确信结论。群体迷思强调凝聚和压力如何妨碍审查，但教材同时保留对其完整理论证据的质疑。", "aliases": ["群体思维"], "keywords": ["群体迷思", "群体思维", "共识", "自我审查", "异议", "决策", "凝聚", "领导"], "questions": ["表面一致怎样掩盖未被表达的不同意见？", "为什么不能从决策失败直接认定群体迷思？"], "sources": [{"book": "social", "chapter": "第12章 群体", "locator": "PDF 第 574–575 页", "pdfPages": [574, 575]}], "candidateRelated": [{"concept": "群体极化", "reason": "另一类讨论后的意见变化"}, {"concept": "规范性社会影响", "reason": "接纳压力可抑制异议"}], "sections": [{"heading": "核心解释", "text": "群体迷思描述高度追求共识时出现的决策问题：成员自我审查，异议难以表达，对信息和备选方案的检查变得肤浅。强势领导、封闭讨论或压力可能推动这一过程。教材也说明，对这一理论的实证检验结果并不一致，一些条件之间的关系及其是否必要仍有争论。"}, {"heading": "一个例子", "text": "理解用例：小组负责人一开始便支持某方案，其他成员虽然发现风险，却怕破坏团结而没有说出来，讨论很快结束。用例展示表面一致可能遮住未表达的疑虑。"}, {"heading": "理解边界", "text": "坏决策或高度一致都不自动证明群体迷思。教材提醒其条件与证据仍有争议，应检查讨论过程，不能事后见失败便套用。"}], "markdown": "---\nid: \"social-groupthink\"\ntitle: \"群体迷思\"\nenglish: \"Groupthink\"\nkind: \"理论\"\ndomain: \"social\"\nsubdomain: \"群体决策\"\nsummary: \"群体追求一致时，可能压制异议、缩窄备选方案并过早确信结论。群体迷思强调凝聚和压力如何妨碍审查，但教材同时保留对其完整理论证据的质疑。\"\naliases: [\"群体思维\"]\nkeywords: [\"群体迷思\", \"群体思维\", \"共识\", \"自我审查\", \"异议\", \"决策\", \"凝聚\", \"领导\"]\nquestions: [\"表面一致怎样掩盖未被表达的不同意见？\", \"为什么不能从决策失败直接认定群体迷思？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"第12章 群体\", \"locator\": \"PDF 第 574–575 页\", \"pdfPages\": [574, 575]}]\ncandidateRelated: [{\"concept\": \"群体极化\", \"reason\": \"另一类讨论后的意见变化\"}, {\"concept\": \"规范性社会影响\", \"reason\": \"接纳压力可抑制异议\"}]\n---\n\n## 核心解释\n\n群体迷思描述高度追求共识时出现的决策问题：成员自我审查，异议难以表达，对信息和备选方案的检查变得肤浅。强势领导、封闭讨论或压力可能推动这一过程。教材也说明，对这一理论的实证检验结果并不一致，一些条件之间的关系及其是否必要仍有争论。\n\n## 一个例子\n\n理解用例：小组负责人一开始便支持某方案，其他成员虽然发现风险，却怕破坏团结而没有说出来，讨论很快结束。用例展示表面一致可能遮住未表达的疑虑。\n\n## 理解边界\n\n坏决策或高度一致都不自动证明群体迷思。教材提醒其条件与证据仍有争议，应检查讨论过程，不能事后见失败便套用。\n"}, {"id": "social-honor-culture", "title": "荣誉文化", "english": "Culture of Honor", "kind": "概念", "domain": "social", "subdomain": "攻击与文化", "summary": "在重视声誉防卫的文化情境中，侮辱可能被解释成必须回应的地位威胁。荣誉文化概念说明，攻击反应也受到历史环境和社会规范的影响。", "aliases": [], "keywords": ["荣誉", "文化", "声誉", "侮辱", "地位", "防卫", "规范", "攻击"], "questions": ["为什么相同侮辱在不同环境中有不同分量？", "理解荣誉文化为什么不能只给地区贴标签？"], "sources": [{"book": "social", "chapter": "第13章 攻击", "locator": "PDF 第 653 页", "pdfPages": [653]}], "candidateRelated": [{"concept": "情境解释", "reason": "文化规则改变事件意义"}, {"concept": "个体主义与集体主义", "reason": "文化差异的另一描述维度"}], "sections": [{"heading": "核心解释", "text": "荣誉文化强调维护个人或群体的声誉，并可能要求对侮辱与恶意行为作强硬回应。教材把这一模式放入文化与历史条件中理解，特别讨论财富容易被夺取的环境如何与防卫声誉相关。重点是社会期待如何赋予事件意义，而不是把某一地区的人描述成具有固定攻击本性。"}, {"heading": "一个例子", "text": "理解用例：同一句轻视的话，有人当作无关紧要的玩笑，有人却认为若不回应就会被持续欺负。这个用例呈现声誉规则如何改变对侮辱的解释。"}, {"heading": "理解边界", "text": "文化模式不是每位成员的性格，也不能直接预测具体个人会使用暴力。还需要区分场合、个人经历和实际威胁。"}], "markdown": "---\nid: \"social-honor-culture\"\ntitle: \"荣誉文化\"\nenglish: \"Culture of Honor\"\nkind: \"概念\"\ndomain: \"social\"\nsubdomain: \"攻击与文化\"\nsummary: \"在重视声誉防卫的文化情境中，侮辱可能被解释成必须回应的地位威胁。荣誉文化概念说明，攻击反应也受到历史环境和社会规范的影响。\"\naliases: []\nkeywords: [\"荣誉\", \"文化\", \"声誉\", \"侮辱\", \"地位\", \"防卫\", \"规范\", \"攻击\"]\nquestions: [\"为什么相同侮辱在不同环境中有不同分量？\", \"理解荣誉文化为什么不能只给地区贴标签？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"第13章 攻击\", \"locator\": \"PDF 第 653 页\", \"pdfPages\": [653]}]\ncandidateRelated: [{\"concept\": \"情境解释\", \"reason\": \"文化规则改变事件意义\"}, {\"concept\": \"个体主义与集体主义\", \"reason\": \"文化差异的另一描述维度\"}]\n---\n\n## 核心解释\n\n荣誉文化强调维护个人或群体的声誉，并可能要求对侮辱与恶意行为作强硬回应。教材把这一模式放入文化与历史条件中理解，特别讨论财富容易被夺取的环境如何与防卫声誉相关。重点是社会期待如何赋予事件意义，而不是把某一地区的人描述成具有固定攻击本性。\n\n## 一个例子\n\n理解用例：同一句轻视的话，有人当作无关紧要的玩笑，有人却认为若不回应就会被持续欺负。这个用例呈现声誉规则如何改变对侮辱的解释。\n\n## 理解边界\n\n文化模式不是每位成员的性格，也不能直接预测具体个人会使用暴力。还需要区分场合、个人经历和实际威胁。\n"}, {"id": "social-implicit-intelligence-theories", "title": "智力的内隐理论", "english": "Implicit Theories of Intelligence", "kind": "理论", "domain": "learning", "subdomain": "学习动机", "summary": "把能力看作固定不变或能够发展，会改变人如何理解困难和选择挑战。教材区分实体理论与渐进理论，关注能力观念与学习反应之间的联系。", "aliases": ["成长型思维", "固定型思维"], "keywords": ["能力观", "智力", "固定", "成长", "实体理论", "渐进理论", "挑战", "失败"], "questions": ["把能力看作可发展会怎样改变失败解释？", "为什么成长观念不能简化为只要努力就行？"], "sources": [{"book": "social", "chapter": "应用模块2 社会心理学与教育", "locator": "PDF 第 723–724 页", "pdfPages": [723, 724]}, {"book": "social", "chapter": "应用模块2 社会心理学与教育", "locator": "PDF 第 734 页", "pdfPages": [734]}], "candidateRelated": [{"concept": "刻板印象威胁", "reason": "能力评价情境也可能影响表现"}, {"concept": "认知情感人格系统", "reason": "关注解释与情境化反应"}], "sections": [{"heading": "核心解释", "text": "实体理论把智力看作较固定的属性，渐进理论则认为能力可以在学习与努力中发展。教材说明，这些看法影响人如何解释失败、是否选择有挑战的任务，以及是否把困难当成学习机会。这里讨论的是关于能力的信念及其后果，并不等于假定每种教学条件下的变化都相同。"}, {"heading": "一个例子", "text": "理解用例：一道新题没有做出，有人据此认为自己不适合这门课，有人把它看成还没有掌握方法并继续尝试。用例用于比较能力解释，不是评价谁更值得肯定。"}, {"heading": "理解边界", "text": "相信能力可变不意味着单靠努力就足够，教学和资源仍重要。不能由一次坚持或放弃直接判定一个人固定的能力观。"}], "markdown": "---\nid: \"social-implicit-intelligence-theories\"\ntitle: \"智力的内隐理论\"\nenglish: \"Implicit Theories of Intelligence\"\nkind: \"理论\"\ndomain: \"learning\"\nsubdomain: \"学习动机\"\nsummary: \"把能力看作固定不变或能够发展，会改变人如何理解困难和选择挑战。教材区分实体理论与渐进理论，关注能力观念与学习反应之间的联系。\"\naliases: [\"成长型思维\", \"固定型思维\"]\nkeywords: [\"能力观\", \"智力\", \"固定\", \"成长\", \"实体理论\", \"渐进理论\", \"挑战\", \"失败\"]\nquestions: [\"把能力看作可发展会怎样改变失败解释？\", \"为什么成长观念不能简化为只要努力就行？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"应用模块2 社会心理学与教育\", \"locator\": \"PDF 第 723–724 页\", \"pdfPages\": [723, 724]}, {\"book\": \"social\", \"chapter\": \"应用模块2 社会心理学与教育\", \"locator\": \"PDF 第 734 页\", \"pdfPages\": [734]}]\ncandidateRelated: [{\"concept\": \"刻板印象威胁\", \"reason\": \"能力评价情境也可能影响表现\"}, {\"concept\": \"认知情感人格系统\", \"reason\": \"关注解释与情境化反应\"}]\n---\n\n## 核心解释\n\n实体理论把智力看作较固定的属性，渐进理论则认为能力可以在学习与努力中发展。教材说明，这些看法影响人如何解释失败、是否选择有挑战的任务，以及是否把困难当成学习机会。这里讨论的是关于能力的信念及其后果，并不等于假定每种教学条件下的变化都相同。\n\n## 一个例子\n\n理解用例：一道新题没有做出，有人据此认为自己不适合这门课，有人把它看成还没有掌握方法并继续尝试。用例用于比较能力解释，不是评价谁更值得肯定。\n\n## 理解边界\n\n相信能力可变不意味着单靠努力就足够，教学和资源仍重要。不能由一次坚持或放弃直接判定一个人固定的能力观。\n"}, {"id": "social-informational-influence", "title": "信息性社会影响", "english": "Informational Social Influence", "kind": "心理过程", "domain": "social", "subdomain": "从众", "summary": "在情境陌生或答案不清楚时，人会把他人的判断当作有用信息。信息性社会影响解释从众如何源于寻找正确理解，而不只是承受群体压力。", "aliases": [], "keywords": ["信息", "从众", "不确定", "陌生", "判断", "参照", "群体", "谢里夫"], "questions": ["为什么越不确定越容易参考他人的选择？", "多人意见一致能否保证他们掌握了准确信息？"], "sources": [{"book": "social", "chapter": "第8章 社会影响", "locator": "PDF 第 358–359 页", "pdfPages": [358, 359]}, {"book": "social", "chapter": "第8章 社会影响", "locator": "PDF 第 394 页", "pdfPages": [394]}], "candidateRelated": [{"concept": "规范性社会影响", "reason": "同一行为可能有另一动机"}, {"concept": "情境解释", "reason": "他人的意见提供解释参照"}], "sections": [{"heading": "核心解释", "text": "信息性社会影响是把他人的言语和行动作为判断何者正确、适当或有效的依据。自己缺少知识或参照时，这种依赖尤其容易发生。教材用谢里夫的游动错觉研究说明，当刺激本身模糊时，多人的估计会逐渐汇合，并可能留下持续影响；但群体一致本身并不保证判断符合事实。"}, {"heading": "一个例子", "text": "理解用例：第一次参加陌生活动，你不清楚应在哪里报到，便观察其他人的路线并跟着走。此时他人的行动被当作了解环境的线索，而不一定是害怕显得不同。"}, {"heading": "理解边界", "text": "他人也可能缺少可靠信息，因此共同判断仍会出错。实际从众可以同时包含信息性与规范性影响，不能只凭行为外观分类。"}], "markdown": "---\nid: \"social-informational-influence\"\ntitle: \"信息性社会影响\"\nenglish: \"Informational Social Influence\"\nkind: \"心理过程\"\ndomain: \"social\"\nsubdomain: \"从众\"\nsummary: \"在情境陌生或答案不清楚时，人会把他人的判断当作有用信息。信息性社会影响解释从众如何源于寻找正确理解，而不只是承受群体压力。\"\naliases: []\nkeywords: [\"信息\", \"从众\", \"不确定\", \"陌生\", \"判断\", \"参照\", \"群体\", \"谢里夫\"]\nquestions: [\"为什么越不确定越容易参考他人的选择？\", \"多人意见一致能否保证他们掌握了准确信息？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"第8章 社会影响\", \"locator\": \"PDF 第 358–359 页\", \"pdfPages\": [358, 359]}, {\"book\": \"social\", \"chapter\": \"第8章 社会影响\", \"locator\": \"PDF 第 394 页\", \"pdfPages\": [394]}]\ncandidateRelated: [{\"concept\": \"规范性社会影响\", \"reason\": \"同一行为可能有另一动机\"}, {\"concept\": \"情境解释\", \"reason\": \"他人的意见提供解释参照\"}]\n---\n\n## 核心解释\n\n信息性社会影响是把他人的言语和行动作为判断何者正确、适当或有效的依据。自己缺少知识或参照时，这种依赖尤其容易发生。教材用谢里夫的游动错觉研究说明，当刺激本身模糊时，多人的估计会逐渐汇合，并可能留下持续影响；但群体一致本身并不保证判断符合事实。\n\n## 一个例子\n\n理解用例：第一次参加陌生活动，你不清楚应在哪里报到，便观察其他人的路线并跟着走。此时他人的行动被当作了解环境的线索，而不一定是害怕显得不同。\n\n## 理解边界\n\n他人也可能缺少可靠信息，因此共同判断仍会出错。实际从众可以同时包含信息性与规范性影响，不能只凭行为外观分类。\n"}, {"id": "social-investment-model", "title": "关系承诺投资模型", "english": "Investment Model of Commitment", "kind": "模型", "domain": "social", "subdomain": "亲密关系", "summary": "关系承诺不仅取决于当下是否满意，也受到替代选择与已经投入的资源影响。投资模型用这三个方面解释人为何愿意持续维持一段关系。", "aliases": [], "keywords": ["承诺", "满意", "替代", "投入", "关系", "维持", "资源", "合作"], "questions": ["为什么对关系不完全满意的人仍可能保持承诺？", "投入和满意在解释关系维持时有什么区别？"], "sources": [{"book": "social", "chapter": "第9章 关系与吸引", "locator": "PDF 第 450 页", "pdfPages": [450]}], "candidateRelated": [{"concept": "成人依恋的焦虑与回避", "reason": "关注关系中的安全与亲近"}, {"concept": "认知失调理论", "reason": "可帮助区分对投入的不同解释"}], "sections": [{"heading": "核心解释", "text": "投资模型把承诺与关系满意程度、可行替代选择及已有投入相联系。满意较高、替代选择较少、投入较多时，承诺通常更强。投入可以包括共同时间、资源与经历。教材进一步把承诺与促进关系的行为联系起来，例如包容和自我牺牲，帮助解释关系为何能够持续。"}, {"heading": "一个例子", "text": "理解用例：两个搭档虽然偶尔合作不顺，但重视共同成果，又已投入大量时间，并不容易找到合适新搭档。这个用例说明维持关系的考虑可以超出即时满意度。"}, {"heading": "理解边界", "text": "持续关系不一定表示关系幸福或健康。模型解释承诺的形成，不能把已经投入很多当作必须继续投入的建议。"}], "markdown": "---\nid: \"social-investment-model\"\ntitle: \"关系承诺投资模型\"\nenglish: \"Investment Model of Commitment\"\nkind: \"模型\"\ndomain: \"social\"\nsubdomain: \"亲密关系\"\nsummary: \"关系承诺不仅取决于当下是否满意，也受到替代选择与已经投入的资源影响。投资模型用这三个方面解释人为何愿意持续维持一段关系。\"\naliases: []\nkeywords: [\"承诺\", \"满意\", \"替代\", \"投入\", \"关系\", \"维持\", \"资源\", \"合作\"]\nquestions: [\"为什么对关系不完全满意的人仍可能保持承诺？\", \"投入和满意在解释关系维持时有什么区别？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"第9章 关系与吸引\", \"locator\": \"PDF 第 450 页\", \"pdfPages\": [450]}]\ncandidateRelated: [{\"concept\": \"成人依恋的焦虑与回避\", \"reason\": \"关注关系中的安全与亲近\"}, {\"concept\": \"认知失调理论\", \"reason\": \"可帮助区分对投入的不同解释\"}]\n---\n\n## 核心解释\n\n投资模型把承诺与关系满意程度、可行替代选择及已有投入相联系。满意较高、替代选择较少、投入较多时，承诺通常更强。投入可以包括共同时间、资源与经历。教材进一步把承诺与促进关系的行为联系起来，例如包容和自我牺牲，帮助解释关系为何能够持续。\n\n## 一个例子\n\n理解用例：两个搭档虽然偶尔合作不顺，但重视共同成果，又已投入大量时间，并不容易找到合适新搭档。这个用例说明维持关系的考虑可以超出即时满意度。\n\n## 理解边界\n\n持续关系不一定表示关系幸福或健康。模型解释承诺的形成，不能把已经投入很多当作必须继续投入的建议。\n"}, {"id": "social-kin-selection", "title": "亲缘选择", "english": "Kin Selection", "kind": "理论", "domain": "social", "subdomain": "合作与进化", "summary": "亲缘选择解释有成本的帮助为何可能经自然选择保留：帮助与自身共享基因的亲属，有时能增加相关基因传递至后代的机会。", "aliases": ["亲缘选择理论", "Kin selection theory"], "keywords": ["亲缘选择", "亲属", "遗传关联", "帮助", "利他", "自然选择", "行为成本", "进化", "Kin Selection"], "questions": ["有成本的帮助为何可能通过自然选择保留下来？", "亲缘选择与非亲属之间的互惠合作有什么区别？"], "sources": [{"book": "general", "chapter": "第3章 · 行为的遗传与进化基础", "locator": "PDF 第 246–247 页", "pdfPages": [246, 247]}], "candidateRelated": [{"title": "心理学的多层次解释", "reason": "进化功能与当前心理过程属不同层次"}, {"title": "观察学习", "reason": "合作规则也可经社会经验学习"}, {"title": "互惠利他", "reason": "比较遗传关联与未来回报这两种进化解释"}], "sections": [{"heading": "核心解释", "text": "亲缘选择从基因在代际间的传递解释有成本的帮助。若帮助使共享相关基因的亲属受益，其收益可能抵消帮助者承担的成本。教材以亲属间帮助和地松鼠警报行为说明这一逻辑；它解释的是行为可能演化的条件，并不要求行动者有意识地计算遗传关系。"}, {"heading": "一个例子", "text": "教材例子：地松鼠对附近捕食者发出警报会增加自身暴露风险，与亲属同住的地松鼠更可能报警。这帮助说明帮助者成本与亲属收益的关系。"}, {"heading": "理解边界", "text": "亲缘选择不能直接解释每一次帮助，也不等于亲属间总是合作。进化功能并非道德评价，当前动机还可能涉及情感、学习和文化。"}], "markdown": "---\nid: \"social-kin-selection\"\ntitle: \"亲缘选择\"\nenglish: \"Kin Selection\"\nkind: \"理论\"\ndomain: \"social\"\nsubdomain: \"合作与进化\"\nsummary: \"亲缘选择解释有成本的帮助为何可能经自然选择保留：帮助与自身共享基因的亲属，有时能增加相关基因传递至后代的机会。\"\naliases: [\"亲缘选择理论\", \"Kin selection theory\"]\nkeywords: [\"亲缘选择\", \"亲属\", \"遗传关联\", \"帮助\", \"利他\", \"自然选择\", \"行为成本\", \"进化\", \"Kin Selection\"]\nquestions: [\"有成本的帮助为何可能通过自然选择保留下来？\", \"亲缘选择与非亲属之间的互惠合作有什么区别？\"]\nsources: [{\"book\": \"general\", \"chapter\": \"第3章 · 行为的遗传与进化基础\", \"locator\": \"PDF 第 246–247 页\", \"pdfPages\": [246, 247]}]\ncandidateRelated: [{\"title\": \"心理学的多层次解释\", \"reason\": \"进化功能与当前心理过程属不同层次\"}, {\"title\": \"观察学习\", \"reason\": \"合作规则也可经社会经验学习\"}, {\"title\": \"互惠利他\", \"reason\": \"比较遗传关联与未来回报这两种进化解释\"}]\n---\n\n## 核心解释\n\n亲缘选择从基因在代际间的传递解释有成本的帮助。若帮助使共享相关基因的亲属受益，其收益可能抵消帮助者承担的成本。教材以亲属间帮助和地松鼠警报行为说明这一逻辑；它解释的是行为可能演化的条件，并不要求行动者有意识地计算遗传关系。\n\n## 一个例子\n\n教材例子：地松鼠对附近捕食者发出警报会增加自身暴露风险，与亲属同住的地松鼠更可能报警。这帮助说明帮助者成本与亲属收益的关系。\n\n## 理解边界\n\n亲缘选择不能直接解释每一次帮助，也不等于亲属间总是合作。进化功能并非道德评价，当前动机还可能涉及情感、学习和文化。\n"}, {"id": "social-mere-exposure", "title": "单纯曝光效应", "english": "Mere Exposure Effect", "kind": "效应", "domain": "social", "subdomain": "吸引与熟悉", "summary": "反复接触某个原本陌生的刺激，有时会增加对它的喜欢。单纯曝光效应关注接触与评价的关系，并不要求每次接触都伴随明确奖励或深入了解。", "aliases": ["纯粹接触效应"], "keywords": ["曝光", "重复接触", "熟悉", "好感", "吸引", "面孔", "偏好", "扎荣茨"], "questions": ["为什么熟悉感可能让一个对象显得更讨喜？", "单纯曝光与习惯化或去敏化有什么区别？"], "sources": [{"book": "social", "chapter": "第9章 关系与吸引", "locator": "PDF 第 416–417 页", "pdfPages": [416, 417]}], "candidateRelated": [{"concept": "社会交换理论", "reason": "互动奖励是另一种吸引解释"}, {"concept": "图式", "reason": "熟悉对象也涉及既有知识"}], "sections": [{"heading": "核心解释", "text": "教材以陌生词语、面孔等研究说明，增加出现次数可以改变人对刺激的评价，使较熟悉的对象得到更多好感。它也用这一效应解释接近和反复相遇为何可能促进吸引。重要的是区分简单重复接触、由接触获得的新信息，以及互动本身提供奖励这几种可能不同的来源。"}, {"heading": "一个例子", "text": "理解用例：一张原本不熟悉的海报反复出现在走廊里，后来你觉得它比初见时顺眼。用例只说明熟悉与好感的可能联系，没有假定你学到了更多内容。"}, {"heading": "理解边界", "text": "重复接触不保证一直增加喜欢，教材也提出反复听歌会烦躁的反例。此效应不等于反应减弱的习惯化或治疗中的脱敏。"}], "markdown": "---\nid: \"social-mere-exposure\"\ntitle: \"单纯曝光效应\"\nenglish: \"Mere Exposure Effect\"\nkind: \"效应\"\ndomain: \"social\"\nsubdomain: \"吸引与熟悉\"\nsummary: \"反复接触某个原本陌生的刺激，有时会增加对它的喜欢。单纯曝光效应关注接触与评价的关系，并不要求每次接触都伴随明确奖励或深入了解。\"\naliases: [\"纯粹接触效应\"]\nkeywords: [\"曝光\", \"重复接触\", \"熟悉\", \"好感\", \"吸引\", \"面孔\", \"偏好\", \"扎荣茨\"]\nquestions: [\"为什么熟悉感可能让一个对象显得更讨喜？\", \"单纯曝光与习惯化或去敏化有什么区别？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"第9章 关系与吸引\", \"locator\": \"PDF 第 416–417 页\", \"pdfPages\": [416, 417]}]\ncandidateRelated: [{\"concept\": \"社会交换理论\", \"reason\": \"互动奖励是另一种吸引解释\"}, {\"concept\": \"图式\", \"reason\": \"熟悉对象也涉及既有知识\"}]\n---\n\n## 核心解释\n\n教材以陌生词语、面孔等研究说明，增加出现次数可以改变人对刺激的评价，使较熟悉的对象得到更多好感。它也用这一效应解释接近和反复相遇为何可能促进吸引。重要的是区分简单重复接触、由接触获得的新信息，以及互动本身提供奖励这几种可能不同的来源。\n\n## 一个例子\n\n理解用例：一张原本不熟悉的海报反复出现在走廊里，后来你觉得它比初见时顺眼。用例只说明熟悉与好感的可能联系，没有假定你学到了更多内容。\n\n## 理解边界\n\n重复接触不保证一直增加喜欢，教材也提出反复听歌会烦躁的反例。此效应不等于反应减弱的习惯化或治疗中的脱敏。\n"}, {"id": "social-normative-influence", "title": "规范性社会影响", "english": "Normative Social Influence", "kind": "心理过程", "domain": "social", "subdomain": "从众", "summary": "人可能为了获得接纳、避免批评或排斥而与群体一致。规范性社会影响解释了为什么公开行动可以跟随他人，即使私下仍保留不同判断。", "aliases": [], "keywords": ["规范", "从众", "接纳", "排斥", "群体压力", "公开", "私下", "阿希"], "questions": ["为什么明知自己有不同看法还会公开赞同？", "怎样区分寻求正确答案与避免被排斥？"], "sources": [{"book": "social", "chapter": "第8章 社会影响", "locator": "PDF 第 360 页", "pdfPages": [360]}, {"book": "social", "chapter": "第8章 社会影响", "locator": "PDF 第 362–363 页", "pdfPages": [362, 363]}, {"book": "social", "chapter": "第8章 社会影响", "locator": "PDF 第 394 页", "pdfPages": [394]}], "candidateRelated": [{"concept": "信息性社会影响", "reason": "从众的另一种主要过程"}, {"concept": "社会计量器假说", "reason": "关系接纳与自我感受相连"}], "sections": [{"heading": "核心解释", "text": "规范性社会影响来自社会接纳与社会惩罚的压力。个体在意自己在群体中的位置，所以可能公开同意群体，即便没有完全相信群体判断。教材通过阿希的线段判断研究说明这种压力，并指出群体一致性、成员特点及周围情境都会影响从众，信息性影响也可能同时参与。"}, {"heading": "一个例子", "text": "理解用例：同学们都说某项展示安排很好，你其实有疑虑，却担心当场反对会让人不快，于是口头赞同。这里的关键是预期关系后果，而不只是别人拥有更多知识。"}, {"heading": "理解边界", "text": "一致行为不能直接证明存在规范压力，也不能说明私下态度已改变。理解原因时还要区分信息判断与避免排斥的动机。"}], "markdown": "---\nid: \"social-normative-influence\"\ntitle: \"规范性社会影响\"\nenglish: \"Normative Social Influence\"\nkind: \"心理过程\"\ndomain: \"social\"\nsubdomain: \"从众\"\nsummary: \"人可能为了获得接纳、避免批评或排斥而与群体一致。规范性社会影响解释了为什么公开行动可以跟随他人，即使私下仍保留不同判断。\"\naliases: []\nkeywords: [\"规范\", \"从众\", \"接纳\", \"排斥\", \"群体压力\", \"公开\", \"私下\", \"阿希\"]\nquestions: [\"为什么明知自己有不同看法还会公开赞同？\", \"怎样区分寻求正确答案与避免被排斥？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"第8章 社会影响\", \"locator\": \"PDF 第 360 页\", \"pdfPages\": [360]}, {\"book\": \"social\", \"chapter\": \"第8章 社会影响\", \"locator\": \"PDF 第 362–363 页\", \"pdfPages\": [362, 363]}, {\"book\": \"social\", \"chapter\": \"第8章 社会影响\", \"locator\": \"PDF 第 394 页\", \"pdfPages\": [394]}]\ncandidateRelated: [{\"concept\": \"信息性社会影响\", \"reason\": \"从众的另一种主要过程\"}, {\"concept\": \"社会计量器假说\", \"reason\": \"关系接纳与自我感受相连\"}]\n---\n\n## 核心解释\n\n规范性社会影响来自社会接纳与社会惩罚的压力。个体在意自己在群体中的位置，所以可能公开同意群体，即便没有完全相信群体判断。教材通过阿希的线段判断研究说明这种压力，并指出群体一致性、成员特点及周围情境都会影响从众，信息性影响也可能同时参与。\n\n## 一个例子\n\n理解用例：同学们都说某项展示安排很好，你其实有疑虑，却担心当场反对会让人不快，于是口头赞同。这里的关键是预期关系后果，而不只是别人拥有更多知识。\n\n## 理解边界\n\n一致行为不能直接证明存在规范压力，也不能说明私下态度已改变。理解原因时还要区分信息判断与避免排斥的动机。\n"}, {"id": "social-obedience-authority", "title": "服从权威", "english": "Obedience to Authority", "kind": "心理过程", "domain": "social", "subdomain": "社会影响", "summary": "权威要求可能使人持续执行自己感到不安的行为。教材用服从研究说明，承诺、情境解释、责任承担与抵抗困难共同参与，而非把参与者简单看作毫无顾虑。", "aliases": [], "keywords": ["服从", "权威", "责任", "逐步升级", "承诺", "反对", "情境", "米尔格拉姆"], "questions": ["为什么表达不赞同的人仍可能继续执行要求？", "权威承担责任会怎样改变行动者对处境的理解？"], "sources": [{"book": "social", "chapter": "第8章 社会影响", "locator": "PDF 第 386–387 页", "pdfPages": [386, 387]}], "candidateRelated": [{"concept": "规范性社会影响", "reason": "避免他人不满可能参与服从"}, {"concept": "情境解释", "reason": "影响任务与权威被如何理解"}], "sections": [{"heading": "核心解释", "text": "教材把服从置于相互冲突的力量之间：履行已接受的任务、避免权威不满，与停止伤害他人的要求可以同时存在。权威声称承担责任及逐步增加的要求，可能使人难以有效退出。许多参与者表达过反对却仍继续，这使服从的解释必须区分内心赞同与未能把反对化为行动。"}, {"heading": "一个例子", "text": "理解用例：活动负责人不断要求成员继续一项让人不安的任务，成员提出疑虑却没有明确退出。用例只展示反对与实际行动可能分离，不代表当事人赞同要求。"}, {"heading": "理解边界", "text": "服从研究不表示所有人必然服从，也不能把任何权威互动都当作同一种情境。应检查正当性、任务进程与可见的退出条件。"}], "markdown": "---\nid: \"social-obedience-authority\"\ntitle: \"服从权威\"\nenglish: \"Obedience to Authority\"\nkind: \"心理过程\"\ndomain: \"social\"\nsubdomain: \"社会影响\"\nsummary: \"权威要求可能使人持续执行自己感到不安的行为。教材用服从研究说明，承诺、情境解释、责任承担与抵抗困难共同参与，而非把参与者简单看作毫无顾虑。\"\naliases: []\nkeywords: [\"服从\", \"权威\", \"责任\", \"逐步升级\", \"承诺\", \"反对\", \"情境\", \"米尔格拉姆\"]\nquestions: [\"为什么表达不赞同的人仍可能继续执行要求？\", \"权威承担责任会怎样改变行动者对处境的理解？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"第8章 社会影响\", \"locator\": \"PDF 第 386–387 页\", \"pdfPages\": [386, 387]}]\ncandidateRelated: [{\"concept\": \"规范性社会影响\", \"reason\": \"避免他人不满可能参与服从\"}, {\"concept\": \"情境解释\", \"reason\": \"影响任务与权威被如何理解\"}]\n---\n\n## 核心解释\n\n教材把服从置于相互冲突的力量之间：履行已接受的任务、避免权威不满，与停止伤害他人的要求可以同时存在。权威声称承担责任及逐步增加的要求，可能使人难以有效退出。许多参与者表达过反对却仍继续，这使服从的解释必须区分内心赞同与未能把反对化为行动。\n\n## 一个例子\n\n理解用例：活动负责人不断要求成员继续一项让人不安的任务，成员提出疑虑却没有明确退出。用例只展示反对与实际行动可能分离，不代表当事人赞同要求。\n\n## 理解边界\n\n服从研究不表示所有人必然服从，也不能把任何权威互动都当作同一种情境。应检查正当性、任务进程与可见的退出条件。\n"}, {"id": "social-perceived-control", "title": "知觉控制", "english": "Perceived Control", "kind": "概念", "domain": "social", "subdomain": "压力与健康", "summary": "相信自己能够影响处境，与完全被动地接受安排有不同心理意义。知觉控制强调对可选择、可行动空间的理解，教材将其与压力和应对联系起来。", "aliases": ["感知控制"], "keywords": ["知觉控制", "控制感", "选择", "主动", "应对", "压力", "资源", "参与"], "questions": ["为什么小范围的选择也可能改变处境感受？", "感到有控制与实际有控制有什么区别？"], "sources": [{"book": "social", "chapter": "应用模块1 社会心理学与健康", "locator": "PDF 第 718–719 页", "pdfPages": [718, 719]}], "candidateRelated": [{"concept": "压力的认知评价", "reason": "控制感可参与资源评价"}, {"concept": "自我效能", "reason": "关注完成具体行动的能力判断"}], "sections": [{"heading": "核心解释", "text": "知觉控制是对自己能够影响生活条件或结果的判断。教材通过日常选择和照料环境中的研究，讨论控制感如何与情绪、活动参与及应对压力相联系。它关注的不只是客观选择数量，还包括人是否认识到这些选择。控制感也可能通过行为和生活习惯影响后续生活状况。"}, {"heading": "一个例子", "text": "理解用例：集体活动中，成员可以自行选择承担哪项任务，可能比完全被动接受分工更觉得自己能参与安排。这个用例只帮助理解控制感与客观安排的联系。"}, {"heading": "理解边界", "text": "控制感不等于真正控制一切，也不是保证健康的办法。需要区分可改变的条件与实际限制，避免把不良结果归咎于想法。"}], "markdown": "---\nid: \"social-perceived-control\"\ntitle: \"知觉控制\"\nenglish: \"Perceived Control\"\nkind: \"概念\"\ndomain: \"social\"\nsubdomain: \"压力与健康\"\nsummary: \"相信自己能够影响处境，与完全被动地接受安排有不同心理意义。知觉控制强调对可选择、可行动空间的理解，教材将其与压力和应对联系起来。\"\naliases: [\"感知控制\"]\nkeywords: [\"知觉控制\", \"控制感\", \"选择\", \"主动\", \"应对\", \"压力\", \"资源\", \"参与\"]\nquestions: [\"为什么小范围的选择也可能改变处境感受？\", \"感到有控制与实际有控制有什么区别？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"应用模块1 社会心理学与健康\", \"locator\": \"PDF 第 718–719 页\", \"pdfPages\": [718, 719]}]\ncandidateRelated: [{\"concept\": \"压力的认知评价\", \"reason\": \"控制感可参与资源评价\"}, {\"concept\": \"自我效能\", \"reason\": \"关注完成具体行动的能力判断\"}]\n---\n\n## 核心解释\n\n知觉控制是对自己能够影响生活条件或结果的判断。教材通过日常选择和照料环境中的研究，讨论控制感如何与情绪、活动参与及应对压力相联系。它关注的不只是客观选择数量，还包括人是否认识到这些选择。控制感也可能通过行为和生活习惯影响后续生活状况。\n\n## 一个例子\n\n理解用例：集体活动中，成员可以自行选择承担哪项任务，可能比完全被动接受分工更觉得自己能参与安排。这个用例只帮助理解控制感与客观安排的联系。\n\n## 理解边界\n\n控制感不等于真正控制一切，也不是保证健康的办法。需要区分可改变的条件与实际限制，避免把不良结果归咎于想法。\n"}, {"id": "social-pluralistic-ignorance", "title": "多元无知", "english": "Pluralistic Ignorance", "kind": "心理过程", "domain": "social", "subdomain": "社会判断与帮助", "summary": "人可能把他人的表面镇定误当作真实的不担心，而自己也维持镇定，最终彼此误读。多元无知说明，所有人的公开表现未必反映他们各自的私下判断。", "aliases": [], "keywords": ["多元无知", "表面镇定", "私下判断", "群体", "含混", "旁观者", "误读", "信息"], "questions": ["为什么大家私下担忧，却都以为只有自己担忧？", "多元无知与责任分散有什么区别？"], "sources": [{"book": "social", "chapter": "第14章 道德利他与合作", "locator": "PDF 第 678 页", "pdfPages": [678]}], "candidateRelated": [{"concept": "信息性社会影响", "reason": "他人的表现被当作判断线索"}, {"concept": "旁观者效应与责任分散", "reason": "可能共同妨碍帮助"}], "sections": [{"heading": "核心解释", "text": "教材在旁观者情境中介绍多元无知：面对含混事件，人会观察他人是否担忧，同时又为了避免尴尬而显得冷静。如果大家都如此，个人便可能把别人没有反应误当成没有危险的证据。这样，私下的不确定与公开的镇定相互作用，维持了一个并不准确的共同判断。"}, {"heading": "一个例子", "text": "理解用例：教室里出现异常气味，几位同学都觉得不对劲，却见别人仍在写字而没有开口。每个人的克制可能被他人误读为已经确认没有问题。"}, {"heading": "理解边界", "text": "多元无知不等于所有人真的相信同一件事，也不等于责任分散。需要区分误读他人想法与认为别人应该负责这两种过程。"}], "markdown": "---\nid: \"social-pluralistic-ignorance\"\ntitle: \"多元无知\"\nenglish: \"Pluralistic Ignorance\"\nkind: \"心理过程\"\ndomain: \"social\"\nsubdomain: \"社会判断与帮助\"\nsummary: \"人可能把他人的表面镇定误当作真实的不担心，而自己也维持镇定，最终彼此误读。多元无知说明，所有人的公开表现未必反映他们各自的私下判断。\"\naliases: []\nkeywords: [\"多元无知\", \"表面镇定\", \"私下判断\", \"群体\", \"含混\", \"旁观者\", \"误读\", \"信息\"]\nquestions: [\"为什么大家私下担忧，却都以为只有自己担忧？\", \"多元无知与责任分散有什么区别？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"第14章 道德利他与合作\", \"locator\": \"PDF 第 678 页\", \"pdfPages\": [678]}]\ncandidateRelated: [{\"concept\": \"信息性社会影响\", \"reason\": \"他人的表现被当作判断线索\"}, {\"concept\": \"旁观者效应与责任分散\", \"reason\": \"可能共同妨碍帮助\"}]\n---\n\n## 核心解释\n\n教材在旁观者情境中介绍多元无知：面对含混事件，人会观察他人是否担忧，同时又为了避免尴尬而显得冷静。如果大家都如此，个人便可能把别人没有反应误当成没有危险的证据。这样，私下的不确定与公开的镇定相互作用，维持了一个并不准确的共同判断。\n\n## 一个例子\n\n理解用例：教室里出现异常气味，几位同学都觉得不对劲，却见别人仍在写字而没有开口。每个人的克制可能被他人误读为已经确认没有问题。\n\n## 理解边界\n\n多元无知不等于所有人真的相信同一件事，也不等于责任分散。需要区分误读他人想法与认为别人应该负责这两种过程。\n"}, {"id": "social-procedural-justice", "title": "程序公正", "english": "Procedural Justice", "kind": "概念", "domain": "social", "subdomain": "公平判断", "summary": "人评价公正时，不只看自己得到多少，也会看决定如何作出。程序公正关注中立、一致、可信与尊重，说明过程体验与结果得失可以分开。", "aliases": ["程序正义"], "keywords": ["程序公正", "公平", "中立", "尊重", "信任", "分配", "结果", "过程"], "questions": ["为什么结果不利时人仍可能认可程序？", "程序公平与分配结果公平有什么不同？"], "sources": [{"book": "social", "chapter": "应用模块3 社会心理学与法律", "locator": "PDF 第 752–753 页", "pdfPages": [752, 753]}], "candidateRelated": [{"concept": "归因模糊性", "reason": "不明原因的待遇使评价更困难"}, {"concept": "情境解释", "reason": "过程体验影响对结果的理解"}], "sections": [{"heading": "核心解释", "text": "程序公正涉及分配奖励或惩罚的过程是否被认为公平。教材重点讨论权威是否中立、是否值得信任，以及是否尊重当事人。结果对自己不利时，人仍可能认可程序；获得有利结果时，也可能质疑过程。这个概念因而把对待遇方式的评价与对结果大小的评价区分开来。"}, {"heading": "一个例子", "text": "理解用例：两个小组都没有获得展示名额，其中一个收到清楚且一致的评选说明，另一个只听到随意敷衍。即便结果相同，成员对程序的评价仍可能不同。"}, {"heading": "理解边界", "text": "感觉程序公平不自动证明结果合理，更不证明没有结构性问题。需要区分主观公正感、实际程序和分配结果。"}], "markdown": "---\nid: \"social-procedural-justice\"\ntitle: \"程序公正\"\nenglish: \"Procedural Justice\"\nkind: \"概念\"\ndomain: \"social\"\nsubdomain: \"公平判断\"\nsummary: \"人评价公正时，不只看自己得到多少，也会看决定如何作出。程序公正关注中立、一致、可信与尊重，说明过程体验与结果得失可以分开。\"\naliases: [\"程序正义\"]\nkeywords: [\"程序公正\", \"公平\", \"中立\", \"尊重\", \"信任\", \"分配\", \"结果\", \"过程\"]\nquestions: [\"为什么结果不利时人仍可能认可程序？\", \"程序公平与分配结果公平有什么不同？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"应用模块3 社会心理学与法律\", \"locator\": \"PDF 第 752–753 页\", \"pdfPages\": [752, 753]}]\ncandidateRelated: [{\"concept\": \"归因模糊性\", \"reason\": \"不明原因的待遇使评价更困难\"}, {\"concept\": \"情境解释\", \"reason\": \"过程体验影响对结果的理解\"}]\n---\n\n## 核心解释\n\n程序公正涉及分配奖励或惩罚的过程是否被认为公平。教材重点讨论权威是否中立、是否值得信任，以及是否尊重当事人。结果对自己不利时，人仍可能认可程序；获得有利结果时，也可能质疑过程。这个概念因而把对待遇方式的评价与对结果大小的评价区分开来。\n\n## 一个例子\n\n理解用例：两个小组都没有获得展示名额，其中一个收到清楚且一致的评选说明，另一个只听到随意敷衍。即便结果相同，成员对程序的评价仍可能不同。\n\n## 理解边界\n\n感觉程序公平不自动证明结果合理，更不证明没有结构性问题。需要区分主观公正感、实际程序和分配结果。\n"}, {"id": "social-random-assignment", "title": "随机分配与实验", "english": "Random Assignment", "kind": "方法", "domain": "foundations", "subdomain": "研究设计", "summary": "实验通过改变自变量并观察结果来检验解释。随机分配将参与者分到不同条件，帮助减少条件之间原有差异，使因果比较更有依据。", "aliases": [], "keywords": ["实验", "随机分配", "自变量", "因变量", "因果", "混淆", "自选", "随机抽样"], "questions": ["随机分配和随机抽样解决的是同一个问题吗？", "为什么自行选择实验条件会妨碍因果解释？"], "sources": [{"book": "social", "chapter": "第2章 研究方法", "locator": "PDF 第 107 页", "pdfPages": [107]}], "candidateRelated": [{"concept": "信度、效度与操作化", "reason": "实验仍需合适测量"}, {"concept": "复制与开放科学", "reason": "重复检验实验结果"}], "sections": [{"heading": "核心解释", "text": "实验研究主动操纵预期产生影响的变量，并测量各条件下的结果。随机分配使每位参与者进入不同条件的机会由随机程序决定，从而减少系统性选择差异。它与从总体随机抽取样本不同：前者服务于条件间的因果比较，后者主要关系到样本能否描述目标总体。"}, {"heading": "一个例子", "text": "理解用例：研究者让报名者随机阅读两种长度相同、语气不同的通知，再比较理解程度。这样比让参与者自己选择通知，更能减少原有偏好带来的混淆。"}, {"heading": "理解边界", "text": "随机分配不自动保证操纵成功或测量有效，也不能使任意方便样本代表所有人。还要检查执行过程、条件差异及推广范围。"}], "markdown": "---\nid: \"social-random-assignment\"\ntitle: \"随机分配与实验\"\nenglish: \"Random Assignment\"\nkind: \"方法\"\ndomain: \"foundations\"\nsubdomain: \"研究设计\"\nsummary: \"实验通过改变自变量并观察结果来检验解释。随机分配将参与者分到不同条件，帮助减少条件之间原有差异，使因果比较更有依据。\"\naliases: []\nkeywords: [\"实验\", \"随机分配\", \"自变量\", \"因变量\", \"因果\", \"混淆\", \"自选\", \"随机抽样\"]\nquestions: [\"随机分配和随机抽样解决的是同一个问题吗？\", \"为什么自行选择实验条件会妨碍因果解释？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"第2章 研究方法\", \"locator\": \"PDF 第 107 页\", \"pdfPages\": [107]}]\ncandidateRelated: [{\"concept\": \"信度、效度与操作化\", \"reason\": \"实验仍需合适测量\"}, {\"concept\": \"复制与开放科学\", \"reason\": \"重复检验实验结果\"}]\n---\n\n## 核心解释\n\n实验研究主动操纵预期产生影响的变量，并测量各条件下的结果。随机分配使每位参与者进入不同条件的机会由随机程序决定，从而减少系统性选择差异。它与从总体随机抽取样本不同：前者服务于条件间的因果比较，后者主要关系到样本能否描述目标总体。\n\n## 一个例子\n\n理解用例：研究者让报名者随机阅读两种长度相同、语气不同的通知，再比较理解程度。这样比让参与者自己选择通知，更能减少原有偏好带来的混淆。\n\n## 理解边界\n\n随机分配不自动保证操纵成功或测量有效，也不能使任意方便样本代表所有人。还要检查执行过程、条件差异及推广范围。\n"}, {"id": "social-realistic-group-conflict", "title": "现实群体冲突理论", "english": "Realistic Group Conflict Theory", "kind": "理论", "domain": "social", "subdomain": "群际关系", "summary": "当群体围绕有限资源展开竞争时，群体边界可能伴随敌意与歧视。现实群体冲突理论强调目标关系，并关注需要相互合作的共同目标。", "aliases": [], "keywords": ["群体冲突", "资源", "竞争", "共同目标", "合作", "偏见", "上位目标", "敌意"], "questions": ["为什么共同目标可能改变原有群体敌意？", "没有现实利益竞争时还可能出现群体偏爱吗？"], "sources": [{"book": "social", "chapter": "第10章 刻板印象偏见与歧视", "locator": "PDF 第 505 页", "pdfPages": [505]}], "candidateRelated": [{"concept": "社会认同理论", "reason": "解释没有明显资源竞争的偏爱"}, {"concept": "信息性社会影响", "reason": "群体也会提供判断线索"}], "sections": [{"heading": "核心解释", "text": "现实群体冲突理论把群际偏见与竞争关系联系起来：若一方获益被理解为另一方受损，资源争夺可能加深敌意。教材以营地研究说明竞争与共同上位目标的不同作用；后者需要各方协作才能实现。这里的重点是群体所处的目标结构，而非单纯认为接触就能改善关系。"}, {"heading": "一个例子", "text": "理解用例：两个小组争夺唯一展示名额时可能互相贬低；后来必须合作修复共用设备，双方目标便发生变化。这个用例用于理解竞争与合作结构的差别。"}, {"heading": "理解边界", "text": "资源竞争不是所有偏见的必要条件，任意分类也可能出现内群体偏爱。共同目标的作用应结合具体合作情境理解。"}], "markdown": "---\nid: \"social-realistic-group-conflict\"\ntitle: \"现实群体冲突理论\"\nenglish: \"Realistic Group Conflict Theory\"\nkind: \"理论\"\ndomain: \"social\"\nsubdomain: \"群际关系\"\nsummary: \"当群体围绕有限资源展开竞争时，群体边界可能伴随敌意与歧视。现实群体冲突理论强调目标关系，并关注需要相互合作的共同目标。\"\naliases: []\nkeywords: [\"群体冲突\", \"资源\", \"竞争\", \"共同目标\", \"合作\", \"偏见\", \"上位目标\", \"敌意\"]\nquestions: [\"为什么共同目标可能改变原有群体敌意？\", \"没有现实利益竞争时还可能出现群体偏爱吗？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"第10章 刻板印象偏见与歧视\", \"locator\": \"PDF 第 505 页\", \"pdfPages\": [505]}]\ncandidateRelated: [{\"concept\": \"社会认同理论\", \"reason\": \"解释没有明显资源竞争的偏爱\"}, {\"concept\": \"信息性社会影响\", \"reason\": \"群体也会提供判断线索\"}]\n---\n\n## 核心解释\n\n现实群体冲突理论把群际偏见与竞争关系联系起来：若一方获益被理解为另一方受损，资源争夺可能加深敌意。教材以营地研究说明竞争与共同上位目标的不同作用；后者需要各方协作才能实现。这里的重点是群体所处的目标结构，而非单纯认为接触就能改善关系。\n\n## 一个例子\n\n理解用例：两个小组争夺唯一展示名额时可能互相贬低；后来必须合作修复共用设备，双方目标便发生变化。这个用例用于理解竞争与合作结构的差别。\n\n## 理解边界\n\n资源竞争不是所有偏见的必要条件，任意分类也可能出现内群体偏爱。共同目标的作用应结合具体合作情境理解。\n"}, {"id": "social-reciprocal-altruism", "title": "互惠利他", "english": "Reciprocal Altruism", "kind": "理论", "domain": "social", "subdomain": "帮助与合作", "summary": "互惠利他把帮助放入持续互动中：当前付出可能换来未来合作，记忆、声誉和对过去互惠的回应使非亲属间的帮助也能维持。", "aliases": [], "keywords": ["互惠", "利他", "合作", "回报", "重复互动", "声誉", "帮助", "博弈"], "questions": ["为什么重复交往可能改变合作选择？", "互惠帮助与当场交换有什么不同？"], "sources": [{"book": "social", "chapter": "第14章 道德利他与合作", "locator": "PDF 第 700 页", "pdfPages": [700]}, {"book": "general", "chapter": "第3章 · 行为的遗传与进化基础", "locator": "PDF 第 248–249 页", "pdfPages": [248, 249]}], "candidateRelated": [{"concept": "共情关怀与利他", "reason": "提供另一种帮助动机"}, {"concept": "关系承诺投资模型", "reason": "同样关注持续关系"}, {"title": "亲缘选择", "reason": "比较未来合作回报与遗传关联两种解释"}], "sections": [{"heading": "核心解释", "text": "互惠利他从长期合作解释非亲属间的帮助：当前付出可能增加未来获得回报的机会。教材关注记住谁曾合作、减少帮助不回报者，以及声誉和合作博弈。这是在进化或互动层面解释合作，不要求行动者每次都自觉算计；情感也可能支持这种持续关系。"}, {"heading": "一个例子", "text": "理解用例：两位同学长期互相整理课堂笔记，偶尔一方缺席时由另一方补上。这个用例说明，一次付出可以放在持续关系和未来互相帮助的预期中理解。"}, {"heading": "理解边界", "text": "互惠不要求每次立即等额回报，也不表示所有帮助都出于算计。需要与共情关怀、亲缘关系及其他合作解释区分。"}], "markdown": "---\nid: \"social-reciprocal-altruism\"\ntitle: \"互惠利他\"\nenglish: \"Reciprocal Altruism\"\nkind: \"理论\"\ndomain: \"social\"\nsubdomain: \"帮助与合作\"\nsummary: \"互惠利他把帮助放入持续互动中：当前付出可能换来未来合作，记忆、声誉和对过去互惠的回应使非亲属间的帮助也能维持。\"\naliases: []\nkeywords: [\"互惠\", \"利他\", \"合作\", \"回报\", \"重复互动\", \"声誉\", \"帮助\", \"博弈\"]\nquestions: [\"为什么重复交往可能改变合作选择？\", \"互惠帮助与当场交换有什么不同？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"第14章 道德利他与合作\", \"locator\": \"PDF 第 700 页\", \"pdfPages\": [700]}, {\"book\": \"general\", \"chapter\": \"第3章 · 行为的遗传与进化基础\", \"locator\": \"PDF 第 248–249 页\", \"pdfPages\": [248, 249]}]\ncandidateRelated: [{\"concept\": \"共情关怀与利他\", \"reason\": \"提供另一种帮助动机\"}, {\"concept\": \"关系承诺投资模型\", \"reason\": \"同样关注持续关系\"}, {\"title\": \"亲缘选择\", \"reason\": \"比较未来合作回报与遗传关联两种解释\"}]\n---\n\n## 核心解释\n\n互惠利他从长期合作解释非亲属间的帮助：当前付出可能增加未来获得回报的机会。教材关注记住谁曾合作、减少帮助不回报者，以及声誉和合作博弈。这是在进化或互动层面解释合作，不要求行动者每次都自觉算计；情感也可能支持这种持续关系。\n\n## 一个例子\n\n理解用例：两位同学长期互相整理课堂笔记，偶尔一方缺席时由另一方补上。这个用例说明，一次付出可以放在持续关系和未来互相帮助的预期中理解。\n\n## 理解边界\n\n互惠不要求每次立即等额回报，也不表示所有帮助都出于算计。需要与共情关怀、亲缘关系及其他合作解释区分。\n"}, {"id": "social-schemas", "title": "图式", "english": "Schemas", "kind": "概念", "domain": "cognition", "subdomain": "知识表征", "summary": "图式是关于世界的有组织知识，帮助人判断情境意味着什么及应如何行动。它让理解更有效率，但既有期待也可能遮蔽某个人或事件的特殊信息。", "aliases": ["Schema", "图式"], "keywords": ["图式", "知识结构", "期待", "情境", "角色", "概括", "刻板印象", "理解", "Schema", "知识表征", "预期", "填补", "脚本"], "questions": ["为什么进入陌生但同类的场所仍知道怎样行动？", "图式怎样帮助理解，又怎样造成误解？", "为什么我会自动补出别人没有明说的信息？", "图式在什么条件下适用，有什么局限？"], "sources": [{"book": "social", "chapter": "第1章 社会心理学导论", "locator": "PDF 第 42–43 页", "pdfPages": [42, 43]}, {"book": "cognitive", "chapter": "第7章 · 长期记忆系统", "locator": "PDF 第 372–372 页", "pdfPages": [372]}], "candidateRelated": [{"concept": "情境解释", "reason": "图式提供解释资源"}, {"concept": "确认偏差", "reason": "既有框架可能引导选择性搜索"}, {"title": "自上而下与自下而上加工", "reason": "图式提供自上而下的知识约束"}, {"title": "情境模型", "reason": "理解文本时会建立更具体的当前事件表征"}], "sections": [{"heading": "核心解释", "text": "图式储存对常见对象、角色和情境的概括性知识，使人不必每次从头理解环境。例如，它可以提示一堂研讨课通常怎样展开，人们在其中如何发言。教材把刻板印象看作关于某类人的图式，同时提醒，概括知识若被过度应用，就可能压过与眼前对象更相关的具体信息。"}, {"heading": "一个例子", "text": "理解用例：第一次走进新餐厅，你仍大致知道要找座位、看菜单和点餐，因为已有相关知识框架。如果餐厅规则特殊，这套期待也可能需要调整。"}, {"heading": "理解边界", "text": "图式不是刻板印象的同义词，也不必然导致偏差。问题在于知识是否适用，以及能否根据眼前的新信息作出修正。"}], "markdown": "---\nid: \"social-schemas\"\ntitle: \"图式\"\nenglish: \"Schemas\"\nkind: \"概念\"\ndomain: \"cognition\"\nsubdomain: \"知识表征\"\nsummary: \"图式是关于世界的有组织知识，帮助人判断情境意味着什么及应如何行动。它让理解更有效率，但既有期待也可能遮蔽某个人或事件的特殊信息。\"\naliases: [\"Schema\", \"图式\"]\nkeywords: [\"图式\", \"知识结构\", \"期待\", \"情境\", \"角色\", \"概括\", \"刻板印象\", \"理解\", \"Schema\", \"知识表征\", \"预期\", \"填补\", \"脚本\"]\nquestions: [\"为什么进入陌生但同类的场所仍知道怎样行动？\", \"图式怎样帮助理解，又怎样造成误解？\", \"为什么我会自动补出别人没有明说的信息？\", \"图式在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"第1章 社会心理学导论\", \"locator\": \"PDF 第 42–43 页\", \"pdfPages\": [42, 43]}, {\"book\": \"cognitive\", \"chapter\": \"第7章 · 长期记忆系统\", \"locator\": \"PDF 第 372–372 页\", \"pdfPages\": [372]}]\ncandidateRelated: [{\"concept\": \"情境解释\", \"reason\": \"图式提供解释资源\"}, {\"concept\": \"确认偏差\", \"reason\": \"既有框架可能引导选择性搜索\"}, {\"title\": \"自上而下与自下而上加工\", \"reason\": \"图式提供自上而下的知识约束\"}, {\"title\": \"情境模型\", \"reason\": \"理解文本时会建立更具体的当前事件表征\"}]\n---\n\n## 核心解释\n\n图式储存对常见对象、角色和情境的概括性知识，使人不必每次从头理解环境。例如，它可以提示一堂研讨课通常怎样展开，人们在其中如何发言。教材把刻板印象看作关于某类人的图式，同时提醒，概括知识若被过度应用，就可能压过与眼前对象更相关的具体信息。\n\n## 一个例子\n\n理解用例：第一次走进新餐厅，你仍大致知道要找座位、看菜单和点餐，因为已有相关知识框架。如果餐厅规则特殊，这套期待也可能需要调整。\n\n## 理解边界\n\n图式不是刻板印象的同义词，也不必然导致偏差。问题在于知识是否适用，以及能否根据眼前的新信息作出修正。\n"}, {"id": "social-self-affirmation", "title": "自我肯定理论", "english": "Self-Affirmation Theory", "kind": "理论", "domain": "social", "subdomain": "态度与自我", "summary": "当某个行为威胁积极自我评价时，人可以通过确认其他重要价值缓解威胁。自我肯定理论强调维护整体自我价值，不只是为受到质疑的行为寻找辩护。", "aliases": [], "keywords": ["自我肯定", "自尊", "价值", "失调", "威胁", "合理化", "自我完整", "应对"], "questions": ["为什么想到其他重要价值能改变对一次失误的反应？", "自我肯定与替错误辩护有什么区别？"], "sources": [{"book": "social", "chapter": "第6章 态度行为与合理化", "locator": "PDF 第 289 页", "pdfPages": [289]}], "candidateRelated": [{"concept": "认知失调理论", "reason": "自我肯定可以缓解其中的威胁"}, {"concept": "社会计量器假说", "reason": "从另一路径理解自尊变化"}], "sections": [{"heading": "核心解释", "text": "教材将自我肯定作为应对失调和自尊威胁的一种方式：个体可以直接处理问题，也可以回顾自己在其他领域的重要价值与良好品质。后者使一次不足不再等于整体自我失败，因而可能减少立即合理化的需要。它强调自我价值的多个来源，而不是反复宣称某项行为正确。"}, {"heading": "一个例子", "text": "理解用例：你在合作中犯错后，先承认错误，同时想起自己长期认真帮助同伴。这个用例说明，保留整体自我价值可能让人不必急着否认本次失误。"}, {"heading": "理解边界", "text": "自我肯定不等于自夸，也不自动解决实际问题。确认其他价值可能缓解威胁，但不能据此断定原来的行为合理。"}], "markdown": "---\nid: \"social-self-affirmation\"\ntitle:
