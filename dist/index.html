1, 1312]}]\ncandidateRelated: [{\"title\": \"情绪与重构性记忆\", \"reason\": \"当前情绪会影响可被提取和重建的过去\"}, {\"title\": \"认知行为取向的情绪解释\", \"reason\": \"关注思维与情绪相互强化的循环\"}, {\"title\": \"绝望理论\", \"reason\": \"区分反复思考的过程与对事件的消极推断内容\"}]\n---\n\n## 核心解释\n\n情绪可以增加某类记忆的可及性，这些记忆又反过来强化当前情绪。教材据此讨论反刍如何参与低落的延续：思考反复围绕症状和失败，却不形成新的理解或行动。它同时区分消极沉思与反思性探究，提醒我们不能把所有回顾痛苦经历的思考都视为相同过程。\n\n## 一个例子\n\n理解用例：反复问“为什么我总是失败”却始终回到同一结论，和具体分析哪一步出了问题并形成新的理解，虽然都在回顾，却有不同结构。\n\n## 理解边界\n\n反刍与困难的关系可能双向，不能仅因一个人重复思考就推断其患有障碍。这里介绍维持机制，不是针对个人的治疗操作建议。\n"}, {"id": "emotion-self-conscious-development", "title": "自我意识情绪的发展", "english": "Development of Self-Conscious Emotions", "kind": "心理过程", "domain": "development", "subdomain": "儿童情绪发展", "summary": "尴尬、羞耻、内疚和自豪的发展与自我识别、理解他人视角以及评价自身行为有关，展示了情绪如何随社会认知能力变得复杂。", "aliases": [], "keywords": ["自我意识情绪", "尴尬", "羞耻", "内疚", "自豪", "镜像自我识别", "他人视角", "儿童", "发展", "Development of Self-Conscious Emotions"], "questions": ["儿童为什么不是出生时就以成人方式感到羞耻或自豪？", "意识到别人怎么看自己与情绪有什么关系？"], "sources": [{"book": "emotions", "chapter": "第8章 儿童期情绪的发展", "locator": "第8章 · Social Emotions: 18 Months and Beyond", "epubPath": "OPS/c08.xhtml#head-3-103"}], "candidateRelated": [{"title": "情绪评价理论", "reason": "自我与责任归因改变情绪性质"}, {"title": "家庭中的情绪社会化", "reason": "社会互动帮助儿童理解情绪与规范"}], "sections": [{"heading": "核心解释", "text": "教材指出，自我意识情绪需要儿童逐渐理解自己是可被他人看见和评价的对象，也需要区分他人与自己的体验。较早的自我识别与尴尬有关，随后将结果归于自身属性或行为的能力帮助形成自豪、羞耻与内疚。情绪变化由认知、关系经验和表达能力共同支持。"}, {"heading": "一个例子", "text": "理解用例：儿童打翻同伴的玩具后，不仅因声音受惊，还开始关注对方的反应并尝试修复；这比单纯不愉快包含更多关于自我与他人的理解。"}, {"heading": "理解边界", "text": "发展年龄是研究中的大致范围，不是每个儿童必须遵循的时刻表。镜像任务和外显动作也无法完整代表全部自我意识或情绪体验。"}], "markdown": "---\nid: \"emotion-self-conscious-development\"\ntitle: \"自我意识情绪的发展\"\nenglish: \"Development of Self-Conscious Emotions\"\nkind: \"心理过程\"\ndomain: \"development\"\nsubdomain: \"儿童情绪发展\"\nsummary: \"尴尬、羞耻、内疚和自豪的发展与自我识别、理解他人视角以及评价自身行为有关，展示了情绪如何随社会认知能力变得复杂。\"\naliases: []\nkeywords: [\"自我意识情绪\", \"尴尬\", \"羞耻\", \"内疚\", \"自豪\", \"镜像自我识别\", \"他人视角\", \"儿童\", \"发展\", \"Development of Self-Conscious Emotions\"]\nquestions: [\"儿童为什么不是出生时就以成人方式感到羞耻或自豪？\", \"意识到别人怎么看自己与情绪有什么关系？\"]\nsources: [{\"book\": \"emotions\", \"chapter\": \"第8章 儿童期情绪的发展\", \"locator\": \"第8章 · Social Emotions: 18 Months and Beyond\", \"epubPath\": \"OPS/c08.xhtml#head-3-103\"}]\ncandidateRelated: [{\"title\": \"情绪评价理论\", \"reason\": \"自我与责任归因改变情绪性质\"}, {\"title\": \"家庭中的情绪社会化\", \"reason\": \"社会互动帮助儿童理解情绪与规范\"}]\n---\n\n## 核心解释\n\n教材指出，自我意识情绪需要儿童逐渐理解自己是可被他人看见和评价的对象，也需要区分他人与自己的体验。较早的自我识别与尴尬有关，随后将结果归于自身属性或行为的能力帮助形成自豪、羞耻与内疚。情绪变化由认知、关系经验和表达能力共同支持。\n\n## 一个例子\n\n理解用例：儿童打翻同伴的玩具后，不仅因声音受惊，还开始关注对方的反应并尝试修复；这比单纯不愉快包含更多关于自我与他人的理解。\n\n## 理解边界\n\n发展年龄是研究中的大致范围，不是每个儿童必须遵循的时刻表。镜像任务和外显动作也无法完整代表全部自我意识或情绪体验。\n"}, {"id": "emotion-self-construal", "title": "独立与互依自我建构", "english": "Independent and Interdependent Self-Construal", "kind": "理论", "domain": "emotion", "subdomain": "文化与情绪", "summary": "自我可以更多围绕独特属性，也可以更多围绕关系和角色来理解；这种自我建构影响哪些事件重要，以及情绪的体验、表达与调节。", "aliases": ["Self-Construal"], "keywords": ["自我建构", "独立自我", "互依自我", "文化", "关系", "角色", "自豪", "羞耻", "社会和谐", "Independent and Interdependent Self-Construal"], "questions": ["为什么同一件事对不同文化背景的人情绪意义不同？", "把自己看作独立个体或关系中的一员会带来什么差别？"], "sources": [{"book": "emotions", "chapter": "第3章 情绪的文化理解", "locator": "第3章 · Independent and Interdependent Selves", "epubPath": "OPS/c03.xhtml#head-3-32"}], "candidateRelated": [{"title": "情绪评价理论", "reason": "自我建构改变评价涉及的目标和价值"}, {"title": "理想情感与情感评价", "reason": "解释文化偏好的情绪状态"}], "sections": [{"heading": "核心解释", "text": "独立自我强调独特性、偏好和相对稳定的内部属性；互依自我强调与他人的连接、角色和情境。由于情绪回应的是个人关切，两种自我理解会使成功、冲突、义务或他人评价获得不同意义，也可能影响社会投入或疏离情绪出现的机会，以及表达和调节是否合宜的标准。"}, {"heading": "一个例子", "text": "理解用例：完成一项团队任务后，有人首先为自己的能力被认可而高兴，有人首先为履行承诺、与伙伴配合顺利而满足，两种侧重可以并存。"}, {"heading": "理解边界", "text": "这是比较文化倾向的框架，不是按国家给所有人分类。群体内部存在差异，同一个人也能在不同关系中采用不同自我理解。"}], "markdown": "---\nid: \"emotion-self-construal\"\ntitle: \"独立与互依自我建构\"\nenglish: \"Independent and Interdependent Self-Construal\"\nkind: \"理论\"\ndomain: \"emotion\"\nsubdomain: \"文化与情绪\"\nsummary: \"自我可以更多围绕独特属性，也可以更多围绕关系和角色来理解；这种自我建构影响哪些事件重要，以及情绪的体验、表达与调节。\"\naliases: [\"Self-Construal\"]\nkeywords: [\"自我建构\", \"独立自我\", \"互依自我\", \"文化\", \"关系\", \"角色\", \"自豪\", \"羞耻\", \"社会和谐\", \"Independent and Interdependent Self-Construal\"]\nquestions: [\"为什么同一件事对不同文化背景的人情绪意义不同？\", \"把自己看作独立个体或关系中的一员会带来什么差别？\"]\nsources: [{\"book\": \"emotions\", \"chapter\": \"第3章 情绪的文化理解\", \"locator\": \"第3章 · Independent and Interdependent Selves\", \"epubPath\": \"OPS/c03.xhtml#head-3-32\"}]\ncandidateRelated: [{\"title\": \"情绪评价理论\", \"reason\": \"自我建构改变评价涉及的目标和价值\"}, {\"title\": \"理想情感与情感评价\", \"reason\": \"解释文化偏好的情绪状态\"}]\n---\n\n## 核心解释\n\n独立自我强调独特性、偏好和相对稳定的内部属性；互依自我强调与他人的连接、角色和情境。由于情绪回应的是个人关切，两种自我理解会使成功、冲突、义务或他人评价获得不同意义，也可能影响社会投入或疏离情绪出现的机会，以及表达和调节是否合宜的标准。\n\n## 一个例子\n\n理解用例：完成一项团队任务后，有人首先为自己的能力被认可而高兴，有人首先为履行承诺、与伙伴配合顺利而满足，两种侧重可以并存。\n\n## 理解边界\n\n这是比较文化倾向的框架，不是按国家给所有人分类。群体内部存在差异，同一个人也能在不同关系中采用不同自我理解。\n"}, {"id": "emotion-social-intuition", "title": "道德判断的社会直觉观点", "english": "Social Intuitionist Approach to Moral Judgment", "kind": "理论", "domain": "emotion", "subdomain": "情绪与道德", "summary": "社会直觉观点强调道德判断常先由快速、情绪性的直觉形成，较慢推理随后参与解释与交流；它提醒人区分判断发生与理由陈述。", "aliases": ["道德社会直觉模型"], "keywords": ["道德判断", "社会直觉", "Haidt", "海特", "情绪直觉", "系统一", "系统二", "理由", "道德推理", "Social Intuitionist Approach to Moral Judgment"], "questions": ["先觉得一件事不对，再寻找理由，是怎样的判断过程？", "说得出的理由是否总是最初形成判断的原因？"], "sources": [{"book": "emotions", "chapter": "第10章 情绪与思维", "locator": "第10章 · Intuitions and Principles", "epubPath": "OPS/c10.xhtml#head-3-139"}], "candidateRelated": [{"title": "厌恶的污染防御与扩展", "reason": "厌恶可参与某些道德直觉"}, {"title": "情绪评价理论", "reason": "快速评价可连接价值关切与情绪"}], "sections": [{"heading": "核心解释", "text": "教材介绍海特对“道德主要来自理性推导”的挑战：快速的启发式评价可以先产生道德上的赞同或反感，随后才出现较慢的审议和理由表达，并可能进入与他人的讨论。该观点把情绪放回道德判断的形成过程，让研究者分别考察初始直觉、之后推理及社会交流。"}, {"heading": "一个例子", "text": "理解用例：听到某人违背承诺，你很快感到不对，过后才组织关于责任、公平和后果的理由；最初反应与后来论证值得分开观察。"}, {"heading": "理解边界", "text": "强调直觉先行不意味着推理从不改变判断，也不表示情绪直觉必然正确。教材同时讨论原则与理性，因此应保留不同路径的比较。"}], "markdown": "---\nid: \"emotion-social-intuition\"\ntitle: \"道德判断的社会直觉观点\"\nenglish: \"Social Intuitionist Approach to Moral Judgment\"\nkind: \"理论\"\ndomain: \"emotion\"\nsubdomain: \"情绪与道德\"\nsummary: \"社会直觉观点强调道德判断常先由快速、情绪性的直觉形成，较慢推理随后参与解释与交流；它提醒人区分判断发生与理由陈述。\"\naliases: [\"道德社会直觉模型\"]\nkeywords: [\"道德判断\", \"社会直觉\", \"Haidt\", \"海特\", \"情绪直觉\", \"系统一\", \"系统二\", \"理由\", \"道德推理\", \"Social Intuitionist Approach to Moral Judgment\"]\nquestions: [\"先觉得一件事不对，再寻找理由，是怎样的判断过程？\", \"说得出的理由是否总是最初形成判断的原因？\"]\nsources: [{\"book\": \"emotions\", \"chapter\": \"第10章 情绪与思维\", \"locator\": \"第10章 · Intuitions and Principles\", \"epubPath\": \"OPS/c10.xhtml#head-3-139\"}]\ncandidateRelated: [{\"title\": \"厌恶的污染防御与扩展\", \"reason\": \"厌恶可参与某些道德直觉\"}, {\"title\": \"情绪评价理论\", \"reason\": \"快速评价可连接价值关切与情绪\"}]\n---\n\n## 核心解释\n\n教材介绍海特对“道德主要来自理性推导”的挑战：快速的启发式评价可以先产生道德上的赞同或反感，随后才出现较慢的审议和理由表达，并可能进入与他人的讨论。该观点把情绪放回道德判断的形成过程，让研究者分别考察初始直觉、之后推理及社会交流。\n\n## 一个例子\n\n理解用例：听到某人违背承诺，你很快感到不对，过后才组织关于责任、公平和后果的理由；最初反应与后来论证值得分开观察。\n\n## 理解边界\n\n强调直觉先行不意味着推理从不改变判断，也不表示情绪直觉必然正确。教材同时讨论原则与理性，因此应保留不同路径的比较。\n"}, {"id": "emotion-social-referencing", "title": "社会参照", "english": "Social Referencing", "kind": "心理过程", "domain": "development", "subdomain": "儿童情绪发展", "summary": "社会参照指儿童在不确定情境中利用他人的情绪表达来指导行动；表情、声音与关系提供信息，帮助决定接近还是回避。", "aliases": [], "keywords": ["社会参照", "婴儿", "视觉悬崖", "表情", "声音", "不确定性", "接近", "回避", "社会信息", "Social Referencing"], "questions": ["儿童遇到陌生事物时为什么先看照料者的表情？", "他人的情绪怎样成为判断环境的线索？"], "sources": [{"book": "emotions", "chapter": "第8章 儿童期情绪的发展", "locator": "第8章 · Facial Expressions", "epubPath": "OPS/c08.xhtml#head-3-105"}], "candidateRelated": [{"title": "情绪表达的行为生态观点", "reason": "表达传递情境与行动信息"}, {"title": "儿童依恋与安全基地", "reason": "熟悉关系提供探索环境时的支持"}], "sections": [{"heading": "核心解释", "text": "当环境本身难以判断时，儿童可以把熟悉他人的情绪表现作为行动信息。教材以视觉悬崖研究说明，照料者的愉快或害怕表达会影响幼儿是否向前，声音与面部信息也能共同发挥作用。这说明识别情绪不仅是给表情命名，还服务于在关系中理解情况和调节行动。"}, {"heading": "一个例子", "text": "理解用例：第一次接近一只温顺小狗的幼儿先看父亲，如果父亲语气轻松、表情鼓励，幼儿可能更愿意靠近；惊恐信号则可能促使后退。"}, {"heading": "理解边界", "text": "社会参照不等于简单复制别人的感受，儿童可能把表达当作环境信息。作用还取决于年龄、信息通道、关系和情境是否模糊。"}], "markdown": "---\nid: \"emotion-social-referencing\"\ntitle: \"社会参照\"\nenglish: \"Social Referencing\"\nkind: \"心理过程\"\ndomain: \"development\"\nsubdomain: \"儿童情绪发展\"\nsummary: \"社会参照指儿童在不确定情境中利用他人的情绪表达来指导行动；表情、声音与关系提供信息，帮助决定接近还是回避。\"\naliases: []\nkeywords: [\"社会参照\", \"婴儿\", \"视觉悬崖\", \"表情\", \"声音\", \"不确定性\", \"接近\", \"回避\", \"社会信息\", \"Social Referencing\"]\nquestions: [\"儿童遇到陌生事物时为什么先看照料者的表情？\", \"他人的情绪怎样成为判断环境的线索？\"]\nsources: [{\"book\": \"emotions\", \"chapter\": \"第8章 儿童期情绪的发展\", \"locator\": \"第8章 · Facial Expressions\", \"epubPath\": \"OPS/c08.xhtml#head-3-105\"}]\ncandidateRelated: [{\"title\": \"情绪表达的行为生态观点\", \"reason\": \"表达传递情境与行动信息\"}, {\"title\": \"儿童依恋与安全基地\", \"reason\": \"熟悉关系提供探索环境时的支持\"}]\n---\n\n## 核心解释\n\n当环境本身难以判断时，儿童可以把熟悉他人的情绪表现作为行动信息。教材以视觉悬崖研究说明，照料者的愉快或害怕表达会影响幼儿是否向前，声音与面部信息也能共同发挥作用。这说明识别情绪不仅是给表情命名，还服务于在关系中理解情况和调节行动。\n\n## 一个例子\n\n理解用例：第一次接近一只温顺小狗的幼儿先看父亲，如果父亲语气轻松、表情鼓励，幼儿可能更愿意靠近；惊恐信号则可能促使后退。\n\n## 理解边界\n\n社会参照不等于简单复制别人的感受，儿童可能把表达当作环境信息。作用还取决于年龄、信息通道、关系和情境是否模糊。\n"}, {"id": "emotion-somatic-marker", "title": "躯体标记假说", "english": "Somatic Marker Hypothesis", "kind": "理论", "domain": "emotion", "subdomain": "情绪与决策", "summary": "躯体标记假说认为，过往结果形成的身体相关信号或其表征能为选项标出情绪意义，从而帮助人在复杂决策中筛选行动。", "aliases": [], "keywords": ["躯体标记", "达马西奥", "决策", "腹内侧前额叶", "爱荷华赌博任务", "风险", "皮肤电", "直觉", "Somatic Marker Hypothesis"], "questions": ["身体上的不安为什么可能帮助人避开危险选项？", "情绪反应受损为何有时会使决策更差？"], "sources": [{"book": "emotions", "chapter": "第5章 身体变化与情绪", "locator": "第5章 · Gut Feelings and Decision Making", "epubPath": "OPS/c05.xhtml#head-3-68"}], "candidateRelated": [{"title": "内感受", "reason": "觉察身体信号是理解标记作用的相关过程"}, {"title": "情感即信息", "reason": "两者均考察情绪如何为判断提供线索"}], "sections": [{"heading": "核心解释", "text": "达马西奥根据部分前额叶损伤者的情绪和社会决策困难提出：选项可唤起与过去结果相关的身体反应，或这些反应的心理表征，帮助判断价值与风险。教材用爱荷华赌博任务说明这一思路：选项的即时收益与长期后果不同，预期性的身体信号可能帮助人避开不利选择。"}, {"heading": "一个例子", "text": "理解用例：一个投资方案表面收益诱人，但与过去失败经历相似时会引起不安；假说关注这种身体相关提示如何参与后续权衡。"}, {"heading": "理解边界", "text": "假说不意味着直觉必然正确，也不意味着应以身体感觉替代证据。任务表现、脑损伤和身体指标之间的关联仍须按研究设计解读。"}], "markdown": "---\nid: \"emotion-somatic-marker\"\ntitle: \"躯体标记假说\"\nenglish: \"Somatic Marker Hypothesis\"\nkind: \"理论\"\ndomain: \"emotion\"\nsubdomain: \"情绪与决策\"\nsummary: \"躯体标记假说认为，过往结果形成的身体相关信号或其表征能为选项标出情绪意义，从而帮助人在复杂决策中筛选行动。\"\naliases: []\nkeywords: [\"躯体标记\", \"达马西奥\", \"决策\", \"腹内侧前额叶\", \"爱荷华赌博任务\", \"风险\", \"皮肤电\", \"直觉\", \"Somatic Marker Hypothesis\"]\nquestions: [\"身体上的不安为什么可能帮助人避开危险选项？\", \"情绪反应受损为何有时会使决策更差？\"]\nsources: [{\"book\": \"emotions\", \"chapter\": \"第5章 身体变化与情绪\", \"locator\": \"第5章 · Gut Feelings and Decision Making\", \"epubPath\": \"OPS/c05.xhtml#head-3-68\"}]\ncandidateRelated: [{\"title\": \"内感受\", \"reason\": \"觉察身体信号是理解标记作用的相关过程\"}, {\"title\": \"情感即信息\", \"reason\": \"两者均考察情绪如何为判断提供线索\"}]\n---\n\n## 核心解释\n\n达马西奥根据部分前额叶损伤者的情绪和社会决策困难提出：选项可唤起与过去结果相关的身体反应，或这些反应的心理表征，帮助判断价值与风险。教材用爱荷华赌博任务说明这一思路：选项的即时收益与长期后果不同，预期性的身体信号可能帮助人避开不利选择。\n\n## 一个例子\n\n理解用例：一个投资方案表面收益诱人，但与过去失败经历相似时会引起不安；假说关注这种身体相关提示如何参与后续权衡。\n\n## 理解边界\n\n假说不意味着直觉必然正确，也不意味着应以身体感觉替代证据。任务表现、脑损伤和身体指标之间的关联仍须按研究设计解读。\n"}, {"id": "emotion-status-display", "title": "情绪表达与地位协商", "english": "Emotion and Social Hierarchy", "kind": "心理过程", "domain": "emotion", "subdomain": "社会关系", "summary": "情绪表达既反映地位，也参与协商地位：愤怒、自豪、羞耻或尴尬向他人传递不同关系信号，影响群体互动中的接近与退让。", "aliases": [], "keywords": ["社会地位", "权力", "等级", "愤怒", "自豪", "羞耻", "尴尬", "关系信号", "支配", "Emotion and Social Hierarchy"], "questions": ["情绪表达为什么会改变别人对一个人地位的判断？", "羞耻或尴尬在社会互动中可能传递什么信息？"], "sources": [{"book": "emotions", "chapter": "第2章 情绪的进化", "locator": "第2章 · Emotions and Negotiation of Social Hierarchy", "epubPath": "OPS/c02.xhtml#head-3-25"}, {"book": "emotions", "chapter": "第9章 社会关系中的情绪", "locator": "第9章 · Emotional Displays and the Negotiation of Social Rank", "epubPath": "OPS/c09.xhtml#head-3-122"}], "candidateRelated": [{"title": "情绪表达的行为生态观点", "reason": "地位协商属于表达的社会互动功能"}, {"title": "群体情绪与集体情绪", "reason": "把情绪的关系功能扩展到群体层面"}], "sections": [{"heading": "核心解释", "text": "教材把情绪放到关系协调中考察。某些愤怒和自豪表达可以传达较高地位或对资源的主张，羞耻和尴尬则可能显示退让、承认规范或较低地位。情绪因此不是只有私人的感受，它还向他人提供关系信息；同时，人处于什么位置又会改变其可以表达及容易体验的情绪。"}, {"heading": "一个例子", "text": "理解用例：小组成员受到表扬后昂首微笑，别人可能据此看到自信与成就；犯错后的低头和歉意则可能帮助表明对共同规则的认可。"}, {"heading": "理解边界", "text": "相同表情的意义取决于关系、规范和情境，不能把愤怒直接等同于权力。表达地位信号也不保证观察者会接受相应主张。"}], "markdown": "---\nid: \"emotion-status-display\"\ntitle: \"情绪表达与地位协商\"\nenglish: \"Emotion and Social Hierarchy\"\nkind: \"心理过程\"\ndomain: \"emotion\"\nsubdomain: \"社会关系\"\nsummary: \"情绪表达既反映地位，也参与协商地位：愤怒、自豪、羞耻或尴尬向他人传递不同关系信号，影响群体互动中的接近与退让。\"\naliases: []\nkeywords: [\"社会地位\", \"权力\", \"等级\", \"愤怒\", \"自豪\", \"羞耻\", \"尴尬\", \"关系信号\", \"支配\", \"Emotion and Social Hierarchy\"]\nquestions: [\"情绪表达为什么会改变别人对一个人地位的判断？\", \"羞耻或尴尬在社会互动中可能传递什么信息？\"]\nsources: [{\"book\": \"emotions\", \"chapter\": \"第2章 情绪的进化\", \"locator\": \"第2章 · Emotions and Negotiation of Social Hierarchy\", \"epubPath\": \"OPS/c02.xhtml#head-3-25\"}, {\"book\": \"emotions\", \"chapter\": \"第9章 社会关系中的情绪\", \"locator\": \"第9章 · Emotional Displays and the Negotiation of Social Rank\", \"epubPath\": \"OPS/c09.xhtml#head-3-122\"}]\ncandidateRelated: [{\"title\": \"情绪表达的行为生态观点\", \"reason\": \"地位协商属于表达的社会互动功能\"}, {\"title\": \"群体情绪与集体情绪\", \"reason\": \"把情绪的关系功能扩展到群体层面\"}]\n---\n\n## 核心解释\n\n教材把情绪放到关系协调中考察。某些愤怒和自豪表达可以传达较高地位或对资源的主张，羞耻和尴尬则可能显示退让、承认规范或较低地位。情绪因此不是只有私人的感受，它还向他人提供关系信息；同时，人处于什么位置又会改变其可以表达及容易体验的情绪。\n\n## 一个例子\n\n理解用例：小组成员受到表扬后昂首微笑，别人可能据此看到自信与成就；犯错后的低头和歉意则可能帮助表明对共同规则的认可。\n\n## 理解边界\n\n相同表情的意义取决于关系、规范和情境，不能把愤怒直接等同于权力。表达地位信号也不保证观察者会接受相应主张。\n"}, {"id": "emotion-temperament", "title": "气质与情绪偏向", "english": "Temperament and Affective Biases", "kind": "概念", "domain": "development", "subdomain": "个体差异", "summary": "气质是较早出现、具有生物基础的情绪和调节倾向，会影响注意什么、如何解释事件及如何行动，但也在发展和经验中变化。", "aliases": [], "keywords": ["气质", "行为抑制", "负性情绪", "积极情绪", "冲动", "注意", "情绪反应性", "人格", "个体差异", "Temperament and Affective Biases"], "questions": ["为什么有些儿童面对新情境更谨慎，有些更大胆？", "早期气质怎样影响后来理解世界的方式？"], "sources": [{"book": "emotions", "chapter": "第8章 儿童期情 "text": "经典条件作用研究条件刺激与无条件刺激如何建立联系。学习后，条件刺激可以单独引发反应；相似线索可能泛化，也能通过差异经验学会辨别。教材强调可靠预测的重要性，并指出消退通常不等于原有学习彻底消失，因此反应可能恢复。"}, {"heading": "一个例子", "text": "理解用例：原本普通的提示声多次预示食物到来，后来只听到声音就产生期待。若提示声不再预示食物，这种反应可能逐渐减弱。"}, {"heading": "理解边界", "text": "条件反应不一定是无条件反应的简单复制，刺激时序和预测信息都很重要。消退后的恢复也说明“暂不反应”不等于学习痕迹被抹掉。"}], "markdown": "---\nid: \"learning-classical-conditioning\"\ntitle: \"经典条件作用\"\nenglish: \"Classical conditioning\"\nkind: \"心理过程\"\ndomain: \"learning\"\nsubdomain: \"基本学习\"\nsummary: \"原本中性的线索在能够预测重要事件后，可能引起预备性反应。学习的不只是反复相邻，更包括线索与后续结果之间的预测关系。\"\naliases: [\"Classical conditioning\"]\nkeywords: [\"经典条件作用\", \"Classical conditioning\", \"基本学习\", \"联结\", \"预测\", \"条件反射\", \"巴甫洛夫\", \"消退\", \"泛化\"]\nquestions: [\"经典条件作用解释了什么心理现象？\", \"经典条件作用在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"general\", \"chapter\": \"第8章 · 学习的基本过程\", \"locator\": \"PDF 第 601–624 页\", \"pdfPages\": [601, 623, 624]}]\ncandidateRelated: [{\"title\": \"操作性条件作用\", \"reason\": \"分别侧重事件关系与行为后果\"}, {\"title\": \"赫布学习与长时程增强\", \"reason\": \"学习的连接变化需要神经机制支持\"}]\n---\n\n## 核心解释\n\n经典条件作用研究条件刺激与无条件刺激如何建立联系。学习后，条件刺激可以单独引发反应；相似线索可能泛化，也能通过差异经验学会辨别。教材强调可靠预测的重要性，并指出消退通常不等于原有学习彻底消失，因此反应可能恢复。\n\n## 一个例子\n\n理解用例：原本普通的提示声多次预示食物到来，后来只听到声音就产生期待。若提示声不再预示食物，这种反应可能逐渐减弱。\n\n## 理解边界\n\n条件反应不一定是无条件反应的简单复制，刺激时序和预测信息都很重要。消退后的恢复也说明“暂不反应”不等于学习痕迹被抹掉。\n"}, {"id": "learning-habituation", "title": "习惯化", "english": "Habituation", "kind": "心理过程", "domain": "learning", "subdomain": "基本学习", "summary": "重复出现且未带来重要后果的刺激，可能逐渐引起较弱反应。习惯化帮助把有限注意转向新信息，是不必学习刺激之间关系的基本变化。", "aliases": ["Habituation"], "keywords": ["习惯化", "Habituation", "基本学习", "反应减弱", "重复", "适应", "熟悉", "麻木"], "questions": ["为什么反复遇到同样的刺激，反应会越来越弱？", "习惯化在什么条件下适用，有什么局限？"], "sources": [{"book": "general", "chapter": "第8章 · 学习的基本过程", "locator": "PDF 第 600–601 页", "pdfPages": [600, 601]}], "candidateRelated": [{"title": "经典条件作用", "reason": "重复刺激本身与学习刺激关系应区分"}, {"title": "暴露与消退学习", "reason": "重复接触可能参与反应减弱但过程有别"}], "sections": [{"heading": "核心解释", "text": "习惯化表现为反应随重复刺激减弱，例如对反复出现的声音不再明显惊跳。它与建立新刺激—反应关系的条件作用不同，也需要与感受器适应、肌肉疲劳等原因区分。教材从适应功能解释这种变化：持续忽略无后果的重复刺激，可以保留注意给新的事件。"}, {"heading": "一个例子", "text": "教材例子：常住者可能几乎不再注意附近反复响起的声音，初到的客人却觉得明显；刺激本身仍在，双方的经验和反应已经不同。"}, {"heading": "理解边界", "text": "并非所有反射都会习惯化，也不能把习惯化直接等同接受、赞同或规范改变。生理反应减弱与复杂态度变化之间需要额外证据。"}], "markdown": "---\nid: \"learning-habituation\"\ntitle: \"习惯化\"\nenglish: \"Habituation\"\nkind: \"心理过程\"\ndomain: \"learning\"\nsubdomain: \"基本学习\"\nsummary: \"重复出现且未带来重要后果的刺激，可能逐渐引起较弱反应。习惯化帮助把有限注意转向新信息，是不必学习刺激之间关系的基本变化。\"\naliases: [\"Habituation\"]\nkeywords: [\"习惯化\", \"Habituation\", \"基本学习\", \"反应减弱\", \"重复\", \"适应\", \"熟悉\", \"麻木\"]\nquestions: [\"为什么反复遇到同样的刺激，反应会越来越弱？\", \"习惯化在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"general\", \"chapter\": \"第8章 · 学习的基本过程\", \"locator\": \"PDF 第 600–601 页\", \"pdfPages\": [600, 601]}]\ncandidateRelated: [{\"title\": \"经典条件作用\", \"reason\": \"重复刺激本身与学习刺激关系应区分\"}, {\"title\": \"暴露与消退学习\", \"reason\": \"重复接触可能参与反应减弱但过程有别\"}]\n---\n\n## 核心解释\n\n习惯化表现为反应随重复刺激减弱，例如对反复出现的声音不再明显惊跳。它与建立新刺激—反应关系的条件作用不同，也需要与感受器适应、肌肉疲劳等原因区分。教材从适应功能解释这种变化：持续忽略无后果的重复刺激，可以保留注意给新的事件。\n\n## 一个例子\n\n教材例子：常住者可能几乎不再注意附近反复响起的声音，初到的客人却觉得明显；刺激本身仍在，双方的经验和反应已经不同。\n\n## 理解边界\n\n并非所有反射都会习惯化，也不能把习惯化直接等同接受、赞同或规范改变。生理反应减弱与复杂态度变化之间需要额外证据。\n"}, {"id": "learning-hebb-ltp", "title": "赫布学习与长时程增强", "english": "Hebbian learning and long-term potentiation", "kind": "理论", "domain": "learning", "subdomain": "学习的神经基础", "summary": "神经元活动之间的时间关系可能改变连接强度。赫布假设与长时程增强研究，为理解经验怎样留下持久的神经变化提供一种机制。", "aliases": ["Hebbian learning and long-term potentiation"], "keywords": ["赫布学习与长时程增强", "Hebbian learning and long-term potentiation", "学习的神经基础", "学习", "突触", "连接", "强化", "可塑性", "LTP"], "questions": ["赫布学习与长时程增强解释了什么心理现象？", "赫布学习与长时程增强在什么条件下适用，有什么局限？"], "sources": [{"book": "general", "chapter": "第4章 · 行为的神经控制", "locator": "PDF 第 347–348 页", "pdfPages": [347, 348]}], "candidateRelated": [{"title": "联结主义", "reason": "学习可体现为连接强度变化"}, {"title": "经典条件作用", "reason": "中性线索获得反应功能需要可塑性解释"}], "sections": [{"heading": "核心解释", "text": "赫布提出，若某个突触前细胞活动后，突触后细胞紧接着发放，两者的连接可能增强。长时程增强研究发现，特定刺激可使后续同样输入产生更强反应。这类可塑性现象支持用连接变化解释部分学习，同时需要进一步连接细胞变化与具体行为。"}, {"heading": "一个例子", "text": "理解用例：一条原本很弱的输入多次与强输入共同出现，逐渐变得足以推动下游细胞反应；此前中性的线索因此可能获得新的作用。"}, {"heading": "理解边界", "text": "长时程增强是重要研究机制，但不能当作全部学习的唯一形式。实验中人工刺激的结果，仍需与自然学习中的过程和时间尺度对应。"}], "markdown": "---\nid: \"learning-hebb-ltp\"\ntitle: \"赫布学习与长时程增强\"\nenglish: \"Hebbian learning and long-term potentiation\"\nkind: \"理论\"\ndomain: \"learning\"\nsubdomain: \"学习的神经基础\"\nsummary: \"神经元活动之间的时间关系可能改变连接强度。赫布假设与长时程增强研究，为理解经验怎样留下持久的神经变化提供一种机制。\"\naliases: [\"Hebbian learning and long-term potentiation\"]\nkeywords: [\"赫布学习与长时程增强\", \"Hebbian learning and long-term potentiation\", \"学习的神经基础\", \"学习\", \"突触\", \"连接\", \"强化\", \"可塑性\", \"LTP\"]\nquestions: [\"赫布学习与长时程增强解释了什么心理现象？\", \"赫布学习与长时程增强在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"general\", \"chapter\": \"第4章 · 行为的神经控制\", \"locator\": \"PDF 第 347–348 页\", \"pdfPages\": [347, 348]}]\ncandidateRelated: [{\"title\": \"联结主义\", \"reason\": \"学习可体现为连接强度变化\"}, {\"title\": \"经典条件作用\", \"reason\": \"中性线索获得反应功能需要可塑性解释\"}]\n---\n\n## 核心解释\n\n赫布提出，若某个突触前细胞活动后，突触后细胞紧接着发放，两者的连接可能增强。长时程增强研究发现，特定刺激可使后续同样输入产生更强反应。这类可塑性现象支持用连接变化解释部分学习，同时需要进一步连接细胞变化与具体行为。\n\n## 一个例子\n\n理解用例：一条原本很弱的输入多次与强输入共同出现，逐渐变得足以推动下游细胞反应；此前中性的线索因此可能获得新的作用。\n\n## 理解边界\n\n长时程增强是重要研究机制，但不能当作全部学习的唯一形式。实验中人工刺激的结果，仍需与自然学习中的过程和时间尺度对应。\n"}, {"id": "learning-levels-processing", "title": "加工水平理论", "english": "Levels of processing", "kind": "理论", "domain": "learning", "subdomain": "记忆与学习", "summary": "学习时如何处理材料，会影响以后能否记住它。关注意义、建立联系和形成独特表征，通常比仅处理外形或声音留下更可用的记忆。", "aliases": ["Levels of processing"], "keywords": ["加工水平理论", "Levels of processing", "记忆与学习", "理解", "记忆", "意义", "精细加工", "复习", "独特性"], "questions": ["怎样理解一个概念才能更容易记住？", "加工水平理论在什么条件下适用，有什么局限？"], "sources": [{"book": "cognitive", "chapter": "第6章 · 学习、记忆与遗忘", "locator": "PDF 第 325–325 页", "pdfPages": [325]}], "candidateRelated": [{"title": "提取练习效应", "reason": "学习结果还取决于是否练习提取"}, {"title": "图式", "reason": "已有知识可以支持精细加工"}], "sections": [{"heading": "核心解释", "text": "Craik与Lockhart将重点从记忆仓库转向编码活动。所谓较深加工主要涉及意义，精细加工则把材料与其他知识联结，独特性使材料更容易区分。理论解释了同样接触时间为何产生不同记忆效果，也提醒我们不能用“看过多少遍”代替学习质量。"}, {"heading": "一个例子", "text": "理解用例：学习一个新概念时，比较它与相近概念并自己举例，通常比只反复读名称更利于后来解释它；两种活动投入的加工不同。"}, {"heading": "理解边界", "text": "深度若只由记忆结果反推，会形成循环解释。编码活动是否有利还取决于后续提取任务，语义加工并非对所有测验都最优。"}], "markdown": "---\nid: \"learning-levels-processing\"\ntitle: \"加工水平理论\"\nenglish: \"Levels of processing\"\nkind: \"理论\"\ndomain: \"learning\"\nsubdomain: \"记忆与学习\"\nsummary: \"学习时如何处理材料，会影响以后能否记住它。关注意义、建立联系和形成独特表征，通常比仅处理外形或声音留下更可用的记忆。\"\naliases: [\"Levels of processing\"]\nkeywords: [\"加工水平理论\", \"Levels of processing\", \"记忆与学习\", \"理解\", \"记忆\", \"意义\", \"精细加工\", \"复习\", \"独特性\"]\nquestions: [\"怎样理解一个概念才能更容易记住？\", \"加工水平理论在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"cognitive\", \"chapter\": \"第6章 · 学习、记忆与遗忘\", \"locator\": \"PDF 第 325–325 页\", \"pdfPages\": [325]}]\ncandidateRelated: [{\"title\": \"提取练习效应\", \"reason\": \"学习结果还取决于是否练习提取\"}, {\"title\": \"图式\", \"reason\": \"已有知识可以支持精细加工\"}]\n---\n\n## 核心解释\n\nCraik与Lockhart将重点从记忆仓库转向编码活动。所谓较深加工主要涉及意义，精细加工则把材料与其他知识联结，独特性使材料更容易区分。理论解释了同样接触时间为何产生不同记忆效果，也提醒我们不能用“看过多少遍”代替学习质量。\n\n## 一个例子\n\n理解用例：学习一个新概念时，比较它与相近概念并自己举例，通常比只反复读名称更利于后来解释它；两种活动投入的加工不同。\n\n## 理解边界\n\n深度若只由记忆结果反推，会形成循环解释。编码活动是否有利还取决于后续提取任务，语义加工并非对所有测验都最优。\n"}, {"id": "learning-operant-conditioning", "title": "操作性条件作用", "english": "Operant conditioning", "kind": "心理过程", "domain": "learning", "subdomain": "基本学习", "summary": "行为后果会影响同一行为以后出现的概率。强化提高行为发生率，惩罚降低发生率；加入或移除刺激与提高或降低行为是两组不同区分。", "aliases": ["Operant conditioning"], "keywords": ["操作性条件作用", "Operant conditioning", "基本学习", "强化", "惩罚", "奖励", "习惯", "后果", "塑造"], "questions": ["为什么取消不舒服的声音也可能强化行为？", "操作性条件作用在什么条件下适用，有什么局限？"], "sources": [{"book": "general", "chapter": "第8章 · 学习的基本过程", "locator": "PDF 第 648–649 页", "pdfPages": [648, 649]}], "candidateRelated": [{"title": "奖励的想要、喜欢与强化", "reason": "愉悦体验与行为强化可区分"}, {"title": "经典条件作用", "reason": "两类学习在真实行为中可同时发生"}], "sections": [{"heading": "核心解释", "text": "操作性学习关注行动与结果的关系。正强化通过增加某种后果提高行为概率，负强化通过移除不适提高行为概率，两者都属于强化。行为还能通过逐步强化接近目标的反应形成，强化时程则影响行为频率及停止强化后的持续性。"}, {"heading": "一个例子", "text": "理解用例：按下按钮后刺耳声音停止，若以后更常按按钮，就是负强化；这里“负”表示移除刺激，并不表示惩罚，也不表示行为变少。"}, {"heading": "理解边界", "text": "强化物由实际行为变化界定，不只由实施者的善意决定。奖励的意义、原有兴趣和情境也会影响人类表现，不能假设奖励总有效。"}], "markdown": "---\nid: \"learning-operant-conditioning\"\ntitle: \"操作性条件作用\"\nenglish: \"Operant conditioning\"\nkind: \"心理过程\"\ndomain: \"learning\"\nsubdomain: \"基本学习\"\nsummary: \"行为后果会影响同一行为以后出现的概率。强化提高行为发生率，惩罚降低发生率；加入或移除刺激与提高或降低行为是两组不同区分。\"\naliases: [\"Operant conditioning\"]\nkeywords: [\"操作性条件作用\", \"Operant conditioning\", \"基本学习\", \"强化\", \"惩罚\", \"奖励\", \"习惯\", \"后果\", \"塑造\"]\nquestions: [\"为什么取消不舒服的声音也可能强化行为？\", \"操作性条件作用在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"general\", \"chapter\": \"第8章 · 学习的基本过程\", \"locator\": \"PDF 第 648–649 页\", \"pdfPages\": [648, 649]}]\ncandidateRelated: [{\"title\": \"奖励的想要、喜欢与强化\", \"reason\": \"愉悦体验与行为强化可区分\"}, {\"title\": \"经典条件作用\", \"reason\": \"两类学习在真实行为中可同时发生\"}]\n---\n\n## 核心解释\n\n操作性学习关注行动与结果的关系。正强化通过增加某种后果提高行为概率，负强化通过移除不适提高行为概率，两者都属于强化。行为还能通过逐步强化接近目标的反应形成，强化时程则影响行为频率及停止强化后的持续性。\n\n## 一个例子\n\n理解用例：按下按钮后刺耳声音停止，若以后更常按按钮，就是负强化；这里“负”表示移除刺激，并不表示惩罚，也不表示行为变少。\n\n## 理解边界\n\n强化物由实际行为变化界定，不只由实施者的善意决定。奖励的意义、原有兴趣和情境也会影响人类表现，不能假设奖励总有效。\n"}, {"id": "learning-testing-effect", "title": "提取练习效应", "english": "Testing effect / retrieval practice", "kind": "效应", "domain": "learning", "subdomain": "记忆与学习", "summary": "主动尝试回忆已经学过的内容，往往比等量重复阅读更有利于长期保持。测验不仅评估记忆，也会改变后续可提取的知识。", "aliases": ["Testing effect / retrieval practice"], "keywords": ["提取练习效应", "Testing effect / retrieval practice", "记忆与学习", "复习", "自测", "主动回忆", "背诵", "长期记忆", "学习效率"], "questions": ["复习时自测为什么可能比反复阅读更有用？", "提取练习效应在什么条件下适用，有什么局限？"], "sources": [{"book": "cognitive", "chapter": "第6章 · 学习、记忆与遗忘", "locator": "PDF 第 325–325 页", "pdfPages": [325]}], "candidateRelated": [{"title": "加工水平理论", "reason": "提取与编码共同影响学习"}, {"title": "前瞻记忆", "reason": "二者都涉及在需要时重新激活信息"}], "sections": [{"heading": "核心解释", "text": "提取练习要求学习者从记忆中重建答案，可能强化有效提取线索及知识之间的连接。教材总结，多数条件下将一部分复习时间用于回忆有利于长期记忆，适度困难的成功提取尤其有价值。效果也可能扩展到与练习内容有关但未直接测验的信息。"}, {"heading": "一个例子", "text": "理解用例：读完一张理论卡片后先收起页面，用自己的话说出核心解释，再打开核对遗漏；这比始终盯着文字产生熟悉感更能检验可提取性。"}, {"heading": "理解边界", "text": "困难不是越高越好。大量内容完全提取失败且缺少补充学习时，优势可能消失甚至反转；需要结合反馈、任务和保持间隔理解。"}], "markdown": "---\nid: \"learning-testing-effect\"\ntitle: \"提取练习效应\"\nenglish: \"Testing effect / retrieval practice\"\nkind: \"效应\"\ndomain: \"learning\"\nsubdomain: \"记忆与学习\"\nsummary: \"主动尝试回忆已经学过的内容，往往比等量重复阅读更有利于长期保持。测验不仅评估记忆，也会改变后续可提取的知识。\"\naliases: [\"Testing effect / retrieval practice\"]\nkeywords: [\"提取练习效应\", \"Testing effect / retrieval practice\", \"记忆与学习\", \"复习\", \"自测\", \"主动回忆\", \"背诵\", \"长期记忆\", \"学习效率\"]\nquestions: [\"复习时自测为什么可能比反复阅读更有用？\", \"提取练习效应在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"cognitive\", \"chapter\": \"第6章 · 学习、记忆与遗忘\", \"locator\": \"PDF 第 325–325 页\", \"pdfPages\": [325]}]\ncandidateRelated: [{\"title\": \"加工水平理论\", \"reason\": \"提取与编码共同影响学习\"}, {\"title\": \"前瞻记忆\", \"reason\": \"二者都涉及在需要时重新激活信息\"}]\n---\n\n## 核心解释\n\n提取练习要求学习者从记忆中重建答案，可能强化有效提取线索及知识之间的连接。教材总结，多数条件下将一部分复习时间用于回忆有利于长期记忆，适度困难的成功提取尤其有价值。效果也可能扩展到与练习内容有关但未直接测验的信息。\n\n## 一个例子\n\n理解用例：读完一张理论卡片后先收起页面，用自己的话说出核心解释，再打开核对遗漏；这比始终盯着文字产生熟悉感更能检验可提取性。\n\n## 理解边界\n\n困难不是越高越好。大量内容完全提取失败且缺少补充学习时，优势可能消失甚至反转；需要结合反馈、任务和保持间隔理解。\n"}, {"id": "learning-wanting-liking", "title": "奖励的想要、喜欢与强化", "english": "Wanting, liking and reinforcement", "kind": "概念", "domain": "learning", "subdomain": "奖励与动机", "summary": "追求奖励的动机、获得奖励时的愉悦，以及学习预测和取得奖励的强化过程可以区分；强烈想要某物，并不保证实际获得时同样快乐。", "aliases": ["Wanting, liking and reinforcement", "想要与喜欢的区分", "Wanting and Liking"], "keywords": ["奖励", "想要", "喜欢", "强化", "多巴胺", "阿片系统", "伏隔核", "接近动机", "愉悦", "Berridge", "Wanting and Liking"], "questions": ["为什么非常想得到某物，却未必很享受它？", "想要、喜欢和强化分别描述奖励的什么方面？"], "sources": [{"book": "general", "chapter": "第5章 · 动机与情绪的机制", "locator": "PDF 第 383–383 页", "pdfPages": [383]}, {"book": "emotions", "chapter": "第7章 脑机制与情 递质与体验的对应也是简化框架。不能把多巴胺等同快乐，或由一种物质直接诊断个人行为。\n"}, {"id": "personality-behavioral-activation", "title": "行为激活系统", "english": "Behavioral Activation System", "kind": "模型", "domain": "personality", "subdomain": "人格的生物基础", "summary": "行为激活系统用对奖励的敏感和趋近倾向理解个体差异。教材将其与多巴胺及外向性相关讨论，强调生物解释仍需联系更广的情境与行为过程。", "aliases": ["BAS"], "keywords": ["行为激活", "奖励", "趋近", "动机", "多巴胺", "外向性", "敏感性", "生物基础"], "questions": ["奖励敏感性怎样参与理解人格差异？", "为什么不能根据性格直接推断神经递质水平？"], "sources": [{"book": "personality", "chapter": "第8章 人格的解剖与生理", "locator": "PDF 第 644 页", "pdfPages": [644]}], "candidateRelated": [{"concept": "大五人格", "reason": "外向性是相关描述维度"}, {"concept": "人格的神经网络视角", "reason": "强调多个系统共同参与"}], "sections": [{"heading": "核心解释", "text": "行为激活系统是教材介绍的一种生物人格框架，强调奖励线索如何促使个体趋近机会并采取行动。教材把多巴胺在奖励反应中的作用与这一系统联系起来，也将其用于理解外向性的一部分基础。它不是单个行为的万能解释，而是组织奖励敏感、动机与人格差异的一种模型。"}, {"heading": "一个例子", "text": "理解用例：面对一项可能带来新体验的活动，有人很快被潜在乐趣吸引并主动报名。用例用于理解奖励线索与趋近行为的联系，不用于推断其脑内化学水平。"}, {"heading": "理解边界", "text": "不能凭外向表现推断多巴胺多少，也不能把复杂人格归于一种物质。教材提醒生物关联仍具暂定性和双向作用。"}], "markdown": "---\nid: \"personality-behavioral-activation\"\ntitle: \"行为激活系统\"\nenglish: \"Behavioral Activation System\"\nkind: \"模型\"\ndomain: \"personality\"\nsubdomain: \"人格的生物基础\"\nsummary: \"行为激活系统用对奖励的敏感和趋近倾向理解个体差异。教材将其与多巴胺及外向性相关讨论，强调生物解释仍需联系更广的情境与行为过程。\"\naliases: [\"BAS\"]\nkeywords: [\"行为激活\", \"奖励\", \"趋近\", \"动机\", \"多巴胺\", \"外向性\", \"敏感性\", \"生物基础\"]\nquestions: [\"奖励敏感性怎样参与理解人格差异？\", \"为什么不能根据性格直接推断神经递质水平？\"]\nsources: [{\"book\": \"personality\", \"chapter\": \"第8章 人格的解剖与生理\", \"locator\": \"PDF 第 644 页\", \"pdfPages\": [644]}]\ncandidateRelated: [{\"concept\": \"大五人格\", \"reason\": \"外向性是相关描述维度\"}, {\"concept\": \"人格的神经网络视角\", \"reason\": \"强调多个系统共同参与\"}]\n---\n\n## 核心解释\n\n行为激活系统是教材介绍的一种生物人格框架，强调奖励线索如何促使个体趋近机会并采取行动。教材把多巴胺在奖励反应中的作用与这一系统联系起来，也将其用于理解外向性的一部分基础。它不是单个行为的万能解释，而是组织奖励敏感、动机与人格差异的一种模型。\n\n## 一个例子\n\n理解用例：面对一项可能带来新体验的活动，有人很快被潜在乐趣吸引并主动报名。用例用于理解奖励线索与趋近行为的联系，不用于推断其脑内化学水平。\n\n## 理解边界\n\n不能凭外向表现推断多巴胺多少，也不能把复杂人格归于一种物质。教材提醒生物关联仍具暂定性和双向作用。\n"}, {"id": 评与直接观察为什么可能得到不同结果？\", \"直接观察到的行为就不需要解释了吗？\"]\nsources: [{\"book\": \"personality\", \"chapter\": \"第2章 人格研究方法\", \"locator\": \"PDF 第 177–178 页\", \"pdfPages\": [177, 178]}]\ncandidateRelated: [{\"concept\": \"人格判断的汇聚验证\", \"reason\": \"结合不同信息评估结论\"}, {\"concept\": \"构念效度\", \"reason\": \"检查资料到底反映何种属性\"}]\n---\n\n## 核心解释\n\n教材区分自我判断资料、知情者判断资料、生活结果资料与行为观察资料。自评接近个人的想法和感受，他评反映熟悉者的观察，生活结果记录可核查经历，行为资料直接记录行动。直接与客观不等于心理意义自动明确；结合多类资料能帮助检查偏差，也能显示不同情境中的表现。\n\n## 一个例子\n\n理解用例：了解一个人是否有条理，可以问本人、询问合作者、检查长期完成任务的记录，再观察一次实际安排。几类资料提供的侧面不同，可能彼此补充。\n\n## 理解边界\n\n生活结果受许多因素影响，行为也需要解释。多来源一致能增强判断依据，但不能机械投票，也不能忽略来源之间共享的偏差。\n"}, {"id": "personality-cognitive-affective-system", "title": "认知情感人格系统", "english": "Cognitive-Affective Personality System", "kind": "模型", "domain": "personality", "subdomain": "学习与认知", "summary": "人格可以表现为稳定的情境反应模式，而不只是每次都出现同一种行为。认知情感人格系统用如果遇到某类条件、那么如何反应的方式理解个体差异。", "aliases": ["CAPS"], "keywords": ["认知情感", "人格系统", "如果那么", "情境", "反应模式", "稳定", "米歇尔", "行为"], "questions": ["不同场合行为不一样还能体现稳定人格吗？", "怎样用如果那么描述一个人的反应模式？"], "sources": [{"book": "personality", "chapter": "第14章 人格过程", "locator": "PDF 第 1144 页", "pdfPages": [1144]}], "candidateRelated": [{"concept": "人与情境交互作用", "reason": "提供更一般的关系框架"}, {"concept": "相对一致性", "reason": "另一种理解稳定的方法"}], "sections": [{"heading": "核心解释", "text": "认知情感人格系统把人格描述为对不同情境形成有规律反应的系统。一个人可能在被支持时主动，在感到被评价时退缩，这种条件性模式本身可以具有稳定性。教材将其概括为如果那么模型，用以连接情境的心理意义、认知情感过程与行为，而不是要求行为在所有场合一致。"}, {"heading": "一个例子", "text": "理解用例：同一位同学在熟悉伙伴面前很健谈，在感到被严格评判时却沉默。若这一组合反复出现，就可尝试记录其条件性模式，而非只选择一个性格标签。"}, {"heading": "理解边界", "text": "列出情境差异还不等于解释了系统机制。必须说明哪些条件对当事人有意义，并检验模式是否稳定而非事后拼接。"}], "markdown": "---\nid: \"personality-cognitive-affective-system\"\ntitle: \"认知情感人格系统\"\nenglish: \"Cognitive-Affective Personality System\"\nkind: \"模型\"\ndomain: \"personality\"\nsubdomain: \"学习与认知\"\nsummary: \"人格可以表现为稳定的情境反应模式，而不只是每次都出现同一种行为。认知情感人格系统用如果遇到某类条件、那么如何反应的方式理解个体差异。\"\naliases: [\"CAPS\"]\nkeywords: [\"认知情感\", \"人格系统\", \"如果那么\", \"情境\", \"反应模式\", \"稳定\", \"米歇尔\", \"行为\"]\nquestions: [\"不同场合行为不一样还能体现稳定人格吗？\", \"怎样用如果那么描述一个人的反应模式？\"]\nsources: [{\"book\": \"personality\", \"chapter\": \"第14章 人格过程\", \"locator\": \"PDF 第 1144 页\", \"pdfPages\": [1144]}]\ncandidateRelated: [{\"concept\": \"人与情境交互作用\", \"reason\": \"提供更一般的关系框架\"}, {\"concept\": \"相对一致性\", \"reason\": \"另一种理解稳定的方法\"}]\n---\n\n## 核心解释\n\n认知情感人格系统把人格描述为对不同情境形成有规律反应的系统。一个人可能在被支持时主动，在感到被评价时退缩，这种条件性模式本身可以具有稳定性。教材将其概括为如果那么模型，用以连接情境的心理意义、认知情感过程与行为，而不是要求行为在所有场合一致。\n\n## 一个例子\n\n理解用例：同一位同学在熟悉伙伴面前很健谈，在感到被严格评判时却沉默。若这一组合反复出现，就可尝试记录其条件性模式，而非只选择一个性格标签。\n\n## 理解边界\n\n列出情境差异还不等于解释了系统机制。必须说明哪些条件对当事人有意义，并检验模式是否稳定而非事后拼接。\n"}, {"id": "personality-complementary-approaches", "title": "人格研究取向的互补性", "english": "Complementary Approaches to Personality", "kind": "概念", "domain": "personality", "subdomain": "人格研究导论", "summary": "特质、生物、精神分析、现象学及学习认知取向回答不同的问题。选择解释框架时，应先明确想了解什么，而不是预设一种取向能够包办所有人格现象。", "aliases": [], "keywords": ["研究取向", "特质", "生物", "精神分析", "人本", "认知", "互补", "人格"], "questions": ["为什么人格研究会保留多种不同取向？", "怎样根据问题选择合适的解释框架？"], "sources": [{"book": "personality", "chapter": "第1章 对人的研究", "locator": "PDF 第 94 页", "pdfPages": [94]}, {"book": "personality", "chapter": "第18章 我们学到了什么", "locator": "PDF 第 1393 页", "pdfPages": [1393]}], "candidateRelated": [{"concept": "心理三要素", "reason": "构成人格研究的共同对象"}, {"concept": "人与情境交互作用", "reason": "示范把多个解释因素结合"}], "sections": [{"heading": "核心解释", "text": "教材将人格研究组织为多个基本取向，每个取向都通过突出一部分问题而获得解释力，也因此留下盲点。特质研究描述差异，生物取向考察身体基础，其他取向关注无意识、主观体验或学习过程。它们的价值需要联系所提问题判断，综合理解则要求说明各自解释到了什么。"}, {"heading": "一个例子", "text": "理解用例：想知道谁更常主动交谈，可以比较特质；想知道同一个人为什么在某种场合沉默，则还要检查情境及其解释。不同问题可能需要不同入口。"}, {"heading": "理解边界", "text": "互补不等于所有主张都同样可靠，也不意味着互相矛盾的解释可以不加检验地并列。仍需查看概念、证据和适用范围。"}], "markdown": "---\nid: \"personality-complementary-approaches\"\ntitle: \"人格研究取向的互补性\"\nenglish: \"Complementary Approaches to Personality\"\nkind: \"概念\"\ndomain: \"personality\"\nsubdomain: \"人格研究导论\"\nsummary: \"特质、生物、精神分析、现象学及学习认知取向回答不同的问题。选择解释框架时，应先明确想了解什么，而不是预设一种取向能够包办所有人格现象。\"\naliases: []\nkeywords: [\"研究取向\", \"特质\", \"生物\", \"精神分析\", \"人本\", \"认知\", \"互补\", \"人格\"]\nquestions: [\"为什么人格研究会保留多种不同取向？\", \"怎样根据问题选择合适的解释框架？\"]\nsources: [{\"book\": \"personality\", \"chapter\": \"第1章 对人的研究\", \"locator\": \"PDF 第 94 页\", \"pdfPages\": [94]}, {\"book\": \"personality\", \"chapter\": \"第18章 我们学到了什么\", \"locator\": \"PDF 第 1393 页\", \"pdfPages\": [1393]}]\ncandidateRelated: [{\"concept\": \"心理三要素\", \"reason\": \"构成人格研究的共同对象\"}, {\"concept\": \"人与情境交互作用\", \"reason\": \"示范把多个解释因素结合\"}]\n---\n\n## 核心解释\n\n教材将人格研究组织为多个基本取向，每个取向都通过突出一部分问题而获得解释力，也因此留下盲点。特质研究描述差异，生物取向考察身体基础，其他取向关注无意识、主观体验或学习过程。它们的价值需要联系所提问题判断，综合理解则要求说明各自解释到了什么。\n\n## 一个例子\n\n理解用例：想知道谁更常主动交谈，可以比较特质；想知道同一个人为什么在某种场合沉默，则还要检查情境及其解释。不同问题可能需要不同入口。\n\n## 理解边界\n\n互补不等于所有主张都同样可靠，也不意味着互相矛盾的解释可以不加检验地并列。仍需查看概念、证据和适用范围。\n"}, {"id": "personality-construct-validity", "title": "构念效度", "english": "Construct Validity", "kind": "方法", "domain": "foundations", "subdomain": "心理测量", "summary": "构念效度关注某项测量是否真正对应想研究的心理属性。给指标贴上“坚持”或“友善”的名字并不够，还需要检验它与其他证据的关系。", "aliases": [], "keywords": ["构念", "效度", "测量", "指标", "解释", "信度", "证据", "人格"], "questions": ["为什么给行为指标命名不等于完成了测量验证？", "同一指标在不同任务中能否代表相同属性？"], "sources": [{"book": "personality", "chapter": "第2章 人格研究方法", "locator": "PDF 第 153 页", "pdfPages": [153]}, {"book": "personality", "chapter": "第2章 人格研究方法", "locator": "PDF 第 159 页", "pdfPages": [159]}, {"book": "personality", "chapter": "第2章 人格研究方法", "locator": "PDF 第 178 页", "pdfPages": [178]}], "candidateRelated": [{"concept": "信度、效度与操作化", "reason": "区分测量评价的多个层面"}, {"concept": "人格四类资料", "reason": "不同资料需要不同解释"}], "sections": [{"heading": "核心解释", "text": "心理构念是试图理解的属性，测量则是用来观察该属性的具体办法。构念效度要求检查二者之间是否建立了可信联系，而不只看指标是否方便记录或多次得分一致。教材将效度与信度及概括性共同讨论，提醒读者：数据可以非常精确，但其心理含义仍然需要论证。"}, {"heading": "一个例子", "text": "理解用例：让一个人持续解难题并计时，能直接得到坚持多久的记录；但时间长也可能来自误解任务。把它称为坚持性测量之前，还需要排查其他解释。"}, {"heading": "理解边界", "text": "某项测量有效是有条件的判断，不是永远适用的标签。测量稳定与目标属性的解释正确，也必须分别检验。"}], "markdown": "---\nid: \"personality-construct-validity\"\ntitle: \"构念效度\"\nenglish: \"Construct Validity\"\nkind: \"方法\"\ndomain: \"foundations\"\nsubdomain: \"心理测量\"\nsummary: \"构念效度关注某项测量是否真正对应想研究的心理属性。给指标贴上“坚持”或“友善”的名字并不够，还需要检验它与其他证据的关系。\"\naliases: []\nkeywords: [\"构念\", \"效度\", \"测量\", \"指标\", \"解释\", \"信度\", \"证据\", \"人格\"]\nquestions: [\"为什么给行为指标命名不等于完成了测量验证？\", \"同一指标在不同任务中能否代表相同属性？\"]\nsources: [{\"book\": \"personality\", \"chapter\": \"第2章 人格研究方法\", \"locator\": \"PDF 第 153 页\", \"pdfPages\": [153]}, {\"book\": \"personality\", \"chapter\": \"第2章 人格研究方法\", \"locator\": \"PDF 第 159 页\", \"pdfPages\": [159]}, {\"book\": \"personality\", \"chapter\": \"第2章 人格研究方法\", \"locator\": \"PDF 第 178 页\", \"pdfPages\": [178]}]\ncandidateRelated: [{\"concept\": \"信度、效度与操作化\", \"reason\": \"区分测量评价的多个层面\"}, {\"concept\": \"人格四类资料\", \"reason\": \"不同资料需要不同解释\"}]\n---\n\n## 核心解释\n\n心理构念是试图理解的属性，测量则是用来观察该属性的具体办法。构念效度要求检查二者之间是否建立了可信联系，而不只看指标是否方便记录或多次得分一致。教材将效度与信度及概括性共同讨论，提醒读者：数据可以非常精确，但其心理含义仍然需要论证。\n\n## 一个例子\n\n理解用例：让一个人持续解难题并计时，能直接得到坚持多久的记录；但时间长也可能来自误解任务。把它称为坚持性测量之前，还需要排查其他解释。\n\n## 理解边界\n\n某项测量有效是有条件的判断，不是永远适用的标签。测量稳定与目标属性的解释正确，也必须分别检验。\n"}, {"id": "personality-convergent-validation", "title": "人格判断的汇聚验证", "english": "Convergent Validation", "kind": "方法", "domain": "foundations", "subdomain": "心理测量", "summary": "人格判断的准确性需要不同证据共同支持。汇聚验证关注多位判断者、行为预测与其他资料是否趋向同一解释，同时保留对共同偏差的检查。", "aliases": [], "keywords": ["汇聚验证", "一致", "判断", "预测", "准确性", "来源", "证据", "共识"], "questions": ["很多人形成相同印象是否就代表印象准确？", "如何用不同来源检查一个人格判断？"], "sources": [{"book": "personality", "chapter": "第5章 人格判断", "locator": "PDF 第 397–398 页", "pdfPages": [397, 398]}, {"book": "personality", "chapter": "第5章 人格判断", "locator": "PDF 第 402 页", "pdfPages": [402]}], "candidateRelated": [{"concept": "现实准确性模型", "reason": "解释线索转化为判断的过程"}, {"concept": "确认偏差", "reason": "提醒检验是否只收集同向材料"}], "sections": [{"heading": "核心解释", "text": "教材以判断者之间的一致及预测行为的能力来评估人格判断。来自不同来源的信息若趋向相同结论，便比孤立印象更有依据；但共识并不是绝对真相。汇聚验证因此是一种积累并比较证据的过程，需要问这些资料是否相对独立、是否真的与所判断的特质有关。"}, {"heading": "一个例子", "text": "理解用例：你觉得一位合作者可靠，其他长期伙伴也有类似评价，任务记录又显示其多次守约。这些线索比只依据第一印象提供了更广的判断基础。"}, {"heading": "理解边界", "text": "许多人同意可能来自同一传闻或刻板印象。汇聚验证必须考察来源和预测力，不能简单把重复评价当作独立支持。"}], "markdown": "---\nid: \"personality-convergent-validation\"\ntitle: \"人格判断的汇聚验证\"\nenglish: \"Convergent Validation\"\nkind: \"方法\"\ndomain: \"foundations\"\nsubdomain: \"心理测量\"\nsummary: \"人格判断的准确性需要不同证据共同支持。汇聚验证关注多位判断者、行为预测与其他资料是否趋向同一解释，同时保留对共同偏差的检查。\"\naliases: []\nkeywords: [\"汇聚验证\", \"一致\", \"判断\", \"预测\", \"准确性\", \"来源\", \"证据\", \"共识\"]\nquestions: [\"很多人形成相同印象是否就代表印象准确？\", \"如何用不同来源检查一个人格判断？\"]\nsources: [{\"book\": \"personality\", \"chapter\": \"第5章 人格判断\", \"locator\": \"PDF 第 397–398 页\", \"pdfPages\": [397, 398]}, {\"book\": \"personality\", \"chapter\": \"第5章 人格判断\", \"locator\": \"PDF 第 402 页\", \"pdfPages\": [402]}]\ncandidateRelated: [{\"concept\": \"现实准确性模型\", \"reason\": \"解释线索转化为判断的过程\"}, {\"concept\": \"确认偏差\", \"reason\": \"提醒检验是否只收集同向材料\"}]\n---\n\n## 核心解释\n\n教材以判断者之间的一致及预测行为的能力来评估人格判断。来自不同来源的信息若趋向相同结论，便比孤立印象更有依据；但共识并不是绝对真相。汇聚验证因此是一种积累并比较证据的过程，需要问这些资料是否相对独立、是否真的与所判断的特质有关。\n\n## 一个例子\n\n理解用例：你觉得一位合作者可靠，其他长期伙伴也有类似评价，任务记录又显示其多次守约。这些线索比只依据第一印象提供了更广的判断基础。\n\n## 理解边界\n\n许多人同意可能来自同一传闻或刻板印象。汇聚验证必须考察来源和预测力，不能简单把重复评价当作独立支持。\n"}, {"id": "personality-cumulative-continuity", "title": "累积连续性原则", "english": "Cumulative Continuity Principle", "kind": "理论", "domain": "personality", "subdomain": "人格发展", "summary": "人格的相对稳定程度可能随年龄增加而提高。累积连续性原则把这种变化与持续环境、早期经验以及人对适合自身环境的选择联系起来。", "aliases": [], "keywords": ["连续性", "年龄", "稳定", "发展", "环境选择", "经验", "人格", "时间"], "questions": ["人格为什么可能随着年龄增长而更稳定？", "环境稳定与人格稳定怎样互相联系？"], "sources": [{"book": "personality", "chapter": "第7章 人格稳定发展与变化", "locator": "PDF 第 556–557 页", "pdfPages": [556, 557]}], "candidateRelated": [{"concept": "相对一致性", "reason": "明确稳定所指的比较"}, {"concept": "人与情境交互作用", "reason": "解释持续模式的形成"}], "sections": [{"heading": "核心解释", "text": "累积连续性原则概括人格随时间推移越来越稳定的倾向。教材说明，环境本身的持续性、早期经验的影响，以及人选择并改造适合自身的处境，都可能使已有模式获得延续。稳定由长期过程形成，因此理解人格不能只在一次测量中寻找固定本质，还要考察生活轨迹。"}, {"heading": "一个例子", "text": "理解用例：一个喜欢有序安排的人逐渐选择流程明确的活动，又把自己的日常组织得更规律。长期下来，个人倾向与所处环境可能互相强化。"}, {"heading": "理解边界", "text": "稳定程度提高不表示成年人完全不会改变。教材同时讨论可塑性与干预、生活经历，需区分平均趋势和个体变化。"}], "markdown": "---\nid: \"personality-cumulative-continuity\"\ntitle: \"累积连续性原则\"\nenglish: \"Cumulative Continuity Principle\"\nkind: \"理论\"\ndomain: \"personality\"\nsubdomain: \"人格发展\"\nsummary: \"人格的相对稳定程度可能随年龄增加而提高。累积连续性原则把这种变化与持续环境、早期经验以及人对适合自身环境的选择联系起来。\"\naliases: []\nkeywords: [\"连续性\", \"年龄\", \"稳定\", \"发展\", \"环境选择\", \"经验\", \"人格\", \"时间\"]\nquestions: [\"人格为什么可能随着年龄增长而更稳定？\", \"环境稳定与人格稳定怎样互相联系？\"]\nsources: [{\"book\": \"personality\", \"chapter\": \"第7章 人格稳定发展与变化\", \"locator\": \"PDF 第 556–557 页\", \"pdfPages\": [556, 557]}]\ncandidateRelated: [{\"concept\": \"相对一致性\", \"reason\": \"明确稳定所指的比较\"}, {\"concept\": \"人与情境交互作用\", \"reason\": \"解释持续模式的形成\"}]\n---\n\n## 核心解释\n\n累积连续性原则概括人格随时间推移越来越稳定的倾向。教材说明，环境本身的持续性、早期经验的影响，以及人选择并改造适合自身的处境，都可能使已有模式获得延续。稳定由长期过程形成，因此理解人格不能只在一次测量中寻找固定本质，还要考察生活轨迹。\n\n## 一个例子\n\n理解用例：一个喜欢有序安排的人逐渐选择流程明确的活动，又把自己的日常组织得更规律。长期下来，个人倾向与所处环境可能互相强化。\n\n## 理解边界\n\n稳定程度提高不表示成年人完全不会改变。教材同时讨论可塑性与干预、生活经历，需区分平均趋势和个体变化。\n"}, {"id": "personality-declarative-self", "title": "陈述性自我", "english": "Declarative Self", "kind": "概念", "domain": "personality", "subdomain": "自我知识", "summary": "陈述性自我是能够表达为我是什么样的人的自我知识，涉及价值、特征和能力认识。它帮助组织信息与行动，但不必与实际行为或他人判断完全一致。", "aliases": [], "keywords": ["陈述性自我", "自我知识", "自尊", "自我图式", "能力", "自我效能", "记忆", "描述"], "questions": ["我们能说出来的自我认识包含哪些内容？", "自我描述为什么未必完全对应实际行动？"], "sources": [{"book": "personality", "chapter": "第15章 自我", "locator": "PDF 第 1198–1199 页", "pdfPages": [1198, 1199]}], "candidateRelated": [{"concept": "程序性自我", "reason": "关注习惯化的自我方式"}, {"concept": "自我知觉理论", "reason": "解释某些自我认识的形成"}], "sections": [{"heading": "核心解释", "text": "教材把能够报告的自我认识归入陈述性自我，包括自尊、自我图式及对能力的理解。自我图式组织与自己有关的信息，考虑信息与自身的联系也可影响记忆。这样的知识不只是对过去的总结，还会参与选择与调节；不过，自我描述仍可能遗漏习惯或受到评价动机影响。"}, {"heading": "一个例子", "text": "理解用例：你描述自己为认真、喜欢探索，也相信自己能完成某类任务。这些可以用语言报告的内容属于自我知识，却还需要与实际经历相互对照。"}, {"heading": "理解边界", "text": "能够清楚描述自己不代表所有描述准确。陈述性自我也不同于自动运作的习惯，二者可能一致，也可能存在差距。"}], "markdown": "---\nid: \"personality-declarative-self\"\ntitle: \"陈述性自我\"\nenglish: \"Declarative Self\"\nkind: \"概念\"\ndomain: \"personality\"\nsubdomain: \"自我知识\"\nsummary: \"陈述性自我是能够表达为我是什么样的人的自我知识，涉及价值、特征和能力认识。它帮助组织信息与行动，但不必与实际行为或他人判断完全一致。\"\naliases: []\nkeywords: [\"陈述性自我\", \"自我知识\", \"自尊\", \"自我图式\", \"能力\", \"自我效能\", \"记忆\", \"描述\"]\nquestions: [\"我们能说出来的自我认识包含哪些内容？\", \"自我描述为什么未必完全对应实际行动？\"]\nsources: [{\"book\": \"personality\", \"chapter\": \"第15章 自我\", \"locator\": \"PDF 第 1198–1199 页\", \"pdfPages\": [1198, 1199]}]\ncandidateRelated: [{\"concept\": \"程序性自我\", \"reason\": \"关注习惯化的自我方式\"}, {\"concept\": \"自我知觉理论\", \"reason\": \"解释某些自我认识的形成\"}]\n---\n\n## 核心解释\n\n教材把能够报告的自我认识归入陈述性自我，包括自尊、自我图式及对能力的理解。自我图式组织与自己有关的信息，考虑信息与自身的联系也可影响记忆。这样的知识不只是对过去的总结，还会参与选择与调节；不过，自我描述仍可能遗漏习惯或受到评价动机影响。\n\n## 一个例子\n\n理解用例：你描述自己为认真、喜欢探索，也相信自己能完成某类任务。这些可以用语言报告的内容属于自我知识，却还需要与实际经历相互对照。\n\n## 理解边界\n\n能够清楚描述自己不代表所有描述准确。陈述性自我也不同于自动运作的习惯，二者可能一致，也可能存在差距。\n"}, {"id": "personality-defense-mechanisms", "title": "防御机制", "english": "Defense Mechanisms", "kind": "心理过程", "domain": "personality", "subdomain": "精神分析", "summary": "经典精神分析认为，人可能通过改变对经历的处理来缓解焦虑、羞耻或内在冲突。防御机制关注这种保护作用，也提醒短期缓解可能伴随理解现实的代价。", "aliases": [], "keywords": ["防御", "焦虑", "合理化", "否认", "投射", "压抑", "转移", "升华"], "questions": ["短期减轻焦虑的做法为什么可能带来长期代价？", "为什么不能随意用防御机制解释别人的行为？"], "sources": [{"book": "personality", "chapter": "第10章 精神分析基础", "locator": "PDF 第 792 页", "pdfPages": [792]}, {"book": "personality", "chapter": "第10章 精神分析基础", "locator": "PDF 第 814 页", "pdfPages": [814]}], "candidateRelated": [{"concept": "本我自我与超我", "reason": "提供经典冲突框架"}, {"concept": "认知失调理论", "reason": "同样讨论缓解不一致的过程"}], "sections": [{"heading": "核心解释", "text": "教材把防御机制放在自我应对过强焦虑的框架中，介绍否认、压抑、投射、合理化、转移与升华等形式。多数形式虽可暂时降低不适，却可能妨碍准确理解现实；升华则被单独视为较建设性的出口。关键在于如何处理难以接受的经验，而不只是行为表面积极或消极。"}, {"heading": "一个例子", "text": "理解用例：一次重要任务失败后，有人立即说任务根本不值得做，以避免面对失落。这个用例说明合理化的可能解释，但并不据此断定他的真实动机。"}, {"heading": "理解边界", "text": "除升华等较建设性形式外，教材提示长期使用防御可能使人疏离现实。仍不能凭一个故事确认无意识机制，还需保留对理论检验方式的争议。"}], "markdown": "---\nid: \"personality-defense-mechanisms\"\ntitle: \"防御机制\"\nenglish: \"Defense Mechanisms\"\nkind: \"心理过程\"\ndomain: \"personality\"\nsubdomain: \"精神分析\"\nsummary: \"经典精神分析认为，人可能通过改变对经历的处理来缓解焦虑、羞耻或内在冲突。防御机制关注这种保护作用，也提醒短期缓解可能伴随理解现实的代价。\"\naliases: []\nkeywords: [\"防御\", \"焦虑\", \"合理化\", \"否认\", \"投射\", \"压抑\", \"转移\", \"升华\"]\nquestions: [\"短期减轻焦虑的做法为什么可能带来长期代价？\", \"为什么不能随意用防御机制解释别人的行为？\"]\nsources: [{\"book\": \"personality\", \"chapter\": \"第10章 精神分析基础\", \"locator\": \"PDF 第 792 页\", \"pdfPages\": [792]}, {\"book\": \"personality\", \"chapter\": \"第10章 精神分析基础\", \"locator\": \"PDF 第 814 页\", \"pdfPages\": [814]}]\ncandidateRelated: [{\"concept\": \"本我自我与超我\", \"reason\": \"提供经典冲突框架\"}, {\"concept\": \"认知失调理论\", \"reason\": \"同样讨论缓解不一致的过程\"}]\n---\n\n## 核心解释\n\n教材把防御机制放在自我应对过强焦虑的框架中，介绍否认、压抑、投射、合理化、转移与升华等形式。多数形式虽可暂时降低不适，却可能妨碍准确理解现实；升华则被单独视为较建设性的出口。关键在于如何处理难以接受的经验，而不只是行为表面积极或消极。\n\n## 一个例子\n\n理解用例：一次重要任务失败后，有人立即说任务根本不值得做，以避免面对失落。这个用例说明合理化的可能解释，但并不据此断定他的真实动机。\n\n## 理解边界\n\n除升华等较建设性形式外，教材提示长期使用防御可能使人疏离现实。仍不能凭一个故事确认无意识机制，还需保留对理论检验方式的争议。\n"}, {"id": "personality-dimensional-personality-pathology", "title": "人格的维度化理解", "english": "Dimensional View of Personality Pathology", "kind": "模型", "domain": "clinical", "subdomain": "人格与心理困扰", "summary": "教材把部分人格问题放在连续特质的极端与功能受损中理解，而不仅是有或没有的类别。维度化视角让正常差异和严重困难之间的联系成为可讨论的问题。", "aliases": [], "keywords": ["人格", "维度", "类别", "极端", "功能", "适应", "连续", "诊断概念"], "questions": ["连续特质与诊断类别怎样提供不同信息？", "为什么判断人格问题还要看生活功能？"], "sources": [{"book": "personality", "chapter": "第17章 心理与身体健康", "locator": "PDF 第 1349–1351 页", "pdfPages": [1349, 1350, 1351]}], "candidateRelated": [{"concept": "特质与类型的区别", "reason": "共享连续与类别之分"}, {"concept": "大五人格", "reason": "正常人格维度的组织方式"}], "sections": [{"heading": "核心解释", "text": "教材对比离散诊断类别与连续特质维度，强调极端程度、生活功能及对自己或他人的问题需要一起考察。某些通常有益的倾向在过强或僵化时也可能造成困难。这里的核心是描述方式的差别：维度记录程度，类别提供分组；它们的用途与局限都需要具体评估。"}, {"heading": "一个例子", "text": "理解用例：认真整理资料通常有帮助，但若任何细节都无法放手而严重妨碍日常活动，就需要考虑程度与功能。用例说明连续变化，不据此判断任何疾病。"}, {"heading": "理解边界", "text": "这张卡概括本版教材的理论讨论，不是现行诊断指南。极端特质或一次困难都不足以作诊断，不能用来给熟人贴标签。"}], "markdown": "---\nid: \"personality-dimensional-personality-pathology\"\ntitle: \"人格的维度化理解\"\nenglish: \"Dimensional View of Personality Pathology\"\nkind: \"模型\"\ndomain: \"clinical\"\nsubdomain: \"人格与心理困扰\"\nsummary: \"教材把部分人格问题放在连续特质的极端与功能受损中理解，而不仅是有或没有的类别。维度化视角让正常差异和严重困难之间的联系成为可讨论的问题。\"\naliases: []\nkeywords: [\"人格\", \"维度\", \"类别\", \"极端\", \"功能\", \"适应\", \"连续\", \"诊断概念\"]\nquestions: [\"连续特质与诊断类别怎样提供不同信息？\", \"为什么判断人格问题还要看生活功能？\"]\nsources: [{\"book\": \"personality\", \"chapter\": \"第17章 心理与身体健康\", \"locator\": \"PDF 第 1349–1351 页\", \"pdfPages\": [1349, 1350, 1351]}]\ncandidateRelated: [{\"concept\": \"特质与类型的区别\", \"reason\": \"共享连续与类别之分\"}, {\"concept\": \"大五人格\", \"reason\": \"正常人格维度的组织方式\"}]\n---\n\n## 核心解释\n\n教材对比离散诊断类别与连续特质维度，强调极端程度、生活功能及对自己或他人的问题需要一起考察。某些通常有益的倾向在过强或僵化时也可能造成困难。这里的核心是描述方式的差别：维度记录程度，类别提供分组；它们的用途与局限都需要具体评估。\n\n## 一个例子\n\n理解用例：认真整理资料通常有帮助，但若任何细节都无法放手而严重妨碍日常活动，就需要考虑程度与功能。用例说明连续变化，不据此判断任何疾病。\n\n## 理解边界\n\n这张卡概括本版教材的理论讨论，不是现行诊断指南。极端特质或一次困难都不足以作诊断，不能用来给熟人贴标签。\n"}, {"id": "personality-effect-size", "title": "效应量", "english": "Effect Size", "kind": "方法", "domain": "foundations", "subdomain": "理解研究结果", "summary": "效应量描述变量之间的关联或条件差异有多大。它帮助把统计显著与实际强度分开，使读者不只问有没有关系，还能进一步比较关系的幅度。", "aliases": [], "keywords": ["效应量", "显著性", "相关", "幅度", "强度", "差异", "统计", "证据"], "questions": ["统计显著是否意味着效果很大？", "比较两项研究时为什么要看效应量？"], "sources": [{"book": "personality", "chapter": "第3章 人格评估与开放科学", "locator": "PDF 第 255 页", "pdfPages": [255]}], "candidateRelated": [{"concept": "复制与开放科学", "reason": "评估结果能否重复"}, {"concept": "随机分配与实验", "reason": "区分关联强度与因果解释"}], "sections": [{"heading": "核心解释", "text": "教材强调，统计显著性不等于结果重要，也不直接反映变量联系的强弱。效应量则用数值描述关联或差异的程度，例如相关系数可表达线性关系的方向和幅度。解释效应量还需要联系研究对象、测量方式与实际结果，从而避免把一个显著标记当成对理论意义的完整评价。"}, {"heading": "一个例子", "text": "理解用例：两项研究都报告存在关联，但其中一项的关系很弱，另一项较强。只看是否显著无法知道这一差别，比较效应量才能开始理解强度差异。"}, {"heading": "理解边界", "text": "效应量大小不直接证明因果关系，也不自动决定现实重要性。解释时仍要结合设计、测量、重复证据及具体研究问题。"}], "markdown": "---\nid: \"personality-effect-size\"\ntitle: \"效应量\"\nenglish: \"Effect Size\"\nkind: \"方法\"\ndomain: \"foundations\"\nsubdomain: \"理解研究结果\"\nsummary: \"效应量描述变量之间的关联或条件差异有多大。它帮助把统计显著与实际强度分开，使读者不只问有没有关系，还能进一步比较关系的幅度。\"\naliases: []\nkeywords: [\"效应量\", \"显著性\", \"相关\", \"幅度\", \"强度\", \"差异\", \"统计\", \"证据\"]\nquestions: [\"统计显著是否意味着效果很大？\", \"比较两项研究时为什么要看效应量？\"]\nsources: [{\"book\": \"personality\", \"chapter\": \"第3章 人格评估与开放科学\", \"locator\": \"PDF 第 255 页\", \"pdfPages\": [255]}]\ncandidateRelated: [{\"concept\": \"复制与开放科学\", \"reason\": \"评估结果能否重复\"}, {\"concept\": \"随机分配与实验\", \"reason\": \"区分关联强度与因果解释\"}]\n---\n\n## 核心解释\n\n教材强调，统计显著性不等于结果重要，也不直接反映变量联系的强弱。效应量则用数值描述关联或差异的程度，例如相关系数可表达线性关系的方向和幅度。解释效应量还需要联系研究对象、测量方式与实际结果，从而避免把一个显著标记当成对理论意义的完整评价。\n\n## 一个例子\n\n理解用例：两项研究都报告存在关联，但其中一项的关系很弱，另一项较强。只看是否显著无法知道这一差别，比较效应量才能开始理解强度差异。\n\n## 理解边界\n\n效应量大小不直接证明因果关系，也不自动决定现实重要性。解释时仍要结合设计、测量、重复证据及具体研究问题。\n"}, {"id": "personality-etics-emics", "title": "跨文化研究的共同与特有视角", "english": "Etics and Emics", "kind": "方法", "domain": "personality", "subdomain": "文化与人格", "summary": "跨文化研究既要寻找不同社会共有的心理成分，也要理解各自特有的意义。共同与特有视角帮助避免把一个文化的测量语言直接当作普遍事实。", "aliases": ["主位与客位"], "keywords": ["跨文化", "共同", "特有", "文化意义", "比较", "测量", "民族中心", "普遍性"], "questions": ["如何区分跨文化共有的心理成分与本地意义？", "把同一问卷翻译过去就能直接比较人格吗？"], "sources": [{"book": "personality", "chapter": "第13章 文化差异", "locator": "PDF 第 1062–1064 页", "pdfPages": [1062, 1063, 1064]}], "candidateRelated": [{"concept": "个体主义与集体主义", "reason": "常见的文化比较维度"}, {"concept": "构念效度", "reason": "文化变化会影响指标的意义"}], "sections": [{"heading": "核心解释", "text": "教材把跨文化共有的成分称为共同视角所关注的内容，把使文化彼此不同的成分称为特有视角所关注的内容。比较人格时，需要同时检查哪些概念可以通用、哪些表达依赖当地意义。两种视角相配合，可以避免只强调差异，也避免预设所有人的心理类别完全相同。"}, {"heading": "一个例子", "text": "理解用例：比较不同地方如何表达友善时，一方面可找共同的关心行为，另一方面也要理解当地表达尊重的方式。表面做法不同，不一定代表缺少共同关切。"}, {"heading": "理解边界", "text": "共同与特有并非非此即彼，研究者自身也有文化位置。教材提醒民族中心主义与过度相对化都可能妨碍理解。"}], "markdown": "---\nid: \"personality-etics-emics\"\ntitle: \"跨文化研究的共同与特有视角\"\nenglish: \"Etics and Emics\"\nkind: \"方法\"\ndomain: \"personality\"\nsubdomain: \"文化与人格\"\nsummary: \"跨文化研究既要寻找不同社会共有的心理成分，也要理解各自特有的意义。共同与特有视角帮助避免把一个文化的测量语言直接当作普遍事实。\"\naliases: [\"主位与客位\"]\nkeywords: [\"跨文化\", \"共同\", \"特有\", \"文化意义\", \"比较\", \"测量\", \"民族中心\", \"普遍性\"]\nquestions: [\"如何区分跨文化共有的心理成分与本地意义？\", \"把同一问卷翻译过去就能直接比较人格吗？\"]\nsources: [{\"book\": \"personality\", \"chapter\": \"第13章 文化差异\", \"locator\": \"PDF 第 1062–1064 页\", \"pdfPages\": [1062, 1063, 1064]}]\ncandidateRelated: [{\"concept\": \"个体主义与集体主义\", \"reason\": \"常见的文化比较维度\"}, {\"concept\": \"构念效度\", \"reason\": \"文化变化会影响指标的意义\"}]\n---\n\n## 核心解释\n\n教材把跨文化共有的成分称为共同视角所关注的内容，把使文化彼此不同的成分称为特有视角所关注的内容。比较人格时，需要同时检查哪些概念可以通用、哪些表达依赖当地意义。两种视角相配合，可以避免只强调差异，也避免预设所有人的心理类别完全相同。\n\n## 一个例子\n\n理解用例：比较不同地方如何表达友善时，一方面可找共同的关心行为，另一方面也要理解当地表达尊重的方式。表面做法不同，不一定代表缺少共同关切。\n\n## 理解边界\n\n共同与特有并非非此即彼，研究者自身也有文化位置。教材提醒民族中心主义与过度相对化都可能妨碍理解。\n"}, {"id": "personality-expectancy-reward-value", "title": "期望与奖励价值", "english": "Expectancies and Reward Value", "kind": "模型", "domain": "personality", "subdomain": "社会学习与动机", "summary": "罗特的社会学习解释把行动选择与预期后果联系起来。某个结果多有吸引力，以及人认为自己多有可能获得它，都可能影响是否愿意采取行动。", "aliases": ["期望价值"], "keywords": ["期望", "价值", "奖励", "罗特", "选择", "动机", "可达性", "后果"], "questions": ["没有采取行动是否一定说明结果不值得追求？", "结果吸引力与成功期待怎样共同影响选择？"], "sources": [{"book": "personality", "chapter": "第14章 人格过程", "locator": "PDF 第 1097–1098 页", "pdfPages": [1097, 1098]}], "candidateRelated": [{"concept": "自我效能", "reason": "能力期待可以影响行动"}, {"concept": "控制点", "reason": "关注自身行动是否能影响结果"}], "sections": [{"heading": "核心解释", "text": "教材用工作选择介绍罗特的观点：一个人是否争取某项机会，不只取决于报酬是否有价值，也取决于他认为自己能否得到机会。社会学习取向因此将对未来后果的理解纳入解释，补充只关注实际奖励的观点。价值与可达性的差别，有助于区分缺少兴趣与缺少成功期待。"}, {"heading": "一个例子", "text": "理解用例：两项活动都很有吸引力，但你认为其中一项几乎不可能参加，便先申请另一项。用例说明选择会同时涉及结果价值与得到结果的期待。"}, {"heading": "理解边界", "text": "这里按教材的简要论述介绍，没有添加固定计算公式。实际选择还受信息和环境约束，不能只凭未行动判断缺乏兴趣。"}], "markdown": "---\nid: \"personality-expectancy-reward-value\"\ntitle: \"期望与奖励价值\"\nenglish: \"Expectancies and Reward Value\"\nkind: \"模型\"\ndomain: \"personality\"\nsubdomain: \"社会学习与动机\"\nsummary: \"罗特的社会学习解释把行动选择与预期后果联系起来。某个结果多有吸引力，以及人认为自己多有可能获得它，都可能影响是否愿意采取行动。\"\naliases: [\"期望价值\"]\nkeywords: [\"期望\", \"价值\", \"奖励\", \"罗特\", \"选择\", \"动机\", \"可达性\", \"后果\"]\nquestions: [\"没有采取行动是否一定说明结果不值得追求？\", \"结果吸引力与成功期待怎样共同影响选择？\"]\nsources: [{\"book\": \"personality\", \"chapter\": \"第14章 人格过程\", \"locator\": \"PDF 第 1097–1098 页\", \"pdfPages\": [1097, 1098]}]\ncandidateRelated: [{\"concept\": \"自我效能\", \"reason\": \"能力期待可以影响行动\"}, {\"concept\": \"控制点\", \"reason\": \"关注自身行动是否能影响结果\"}]\n---\n\n## 核心解释\n\n教材用工作选择介绍罗特的观点：一个人是否争取某项机会，不只取决于报酬是否有价值，也取决于他认为自己能否得到机会。社会学习取向因此将对未来后果的理解纳入解释，补充只关注实际奖励的观点。价值与可达性的差别，有助于区分缺少兴趣与缺少成功期待。\n\n## 一个例子\n\n理解用例：两项活动都很有吸引力，但你认为其中一项几乎不可能参加，便先申请另一项。用例说明选择会同时涉及结果价值与得到结果的期待。\n\n## 理解边界\n\n这里按教材的简要论述介绍，没有添加固定计算公式。实际选择还受信息和环境约束，不能只凭未行动判断缺乏兴趣。\n"}, {"id": "personality-gene-environment-interaction", "title": "基因与环境交互作用", "english": "Gene-Environment Interaction", "kind": "心理过程", "domain": "personality", "subdomain": "遗传与环境", "summary": "遗传相关倾向的表现可以随环境条件改变，环境影响也可能因遗传差异而不同。教材因此反对把人格简单看成基因作用与环境作用的机械相加。", "aliases": ["Gene-environment interaction", "基因与环境交互"], "keywords": ["基因", "环境", "交互", "发展", "敏感性", "压力", "遗传", "复制", "基因与环境交互", "Gene-environment interaction", "遗传与进化", "先天", "后天", "表达"], "questions": ["为什么同一种遗传倾向在不同环境下表现不同？", "发现基因关联是否就识别了具体心理机制？", "基因与环境交互解释了什么心理现象？", "基因与环境交互在什么条件下适用，有什么局限？"], "sources": [{"book": "personality", "chapter": "第9章 遗传与进化", "locator": "PDF 第 714–715 页", "pdfPages": [714, 715]}, {"book": "general", "chapter": "第3章 · 行为的遗传与进化基础", "locator": "PDF 第 174–184 页", "pdfPages": [174, 175, 184]}], "candidateRelated": [{"concept": "遗传率", "reason": "群体差异的统计描述"}, {"concept": "人与情境交互作用", "reason": "在另一层面讨论条件性影响"}, {"title": "经验论与先天论", "reason": "发展同时依赖学习机会与生物组织"}, {"title": "专长、组块与刻意练习", "reason": "能力和练习环境可相互影响"}], "sections": [{"heading": "核心解释", "text": "基因与环境交互作用关注遗传差异在不同条件下呈现不同影响。教材说明，基因之间以及基因与经历之间的联系，让人格发展远比独立因素相加复杂；某种倾向可能在特定压力或养育环境中才显现。与此同时，教材 能把情绪与健康的相关直接当作单向原因？"], "sources": [{"book": "personality", "chapter": "第17章 心理与身体健康", "locator": "PDF 第 1351–1352 页", "pdfPages": [1351, 1352]}], "candidateRelated": [{"concept": "人格四类资料", "reason": "健康研究需比较自评与生活记录"}, {"concept": "人与情境交互作用", "reason": "环境同样参与行为形成"}], "sections": [{"heading": "核心解释", "text": "教材讨论人格如何通过吸烟、谨慎行动及持续生活习惯等行为与健康结果相联系，尤其强调尽责性相关的行为路径。它也提醒，情绪和身体状况可能相互影响，若二者都靠自评记录，更要谨慎解释。因此，人格与健康的关联不能简化为某种性格直接制造某种疾病。"}, {"heading": "一个例子", "text": "理解用例：一个习惯按计划办事的人可能更常遵守日常安排，许多小行动随时间累积。这个用例仅说明行为路径的逻辑，不预测个人健康结果。"}, {"heading": "理解边界", "text": "关联不等于个体命运，也不能替代医疗判断。还需区分测量来源、生活环境和反向影响，避免将健康问题归责于人格。"}], "markdown": "---\nid: \"personality-health-behavior-pathway\"\ntitle: \"人格与健康行为路径\"\nenglish: \"Personality and Health Behavior Pathway\"\nkind: \"心理过程\"\ndomain: \"personality\"\nsubdomain: \"人格与适应\"\nsummary: \"人格与健康之间的联系可能通过日常行为逐渐累积。教材强调，理解这种关系需要区分行为途径、直接生物联系及健康状态反过来改变情绪的可能。\"\naliases: []\nkeywords: [\"人格\", \"健康行为\", \"尽责性\", \"生活习惯\", \"累积\", \"反向影响\", \"自评\", \"环境\"]\nquestions: [\"人格与健康的联系可能经过哪些日常行为？\", \"为什么不能把情绪与健康的相关直接当作单向原因？\"]\nsources: [{\"book\": \"personality\", \"chapter\": \"第17章 心理与身体健康\", \"locator\": \"PDF 第 1351–1352 页\", \"pdfPages\": [1351, 1352]}]\ncandidateRelated: [{\"concept\": \"人格四类资料\", \"reason\": \"健康研究需比较自评与生活记录\"}, {\"concept\": \"人与情境交互作用\", \"reason\": \"环境同样参与行为形成\"}]\n---\n\n## 核心解释\n\n教材讨论人格如何通过吸烟、谨慎行动及持续生活习惯等行为与健康结果相联系，尤其强调尽责性相关的行为路径。它也提醒，情绪和身体状况可能相互影响，若二者都靠自评记录，更要谨慎解释。因此，人格与健康的关联不能简化为某种性格直接制造某种疾病。\n\n## 一个例子\n\n理解用例：一个习惯按计划办事的人可能更常遵守日常安排，许多小行动随时间累积。这个用例仅说明行为路径的逻辑，不预测个人健康结果。\n\n## 理解边界\n\n关联不等于个体命运，也不能替代医疗判断。还需区分测量来源、生活环境和反向影响，避免将健康问题归责于人格。\n"}, {"id": "personality-heritability", "title": "遗传率", "english": "Heritability", "kind": "概念", "domain": "personality", "subdomain": "遗传与环境", "summary": "遗传率描述某个群体中差异有多少与遗传差异相关，不能用来拆分一个人的人格来源。理解这一统计量，必须同时关注被研究的群体与环境。", "aliases": [], "keywords": ["遗传率", "群体", "变异", "双生子", "基因", "环境", "先天", "后天"], "questions": ["为什么遗传率不能用来拆分一个人的性格来源？", "高遗传率是否等于人格不可改变？"], "sources": [{"book": "personality", "chapter": "第9章 遗传与进化", "locator": "PDF 第 714–715 页", "pdfPages": [714, 715]}], "candidateRelated": [{"concept": "基因与环境交互作用", "reason": "说明遗传作用取决于条件"}, {"concept": "累积连续性原则", "reason": "从发展过程理解稳定"}], "sections": [{"heading": "核心解释", "text": "教材把遗传率界定为群体中表型变异可归于遗传变异的比例，并用双生子比较介绍估计思路。它讨论的是人群差异，不是说某个人有多少性格由基因制造，也不直接解释群体平均水平。教材特别提醒，遗传率不是先天与后天的固定分配表，基因及环境之间存在复杂联系。"}, {"heading": "一个例子", "text": "理解用例：如果研究某一群体的外向性差异，所得遗传率只描述这组人的变异。不能把这个比例贴在其中一人身上，说他的外向性有相同比例来自父母。"}, {"heading": "理解边界", "text": "遗传率高不代表不可改变，遗传率低也不代表基因无关。统计量依赖群体变异，不能直接移用于另一个环境。"}], "markdown": "---\nid: \"personality-heritability\"\ntitle: \"遗传率\"\nenglish: \"Heritability\"\nkind: \"概念\"\ndomain: \"personality\"\nsubdomain: \"遗传与环境\"\nsummary: \"遗传率描述某个群体中差异有多少与遗传差异相关，不能用来拆分一个人的人格来源。理解这一统计量，必须同时关注被研究的群体与环境。\"\naliases: []\nkeywords: [\"遗传率\", \"群体\", \"变异\", \"双生子\", \"基因\", \"环境\", \"先天\", \"后天\"]\nquestions: [\"为什么遗传率不能用来拆分一个人的性格来源？\", \"高遗传率是否等于人格不可改变？\"]\nsources: [{\"book\": \"personality\", \"chapter\": \"第9章 遗传与进化\", \"locator\": \"PDF 第 714–715 页\", \"pdfPages\": [714, 715]}]\ncandidateRelated: [{\"concept\": \"基因与环境交互作用\", \"reason\": \"说明遗传作用取决于条件\"}, {\"concept\": \"累积连续性原则\", \"reason\": \"从发展过程理解稳定\"}]\n---\n\n## 核心解释\n\n教材把遗传率界定为群体中表型变异可归于遗传变异的比例，并用双生子比较介绍估计思路。它讨论的是人群差异，不是说某个人有多少性格由基因制造，也不直接解释群体平均水平。教材特别提醒，遗传率不是先天与后天的固定分配表，基因及环境之间存在复杂联系。\n\n## 一个例子\n\n理解用例：如果研究某一群体的外向性差异，所得遗传率只描述这组人的变异。不能把这个比例贴在其中一人身上，说他的外向性有相同比例来自父母。\n\n## 理解边界\n\n遗传率高不代表不可改变，遗传率低也不代表基因无关。统计量依赖群体变异，不能直接移用于另一个环境。\n"}, {"id": "personality-hierarchy-needs", "title": "需要层次理论", "english": "Hierarchy of Needs", "kind": "理论", "domain": "personality", "subdomain": "动机与成长", "summary": "马斯洛用需要层次理解动机重点如何变化：基本生存与安全获得满足后，关系、尊重与自我实现可能更突出。它把个人追求与当下处境联系起来。", "aliases": ["Hierarchy of needs and self-actualization", "需要层次与自我实现"], "keywords": ["马斯洛", "需要层次", "生理需要", "安全", "归属", "尊重", "自我实现", "成长", "人本主义", "Hierarchy of Needs"], "questions": ["生活条件变化为什么可能改变一个人最重视的追求？", "需要层次能否当作评判个人价值的排名？"], "sources": [{"book": "personality", "chapter": "第12章 人本积极心理与幸福", "locator": "PDF 第 913–916 页", "pdfPages": [913, 914, 915, 916]}, {"book": "general", "chapter": "第14章 · 人格", "locator": "PDF 第 1218–1220 页", "pdfPages": [1218, 1219, 1220]}], "candidateRelated": [{"concept": "罗杰斯的人本取向", "reason": "同样把自我实现置于重要位置"}, {"concept": "期望与奖励价值", "reason": "从行动选择解释动机"}, {"title": "内稳态与驱力", "reason": "生理调节只解释部分人类动机"}, {"title": "自我记忆系统", "reason": "成长目标与自我理解相联系"}], "sections": [{"heading": "核心解释", "text": "马斯洛将生理、安全、归属、尊重与自我实现需要联系起来：当更紧迫的需要得到一定满足时，其他追求可能获得更多注意和精力。自我实现涉及发展自身能力与选择成长目标，并非统一的外部成就标准。教材还介绍从进化功能理解或改写层次的不同思路。"}, {"heading": "一个例子", "text": "理解用例：面对生活不稳定时，一个人可能优先选择收入较可靠的安排；处境稳定后，则更重视工作的表达与成长空间。用例说明追求重点可能随条件改变。"}, {"heading": "理解边界", "text": "层次是理论性的动机框架，不能据此给人的价值排高低，或把金字塔当作人人严格依次通过的阶梯。多种需要可同时发挥作用。"}], "markdown": "---\nid: \"personality-hierarchy-needs\"\ntitle: \"需要层次理论\"\nenglish: \"Hierarchy of Needs\"\nkind: \"理论\"\ndomain: \"personality\"\nsubdomain: \"动机与成长\"\nsummary: \"马斯洛用需要层次理解动机重点如何变化：基本生存与安全获得满足后，关系、尊重与自我实现可能更突出。它把个人追求与当下处境联系起来。\"\naliases: [\"Hierarchy of needs and self-actualization\", \"需要层次与自我实现\"]\nkeywords: [\"马斯洛\", \"需要层次\", \"生理需要\", \"安全\", \"归属\", \"尊重\", \"自我实现\", \"成长\", \"人本主义\", \"Hierarchy of Needs\"]\nquestions: [\"生活条件变化为什么可能改变一个人最重视的追求？\", \"需要层次能否当作评判个人价值的排名？\"]\nsources: [{\"book\": \"personality\", \"chapter\": \"第12章 人本积极心理与幸福\", \"locator\": \"PDF 第 913–916 页\", \"pdfPages\": [913, 914, 915, 916]}, {\"book\": \"general\", \"chapter\": \"第14章 · 人格\", \"locator\": \"PDF 第 1218–1220 页\", \"pdfPages\": [1218, 1219, 1220]}]\ncandidateRelated: [{\"concept\": \"罗杰斯的人本取向\", \"reason\": \"同样把自我实现置于重要位置\"}, {\"concept\": \"期望与奖励价值\", \"reason\": \"从行动选择解释动机\"}, {\"title\": \"内稳态与驱力\", \"reason\": \"生理调节只解释部分人类动机\"}, {\"title\": \"自我记忆系统\", \"reason\": \"成长目标与自我理解相联系\"}]\n---\n\n## 核心解释\n\n马斯洛将生理、安全、归属、尊重与自我实现需要联系起来：当更紧迫的需要得到一定满足时，其他追求可能获得更多注意和精力。自我实现涉及发展自身能力与选择成长目标，并非统一的外部成就标准。教材还介绍从进化功能理解或改写层次的不同思路。\n\n## 一个例子\n\n理解用例：面对生活不稳定时，一个人可能优先选择收入较可靠的安排；处境稳定后，则更重视工作的表达与成长空间。用例说明追求重点可能随条件改变。\n\n## 理解边界\n\n层次是理论性的动机框架，不能据此给人的价值排高低，或把金字塔当作人人严格依次通过的阶梯。多种需要可同时发挥作用。\n"}, {"id": "personality-holland-vocational-types", "title": "霍兰德职业类型", "english": "Holland Occupational Typology", "kind": "模型", "domain": "personality", "subdomain": "人格与工作", "summary": "霍兰德模型用现实、研究、艺术、社会、企业和常规六类组织职业倾向与工作环境。它提供比较人与工作的语言，而不是从标签直接决定一个人的职业。", "aliases": ["RIASEC"], "keywords": ["霍兰德", "职业", "兴趣", "现实型", "研究型", "艺术型", "社会型", "企业型", "常规型"], "questions": ["职业类型怎样帮助比较不同工作的要求？", "为什么不能单凭类型标签决定职业？"], "sources": [{"book": "personality", "chapter": "第16章 关系与工作", "locator": "PDF 第 1264 页", "pdfPages": [1264]}], "candidateRelated": [{"concept": "特质与类型的区别", "reason": "提醒分类的信息限制"}, {"concept": "大五人格", "reason": "另一种描述人格差异的框架"}], "sections": [{"heading": "核心解释", "text": "教材介绍霍兰德的六类职业框架，用于组织人格特点与不同工作的联系。现实型偏向实际操作，研究型关注探究，艺术型重视创造，社会型涉及助人与教育，企业型涉及组织和经营，常规型涉及有序资料工作。框架帮助提出适配问题，但仍需考察具体能力、任务与环境要求。"}, {"heading": "一个例子", "text": "理解用例：比较两个岗位时，你可以分别查看它们更强调探索、协作还是有序处理资料，再联系自己的偏好。用例用于组织比较，不是根据一个测验替你选择工作。"}, {"heading": "理解边界", "text": "职业类型是简化框架，真实岗位通常包含多种任务。它不能替代能力、机会与生活条件，也不能保证某种人只适合一种工作。"}], "markdown": "---\nid: \"personality-holland-vocational-types\"\ntitle: \"霍兰德职业类型\"\nenglish: \"Holland Occupational Typology\"\nkind: \"模型\"\ndomain: \"personality\"\nsubdomain: \"人格与工作\"\nsummary: \"霍兰德模型用现实、研究、艺术、社会、企业和常规六类组织职业倾向与工作环境。它提供比较人与工作的语言，而不是从标签直接决定一个人的职业。\"\naliases: [\"RIASEC\"]\nkeywords: [\"霍兰德\", \"职业\", \"兴趣\", \"现实型\", \"研究型\", \"艺术型\", \"社会型\", \"企业型\", \"常规型\"]\nquestions: [\"职业类型怎样帮助比较不同工作的要求？\", \"为什么不能单凭类型标签决定职业？\"]\nsources: [{\"book\": \"personality\", \"chapter\": \"第16章 关系与工作\", \"locator\": \"PDF 第 1264 页\", \"pdfPages\": [1264]}]\ncandidateRelated: [{\"concept\": \"特质与类型的区别\", \"reason\": \"提醒分类的信息限制\"}, {\"concept\": \"大五人格\", \"reason\": \"另一种描述人格差异的框架\"}]\n---\n\n## 核心解释\n\n教材介绍霍兰德的六类职业框架，用于组织人格特点与不同工作的联系。现实型偏向实际操作，研究型关注探究，艺术型重视创造，社会型涉及助人与教育，企业型涉及组织和经营，常规型涉及有序资料工作。框架帮助提出适配问题，但仍需考察具体能力、任务与环境要求。\n\n## 一个例子\n\n理解用例：比较两个岗位时，你可以分别查看它们更强调探索、协作还是有序处理资料，再联系自己的偏好。用例用于组织比较，不是根据一个测验替你选择工作。\n\n## 理解边界\n\n职业类型是简化框架，真实岗位通常包含多种任务。它不能替代能力、机会与生活条件，也不能保证某种人只适合一种工作。\n"}, {"id": "personality-individualism-collectivism", "title": "个体主义与集体主义", "english": "Individualism and Collectivism", "kind": "概念", "domain": "personality", "subdomain": "文化与人格", "summary": "文化可以在个人自主与群体关系的相对强调上有所不同。这个维度帮助比较价值与自我理解，但同一文化内部差异很大，不能把文化平均模式当作每个人的性格。", "aliases": [], "keywords": ["个体主义", "集体主义", "文化", "自主", "关系", "责任", "自我", "群体差异"], "questions": ["文化中的个人与群体强调怎样影响自我理解？", "为什么不能用文化平均值判断一个具体的人？"], "sources": [{"book": "personality", "chapter": "第13章 文化差异", "locator": "PDF 第 1062–1064 页", "pdfPages": [1062, 1063, 1064]}], "candidateRelated": [{"concept": "荣誉文化", "reason": "文化比较还包含其他维度"}, {"concept": "跨文化研究的共同与特有视角", "reason": "帮助检验概念适用范围"}], "sections": [{"heading": "核心解释", "text": "教材用个体主义与集体主义描述个人经验和利益、群体关系与责任之间的相对强调。相关差异可见于价值、自我描述和对情境的理解。不过，教材明确提醒简单的东西方对照过于宽泛，文化内部存在亚文化与多文化个体，比较应保留群体之间及群体内部的差异。"}, {"heading": "一个例子", "text": "理解用例：做同一项选择时，有人先问这是否符合个人兴趣，也有人先考虑对家庭协作的影响。用例说明价值关注不同，不表示两人只能属于某一种固定文化。"}, {"heading": "理解边界", "text": "这些是文化比较维度，不是给国籍贴人格标签。不能从群体平均直接推断某个成员，也不能忽视历史与生活条件。"}], "markdown": "---\nid: \"personality-individualism-collectivism\"\ntitle: \"个体主义与集体主义\"\nenglish: \"Individualism and Collectivism\"\nkind: \"概念\"\ndomain: \"personality\"\nsubdomain: \"文化与人格\"\nsummary: \"文化可以在个人自主与群体关系的相对强调上有所不同。这个维度帮助比较价值与自我理解，但同一文化内部差异很大，不能把文化平均模式当作每个人的性格。\"\naliases: []\nkeywords: [\"个体主义\", \"集体主义\", \"文化\", \"自主\", \"关系\", \"责任\", \"自我\", \"群体差异\"]\nquestions: [\"文化中的个人与群体强调怎样影响自我理解？\", \"为什么不能用文化平均值判断一个具体的人？\"]\nsources: [{\"book\": \"personality\", \"chapter\": \"第13章 文化差异\", \"locator\": \"PDF 第 1062–1064 页\", \"pdfPages\": [1062, 1063, 1064]}]\ncandidateRelated: [{\"concept\": \"荣誉文化\", \"reason\": \"文化比较还包含其他维度\"}, {\"concept\": \"跨文化研究的共同与特有视角\", \"reason\": \"帮助检验概念适用范围\"}]\n---\n\n## 核心解释\n\n教材用个体主义与集体主义描述个人经验和利益、群体关系与责任之间的相对强调。相关差异可见于价值、自我描述和对情境的理解。不过，教材明确提醒简单的东西方对照过于宽泛，文化内部存在亚文化与多文化个体，比较应保留群体之间及群体内部的差异。\n\n## 一个例子\n\n理解用例：做同一项选择时，有人先问这是否符合个人兴趣，也有人先考虑对家庭协作的影响。用例说明价值关注不同，不表示两人只能属于某一种固定文化。\n\n## 理解边界\n\n这些是文化比较维度，不是给国籍贴人格标签。不能从群体平均直接推断某个成员，也不能忽视历史与生活条件。\n"}, {"id": "personality-locus-control", "title": "控制点", "english": "Locus of Control", "kind": "概念", "domain": "personality", "subdomain": "社会学习与动机", "summary": "控制点关注人如何理解行动与结果之间的联系。教材介绍内控倾向：越相信自己的行动能够影响生活后果，就越可能愿意尝试做出改变。", "aliases": ["内外控制点"], "keywords": ["控制点", "内控", "外控", "行动", "结果", "期待", "动机", "罗特"], "questions": ["相信行动能影响结果会怎样改变尝试意愿？", "控制点与自我效能关注的是同一个问题吗？"], "sources": [{"book": "personality", "chapter": "第14章 人格过程", "locator": "PDF 第 1098 页", "pdfPages": [1098]}], "candidateRelated": [{"concept": "知觉控制", "reason": "同样涉及对处境影响力的判断"}, {"concept": "自我效能", "reason": "关注自己能否执行所需行动"}], "sections": [{"heading": "核心解释", "text": "在罗特的社会学习讨论中，个体会判断结果是否能够由自己的行为影响。内控倾向强调行动与后果之间的联系，而不是把生活结果完全视为与自身行动无关。这样的期待可以影响投入和尝试，因此理解行动意愿时，需要同时看实际条件与个体认为自己能产生多少影响。"}, {"heading": "一个例子", "text": "理解用例：面对一项可以通过练习改善的任务，有人认为调整方法会影响结果，因此愿意继续尝试。用例说明对行动后果的期待，不保证实际一定能控制结果。"}, {"heading": "理解边界", "text": "内控倾向不等于客观控制能力，也不能把不可控制的结果归责于个人。它与对某个具体任务能力的自我效能需要区分。"}], "markdown": "---\nid: \"personality-locus-control\"\ntitle: \"控制点\"\nenglish: \"Locus of Control\"\nkind: \"概念\"\ndomain: \"personality\"\nsubdomain: \"社会学习与动机\"\nsummary: \"控制点关注人如何理解行动与结果之间的联系。教材介绍内控倾向：越相信自己的行动能够影响生活后果，就越可能愿意尝试做出改变。\"\naliases: [\"内外控制点\"]\nkeywords: [\"控制点\", \"内控\", \"外控\", \"行动\", \"结果\", \"期待\", \"动机\", \"罗特\"]\nquestions: [\"相信行动能影响结果会怎样改变尝试意愿？\", \"控制点与自我效能关注的是同一个问题吗？\"]\nsources: [{\"book\": \"personality\", \"chapter\": \"第14章 人格过程\", \"locator\": \"PDF 第 1098 页\", \"pdfPages\": [1098]}]\ncandidateRelated: [{\"concept\": \"知觉控制\", \"reason\": \"同样涉及对处境影响力的判断\"}, {\"concept\": \"自我效能\", \"reason\": \"关注自己能否执行所需行动\"}]\n---\n\n## 核心解释\n\n在罗特的社会学习讨论中，个体会判断结果是否能够由自己的行为影响。内控倾向强调行动与后果之间的联系，而不是把生活结果完全视为与自身行动无关。这样的期待可以影响投入和尝试，因此理解行动意愿时，需要同时看实际条件与个体认为自己能产生多少影响。\n\n## 一个例子\n\n理解用例：面对一项可以通过练习改善的任务，有人认为调整方法会影响结果，因此愿意继续尝试。用例说明对行动后果的期待，不保证实际一定能控制结果。\n\n## 理解边界\n\n内控倾向不等于客观控制能力，也不能把不可控制的结果归责于个人。它与对某个具体任务能力的自我效能需要区分。\n"}, {"id": "personality-maturity-principle", 念", "domain": "personality", "subdomain": "人格的生物基础", "summary": "人格的生物基础可能涉及多个脑区协同作用，而不是一个特质对应一个孤立位置。教材也强调生物过程与行为、社会环境之间存在双向影响。", "aliases": [], "keywords": ["脑区", "网络", "系统", "人格", "情绪", "认知", "生物", "双向作用"], "questions": ["为什么一个人格特质未必只对应一个脑区？", "生物活动与社会行为怎样可能互相影响？"], "sources": [{"book": "personality", "chapter": "第8章 人格的解剖与生理", "locator": "PDF 第 644–645 页", "pdfPages": [644, 645]}], "candidateRelated": [{"concept": "行为激活系统", "reason": "提供一个奖励相关框架"}, {"concept": "基因与环境交互作用", "reason": "同样反对单因素决定论"}], "sections": [{"heading": "核心解释", "text": "教材在介绍脑区功能之后，强调人格可能更依赖分布式系统或回路的共同活动。情绪和认知需要协调，社会行为又能反过来影响生物过程。因此，理解生物与人格的关系，需要观察系统之间的联系及时间过程，而不是仅凭一个脑区的活跃程度为整个人格作出结论。"}, {"heading": "一个例子", "text": "理解用例：一个人决定是否接受新任务时，可能同时评估奖励、风险和自身计划。这个用例帮助理解多种功能协同，并不宣称已经定位出该决定的脑活动。"}, {"heading": "理解边界", "text": "脑活动的相关图像不能单独证明某区域造成某个特质。教材特别指出方法复杂、部分结果暂定，以及反向影响的可能。"}], "markdown": "---\nid: \"personality-neural-networks\"\ntitle: \"人格的神经网络视角\"\nenglish: \"Neural Systems and Personality\"\nkind: \"概念\"\ndomain: \"personality\"\nsubdomain: \"人格的生物基础\"\nsummary: \"人格的生物基础可能涉及多个脑区协同作用，而不是一个特质对应一个孤立位置。教材也强调生物过程与行为、社会环境之间存在双向影响。\"\naliases: []\nkeywords: [\"脑区\", \"网络\", \"系统\", \"人格\", \"情绪\", \"认知\", \"生物\", \"双向作用\"]\nquestions: [\"为什么一个人格特质未必只对应一个脑区？\", \"生物活动与社会行为怎样可能互相影响？\"]\nsources: [{\"book\": \"personality\", \"chapter\": \"第8章 人格的解剖与生理\", \"locator\": \"PDF 第 644–645 页\", \"pdfPages\": [644, 645]}]\ncandidateRelated: [{\"concept\": \"行为激活系统\", \"reason\": \"提供一个奖励相关框架\"}, {\"concept\": \"基因与环境交互作用\", \"reason\": \"同样反对单因素决定论\"}]\n---\n\n## 核心解释\n\n教材在介绍脑区功能之后，强调人格可能更依赖分布式系统或回路的共同活动。情绪和认知需要协调，社会行为又能反过来影响生物过程。因此，理解生物与人格的关系，需要观察系统之间的联系及时间过程，而不是仅凭一个脑区的活跃程度为整个人格作出结论。\n\n## 一个例子\n\n理解用例：一个人决定是否接受新任务时，可能同时评估奖励、风险和自身计划。这个用例帮助理解多种功能协同，并不宣称已经定位出该决定的脑活动。\n\n## 理解边界\n\n脑活动的相关图像不能单独证明某区域造成某个特质。教材特别指出方法复杂、部分结果暂定，以及反向影响的可能。\n"}, {"id": "personality-object-relations", "title": "客体关系理论", "english": "Object Relations Theory", "kind": "理论", "domain": "personality", "subdomain": "精神分析与关系", "summary": "客体关系 件作用\", \"reason\": \"他人的后果可影响观察者表现\"}, {\"title\": \"社会文化发展理论\", \"reason\": \"社会互动与文化工具参与学习\"}]\n---\n\n## 核心解释\n\n观察学习是观看他人如何行动后获得行为方式的过程。教材介绍班杜拉的玩偶研究：观察成人攻击玩偶，特别是看到其受到奖励后，儿童更可能表现相关行为。它也强调榜样可以提供积极行为。这使学习的解释超出个人直接接受奖励，纳入他人的行为及后果。\n\n## 一个例子\n\n理解用例：你看同学怎样分步骤整理复杂笔记，之后也尝试采用类似结构。用例说明可以从别人的行动获得方法，而不必先经历所有无效做法。\n\n## 理解边界\n\n看到行为不等于必然模仿，玩偶研究也不能直接推出极端现实暴力。需要区分学到行为、实际执行以及不同任务情境。\n"}, {"id": "personality-person-situation-interaction", "title": "人与情境交互作用", "english": "Person-Situation Interactionism", "kind": "理论", "domain": "personality", "subdomain": "特质与情境", "summary": "行为由人的特点和情境共同形成，二者还会彼此影响。交互作用观点超越谁更重要的二选一，也关注人如何选择、改变或引出不同环境。", "aliases": [], "keywords": ["人格", "情境", "交互", "选择", "环境", "特质", "行为", "反馈"], "questions": ["人格与情境为什么不必争出一个唯一胜者？", "人怎样主动塑造自己所处的环境？"], "sources": [{"book": "personality", "chapter": "第4章 人与情境", "locator": "PDF 第 328–329 页", "pdfPages": [328, 329]}], "candidateRelated": [{"concept": "相对一致性", "reason": "说明行为改变与特质稳定可以共存"}, {"concept": "认知情感人格系统", "reason": "刻画情境化反应模式"}], "sections": [{"heading": "核心解释", "text": "交互作用观点包含几种联系：某个特质的影响随情境而变化；不同人格的人会进入或选择不同情境；人的行动又会改变周围环境。教材据此回应人格与情境之争。解释某次行为时既要看眼前条件，也要看跨情境的个人模式，并检查这些模式与环境如何共同维持。"}, {"heading": "一个例子", "text": "理解用例：爱交流的人可能主动参加讨论，又因不断提问让讨论更活跃；在要求安静的阅览室里，他仍可能保持安静。用例展示选择环境与条件限制同时存在。"}, {"heading": "理解边界", "text": "交互作用不是把所有结果笼统归为两者都有作用。具体解释仍需指出哪种特质、哪类情境，以及预期怎样一起改变行为。"}], "markdown": "---\nid: \"personality-person-situation-interaction\"\ntitle: \"人与情境交互作用\"\nenglish: \"Person-Situation Interactionism\"\nkind: \"理论\"\ndomain: \"personality\"\nsubdomain: \"特质与情境\"\nsummary: \"行为由人的特点和情境共同形成，二者还会彼此影响。交互作用观点超越谁更重要的二选一，也关注人如何选择、改变或引出不同环境。\"\naliases: []\nkeywords: [\"人格\", \"情境\", \"交互\", \"选择\", \"环境\", \"特质\", \"行为\", \"反馈\"]\nquestions: [\"人格与情境为什么不必争出一个唯一胜者？\", \"人怎样主动塑造自己所处的环境？\"]\nsources: [{\"book\": \"personality\", \"chapter\": \"第4章 人与情境\", \"locator\": \"PDF 第 328–329 页\", \"pdfPages\": [328, 329]}]\ncandidateRelated: [{\"concept\": \"相对一致性\", \"reason\": \"说明行为改变与特质稳定可以共存\"}, {\"concept\": \"认知情感人格系统\", \"reason\": \"刻画情境化反应模式\"}]\n---\n\n## 核心解释\n\n交互作用观点包含几种联系：某个特质的影响随情境而变化；不同人格的人会进入或选择不同情境；人的行动又会改变周围环境。教材据此回应人格与情境之争。解释某次行为时既要看眼前条件，也要看跨情境的个人模式，并检查这些模式与环境如何共同维持。\n\n## 一个例子\n\n理解用例：爱交流的人可能主动参加讨论，又因不断提问让讨论更活跃；在要求安静的阅览室里，他仍可能保持安静。用例展示选择环境与条件限制同时存在。\n\n## 理解边界\n\n交互作用不是把所有结果笼统归为两者都有作用。具体解释仍需指出哪种特质、哪类情境，以及预期怎样一起改变行为。\n"}, {"id": "personality-personal-constructs", "title": "个人建构理论", "english": "Personal Construct Theory", "kind": "理论", "domain": "personality", "subdomain": "主观体验", "summary": "凯利认为，人以自己形成的解释框架组织经验，并据此理解新事件。个人建构理论把个体看成尝试理解世界的人，重视不同人赋予经历的不同意义。", "aliases": [], "keywords": ["凯利", "个人建构", "解释", "经验", "意义", "主观", "框架", "理解"], "questions": ["为什么相同建议会被理解成支持或反对？", "个人建构怎样既帮助理解又限制视野？"], "sources": [{"book": "personality", "chapter": "第12章 人本积极心理与幸福", "locator": "PDF 第 968 页", "pdfPages": [968]}], "candidateRelated": [{"concept": "情境解释", "reason": "共享对事件意义的关注"}, {"concept": "人格研究取向的互补性", "reason": "体现现象学入口"}], "sections": [{"heading": "核心解释", "text": "个人建构理论强调，每个人用一套相对独特的区分与解释方式组织世界。这些建构来自既往经验，又帮助决定如何理解后来遇到的人和事。教材将它们比作科学中的解释框架：它们使经验变得有序，也可能限制看到哪些可能性，因此理解一个人需要理解其自己的意义体系。"}, {"heading": "一个例子", "text": "理解用例：面对同学提出修改建议，有人用支持与反对来理解，有人用完善与保留来理解。不同建构可能让相同建议分别显得像冲突或合作。"}, {"heading": "理解边界", "text": "主观解释值得理解，不表示所有解释同样准确。个人建构不是随意编造任何意义，也不能脱离实际经验检验。"}], "markdown": "---\nid: \"personality-personal-constructs\"\ntitle: \"个人建构理论\"\nenglish: \"Personal Construct Theory\"\nkind: \"理论\"\ndomain: \"personality\"\nsubdomain: \"主观体验\"\nsummary: \"凯利认为，人以自己形成的解释框架组织经验，并据此理解新事件。个人建构理论把个体看成尝试理解世界的人，重视不同人赋予经历的不同意义。\"\naliases: []\nkeywords: [\"凯利\", \"个人建构\", \"解释\", \"经验\", \"意义\", \"主观\", \"框架\", \"理解\"]\nquestions: [\"为什么相同建议会被理解成支持或反对？\", \"个人建构怎样既帮助理解又限制视野？\"]\nsources: [{\"book\": \"personality\", \"chapter\": \"第12章 人本积极心理与幸福\", \"locator\": \"PDF 第 968 页\", \"pdfPages\": [968]}]\ncandidateRelated: [{\"concept\": \"情境解释\", \"reason\": \"共享对事件意义的关注\"}, {\"concept\": \"人格研究取向的互补性\", \"reason\": \"体现现象学入口\"}]\n---\n\n## 核心解释\n\n个人建构理论强调，每个人用一套相对独特的区分与解释方式组织世界。这些建构来自既往经验，又帮助决定如何理解后来遇到的人和事。教材将它们比作科学中的解释框架：它们使经验变得有序，也可能限制看到哪些可能性，因此理解一个人需要理解其自己的意义体系。\n\n## 一个例子\n\n理解用例：面对同学提出修改建议，有人用支持与反对来理解，有人用完善与保留来理解。不同建构可能让相同建议分别显得像冲突或合作。\n\n## 理解边界\n\n主观解释值得理解，不表示所有解释同样准确。个人建构不是随意编造任何意义，也不能脱离实际经验检验。\n"}, {"id": "personality-procedural-self", "title": "程序性自我", "english": "Procedural Self", "kind": "概念", "domain": "personality", "subdomain": "自我知识", "summary": "程序性自我体现为习惯化的思考、感受和与人相处方式，未必能够直接说清。教材借这一概念区分我们知道自己怎样，与实际自动怎样行动。", "aliases": [], "keywords": ["程序性自我", "习惯", "关系性自我", "隐含自我", "行为", "反馈", "练习", "意识"], "questions": ["为什么知道自己想怎样做仍可能维持旧习惯？", "程序性自我与能够报告的自我认识有什么不同？"], "sources": [{"book": "personality", "chapter": "第15章 自我", "locator": "PDF 第 1199 页", "pdfPages": [1199]}], "candidateRelated": [{"concept": "陈述性自我", "reason": "作为自我知识的另一侧面"}, {"concept": "交互决定论", "reason": "习惯在行动与反馈中形成"}], "sections": [{"heading": "核心解释", "text": "程序性自我指深植于行动和经验中的自我运作方式，包括面对不同关系时习惯采取的反应。它们不总进入意识，却可以持续影响行为。教材讨论关系性自我与隐含自我，并指出此类习惯若要改变，通常需要实践和反馈，而不仅是把新的自我描述重复给自己听。"}, {"heading": "一个例子", "text": "理解用例：你口头认为自己善于求助，却在遇到困难时总习惯先回避联系别人。用例展示可报告的自我看法与在关系中自动展开的行动可能不同。"}, {"heading": "理解边界", "text": "无意识或习惯化不意味着永远不能改变。也不能仅因一个行为与自评不同，就断言测到了真正且唯一的自我。"}], "markdown": "---\nid: \"personality-procedural-self\"\ntitle: \"程序性自我\"\nenglish: \"Procedural Self\"\nkind: \"概念\"\ndomain: \"personality\"\nsubdomain: \"自我知识\"\nsummary: \"程序性自我体现为习惯化的思考、感受和与人相处方式，未必能够直接说清。教材借这一概念区分我们知道自己怎样，与实际自动怎样行动。\"\naliases: []\nkeywords: [\"程序性自我\", \"习惯\", \"关系性自我\", \"隐含自我\", \"行为\", \"反馈\", \"练习\", \"意识\"]\nquestions: [\"为什么知道自己想怎样做仍可能维持旧习惯？\", \"程序性自我与能够报告的自我认识有什么不同？\"]\nsources: [{\"book\": \"personality\", \"chapter\": \"第15章 自我\", \"locator\": \"PDF 第 1199 页\", \"pdfPages\": [1199]}]\ncandidateRelated: [{\"concept\": \"陈述性自我\", \"reason\": \"作为自我知识的另一侧面\"}, {\"concept\": \"交互决定论\", \"reason\": \"习惯在行动与反馈中形成\"}]\n---\n\n## 核心解释\n\n程序性自我指深植于行动和经验中的自我运作方式，包括面对不同关系时习惯采取的反应。它们不总进入意识，却可以持续影响行为。教材讨论关系性自我与隐含自我，并指出此类习惯若要改变，通常需要实践和反馈，而不仅是把新的自我描述重复给自己听。\n\n## 一个例子\n\n理解用例：你口头认为自己善于求助，却在遇到困难时总习惯先回避联系别人。用例展示可报告的自
