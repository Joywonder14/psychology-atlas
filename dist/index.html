及原因、责任、应对可能和未来后果。教材既介绍以核心关系主题区分具体情绪的路径，也介绍以若干意义维度描述情绪相似性与转换的路径。评价未必总是缓慢、明确或有意识的思考。\n\n## 一个例子\n\n理解用例：同样是计划被取消，若认为朋友故意轻视自己，可能愤怒；若认为不可控的天气导致，可能失望；若担心关系破裂，则可能焦虑。\n\n## 理解边界\n\n评价不是事后随意给情绪找理由，也不是所有情绪都需要完整言语推理。不同评价理论在维度、顺序与情绪类别上并不完全一致。\n"}, {"id": "emotion-attachment", "title": "儿童依恋与安全基地", "english": "Childhood Attachment and Secure Base", "kind": "理论", "domain": "development", "subdomain": "关系与情绪发展", "summary": "依恋是儿童在威胁和不适时寻求照料者接近的安全系统；照料经验形成关系预期，可靠的安全基地又支持儿童探索环境。", "aliases": ["依恋理论", "Attachment Theory", "依恋与安全基地", "Attachment and Secure Base"], "keywords": ["依恋", "安全基地", "鲍尔比", "安斯沃思", "照料者", "陌生情境", "关系预期", "安全感", "Attachment and Secure Base"], "questions": ["为什么靠近熟悉的人有时反而让儿童更敢探索？", "依恋模式如何与情绪表达和调节相联系？"], "sources": [{"book": "emotions", "chapter": "第2章 情绪的进化", "locator": "第2章 · Emotions That Promote Attachment", "epubPath": "OPS/c02.xhtml#head-3-24"}, {"book": "emotions", "chapter": "第11章 情绪性的个体差异", "locator": "第11章 · What Is Attachment?", "epubPath": "OPS/c11.xhtml#head-3-149"}, {"book": "emotions", "chapter": "第11章 情绪性的个体差异", "locator": "第11章 · Attachment Status and Emotional Outcomes", "epubPath": "OPS/c11.xhtml#head-3-150"}, {"book": "general", "chapter": "第12章 · 社会发展", "locator": "PDF 第 980、984、985 页", "pdfPages": [980, 984, 985]}], "candidateRelated": [{"title": "儿童情绪调节的发展", "reason": "安全关系为外部调节向自我调节提供条件"}, {"title": "生物行为同步", "reason": "进一步解释亲子协调的过程"}, {"title": "成人依恋的焦虑与回避", "reason": "比较早期安全系统与成人关系中的连续差异"}, {"title": "心智理论", "reason": "发展中逐渐理解关系对象的心理状态"}, {"title": "教养方式", "reason": "儿童依恋与养育互动是相关但不同的研究问题"}], "sections": [{"heading": "核心解释", "text": "鲍尔比把依恋解释为保护脆弱幼儿的生物行为系统。危险、分离或不适激活接近照料者的行为，反复互动帮助儿童形成照料者是否可依靠的预期。安斯沃思通过陌生情境考察不同回应模式；安全基地既提供安慰，也让儿童有条件探索和参与更复杂的关系。"}, {"heading": "一个例子", "text": "理解用例：幼儿第一次进入陌生游戏室时先靠近熟悉照料者，确认其仍可回应后再去探索玩具，受惊时又返回寻求安慰。"}, {"heading": "理解边界", "text": "依恋模式描述关系中的组织方式，不能当作固定人格标签或据此推断一生命运。教材提醒，模式与养育行为的对应也随文化变化。"}], "markdown": "---\nid: \"emotion-attachment\"\ntitle: \"儿童依恋与安全基地\"\nenglish: \"Childhood Attachment and Secure Base\"\nkind: \"理论\"\ndomain: \"development\"\nsubdomain: \"关系与情绪发展\"\nsummary: \"依恋是儿童在威胁和不适时寻求照料者接近的安全系统；照料经验形成关系预期，可靠的安全基地又支持儿童探索环境。\"\naliases: [\"依恋理论\", \"Attachment Theory\", \"依恋与安全基地\", \"Attachment and Secure Base\"]\nkeywords: [\"依恋\", \"安全基地\", \"鲍尔比\", \"安斯沃思\", \"照料者\", \"陌生情境\", \"关系预期\", \"安全感\", \"Attachment and Secure Base\"]\nquestions: [\"为什么靠近熟悉的人有时反而让儿童更敢探索？\", \"依恋模式如何与情绪表达和调节相联系？\"]\nsources: [{\"book\": \"emotions\", \"chapter\": \"第2章 情绪的进化\", \"locator\": \"第2章 · Emotions That Promote Attachment\", \"epubPath\": \"OPS/c02.xhtml#head-3-24\"}, {\"book\": \"emotions\", \"chapter\": \"第11章 情绪性的个体差异\", \"locator\": \"第11章 · What Is Attachment?\", \"epubPath\": \"OPS/c11.xhtml#head-3-149\"}, {\"book\": \"emotions\", \"chapter\": \"第11章 情绪性的个体差异\", \"locator\": \"第11章 · Attachment Status and Emotional Outcomes\", \"epubPath\": \"OPS/c11.xhtml#head-3-150\"}, {\"book\": \"general\", \"chapter\": \"第12章 · 社会发展\", \"locator\": \"PDF 第 980、984、985 页\", \"pdfPages\": [980, 984, 985]}]\ncandidateRelated: [{\"title\": \"儿童情绪调节的发展\", \"reason\": \"安全关系为外部调节向自我调节提供条件\"}, {\"title\": \"生物行为同步\", \"reason\": \"进一步解释亲子协调的过程\"}, {\"title\": \"成人依恋的焦虑与回避\", \"reason\": \"比较早期安全系统与成人关系中的连续差异\"}, {\"title\": \"心智理论\", \"reason\": \"发展中逐渐理解关系对象的心理状态\"}, {\"title\": \"教养方式\", \"reason\": \"儿童依恋与养育互动是相关但不同的研究问题\"}]\n---\n\n## 核心解释\n\n鲍尔比把依恋解释为保护脆弱幼儿的生物行为系统。危险、分离或不适激活接近照料者的行为，反复互动帮助儿童形成照料者是否可依靠的预期。安斯沃思通过陌生情境考察不同回应模式；安全基地既提供安慰，也让儿童有条件探索和参与更复杂的关系。\n\n## 一个例子\n\n理解用例：幼儿第一次进入陌生游戏室时先靠近熟悉照料者，确认其仍可回应后再去探索玩具，受惊时又返回寻求安慰。\n\n## 理解边界\n\n依恋模式描述关系中的组织方式，不能当作固定人格标签或据此推断一生命运。教材提醒，模式与养育行为的对应也随文化变化。\n"}, {"id": "emotion-behavioral-ecology", "title": "情绪表达的行为生态观点", "english": "Behavioral Ecology of Emotional Expression", "kind": "理论", "domain": "emotion", "subdomain": "情绪沟通", "summary": "行为生态观点把情绪表达视为社会互动中的意图信号，关注表达者想做什么或希望别人做什么，并强调观察者借助情境推断意义。", "aliases": [], "keywords": ["行为生态", "情绪表达", "意图", "社会信号", "情境", "语用", "表情识别", "互动", "Fridlund", "Behavioral Ecology of Emotional Expression"], "questions": ["一个微笑一定表示内心快乐吗？", "我们看表情时是在识别感受，还是在推断意图？"], "sources": [{"book": "emotions", "chapter": "第4章 情绪的沟通", "locator": "第4章 · Inference and Context in Emotion Recognition", "epubPath": "OPS/c04.xhtml#head-3-47"}], "candidateRelated": [{"title": "情绪表达与地位协商", "reason": "表达能够协调社会关系与位置"}, {"title": "情绪表情的普遍性假说", "reason": "提供关于表情意义的不同研究侧重"}], "sections": [{"heading": "核心解释", "text": "弗里德伦德主张，表达的重要功能是标示互动将如何继续，而不只是泄露内心感受。教材进一步介绍情感语用观点：表达可以传递感受、事件信息、对他人行动的期待以及自己的计划。关系、身份、其他动作和观察者状态都参与意义推断，因此表达需要在互动情境中理解。"}, {"heading": "一个例子", "text": "理解用例：同样的微笑放在重逢、礼貌接待和紧张争执中，可能分别表达亲近、维持秩序或讽刺；理解者需要结合场景与后续行动。"}, {"heading": "理解边界", "text": "强调信号功能不表示表达都是有意识伪装，也不表示表情与体验毫无关系。它改变的是解释重点，不能代替对实际感受的测量。"}], "markdown": "---\nid: \"emotion-behavioral-ecology\"\ntitle: \"情绪表达的行为生态观点\"\nenglish: \"Behavioral Ecology of Emotional Expression\"\nkind: \"理论\"\ndomain: \"emotion\"\nsubdomain: \"情绪沟通\"\nsummary: \"行为生态观点把情绪表达视为社会互动中的意图信号，关注表达者想做什么或希望别人做什么，并强调观察者借助情境推断意义。\"\naliases: []\nkeywords: [\"行为生态\", \"情绪表达\", \"意图\", \"社会信号\", \"情境\", \"语用\", \"表情识别\", \"互动\", \"Fridlund\", \"Behavioral Ecology of Emotional Expression\"]\nquestions: [\"一个微笑一定表示内心快乐吗？\", \"我们看表情时是在识别感受，还是在推断意图？\"]\nsources: [{\"book\": \"emotions\", \"chapter\": \"第4章 情绪的沟通\", \"locator\": \"第4章 · Inference and Context in Emotion Recognition\", \"epubPath\": \"OPS/c04.xhtml#head-3-47\"}]\ncandidateRelated: [{\"title\": \"情绪表达与地位协商\", \"reason\": \"表达能够协调社会关系与位置\"}, {\"title\": \"情绪表情的普遍性假说\", \"reason\": \"提供关于表情意义的不同研究侧重\"}]\n---\n\n## 核心解释\n\n弗里德伦德主张，表达的重要功能是标示互动将如何继续，而不只是泄露内心感受。教材进一步介绍情感语用观点：表达可以传递感受、事件信息、对他人行动的期待以及自己的计划。关系、身份、其他动作和观察者状态都参与意义推断，因此表达需要在互动情境中理解。\n\n## 一个例子\n\n理解用例：同样的微笑放在重逢、礼貌接待和紧张争执中，可能分别表达亲近、维持秩序或讽刺；理解者需要结合场景与后续行动。\n\n## 理解边界\n\n强调信号功能不表示表达都是有意识伪装，也不表示表情与体验毫无关系。它改变的是解释重点，不能代替对实际感受的测量。\n"}, {"id": "emotion-biobehavioral-synchrony", "title": "生物行为同步", "english": "Biobehavioral Synchronization", "kind": "心理过程", "domain": "development", "subdomain": "关系与情绪发展", "summary": "亲子互动中的轮流回应可与情绪、生理节律及压力调节相协调；照料者的适时回应作为外部调节，参与儿童自我调节的发展。", "aliases": [], "keywords": ["生物行为同步", "亲子同步", "轮流回应", "情绪协调", "心律", "外部调节", "自我调节", "照料", "Feldman", "Biobehavioral Synchronization"], "questions": ["亲子之间的互动节奏为什么与情绪发展有关？", "他人的回应怎样逐渐支持儿童自己的调节能力？"], "sources": [{"book": "emotions", "chapter": "第11章 情绪性的个体差异", "locator": "第11章 · Biobehavioral Synchronization", "epubPath": "OPS/c11.xhtml#head-3-155"}], "candidateRelated": [{"title": "儿童依恋与安全基地", "reason": "稳定回应支持安全关系"}, {"title": "情绪模仿与人际趋同", "reason": "都是互动协调，但同步涉及更广的调节层面"}], "sections": [{"heading": "核心解释", "text": "教材在行为上的相互回应之外，进一步关注生理层面的协调。亲子在目光、声音和行动中形成轮流互动时，情绪同步可以伴随心律等反应以及压力调节系统的协调。照料者根据儿童信号作出恰当回应，提供一种外部调节经验，随着发展帮助儿童建立更自主的调节方式。"}, {"heading": "一个例子", "text": "理解用例：婴儿发声后照料者回应，婴儿暂时停下再发声，双方逐渐形成可预测节奏；安抚与兴奋程度也随着这种来回互动变化。"}, {"heading": "理解边界", "text": "同步不是要求双方时时完全相同，也不能凭短时生理相关断定关系质量。它涉及互动中的协调，需结合情境和发展过程理解。"}], "markdown": "---\nid: \"emotion-biobehavioral-synchrony\"\ntitle: \"生物行为同步\"\nenglish: \"Biobehavioral Synchronization\"\nkind: \"心理过程\"\ndomain: \"development\"\nsubdomain: \"关系与情绪发展\"\nsummary: \"亲子互动中的轮流回应可与情绪、生理节律及压力调节相协调；照料者的适时回应作为外部调节，参与儿童自我调节的发展。\"\naliases: []\nkeywords: [\"生物行为同步\", \"亲子同步\", \"轮流回应\", \"情绪协调\", \"心律\", \"外部调节\", \"自我调节\", \"照料\", \"Feldman\", \"Biobehavioral Synchronization\"]\nquestions: [\"亲子之间的互动节奏为什么与情绪发展有关？\", \"他人的回应怎样逐渐支持儿童自己的调节能力？\"]\nsources: [{\"book\": \"emotions\", \"chapter\": \"第11章 情绪性的个体差异\", \"locator\": \"第11章 · Biobehavioral Synchronization\", \"epubPath\": \"OPS/c11.xhtml#head-3-155\"}]\ncandidateRelated: [{\"title\": \"儿童依恋与安全基地\", \"reason\": \"稳定回应支持安全关系\"}, {\"title\": \"情绪模仿与人际趋同\", \"reason\": \"都是互动协调，但同步涉及更广的调节层面\"}]\n---\n\n## 核心解释\n\n教材在行为上的相互回应之外，进一步关注生理层面的协调。亲子在目光、声音和行动中形成轮流互动时，情绪同步可以伴随心律等反应以及压力调节系统的协调。照料者根据儿童信号作出恰当回应，提供一种外部调节经验，随着发展帮助儿童建立更自主的调节方式。\n\n## 一个例子\n\n理解用例：婴儿发声后照料者回应，婴儿暂时停下再发声，双方逐渐形成可预测节奏；安抚与兴奋程度也随着这种来回互动变化。\n\n## 理解边界\n\n同步不是要求双方时时完全相同，也不能凭短时生理相关断定关系质量。它涉及互动中的协调，需结合情境和发展过程理解。\n"}, {"id": "emotion-brain-patterns", "title": "情绪脑活动的分布模式", "english": "Distributed Patterns of 第7章 脑机制与情绪\", \"locator\": \"第7章 · Distinct Emotions Are Constructed in the Cortex\", \"epubPath\": \"OPS/c07.xhtml#head-3-100\"}, {\"book\": \"emotions\", \"chapter\": \"第7章 脑机制与情绪\", \"locator\": \"第7章 · Emotions Engage Discrete Patterns of Brain Activation\", \"epubPath\": \"OPS/c07.xhtml#head-3-101\"}]\ncandidateRelated: [{\"title\": \"离散情绪观点\", \"reason\": \"活动模式差异可用于检验类别区分\"}, {\"title\": \"情绪建构观点\", \"reason\": \"网络组合也可从概念化与基本过程解释\"}]\n---\n\n## 核心解释\n\n教材总结的成像研究从单个区域走向连接网络与分布模式：情绪唤起涉及皮层和皮层下多处结构，评价、身体感觉、概念化及调节也有相关网络。较细的空间分析和统计分类可发现不同情绪的活动差别，同时建构观点仍可强调一般过程的组合，两种解释需进一步比较。\n\n## 一个例子\n\n理解用例：两段影片分别引发愉悦和满足，研究者比较整个脑活动分布能否区分两类体验，而不是只寻找一个专门负责满足的点。\n\n## 理解边界\n\n区分模式的成功受到材料、样本和分析方法限制，也不等于在任何人任何情境中读懂感受。相关成像不能单独确立机制因果。\n"}, {"id": "emotion-categories-dimensions", "title": "心理病理的类别与维度", "english": "Categorical and Dimensional Psychopathology", "kind": "模型", "domain": "clinical", "subdomain": "心理病理的理解", "summary": "类别模型通过诊断边界组织问题，维度模型考察症状程度的连续变化；共病、同类诊断的差异及阈下困难推动两种方式的比较。", "aliases": [], "keywords": ["心理病理", "类别模型", "维度模型", "症状连续性", "共病", "异质性", "分类", "测量", "儿童", "Categorical and Dimensional Psychopathology"], "questions": ["心理困难应被看作有或没有，还是程度不同？", "为什么同一个诊断名称下面可能有不同的表现？"], "sources": [{"book": "emotions", "chapter": "第12章 儿童情绪的心理病理", "locator": "第12章 · Conceptualizing Childhood Disorders: Categories versus Dimensions", "epubPath": "OPS/c12.xhtml#head-3-163"}], "candidateRelated": [{"title": "一般心理病理因素", "reason": "共病推动寻找诊断间的共同结构"}, {"title": "情绪问题的同型与异型连续性", "reason": "发展中的症状变化挑战固定分类"}], "sections": [{"heading": "核心解释", "text": "教材以儿童问题说明分类的取舍。类别便于交流、服务规划和形成共同描述，但不同诊断常有重叠，同一诊断内部也可能差异很大。维度取向则用连续分数描述情绪或行为倾向，可以保留未达类别阈值的变化。二者回答的问题不同，可用于比较而非简单互相替代。"}, {"heading": "一个例子", "text": "理解用例：两名儿童都未达到某一分类门槛，但其困难程度和日常影响可能明显不同；连续指标可以保留这些差异，类别标签则更便于沟通。"}, {"heading": "理解边界", "text": "本卡解释分类思路，不提供诊断标准或自我筛查。维度分数较高不自动等于某种障碍，实际解释还须考虑发展、情境及功能影响。"}], "markdown": "---\nid: \"emotion-categories-dimensions\"\ntitle: \"心理病理的类别与维度\"\nenglish: \"Categorical and Dimensional Psychopathology\"\nkind: \ ，将其理解为“我什么都做不好”，与理解为“这一部分需要改进”，会为同一事件赋予不同范围和持续性的意义。"}, {"heading": "理解边界", "text": "不能据此声称所有困难都源于错误想法，也不能忽视实际环境与关系压力。本卡只介绍理论逻辑，不构成针对个人的治疗方案。"}], "markdown": "---\nid: \"emotion-cognitive-behavioral\"\ntitle: \"认知行为取向的情绪解释\"\nenglish: \"Cognitive–Behavioral Account of Emotional Difficulties\"\nkind: \"理论\"\ndomain: \"clinical\"\nsubdomain: \"情绪与心理治疗理论\"\nsummary: \"认知行为取向考察对事件的解释、核心信念与行动计划怎样参与情绪循环；教材借此说明，改变理解方式可能改变事件的情绪意义。\"\naliases: [\"认知行为理论\", \"CBT情绪模型\"]\nkeywords: [\"认知行为\", \"Beck\", \"贝克\", \"自动思维\", \"核心信念\", \"评价\", \"情绪循环\", \"归因\", \"CBT\", \"Cognitive–Behavioral Account of Emotional Difficulties\"]\nquestions: [\"同样的挫折为什么会引出持续而不同的情绪反应？\", \"认知行为取向怎样连接思想、感受与行动？\"]\nsources: [{\"book\": \"emotions\", \"chapter\": \"第14章 有意义的生活\", \"locator\": \"第14章 · Cognitive-Behavioral Therapy: Changing Emotional Life by Thought\", \"epubPath\": \"OPS/c14.xhtml#head-3-201\"}]\ncandidateRelated: [{\"title\": \"情绪评价理论\", \"reason\": \"事件的解释连接关切与情绪\"}, {\"title\": \"反刍与情绪延续\", \"reason\": \"认知与情绪相互强化是共同关注的循环\"}]\n---\n\n## 核心解释\n\n教材介绍贝克的认知行为取向：持续困难可能涉及过度绝对、个人化或概括化的评价，评价引发情绪，情绪又使同类思想更容易出现。其理论重点是让事件、思想、感受和行动之间的关系变得可观察，并考察不同解释如何影响体验及计划，而不是把情绪看作意志薄弱。\n\n## 一个例子\n\n理解用例：一次报告被修改后，将其理解为“我什么都做不好”，与理解为“这一部分需要改进”，会为同一事件赋予不同范围和持续性的意义。\n\n## 理解边界\n\n不能据此声称所有困难都源于错误想法，也不能忽视实际环境与关系压力。本卡只介绍理论逻辑，不构成针对个人的治疗方案。\n"}, {"id": "emotion-cognitive-biases", "title": "焦虑、抑郁与认知偏向", "english": "Cognitive biases in anxiety and depression", "kind": "概念", "domain": "emotion", "subdomain": "情绪与注意", "summary": "情绪状态与注意、解释和记忆的选择相互影响。威胁线索或消极内容的优先加工可能帮助维持不良情绪，但不同偏向并不完全相同。", "aliases": ["Cognitive biases in anxiety and depression"], "keywords": ["焦虑、抑郁与认知偏向", "Cognitive biases in anxiety and depression", "情绪与注意", "焦虑", "抑郁", "威胁", "消极", "注意偏向", "解释偏向"], "questions": ["焦虑、抑郁与认知偏向解释了什么心理现象？", "焦虑、抑郁与认知偏向在什么条件下适用，有什么局限？"], "sources": [{"book": "cognitive", "chapter": "第15章 · 认知与情绪", "locator": "PDF 第 793–793 页", "pdfPages": [793]}], "candidateRelated": [{"title": "注意负荷理论", "reason": "控制资源影响信息选择"}, {"title": "心境一致性与心境依赖记忆", "reason": "情绪与记忆内容存在相互关系"}], "sections": [{"heading": "核心解释", "text": "教材区分注意偏向、解释偏向以及显性和隐性记忆偏向。焦虑更常联系对未来威胁的注意，抑郁相关研究更突出消极记忆；两者也可能伴随抑制和转换方面的控制困难。多个偏向会相互影响，因此情绪与认知的关系不能只用单向原因概括。"}, {"heading": "一个例子", "text": "理解用例：处在担忧状态的人看到一条含糊回复，可能更快注意到其中像拒绝的部分，并倾向于将其解释为坏消息，而忽略其他可能含义。"}, {"heading": "理解边界", "text": "这些是群体研究中的倾向，不能凭一次消极解释判断个体是否患病。关联也不足以确定因果方向，具体偏向需用相应任务测量。"}], "markdown": "---\nid: \"emotion-cognitive-biases\"\ntitle: \"焦虑、抑郁与认知偏向\"\nenglish: \"Cognitive biases in anxiety and depression\"\nkind: \"概念\"\ndomain: \"emotion\"\nsubdomain: \"情绪与注意\"\nsummary: \"情绪状态与注意、解释和记忆的选择相互影响。威胁线索或消极内容的优先加工可能帮助维持不良情绪，但不同偏向并不完全相同。\"\naliases: [\"Cognitive biases in anxiety and depression\"]\nkeywords: [\"焦虑、抑郁与认知偏向\", \"Cognitive biases in anxiety and depression\", \"情绪与注意\", \"焦虑\", \"抑郁\", \"威胁\", \"消极\", \"注意偏向\", \"解释偏向\"]\nquestions: [\"焦虑、抑郁与认知偏向解释了什么心理现象？\", \"焦虑、抑郁与认知偏向在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"cognitive\", \"chapter\": \"第15章 · 认知与情绪\", \"locator\": \"PDF 第 793–793 页\", \"pdfPages\": [793]}]\ncandidateRelated: [{\"title\": \"注意负荷理论\", \"reason\": \"控制资源影响信息选择\"}, {\"title\": \"心境一致性与心境依赖记忆\", \"reason\": \"情绪与记忆内容存在相互关系\"}]\n---\n\n## 核心解释\n\n教材区分注意偏向、解释偏向以及显性和隐性记忆偏向。焦虑更常联系对未来威胁的注意，抑郁相关研究更突出消极记忆；两者也可能伴随抑制和转换方面的控制困难。多个偏向会相互影响，因此情绪与认知的关系不能只用单向原因概括。\n\n## 一个例子\n\n理解用例：处在担忧状态的人看到一条含糊回复，可能更快注意到其中像拒绝的部分，并倾向于将其解释为坏消息，而忽略其他可能含义。\n\n## 理解边界\n\n这些是群体研究中的倾向，不能凭一次消极解释判断个体是否患病。关联也不足以确定因果方向，具体偏向需用相应任务测量。\n"}, {"id": "emotion-constructed-emotion", "title": "情绪建构观点", "english": "Constructivist Accounts of Emotion", "kind": "理论", "domain": "emotion", "subdomain": "情绪的结构", "summary": "建构观点认为具体情绪由身体与情境中的核心情感、概念和经验共同形成，情绪词不只是标签，也参与组织人怎样感受和理解。", "aliases": ["建构主义情绪观"], "keywords": ["情绪建构", "核心情感", "效价", "唤醒", "概念化", "语言", "文化", "巴雷特", "Russell", "Constructivist Accounts of Emotion"], "questions": ["先有完整的情绪，还是概念也参与塑造情绪？", "相似的身体唤醒为何会被体验为不同情绪？"], "sources": [{"book": "emotions", "chapter": "第6章 评价、体验与调节", "locator": "第6章 · The Perspective That Emotions Are Constructed", "epubPath": "OPS/c06.xhtml#head-3-84"}, {"book": "emotions", "chapter": "第7章 脑机制与情绪", "locator": "第7章 · Distinct Emotions Are Constructed in the Cortex", "epubPath": "OPS/c07.xhtml#head-3-100"}], "candidateRelated": [{"title": "离散情绪观点", "reason": "对具体情绪来源的不同理论路线"}, {"title": "内感受", "reason": "身体信号为情绪体验提供材料"}], "sections": [{"heading": "核心解释", "text": "教材所述建构取向强调情绪类别内部的变异，以及表达与主观体验并非总能严密对应。它以愉快—不愉快和激活程度等核心情感为基础，加入当下情境、过往经验和语言概念，形成具体情绪。概念化因此参与体验本身，而不只是把一个已经完成的内在状态说出来。"}, {"heading": "一个例子", "text": "理解用例：在身体激动、心跳加快时，人根据当前是在等待重逢还是面临质询，结合既有概念，将体验理解为期待或焦虑。"}, {"heading": "理解边界", "text": "建构不等于随意编造或情绪不真实，也不是仅靠选择一个词就能改变全部体验。教材并列讨论离散观点，并未消除两者间的争论。"}], "markdown": "---\nid: \"emotion-constructed-emotion\"\ntitle: \"情绪建构观点\"\nenglish: \"Constructivist Accounts of Emotion\"\nkind: \"理论\"\ndomain: \"emotion\"\nsubdomain: \"情绪的结构\"\nsummary: \"建构观点认为具体情绪由身体与情境中的核心情感、概念和经验共同形成，情绪词不只是标签，也参与组织人怎样感受和理解。\"\naliases: [\"建构主义情绪观\"]\nkeywords: [\"情绪建构\", \"核心情感\", \"效价\", \"唤醒\", \"概念化\", \"语言\", \"文化\", \"巴雷特\", \"Russell\", \"Constructivist Accounts of Emotion\"]\nquestions: [\"先有完整的情绪，还是概念也参与塑造情绪？\", \"相似的身体唤醒为何会被体验为不同情绪？\"]\nsources: [{\"book\": \"emotions\", \"chapter\": \"第6章 评价、体验与调节\", \"locator\": \"第6章 · The Perspective That Emotions Are Constructed\", \"epubPath\": \"OPS/c06.xhtml#head-3-84\"}, {\"book\": \"emotions\", \"chapter\": \"第7章 脑机制与情绪\", \"locator\": \"第7章 · Distinct Emotions Are Constructed in the Cortex\", \"epubPath\": \"OPS/c07.xhtml#head-3-100\"}]\ncandidateRelated: [{\"title\": \"离散情绪观点\", \"reason\": \"对具体情绪来源的不同理论路线\"}, {\"title\": \"内感受\", \"reason\": \"身体信号为情绪体验提供材料\"}]\n---\n\n## 核心解释\n\n教材所述建构取向强调情绪类别内部的变异，以及表达与主观体验并非总能严密对应。它以愉快—不愉快和激活程度等核心情感为基础，加入当下情境、过往经验和语言概念，形成具体情绪。概念化因此参与体验本身，而不只是把一个已经完成的内在状态说出来。\n\n## 一个例子\n\n理解用例：在身体激动、心跳加快时，人根据当前是在等待重逢还是面临质询，结合既有概念，将体验理解为期待或焦虑。\n\n## 理解边界\n\n建构不等于随意编造或情绪不真实，也不是仅靠选择一个词就能改变全部体验。教材并列讨论离散观点，并未消除两者间的争论。\n"}, {"id": "emotion-cumulative-risk", "title": "累积风险与韧性", "english": "Cumulative Risk and Resilience", "kind": "模型", "domain": "clinical", "subdomain": "发展与风险", "summary": "儿童逆境常同时出现，多个风险的聚集可能增加困难；韧性研究则关注保护性条件与适应过程，避免把单一逆境看作必然结局。", "aliases": [], "keywords": ["累积风险", "韧性", "保护因素", "儿童逆境", "风险聚集", "压力", "发展", "多重风险", "Rutter", "Cumulative Risk and Resilience"], "questions": ["为什么只研究一个风险因素可能低估儿童处境？", "相似逆境下为什么会出现不同发展结果？"], "sources": [{"book": "emotions", "chapter": "第12章 儿童情绪的心理病理", "locator": "第12章 · Risk and Resilience: The Combination of Risk and Protective Factors", "epubPath": "OPS/c12.xhtml#head-3-169"}], "candidateRelated": [{"title": "人与环境的交互发展", "reason": "说明风险如何通过日常互动发挥作用"}, {"title": "差别易感性理论", "reason": "同样的环境风险对不同个体可能有不同影响"}], "sections": [{"heading": "核心解释", "text": "教材以鲁特的风险与韧性思路说明，贫困、家庭冲突和其他逆境并不独立发生，常在同一个儿童的生活中聚集。风险累加指标把这种共同暴露纳入描述，帮助理解为何困难也可能成组出现。与此同时，保护条件与个人资源使结果存在差异，风险表示概率而非命运。"}, {"heading": "一个例子", "text": "理解用例：频繁搬家如果同时伴随收入不稳和家庭冲突，儿童面对的负担就不只是换学校；稳定支持关系可能使同类处境中的结果不同。"}, {"heading": "理解边界", "text": "简单计数会忽略风险的强度、时长和具体组合。韧性也不等于永不受影响或个人必须独自克服环境问题，需结合适应领域理解。"}], "markdown": "---\nid: \"emotion-cumulative-risk\"\ntitle: \"累积风险与韧性\"\nenglish: \"Cumulative Risk and Resilience\"\nkind: \"模型\"\ndomain: \"clinical\"\nsubdomain: \"发展与风险\"\nsummary: \"儿童逆境常同时出现，多个风险的聚集可能增加困难；韧性研究则关注保护性条件与适应过程，避免把单一逆境看作必然结局。\"\naliases: []\nkeywords: [\"累积风险\", \"韧性\", \"保护因素\", \"儿童逆境\", \"风险聚集\", \"压力\", \"发展\", \"多重风险\", \"Rutter\", \"Cumulative Risk and Resilience\"]\nquestions: [\"为什么只研究一个风险因素可能低估儿童处境？\", \"相似逆境下为什么会出现不同发展结果？\"]\nsources: [{\"book\": \"emotions\", \"chapter\": \"第12章 儿童情绪的心理病理\", \"locator\": \"第12章 · Risk and Resilience: The Combination of Risk and Protective Factors\", \"epubPath\": \"OPS/c12.xhtml#head-3-169\"}]\ncandidateRelated: [{\"title\": \"人与环境的交互发展\", \"reason\": \"说明风险如何通过日常互动发挥作用\"}, {\"title\": \"差别易感性理论\", \"reason\": \"同样的环境风险对不同个体可能有不同影响\"}]\n---\n\n## 核心解释\n\n教材以鲁特的风险与韧性思路说明，贫困、家庭冲突和其他逆境并不独立发生，常在同一个儿童的生活中聚集。风险累加指标把这种共同暴露纳入描述，帮助理解为何困难也可能成组出现。与此同时，保护条件与个人资源使结果存在差异，风险表示概率而非命运。\n\n## 一个例子\n\n理解用例：频繁搬家如果同时伴随收入不稳和家庭冲突，儿童面对的负担就不只是换学校；稳定支持关系可能使同类处境中的结果不同。\n\n## 理解边界\n\n简单计数会忽略风险的强度、时长和具体组合。韧性也不等于永不受影响或个人必须独自克服环境问题，需结合适应领域理解。\n"}, {"id": "emotion-developmental-continuity", "title": "情绪问题的同型与异型连续性", "english": "Homotypic and Heterotypic Continuity", "kind": "概念", "domain": "clinical", "subdomain": "发展轨迹", "summary": "同型连续性指相似症状随时间延续，异型连续性指早期一种困难预测后来另一种困难；区分它们可避免只按诊断标签理解发展。", "aliases": [], "keywords": ["同型连续性", "异型连续性", "发展轨迹", "症状变化", "内化", "外化", "跨诊断", "纵向研究", "连续性", "Homotypic and Heterotypic Continuity"], "questions": ["儿童期一种困难为何可能在后来以另一种形式出现？", "症状名称变了是否就说明原来的易感性消失了？"], "sources": [{"book": "emotions", "chapter": "第12章 儿童情绪的心理病理", "locator": "第12章 · Homotypic and Heterotypic Continuity", "epubPath": "OPS/c12.xhtml#head-3-174"}], "candidateRelated": [{"title": "一般心理病理因素", "reason": "共有因素可能解释部分异型连续性"}, {"title": "人与环境的交互发展", "reason": "反馈循环为症状延续和转变提供过程解释"}], "sections": [{"heading": "核心解释", "text": "教材区分同类困难的持续与跨类别困难的转变。例如，早期攻击问题可能预测后期攻击，也可能通过同伴排斥等过程与后来低落相连。共同易感性、问题之间的连锁影响及环境反馈都可能参与解释；一般心理病理因素则提供了理解跨症状关联的另一种层级思路。"}, {"heading": "一个例子", "text": "理解用例：长期冲突既可能使一个人的攻击行为延续，也可能因关系受损而出现后来的退缩或低落；表面症状不同，发展链条仍可能相关。"}, {"heading": "理解边界", "text": "预测关联不表示每个儿童都沿同一路径发展，也不能仅凭先后顺序确定因果。年龄、测量方式和共同风险都会影响观察到的连续性。"}], "markdown": "---\nid: \"emotion-developmental-continuity\"\ntitle: \"情绪问题的同型与异型连续性\"\nenglish: \"Homotypic and Heterotypic Continuity\"\nkind: \"概念\"\ndomain: \"clinical\"\nsubdomain: \"发展轨迹\"\nsummary: \"同型连续性指相似症状随时间延续，异型连续性指早期一种困难预测后来另一种困难；区分它们可避免只按诊断标签理解发展。\"\naliases: []\nkeywords: [\"同型连续性\", \"异型连续性\", \"发展轨迹\", \"症状变化\", \"内化\", \"外化\", \"跨诊断\", \"纵向研究\", \"连续性\", \"Homotypic and Heterotypic Continuity\"]\nquestions: [\"儿童期一种困难为何可能在后来以另一种形式出现？\", \"症状名称变了是否就说明原来的易感性消失了？\"]\nsources: [{\"book\": \"emotions\", \"chapter\": \"第12章 儿童情绪的心理病理\", \"locator\": \"第12章 · Homotypic and Heterotypic Continuity\", \"epubPath\": \"OPS/c12.xhtml#head-3-174\"}]\ncandidateRelated: [{\"title\": \"一般心理病理因素\", \"reason\": \"共有因素可能解释部分异型连续性\"}, {\"title\": \"人与环境的交互发展\", \"reason\": \"反馈循环为症状延续和转变提供过程解释\"}]\n---\n\n## 核心解释\n\n教材区分同类困难的持续与跨类别困难的转变。例如，早期攻击问题可能预测后期攻击，也可能通过同伴排斥等过程与后来低落相连。共同易感性、问题之间的连锁影响及环境反馈都可能参与解释；一般心理病理因素则提供了理解跨症状关联的另一种层级思路。\n\n## 一个例子\n\n理解用例：长期冲突既可能使一个人的攻击行为延续，也可能因关系受损而出现后来的退缩或低落；表面症状不同，发展链条仍可能相关。\n\n## 理解边界\n\n预测关联不表示每个儿童都沿同一路径发展，也不能仅凭先后顺序确定因果。年龄、测量方式和共同风险都会影响观察到的连续性。\n"}, {"id": "emotion-dialectical-complexity", "title": "辩证思维与情绪复杂性", "english": "Dialectical Thinking and Emotional Complexity", "kind": "理论", "domain": "emotion", "subdomain": "文化与情绪", "summary": "辩证思维允许相反意义并存，并重视变化与情境，因此可能使人更容易体验和承认悲喜交加、爱恨并存等混合情绪。", "aliases": [], "keywords": ["辩证思维", "情绪复杂性", "混合情绪", "矛盾", "情境", "文化", "整体思维", "悲喜交加", "Dialectical Thinking and Emotional Complexity"], "questions": ["快乐与悲伤可以在同一时刻存在吗？", "接受矛盾的思维方式如何影响情绪体验？"], "sources": [{"book": "emotions", "chapter": "第3章 情绪的文化理解", "locator": "第3章 · Knowledge Structures", "epubPath": "OPS/c03.xhtml#head-3-34"}, {"book": "emotions", "chapter": "第6章 评价、体验与调节", "locator": "第6章 · Comparing Perspectives", "epubPath": "OPS/c06.xhtml#head-3-85"}], "candidateRelated": [{"title": "情绪建构观点", "reason": "概念和情境有助于理解多种意义"}, {"title": "情绪调节过程模型", "reason": "混合情绪允许人选择关注其中不同部分"}], "sections": [{"heading": "核心解释", "text": "教材介绍一种文化知识结构：世界持续变化，事件处在相互关联的情境中，表面相反的判断也可能同时成立。若人允许一个事件拥有多种意义，就更可能承认看似相反的情绪并存。这一观点把情绪复杂性与理解世界的方式相连，而不只把它视为情绪强弱的差异。"}, {"heading": "一个例子", "text": "理解用例：毕业时既为取得学位高兴，又因离开朋友而难过；把两个感受都视为同一事件的不同侧面，就不必强行选出唯一的真实情绪。"}, {"heading": "理解边界", "text": "教材把这一联系作为理论预期与文化研究问题，不意味着某一文化中的人必然更复杂，也不能将混合情绪自动视为矛盾或失调。"}], "markdown": "---\nid: \"emotion-dialectical-complexity\"\ntitle: \"辩证思维与情绪复杂性\"\nenglish: \"Dialectical Thinking and Emotional Complexity\"\nkind: \"理论\"\ndomain: \"emotion\"\nsubdomain: \"文化与情绪\"\nsummary: \"辩证思维允许相反意义并存，并重视变化与情境，因此可能使人更容易体验和承认悲喜交加、爱恨并存等混合情绪。\"\naliases: []\nkeywords: [\"辩证思维\", \"情绪复杂性\", \"混合情绪\", \"矛盾\", \"情境\", \"文化\", \"整体思维\", \"悲喜交加\", \"Dialectical Thinking and Emotional Complexity\"]\nquestions: [\"快乐与悲伤可以在同一时刻存在吗？\", \"接受矛盾的思维方式如何影响情绪体验？\"]\nsources: [{\"book\": \"emotions\", \"chapter\": \"第3章 情绪的文化理解\", \"locator\": \"第3章 · Knowledge Structures\", \"epubPath\": \"OPS/c03.xhtml#head-3-34\"}, {\"book\": \"emotions\", \"chapter\": \"第6章 评价、体验与调节\", \"locator\": \"第6章 · Comparing Perspectives\", \"epubPath\": \"OPS/c06.xhtml#head-3-85\"}]\ncandidateRelated: [{\"title\": \"情绪建构观点\", \"reason\": \"概念和情境有助于理解多种意义\"}, {\"title\": \"情绪调节过程模型\", \"reason\": \"混合情绪允许人选择关注其中不同部分\"}]\n---\n\n## 核心解释\n\n教材介绍一种文化知识结构：世界持续变化，事件处在相互关联的情境中，表面相反的判断也可能同时成立。若人允许一个事件拥有多种意义，就更可能承认看似相反的情绪并存。这一观点把情绪复杂性与理解世界的方式相连，而不只把它视为情绪强弱的差异。\n\n## 一个例子\n\n理解用例：毕业时既为取得学位高兴，又因离开朋友而难过；把两个感受都视为同一事件的不同侧面，就不必强行选出唯一的真实情绪。\n\n## 理解边界\n\n教材把这一联系作为理论预期与文化研究问题，不意味着某一文化中的人必然更复杂，也不能将混合情绪自动视为矛盾或失调。\n"}, {"id": "emotion-diathesis-stress", "title": "易感性—压力模型", "english": "Diathesis–Stress Model", "kind": "模型", "domain": "clinical", "subdomain": "情绪障碍的解释", "summary": "易感性—压力模型把个体原有的脆弱倾向与生活压力结合起来解释情绪障碍的发生，强调相同事件对不同人的意义及后果可能不同。", "aliases": ["素质—压力模型", "脆弱性—应激模型"], "keywords": ["易感性", "压力", "素质压力模型", "遗传", "生活事件", "脆弱性", "情绪障碍", "环境", "diathesis", "Diathesis–Stress Model"], "questions": ["为什么相似压力事件并不会使每个人产生相同困难？", "个人倾向与生活经历如何共同进入解释？"], "sources": [{"book": "emotions", "chapter": "第13章 成年期的情绪障碍", "locator": "第13章 · How Disorders Are Caused", "epubPath": "OPS/c13.xhtml#head-2-132"}, {"book": "emotions", "chapter": "第13章 成年期的情绪障碍", "locator": "第13章 · Gene–Environment Interactions", "epubPath": "OPS/c13.xhtml#head-2-133"}, {"book": "emotions", "chapter": "第13章 成年期的情绪障碍", "locator": "第13章 · Life Events and Difficulties", "epubPath": "OPS/c13.xhtml#head-3-181"}], "candidateRelated": [{"title": "差别易感性理论", "reason": "进一步比较在良好环境下是否获得更多益处"}, {"title": "HPA轴与应激反应", "reason": "压力的身体通路是其中一个相关层面"}], "sections": [{"heading": "核心解释", "text": "教材用这一模型整合内在易感条件和外部压力：遗传、既往经验及情绪倾向可影响一个人的脆弱性，重大损失、威胁或长期困境则可能触发困难。对事件的理解与所重视的生活角色也很关键。模型鼓励同时研究个体与环境，避免把原因只归于意志或单一经历。"}, {"heading": "一个例子", "text": "理解用例：同样失去一项机会，对高度依赖该角色获得意义、又缺少支持的人可能影响更大；事件与此前资源、倾向和处境需共同理解。"}, {"heading": "理解边界", "text": "这是一般解释框架，不能据此对个人作出诊断或计算必然风险。易感性与压力有时也会相互影响，而非完全独立的两项输入。"}], "markdown": "---\nid: \"emotion-diathesis-stress\"\ntitle: \"易感性—压力模型\"\nenglish: \"Diathesis–Stress Model\"\nkind: \"模型\"\ndomain: \"clinical\"\nsubdomain: \"情绪障碍的解释\"\nsummary: \"易感性—压力模型把个体原有的脆弱倾向与生活压力结合起来解释情绪障碍的发生，强调相同事件对不同人的意义及后果可能不同。\"\naliases: [\"素质—压力模型\", \"脆弱性—应激模型\"]\nkeywords: [\"易感性\", \"压力\", \"素质压力模型\", \"遗传\", \"生活事件\", \"脆弱性\", \"情绪障碍\", \"环境\", \"diathesis\", \"Diathesis–Stress Model\"]\nquestions: [\"为什么相似压力事件并不会使每个人产生相同困难？\", \"个人倾向与生活经历如何共同进入解释？\"]\nsources: [{\"book\": \"emotions\", \"chapter\": \"第13章 成年期的情绪障碍\", \"locator\": \"第13章 · How Disorders Are Caused\", \"epubPath\": \"OPS/c13.xhtml#head-2-132\"}, {\"book\": \"emotions\", \"chapter\": \"第13章 成年期的情绪障碍\", \"locator\": \"第13章 · Gene–Environment Interactions\", \"epubPath\": \"OPS/c13.xhtml#head-2-133\"}, {\"book\": \"emotions\", \"chapter\": \"第13章 成年期的情绪障碍\", \"locator\": \"第13章 · Life Events and Difficulties\", \"epubPath\": \"OPS/c13.xhtml#head-3-181\"}]\ncandidateRelated: [{\"title\": \"差别易感性理论\", \"reason\": \"进一步比较在良好环境下是否获得更多益处\"}, {\"title\": \"HPA轴与应激反应\", \"reason\": \"压力的身体通路是其中一个相关层面\"}]\n---\n\n## 核心解释\n\n教材用这一模型整合内在易感条件和外部压力：遗传、既往经验及情绪倾向可影响一个人的脆弱性，重大损失、威胁或长期困境则可能触发困难。对事件的理解与所重视的生活角色也很关键。模型鼓励同时研究个体与环境，避免把原因只归于意志或单一经历。\n\n## 一个例子\n\n理解用例：同样失去一项机会，对高度依赖该角色获得意义、又缺少支持的人可能影响更大；事件与此前资源、倾向和处境需共同理解。\n\n## 理解边界\n\n这是一般解释框架，不能据此对个人作出诊断或计算必然风险。易感性与压力有时也会相互影响，而非完全独立的两项输入。\n"}, {"id": "emotion-differential-susceptibility", "title": "差别易感性理论", "english": "Differential Susceptibility Theory", "kind": "理论", "domain": "development", "subdomain": "个体与环境", "summary": "对环境更敏感的人可能在不利环境中受损更多，也可能在支持性环境中获益更多；差别易感性因而不只描述单向的脆弱。", "aliases": [], "keywords": ["差别易感性", "环境敏感性", "气质", "兰花", "蒲公英", "教养", "环境风险", "反应性", "发展", "Differential Susceptibility Theory"], "questions": ["更敏感的儿童是否只能被视为更脆弱？", "为什么同一种养育环境对不同儿童的影响不一样？"], "sources": [{"book": "emotions", "chapter": "第11章 情绪性的个体差异", "locator": "第11章 · Emotionality Moderates Environmental Risk", "epubPath": "OPS/c11.xhtml#head-3-148"}], "candidateRelated": [{"title": "气质与情绪偏向", "reason": "气质是环境反应差异的一个来源"}, {"title": "易感性—压力模型", "reason": "差别易感性进一步考察良好环境中的额外收益"}], "sections": [{"heading": "核心解释", "text": "教材以兰花和蒲公英比喻不同的环境反应性。有些儿童对消极照料更容易出现困难，但在支持、较少强制的环境中也可能表现得更好。理论的重要之处在于同时考察环境两端，而非只问谁在压力下更差；情绪与生理反应性可以成为个体差异的相关线索。"}, {"heading": "一个例子", "text": "理解用例：两名儿童中，更敏感的一位在苛刻互动里更容易反抗，却在耐心支持下更愿意合作；差异不是简单的“始终表现较差”。"}, {"heading": "理解边界", "text": "仅发现不利环境下差异较大，还不足以证明差别易感性，需要考察支持环境中的结果。兰花与蒲公英是比喻，不是固定诊断类型。"}], "markdown": "---\nid: \"emotion-differential-susceptibility\"\ntitle: \"差别易感性理论\"\nenglish: \"Differential Susceptibility Theory\"\nkind: \"理论\"\ndomain: \"development\"\nsubdomain: \"个体与环境\"\nsummary: \"对环境更敏感的人可能在不利环境中受损更多，也可能在支持性环境中获益更多；差别易感性因而不只描述单向的脆弱。\"\naliases: []\nkeywords: [\"差别易感性\", \"环境敏感性\", \"气质\", \"兰花\", \"蒲公英\", \"教养\", \"环境风险\", \"反应性\", \"发展\", \"Differential Susceptibility Theory\"]\nquestions: [\"更敏感的儿童是否只能被视为更脆弱？\", \"为什么同一种养育环境对不同儿童的影响不一样？\"]\nsources: [{\"book\": \"emotions\", \"chapter\": \"第11章 情绪性的个体差异\", \"locator\": \"第11章 · Emotionality Moderates Environmental Risk\", \"epubPath\": \"OPS/c11.xhtml#head-3-148\"}]\ncandidateRelated: [{\"title\": \"气质与情绪偏向\", \"reason\": \"气质是环境反应差异的一个来源\"}, {\"title\": \"易感性—压力模型\", \"reason\": \"差别易感性进一步考察良好环境中的额外收益\"}]\n---\n\n## 核心解释\n\n教材以兰花和蒲公英比喻不同的环境反应性。有些儿童对消极照料更容易出现困难，但在支持、较少强制的环境中也可能表现得更好。理论的重要之处在于同时考察环境两端，而非只问谁在压力下更差；情绪与生理反应性可以成为个体差异的相关线索。\n\n## 一个例子\n\n理解用例：两名儿童中，更敏感的一位在苛刻互动里更容易反抗，却在耐心支持下更愿意合作；差异不是简单的“始终表现较差”。\n\n## 理解边界\n\n仅发现不利环境下差异较大，还不足以证明差别易感性，需要考察支持环境中的结果。兰花与蒲公英是比喻，不是固定诊断类型。\n"}, {"id": "emotion-discrete-emotions", "title": "离散情绪观点", "english": "Discrete Emotion Perspective", "kind": "理论", "domain": "emotion", "subdomain": "情绪的结构", "summary": "离散观点认为若干情绪具有可区分的基本形式及行动准备功能，复杂情绪可在此基础上形成；教材也讨论混合与变化带来的挑战。", "aliases": ["基本情绪观点"], "keywords": ["离散情绪", "基本情绪", "行动准备", "悲伤", "恐惧", "愤怒", "体验类别", "混合情绪", "原始情绪", "Discrete Emotion Perspective"], "questions": ["情绪是一组基本类别，还是连续变化的体验？", "复杂情绪和基本情绪之间可能是什么关系？"], "sources": [{"book": "emotions", "chapter": "第6章 评价、体验与调节", "locator": "第6章 · The Perspective That Emotions Are Discrete", "epubPath": "OPS/c06.xhtml#head-3-83"}, {"book": "emotions", "chapter": "第6章 评价、体验与调节", "locator": "第6章 · Comparing Perspectives", "epubPath": "OPS/c06.xhtml#head-3-85"}], "candidateRelated": [{"title": "情绪建构观点", "reason": "对情绪类别来源提出不同解释"}, {"title": "情绪脑活动的分布模式", "reason": "神经层面检验情绪类别的区分"}], "sections": [{"heading": "核心解释", "text": "这一取向把某些情绪看作较基本、可区分的体验与反应组织，帮助人应对反复出现的问题。某些版本认为，基本状态加上有关对象、原因和计划的次级评价，可以形成较复杂的情绪。教材同时指出，真实情绪发作可以混合、转换，因而不能简单假定每次只发生一个清楚分隔的类别。"}, {"heading": "一个例子", "text": "理解用例：担心失去机会时出现恐惧，确认机会已经失去后转为悲伤；离散观点会关注两种状态的不同功能，也需解释它们如何过渡。"}, {"heading": "理解边界", "text": "不同理论提出的基本情绪清单并不相同。找到可区分的体验或脑活动模式，也不能单独证明每种情绪都有固定且唯一的生物本质。"}], "markdown": "---\nid: \"emotion-discrete-emotions\"\ntitle: \"离散情绪观点\"\nenglish: \"Discrete Emotion Perspective\"\nkind: \"理论\"\ndomain: \"emotion\"\nsubdomain: \"情绪的结构\"\nsummary: \"离散观点认为若干情绪具有可区分的基本形式及行动准备功能，复杂情绪可在此基础上形成；教材也讨论混合与变化带来的挑战。\"\naliases: [\"基本情绪观点\"]\nkeywords: [\"离散情绪\", \"基本情绪\", \"行动准备\", \"悲伤\", \"恐惧\", \"愤怒\", \"体验类别\", \"混合情绪\", \"原始情绪\", \"Discrete Emotion Perspective\"]\nquestions: [\"情绪是一组基本类别，还是连续变化的体验？\", \"复杂情绪和基本情绪之间可能是什么关系？\"]\nsources: [{\"book\": \"emotions\", \"chapter\": \"第6章 评价、体验与调节\", \"locator\": \"第6章 · The Perspective That Emotions Are Discrete\", \"epubPath\": \"OPS/c06.xhtml#head-3-83\"}, {\"book\": \"emotions\", \"chapter\": \"第6章 评价、体验与调节\", \"locator\": \"第6章 · Comparing Perspectives\", \"epubPath\": \"OPS/c06.xhtml#head-3-85\"}]\ncandidateRelated: [{\"title\": \"情绪建构观点\", \"reason\": \"对情绪类别来源提出不同解释\"}, {\"title\": \"情绪脑活动的分布模式\", \"reason\": \"神经层面检验情绪类别的区分\"}]\n---\n\n## 核心解释\n\n这一取向把某些情绪看作较基本、可区分的体验与反应组织，帮助人应对反复出现的问题。某些版本认为，基本状态加上有关对象、原因和计划的次级评价，可以形成较复杂的情绪。教材同时指出，真实情绪发作可以混合、转换，因而不能简单假定每次只发生一个清楚分隔的类别。\n\n## 一个例子\n\n理解用例：担心失去机会时出现恐惧，确认机会已经失去后转为悲伤；离散观点会关注两种状态的不同功能，也需解释它们如何过渡。\n\n## 理解边界\n\n不同理论提出的基本情绪清单并不相同。找到可区分的体验或脑活动模式，也不能单独证明每种情绪都有固定且唯一的生物本质。\n"}, {"id": "emotion-disgust", "title": "厌恶的污染防御与扩展", "english": "Disgust and Contamination", "kind": "理论", "domain": "emotion", "subdomain": "进化与功能", "summary": "厌恶最初可从拒绝潜在毒物与污染来理解，并能扩展到行动、观念或群体；这种扩展把身体性的排斥联系到道德和社会判断。", "aliases": ["污染厌恶"], "keywords": ["厌恶", "污染", "排斥", "毒物", "道德厌恶", "纯洁", "群体", "身体反应", "disgust", "Disgust and Contamination"], "questions": ["为什么人们也会说某种行为或观念令人恶心？", "身体污染感如何进入社会判断？"], "sources": [{"book": "emotions", "chapter": "第2章 情绪的进化", "locator": "第2章 · Individual Emotion: Disgust", "epubPath": "OPS/c02.xhtml#head-2-15"}, {"book": "emotions", "chapter": "第9章 社会关系中的情绪", "locator": "第9章 · Group and Collective Emotion and Between‐Group Conflict", "epubPath": "OPS/c09.xhtml#head-3-127"}], "candidateRelated": [{"title": "次级人性否认", "reason": "排斥和去人性化可以在群际关系中相互关联"}, {"title": "道德判断的社会直觉观点", "reason": "说明情绪反应如何进入道德判断"}], "sections": [{"heading": "核心解释", "text": "教材以进化和发展视角讨论厌恶：拒绝苦味、腐坏或被污染的食物具有防护意义，成长中的分类和文化学习又把排斥扩展到非食物对象。人在面对某些道德违反或外群体时也可能使用污染与不洁的理解方式，使原本保护身体的情绪参与社会评价和人际距离的形成。"}, {"heading": "一个例子", "text": "理解用例：一个人原本只对腐坏食物说“恶心”，后来也用同样的词评价欺骗行为；两种对象很不同，却都伴随排斥和保持距离的倾向。"}, {"heading": "理解边界", "text": "厌恶感本身不能证明某个人或群体确实有害，也不能证明道德结论正确。身体厌恶与道德评价的关系需要按具体任务理解。"}], "markdown": "---\nid: \"emotion-disgust\"\ntitle: \"厌恶的污染防御与扩展\"\nenglish: \"Disgust and Contamination\"\nkind: \"理论\"\ndomain: \"emotion\"\nsubdomain: \"进化与功能\"\nsummary: \"厌恶最初可从拒绝潜在毒物与污染来理解，并能扩展到行动、观念或群体；这种扩展把身体性的排斥联系到道德和社会判断。\"\naliases: [\"污染厌恶\"]\nkeywords: [\"厌恶\", \"污染\", \"排斥\", \"毒物\", \"道德厌恶\", \"纯洁\", \"群体\", \"身体反应\", \"disgust\", \"Disgust and Contamination\"]\nquestions: [\"为什么人们也会说某种行为或观念令人恶心？\", \"身体污染感如何进入社会判断？\"]\nsources: [{\"book\": \"emotions\", \"chapter\": \"第2章 情绪的进化\", \"locator\": \"第2章 · Individual Emotion: Disgust\", \"epubPath\": \"OPS/c02.xhtml#head-2-15\"}, {\"book\": \"emotions\", \"chapter\": \"第9章 社会关系中的情绪\", \"locator\": \"第9章 · Group and Collective Emotion and Between‐Group Conflict\", \"epubPath\": \"OPS/c09.xhtml#head-3-127\"}]\ncandidateRelated: [{\"title\": \"次级人性否认\", \"reason\": \"排斥和去人性化可以在群际关系中相互关联\"}, {\"title\": \"道德判断的社会直觉观点\", \"reason\": \"说明情绪反应如何进入道德判断\"}]\n---\n\n## 核心解释\n\n教材以进化和发展视角讨论厌恶：拒绝苦味、腐坏或被污染的食物具有防护意义，成长中的分类和文化学习又把排斥扩展到非食物对象。人在面对某些道德违反或外群体时也可能使用污染与不洁的理解方式，使原本保护身体的情绪参与社会评价和人际距离的形成。\n\n## 一个例子\n\n理解用例：一个人原本只对腐坏食物说“恶心”，后来也用同样的词评价欺骗行为；两种对象很不同，却都伴随排斥和保持距离的倾向。\n\n## 理解边界\n\n厌恶感本身不能证明某个人或群体确实有害，也不能证明道德结论正确。身体厌恶与道德评价的关系需要按具体任务理解。\n"}, {"id": "emotion-display-rules-dialects", "title": "情绪展示规则与情绪方言", "english": "Display Rules and Emotion Dialects", "kind": "理论", "domain": "emotion", "subdomain": "文化与情绪", "summary": "文化既规定何时及多强地表达情绪，也可能形成共享的表达变体；展示规则与情绪方言解释共同表情成分之外的文化差异。", "aliases": [], "keywords": ["展示规则", "情绪方言", "文化差异", "表达强度", "抑制", "规范", "面部动作", "情绪沟通", "dialect", "Display Rules and Emotion Dialects"], "questions": ["为什么同样高兴的人会用不同强度表达？", "文化怎样改变情绪表达的具体动作？"], "sources": [{"book": "emotions", "chapter": "第4章 情绪的沟通", "locator": "第4章 · Cultural Variation in Expressive Behavior", "epubPath": "OPS/c04.xhtml#head-3-51"}, {"book": "emotions", "chapter": "第4章 情绪的沟通", "locator": "第4章 · Cultural Variation in the Interpretation of Emotional Expression", "epubPath": "OPS/c04.xhtml#head-3-52"}], "candidateRelated": [{"title": "理想情感与情感评价", "reason": "受重视的情绪可能得到更强表达"}, {"title": "情绪调节过程模型", "reason": "表达抑制是调节的一种位置与方式"}], "sections": [{"heading": "核心解释", "text": "展示规则涉及在什么关系和场合应增强、减弱或抑制表达；情绪方言则指同一情绪的文化特定表达形式。教材将它比作语言：不同群体共享一些原型成分，又有当地习得的变化。两者可以使看似相同的情绪在强度、动作组合和理解方式上呈现差别。"}, {"heading": "一个例子", "text": "理解用例：一人在朋友聚会上大笑，在正式会议里只轻轻微笑，体现情境中的展示规则；不同群体表示尴尬时惯用动作不同则更接近方言。"}, {"heading": "理解边界", "text": "展示规则、实际感受和表达能力不是一回事。文化变体也不意味着群体之间完全无法沟通，需要同时考察共享成分与具体差别。"}], "markdown": "---\nid: \"emotion-display-rules-dialects\"\ntitle: \"情绪展示规则与情绪方言\"\nenglish: \"Display Rules and Emotion Dialects\"\nkind: \"理论\"\ndomain: \"emotion\"\nsubdomain: \"文化与情绪\"\nsummary: \"文化既规定何时及多强地表达情绪，也可能形成共享的表达变体；展示规则与情绪方言解释共同表情成分之外的文化差异。\"\naliases: []\nkeywords: [\"展示规则\", \"情绪方言\", \"文化差异\", \"表达强度\", \"抑制\", \"规范\", \"面部动作\", \"情绪沟通\", \"dialect\", \"Display Rules and Emotion Dialects\"]\nquestions: [\"为什么同样高兴的人会用不同强度表达？\", \"文化怎样改变情绪表达的具体动作？\"]\nsources: [{\"book\": \"emotions\", \"chapter\": \"第4章 情绪的沟通\", \"locator\": \"第4章 · Cultural Variation in Expressive Behavior\", \"epubPath\": \"OPS/c04.xhtml#head-3-51\"}, {\"book\": \"emotions\", \"chapter\": \"第4章 情绪的沟通\", \"locator\": \"第4章 · Cultural Variation in the Interpretation of Emotional Expression\", \"epubPath\": \"OPS/c04.xhtml#head-3-52\"}]\ncandidateRelated: [{\"title\": \"理想情感与情感评价\", \"reason\": \"受重视的情绪可能得到更强表达\"}, {\"title\": \"情绪调节过程模型\", \"reason\": \"表达抑制是调节的一种位置与方式\"}]\n---\n\n## 核心解释\n\n展示规则涉及在什么关系和场合应增强、减弱或抑制表达；情绪方言则指同一情绪的文化特定表达形式。教材将它比作语言：不同群体共享一些原型成分，又有当地习得的变化。两者可以使看似相同的情绪在强度、动作组合和理解方式上呈现差别。\n\n## 一个例子\n\n理解用例：一人在朋友聚会上大笑，在正式会议里只轻轻微笑，体现情境中的展示规则；不同群体表示尴尬时惯用动作不同则更接近方言。\n\n## 理解边界\n\n展示规则、实际感受和表达能力不是一回事。文化变体也不意味着群体之间完全无法沟通，需要同时考察共享成分与具体差别。\n"}, {"id": "emotion-emotion-socialization", "title": "家庭中的情绪社会化", "english": "Parental Socialization of Emotion", "kind": "理论", "domain": "development", "subdomain": "社会化与情绪", "summary": "家庭通过情绪示范、对儿童表达的回应及谈论感受来传递情绪规范；儿童也会反过来改变照料者，因此社会化是双向互动。", "aliases": ["父母情绪社会化"], "keywords": ["情绪社会化", "情绪教练", "元情绪理念", "父母回应", "情绪谈话", "家庭氛围", "双向作用", "示范", "养育", "Parental Socialization of Emotion"], "questions": ["儿童如何学会什么情绪可以表达、应当怎样表达？", "家长对负面情绪的看法为什么会影响互动方式？"], "sources": [{"book": "emotions", "chapter": "第11章 情绪性的个体差异", "locator": "第11章 · Parental Socialization of Emotion", "epubPath": "OPS/c11.xhtml#head-3-158"}, {"book": "emotions", "chapter": "第11章 情绪性的个体差异", "locator": "第11章 · Emotions to Which Children Are Exposed", "epubPath": "OPS/c11.xhtml#head-4-1"}, {"book": "emotions", "chapter": "第11章 情绪性的个体差异", "locator": "第11章 · Parental Reactions to Children's Emotions and Emotion Coaching", "epubPath": "OPS/c11.xhtml#head-4-2"}], "candidateRelated": [{"title": "儿童情绪调节的发展", "reason": "社会化提供学习调节的关系情境"}, {"title": "情绪展示规则与情绪方言", "reason": "家庭帮助儿童学习文化中的表达规范"}], "sections": [{"heading": "核心解释", "text": "教材归纳情绪社会化的三个入口：儿童接触到的情绪，照料者如何回应其情绪，以及如何谈论和解释这些经验。家长关于情绪的元理念会影响他们把负面情绪视为交流机会还是应被消除的问题。儿童的气质和行为又会引发不同回应，使过程不断双向展开。"}, {"heading": "一个例子", "text": "理解用例：孩子失望时，一个家庭愿意讨论感受及原因，另一个家庭很快否定表达；长期互动可能使儿童对如何理解和表达失望形成不同预期。"}, {"heading": "理解边界", "text": "研究中的相关不能全部归因于单向养育影响。儿童特点、家庭其他关系、年龄及文化规范都会改变互动，因此不宜简单归责家长。"}], "markdown": "---\nid: \"emotion-emotion-socialization\"\ntitle: \"家庭中的情绪社会化\"\nenglish: \"Parental Socialization of Emotion\"\nkind: \"理论\"\ndomain: \"development\"\nsubdomain: \"社会化与情绪\"\nsummary: \"家庭通过情绪示范、对儿童表达的回应及谈论感受来传递情绪规范；儿童也会反过来改变照料者，因此社会化是双向互动。\"\naliases: [\"父母情绪社会化\"]\nkeywords: [\"情绪社会化\", \"情绪教练\", \"元情绪理念\", \"父母回应\", \"情绪谈话\", \"家庭氛围\", \"双向作用\", \"示范\", \"养育\", \"Parental Socialization of Emotion\"]\nquestions: [\"儿童如何学会什么情绪可以表达、应当怎样表达？\", \"家长对负面情绪的看法为什么会影响互动方式？\"]\nsources: [{\"book\": \"emotions\", \"chapter\": \"第11章 情绪性的个体差异\", \"locator\": \"第11章 · Parental Socialization of Emotion\", \"epubPath\": \"OPS/c11.xhtml#head-3-158\"}, {\"book\": \"emotions\", \"chapter\": \"第11章 情绪性的个体差异\", \"locator\": \"第11章 · Emotions to Which Children Are Exposed\", \"epubPath\": \"OPS/c11.xhtml#head-4-1\"}, {\"book\": \"emotions\", \"chapter\": \"第11章 情绪性的个体差异\", \"locator\": \"第11章 · Parental Reactions to Children's Emotions and Emotion Coaching\", \"epubPath\": \"OPS/c11.xhtml#head-4-2\"}]\ncandidateRelated: [{\"title\": \"儿童情绪调节的发展\", \"reason\": \"社会化提供学习调节的关系情境\"}, {\"title\": \"情绪展示规则与情绪方言\", \"reason\": \"家庭帮助儿童学习文化中的表达规范\"}]\n---\n\n## 核心解释\n\n教材归纳情绪社会化的三个入口：儿童接触到的情绪，照料者如何回应其情绪，以及如何谈论和解释这些经验。家长关于情绪的元理念会影响他们把负面情绪视为交流机会还是应被消除的问题。儿童的气质和行为又会引发不同回应，使过程不断双向展开。\n\n## 一个例子\n\n理解用例：孩子失望时，一个家庭愿意讨论感受及原因，另一个家庭很快否定表达；长期互动可能使儿童对如何理解和表达失望形成不同预期。\n\n## 理解边界\n\n研究中的相关不能全部归因于单向养育影响。儿童特点、家庭其他关系、年龄及文化规范都会改变互动，因此不宜简单归责家长。\n"}, {"id": "emotion-emotional-intelligence", "title": "情绪智力", "english": "Emotional Intelligence", "kind": "模型", "domain": "emotion", "subdomain": "情绪能力", "summary": "情绪智力把识别、理解、运用和管理情绪视为可以存在个体差异的能力，关注情绪信息怎样帮助思考及协调社会关系。", "aliases": ["情商能力模型"], "keywords": ["情绪智力", "情绪识别", "情绪理解", "情绪运用", "情绪管理", "Salovey", "Mayer", "人际关系", "情商", "Emotional Intelligence"], "questions": ["理解情绪和善于控制表情是一回事吗？", "情绪能力可以拆成哪些不同方面？"], "sources": [{"book": "emotions", "chapter": "第9章 社会关系中的情绪", "locator": "第9章 · Emotional Intelligence", "epubPath": "OPS/c09.xhtml#head-2-96"}], "candidateRelated": [{"title": "内感受", "reason": "理解自身体验的相关信息来源"}, {"title": "情绪调节过程模型", "reason": "管理情绪是能力模型中的一个组成部分"}], "sections": [{"heading": "核心解释", "text": "教材介绍萨洛维和梅耶的能力取向：准确感知情绪，理解情绪的意义，利用情绪协助思考，以及按照情境管理情绪。一个人在这些方面的表现可以不同，能力也体现在亲密关系、友谊和工作互动中。因此它不是笼统的讨人喜欢，而是围绕情绪信息加工的一组技能。"}, {"heading": "一个例子", "text": "理解用例：同事表现沉默时，你既需要识别可能的感受，也需要理解原因、选择合宜回应，并管理自己的不耐烦；这些不是同一种能力。"}, {"heading": "理解边界", "text": "高情绪智力不保证品德更好，也不能由社交受欢迎程度直接反推。能力模型与日常宽泛的“情商”用法应保持区别。"}], "markdown": "---\nid: \"emotion-emotional-intelligence\"\ntitle: \"情绪智力\"\nenglish: \"Emotional Intelligence\"\nkind: \"模型\"\ndomain: \"emotion\"\nsubdomain: \"情绪能力\"\nsummary: \"情绪智力把识别、理解、运用和管理情绪视为可以存在个体差异的能力，关注情绪信息怎样帮助思考及协调社会关系。\"\naliases: [\"情商能力模型\"]\nkeywords: [\"情绪智力\", \"情绪识别\", \"情绪理解\", \"情绪运用\", \"情绪管理\", \"Salovey\", \"Mayer\", \"人际关系\", \"情商\", \"Emotional Intelligence\"]\nquestions: [\"理解情绪和善于控制表情是一回事吗？\", \"情绪能力可以拆成哪些不同方面？\"]\nsources: [{\"book\": \"emotions\", \"chapter\": \"第9章 社会关系中的情绪\", \"locator\": \"第9章 · Emotional Intelligence\", \"epubPath\": \"OPS/c09.xhtml#head-2-96\"}]\ncandidateRelated: [{\"title\": \"内感受\", \"reason\": \"理解自身体验的相关信息来源\"}, {\"title\": \"情绪调节过程模型\", \"reason\": \"管理情绪是能力模型中的一个组成部分\"}]\n---\n\n## 核心解释\n\n教材介绍萨洛维和梅耶的能力取向：准确感知情绪，理解情绪的意义，利用情绪协助思考，以及按照情境管理情绪。一个人在这些方面的表现可以不同，能力也体现在亲密关系、友谊和工作互动中。因此它不是笼统的讨人喜欢，而是围绕情绪信息加工的一组技能。\n\n## 一个例子\n\n理解用例：同事表现沉默时，你既需要识别可能的感受，也需要理解原因、选择合宜回应，并管理自己的不耐烦；这些不是同一种能力。\n\n## 理解边界\n\n高情绪智力不保证品德更好，也不能由社交受欢迎程度直接反推。能力模型与日常宽泛的“情商”用法应保持区别。\n"}, {"id": "emotion-emotional-mimicry", "title": "情绪模仿与人际趋同", "english": "Emotional Mimicry", "kind": "心理过程", "domain": "emotion", "subdomain": "社会关系", "summary": "人在互动中会模仿他人的表情、声音和动作；情绪模仿可能提高相似感并支持亲近，而已有关系也会影响模仿是否发生。", "aliases": [], "keywords": ["情绪模仿", "同步", "情绪感染", "相似感", "笑声", "友谊", "亲近", "合作", "人际趋同", "Emotional Mimicry tation of Emotion"], "questions": ["看似不理性的情绪为什么可能具有功能？", "是否每一种情绪特征都可以说是进化适应？"], "sources": [{"book": "emotions", "chapter": "第2章 情绪的进化", "locator": "第2章 · Adaptation", "epubPath": "OPS/c02.xhtml#head-3-17"}], "candidateRelated": [{"title": "厌恶的污染防御与扩展", "reason": "进化功能分析的具体案例"}, {"title": "儿童依恋与安全基地", "reason": "照料脆弱后代相关的情绪系统"}], "sections": [{"heading": "核心解释", "text": "情绪能够协调注意、身体和行动，使个体较快回应危险、机会、照料和社会关系问题。进化解释因此关注一类反应在祖先环境中可能解决什么反复出现的难题。教材同时强调，并非每一项行为都是直接适应：有些是其他特征的副产物，有些是在演化中取得新用途的功能转用。"}, {"heading": "一个例子", "text": "理解用例：在光线昏暗的陌生环境里格外警觉，可以从避开潜在危险的功能理解；这种功能解释并不表示每一次警觉都判断准确。"}, {"heading": "理解边界", "text": "有可能的适应功能不等于已经证明特征的进化历史，也不表示它在当代环境总有好处。文化、学习与情境仍会改变反应。"}], "markdown": "---\nid: \"emotion-evolutionary-adaptation\"\ntitle: \"情绪的进化适应观点\"\nenglish: \"Evolutionary Adaptation of Emotion\"\nkind: \"理论\"\ndomain: \"emotion\"\nsubdomain: \"进化与功能\"\nsummary: \"进化观点把情绪放在反复出现的生存、繁殖与合作问题中理解，考察某种反应如何帮助行动，同时区分适应、副产物和功能转用。\"\naliases: []\nkeywords: [\"进化\", \"自然选择\", \"适应\", \"选择压力\", \"生存\", \"繁殖\", \"合作\", \"副产物\", \"功能转用\", \"Evolutionary Adaptation of Emotion\"]\nquestions: [\"看似不理性的情绪为什么可能具有功能？\", \"是否每一种情绪特征都可以说是进化适应？\"]\nsources: [{\"book\": \"emotions\", \"chapter\": \"第2章 情绪的进化\", \"locator\": \"第2章 · Adaptation\", \"epubPath\": \"OPS/c02.xhtml#head-3-17\"}]\ncandidateRelated: [{\"title\": \"厌恶的污染防御与扩展\", \"reason\": \"进化功能分析的具体案例\"}, {\"title\": \"儿童依恋与安全基地\", \"reason\": \"照料脆弱后代相关的情绪系统\"}]\n---\n\n## 核心解释\n\n情绪能够协调注意、身体和行动，使个体较快回应危险、机会、照料和社会关系问题。进化解释因此关注一类反应在祖先环境中可能解决什么反复出现的难题。教材同时强调，并非每一项行为都是直接适应：有些是其他特征的副产物，有些是在演化中取得新用途的功能转用。\n\n## 一个例子\n\n理解用例：在光线昏暗的陌生环境里格外警觉，可以从避开潜在危险的功能理解；这种功能解释并不表示每一次警觉都判断准确。\n\n## 理解边界\n\n有可能的适应功能不等于已经证明特征的进化历史，也不表示它在当代环境总有好处。文化、学习与情境仍会改变反应。\n"}, {"id": "emotion-expressed-emotion", "title": "家庭表达情绪", "english": "Expressed Emotion", "kind": "概念", "domain": "clinical", "subdomain": "关系与情绪障碍", "summary": "表达情绪在临床研究中是一个特定家庭互动指标，主要涉及批评、敌意和过度卷入；它考察关系环境与障碍病程之间的联系。", "aliases": ["情绪表达水平", "Expressed Emotion（EE）"], "keywords": ["表达情绪", "家庭互动", "批评", "敌意", "过度卷入", "复发", "关系环境", "精神分裂症", "EE", "Expressed Emotion"], "questions": ["研究中的高表达情绪是否只是指情绪表达很多？", "家庭互动怎样与情绪困难的病程相互关联？"], "sources": [{"book": "emotions", "chapter": "第13章 成年期的情绪障碍", "locator": "第13章 · Schizophrenia, Emotion, Expressed Emotion in Relatives", "epubPath": "OPS/c13.xhtml#head-3-191"}], "candidateRelated": [{"title": "人与环境的交互发展", "reason": "关系和个体困难可构成相互影响的过程"}, {"title": "家庭中的情绪社会化", "reason": "二者都关注关系中的情绪互动，但研究对象不同"}], "sections": [{"heading": "核心解释", "text": "教材介绍的表达情绪不是一般意义上的“表达感受”，而是通过家属访谈衡量批评、敌意和过度卷入等互动特征。相关研究考察它与出院后的复发及其他障碍病程的关联。患病经历会影响关系，而关系中的持续压力又可能影响困难，因而需要把双方互动纳入理解。"}, {"heading": "一个例子", "text": "理解用例：访谈中反复责备、敌意评论和把成年家人当作完全无法自主的人对待，可能是该指标考察的内容，而热情表达关爱并非其同义词。"}, {"heading": "理解边界", "text": "关联不能被解读为家属单独造成疾病，也不能根据该指标更改治疗。照料负担、既往病程与双向影响都需要同时考虑。"}], "markdown": "---\nid: \"emotion-expressed-emotion\"\ntitle: \"家庭表达情绪\"\nenglish: \"Expressed Emotion\"\nkind: \"概念\"\ndomain: \"clinical\"\nsubdomain: \"关系与情绪障碍\"\nsummary: \"表达情绪在临床研究中是一个特定家庭互动指标，主要涉及批评、敌意和过度卷入；它考察关系环境与障碍病程之间的联系。\"\naliases: [\"情绪表达水平\", \"Expressed Emotion（EE）\"]\nkeywords: [\"表达情绪\", \"家庭互动\", \"批评\", \"敌意\", \"过度卷入\", \"复发\", \"关系环境\", \"精神分裂症\", \"EE\", \"Expressed Emotion\"]\nquestions: [\"研究中的高表达情绪是否只是指情绪表达很多？\", \"家庭互动怎样与情绪困难的病程相互关联？\"]\nsources: [{\"book\": \"emotions\", \"chapter\": \"第13章 成年期的情绪障碍\", \"locator\": \"第13章 · Schizophrenia, Emotion, Expressed Emotion in Relatives\", \"epubPath\": \"OPS/c13.xhtml#head-3-191\"}]\ncandidateRelated: [{\"title\": \"人与环境的交互发展\", \"reason\": \"关系和个体困难可构成相互影响的过程\"}, {\"title\": \"家庭中的情绪社会化\", \"reason\": \"二者都关注关系中的情绪互动，但研究对象不同\"}]\n---\n\n## 核心解释\n\n教材介绍的表达情绪不是一般意义上的“表达感受”，而是通过家属访谈衡量批评、敌意和过度卷入等互动特征。相关研究考察它与出院后的复发及其他障碍病程的关联。患病经历会影响关系，而关系中的持续压力又可能影响困难，因而需要把双方互动纳入理解。\n\n## 一个例子\n\n理解用例：访谈中反复责备、敌意评论和把成年家人当作完全无法自主的人对待，可能是该指标考察的内容，而热情表达关爱并非其同义词。\n\n## 理解边界\n\n关联不能被解读为家属单独造成疾病，也不能根据该指标更改治疗。照料负担、既往病程与双向影响都需要同时考虑。\n"}, {"id": "emotion-expression-universality", "title": "情绪表情的普遍性假说", "english": "Universality of Emotional Expressions", "kind": "理论", "domain": "emotion", "subdomain": "情绪沟通", "summary": "表情普遍性研究分别考察不同文化是否以相似方式表达和识别情绪；教材同时讨论强迫选择、夸张静态照片与情境缺失的限制。", "aliases": [], "keywords": ["面部表情", "普遍性", "编码", "解码", "艾克曼", "跨文化", "强迫选择", "生态效度", "基本情绪", "Universality of Emotional Expressions"], "questions": ["不同文化的人能否看懂彼此的情绪表情？", "经典表情实验为什么不能直接代表所有日常互动？"], "sources": [{"book": "emotions", "chapter": "第4章 情绪的沟通", "locator": "第4章 · Early Evidence of the Universality of Facial Expressions of Emotion", "epubPath": "OPS/c04.xhtml#head-3-43"}, {"book": "emotions", "chapter": "第4章 情绪的沟通", "locator": "第4章 · Critiques of the Ekman and Friesen Studies", "epubPath": "OPS/c04.xhtml#head-3-45"}], "candidateRelated": [{"title": "情绪表达的行为生态观点", "reason": "提出表达还传递意图而非仅仅内心感受"}, {"title": "情绪展示规则与情绪方言", "reason": "文化特异性与普遍成分可以同时存在"}], "sections": [{"heading": "核心解释", "text": "教材区分编码假说与解码假说：前者问相同情绪是否产生相似表达，后者问不同文化的观察者是否作出相似解释。经典研究提供跨文化识别证据，但研究者预设的情绪词、强迫选择方式和高度标准化照片会影响结果。动态行为、更多情绪类别及实际情境让检验更细致。"}, {"heading": "一个例子", "text": "理解用例：在六个词中给一张夸张笑脸选标签，可能比自由描述一段含蓄微笑的对话容易；两项任务考察的识别能力并不完全相同。"}, {"heading": "理解边界", "text": "跨文化一致性不能证明每个表情都有唯一内在情绪，也不排除文化差异。识别准确率须结合备选词、机会水平和材料类型理解。"}], "markdown": "---\nid: \"emotion-expression-universality\"\ntitle: \"情绪表情的普遍性假说\"\nenglish: \"Universality of Emotional Expressions\"\nkind: \"理论\"\ndomain: \"emotion\"\nsubdomain: \"情绪沟通\"\nsummary: \"表情普遍性研究分别考察不同文化是否以相似方式表达和识别情绪；教材同时讨论强迫选择、夸张静态照片与情境缺失的限制。\"\naliases: []\nkeywords: [\"面部表情\", \"普遍性\", \"编码\", \"解码\", \"艾克曼\", \"跨文化\", \"强迫选择\", \"生态效度\", \"基本情绪\", \"Universality of Emotional Expressions\"]\nquestions: [\"不同文化的人能否看懂彼此的情绪表情？\", \"经典表情实验为什么不能直接代表所有日常互动？\"]\nsources: [{\"book\": \"emotions\", \"chapter\": \"第4章 情绪的沟通\", \"locator\": \"第4章 · Early Evidence of the Universality of Facial Expressions of Emotion\", \"epubPath\": \"OPS/c04.xhtml#head-3-43\"}, {\"book\": \"emotions\", \"chapter\": \"第4章 情绪的沟通\", \"locator\": \"第4章 · Critiques of the Ekman and Friesen Studies\", \"epubPath\": \"OPS/c04.xhtml#head-3-45\"}]\ncandidateRelated: [{\"title\": \"情绪表达的行为生态观点\", \"reason\": \"提出表达还传递意图而非仅仅内心感受\"}, {\"title\": \"情绪展示规则与情绪方言\", \"reason\": \"文化特异性与普遍成分可以同时存在\"}]\n---\n\n## 核心解释\n\n教材区分编码假说与解码假说：前者问相同情绪是否产生相似表达，后者问不同文化的观察者是否作出相似解释。经典研究提供跨文化识别证据，但研究者预设的情绪词、强迫选择方式和高度标准化照片会影响结果。动态行为、更多情绪类别及实际情境让检验更细致。\n\n## 一个例子\n\n理解用例：在六个词中给一张夸张笑脸选标签，可能比自由描述一段含蓄微笑的对话容易；两项任务考察的识别能力并不完全相同。\n\n## 理解边界\n\n跨文化一致性不能证明每个表情都有唯一内在情绪，也不排除文化差异。识别准确率须结合备选词、机会水平和材料类型理解。\n"}, {"id": "emotion-flow", "title": "心流", "english": "Flow", "kind": "概念", "domain": "emotion", "subdomain": "意义与福祉", "summary": "心流指人全神贯注地投入活动，感到行动与自我融合的体验；明确目标、可观察的反馈及持续解决具体问题有助于理解其出现。", "aliases": ["最优体验", "心流", "Flow"], "keywords": ["心流", "最优体验", "专注", "投入", "目标", "反馈", "创造性", "Csikszentmihalyi", "内在体验", "Flow", "沉浸", "挑战", "能力", "时间", "体验", "积极心理"], "questions": ["为什么有时做事会投入到暂时忘记自己？", "日常重复工作是否也可能出现心流？", "为什么恰当难度可能让人沉浸于活动？", "忘记时间与心流有什么联系和区别？"], "sources": [{"book": "emotions", "chapter": "第14章 有意义的生活", "locator": "第14章 · Reflection and Cultivation Flow", "epubPath": "OPS/c14.xhtml#head-2-146"}, {"book": "personality", "chapter": "第12章 人本积极心理与幸福", "locator": "PDF 第 968 页", "pdfPages": [968]}], "candidateRelated": [{"title": "生活意义的心理来源", "reason": "自主与胜任可以使活动获得目的感"}, {"title": "奖励的想要、喜欢与强化", "reason": "投入中的享受不等同于对外部奖赏的追求"}, {"concept": "心理三要素", "reason": "联系体验与行为"}, {"concept": "个人建构理论", "reason": "同属对主观经验的研究"}], "sections": [{"heading": "核心解释", "text": "契克森米哈赖将某类完全投入活动的状态称为心流或最优体验。教材强调，这不只是等待愉快事件发生，还涉及把活动组织成有意义的项目，设定具体问题与目标，并能从行动结果获得反馈。即使是普通或重复工作，也可能因主动理解和改进而产生强烈投入。"}, {"heading": "一个例子", "text": "理解用例：练习一段音乐时，你明确要改进的细节，马上听到动作的效果，并不断调整，注意紧密贴着任务，暂时不再关心别人怎样评价自己。"}, {"heading": "理解边界", "text": "心流不是简单的兴奋、忙碌或长时间坚持，也不保证活动具有道德价值。教材强调的是体验结构，不能仅从工作时长推断。"}], "markdown": "---\nid: \"emotion-flow\"\ntitle: \"心流\"\nenglish: \"Flow\"\nkind: \"概念\"\ndomain: \"emotion\"\nsubdomain: \"意义与福祉\"\nsummary: \"心流指人全神贯注地投入活动，感到行动与自我融合的体验；明确目标、可观察的反馈及持续解决具体问题有助于理解其出现。\"\naliases: [\"最优体验\", \"心流\", \"Flow\"]\nkeywords: [\"心流\", \"最优体验\", \"专注\", \"投入\", \"目标\", \"反馈\", \"创造性\", \"Csikszentmihalyi\", \"内在体验\", \"Flow\", \"沉浸\", \"挑战\", \"能力\", \"时间\", \"体验\", \"积极心理\"]\nquestions: [\"为什么有时做事会投入到暂时忘记自己？\", \"日常重复工作是否也可能出现心流？\", \"为什么恰当难度可能让人沉浸于活动？\", \"忘记时间与心流有什么联系和区别？\"]\nsources: [{\"book\": \"emotions\", \"chapter\": \"第14章 有意义的生活\", \"locator\": \"第14章 · Reflection and Cultivation Flow\", \"epubPath\": \"OPS/c14.xhtml#head-2-146\"}, {\"book\": \"personality\", \"chapter\": \"第12章 人本积极心理与幸福\", \"locator\": \"PDF 第 968 页\", \"pdfPages\": [968]}]\ncandidateRelated: [{\"title\": \"生活意义的心理来源\", \"reason\": \"自主与胜任可以使活动获得目的感\"}, {\"title\": \"奖励的想要、喜欢与强化\", \"reason\": \"投入中的享受不等同于对外部奖赏的追求\"}, {\"concept\": \"心理三要素\", \"reason\": \"联系体验与行为\"}, {\"concept\": \"个人建构理论\", \"reason\": \"同属对主观经验的研究\"}]\n---\n\n## 核心解释\n\n契克森米哈赖将某类完全投入活动的状态称为心流或最优体验。教材强调，这不只是等待愉快事件发生，还涉及把活动组织成有意义的项目，设定具体问题与目标，并能从行动结果获得反馈。即使是普通或重复工作，也可能因主动理解和改进而产生强烈投入。\n\n## 一个例子\n\n理解用例：练习一段音乐时，你明确要改进的细节，马上听到动作的效果，并不断调整，注意紧密贴着任务，暂时不再关心别人怎样评价自己。\n\n## 理解边界\n\n心流不是简单的兴奋、忙碌或长时间坚持，也不保证活动具有道德价值。教材强调的是体验结构，不能仅从工作时长推断。\n"}, {"id": "emotion-group-collective", "title": "群体情绪与集体情绪", "english": "Group-Based and Collective Emotions", "kind": "概念", "domain": "emotion", "subdomain": "群体与情绪", "summary": "群体情绪以所属群体的行动和命运为对象，即使独处也能体验；集体情绪发生于共同在场的互动，情绪感染与我们感会改变体验。", "aliases": [], "keywords": ["群体情绪", "集体情绪", "群体认同", "集体欢腾", "仪式", "情绪感染", "我们感", "共同在场", "凝聚", "Group-Based and Collective Emotions"], "questions": ["独自为所属群体感到自豪与现场共同欢呼有何不同？", "共同仪式为什么能改变情绪的性质和强度？"], "sources": [{"book": "emotions", "chapter": "第9章 社会关系中的情绪", "locator": "第9章 · Emotion and Group Dynamics", "epubPath": "OPS/c09.xhtml#head-2-94"}, {"book": "emotions", "chapter": "第9章 社会关系中的情绪", "locator": "第9章 · Group and Collective Emotions", "epubPath": "OPS/c09.xhtml#head-3-126"}, {"book": "emotions", "chapter": "第9章 社会关系中的情绪", "locator": "第9章 · Group and Collective Emotion and Between‐Group Conflict", "epubPath": "OPS/c09.xhtml#head-3-127"}], "candidateRelated": [{"title": "情绪模仿与人际趋同", "reason": "共同表达有助于情绪趋同"}, {"title": "次级人性否认", "reason": "说明群体边界如何进入对他人情绪的理解"}], "sections": [{"heading": "核心解释", "text": "教材区分两类与群体有关的情绪。群体基础情绪来自把群体身份纳入自我，从而因其成就或过错体验自豪、内疚等；集体情绪则通过成员共同在场、模仿和感染，以及对共同身份的理解而形成。共享感受能够增强凝聚，也可能参与群体之间的冲突。"}, {"heading": "一个例子", "text": "理解用例：独自在家得知学校团队获奖而自豪，是以群体为对象的情绪；在庆祝现场与大家共同欢呼，还形成了共同在场的集体体验。"}, {"heading": "理解边界", "text": "凝聚并不保证对其他群体友善，积极的内部情绪也可能伴随外部排斥。需要区分个人报告、群体情境与实际成员之间的相互影响。"}], "markdown": "---\nid: \"emotion-group-collective\"\ntitle: \"群体情绪与集体情绪\"\nenglish: \"Group-Based and Collective Emotions\"\nkind: \"概念\"\ndomain: \"emotion\"\nsubdomain: \"群体与情绪\"\nsummary: \"群体情绪以所属群体的行动和命运为对象，即使独处也能体验；集体情绪发生于共同在场的互动，情绪感染与我们感会改变体验。\"\naliases: []\nkeywords: [\"群体情绪\", \"集体情绪\", \"群体认同\", \"集体欢腾\", \"仪式\", \"情绪感染\", \"我们感\", \"共同在场\", \"凝聚\", \"Group-Based and Collective Emotions\"]\nquestions: [\"独自为所属群体感到自豪与现场共同欢呼有何不同？\", \"共同仪式为什么能改变情绪的性质和强度？\"]\nsources: [{\"book\": \"emotions\", \"chapter\": \"第9章 社会关系中的情绪\", \"locator\": \"第9章 · Emotion and Group Dynamics\", \"epubPath\": \"OPS/c09.xhtml#head-2-94\"}, {\"book\": \"emotions\", \"chapter\": \"第9章 社会关系中的情绪\", \"locator\": \"第9章 · Group and Collective Emotions\", \"epubPath\": \"OPS/c09.xhtml#head-3-126\"}, {\"book\": \"emotions\", \"chapter\": \"第9章 社会关系中的情绪\", \"locator\": \"第9章 · Group and Collective Emotion and Between‐Group Conflict\", \"epubPath\": \"OPS/c09.xhtml#head-3-127\"}]\ncandidateRelated: [{\"title\": \"情绪模仿与人际趋同\", \"reason\": \"共同表达有助于情绪趋同\"}, {\"title\": \"次级人性否认\", \"reason\": \"说明群体边界如何进入对他人情绪的理解\"}]\n---\n\n## 核心解释\n\n教材区分两类与群体有关的情绪。群体基础情绪来自把群体身份纳入自我，从而因其成就或过错体验自豪、内疚等；集体情绪则通过成员共同在场、模仿和感染，以及对共同身份的理解而形成。共享感受能够增强凝聚，也可能参与群体之间的冲突。\n\n## 一个例子\n\n理解用例：独自在家得知学校团队获奖而自豪，是以群体为对象的情绪；在庆祝现场与大家共同欢呼，还形成了共同在场的集体体验。\n\n## 理解边界\n\n凝聚并不保证对其他群体友善，积极的内部情绪也可能伴随外部排斥。需要区分个人报告、群体情境与实际成员之间的相互影响。\n"}, {"id": "emotion-hpa-axis", "title": "HPA轴与应激反应", "english": "Hypothalamic–Pituitary–Adrenal Axis", "kind": "心理过程", "domain": "emotion", "subdomain": "身体与情绪", "summary": "HPA轴把威胁相关评价联系到皮质醇等身体应激变化，帮助调动短期应对资源；社会评价、不可控感和情境会影响其反应。", "aliases": ["下丘脑—垂体—肾上腺轴"], "keywords": ["HPA轴", "应激", "皮质醇", "下丘脑", "垂体", "肾上腺", "社会评价", "威胁", "压力", "Hypothalamic–Pituitary–Adrenal Axis"], "questions": ["心理上的威胁如何引起身体激素变化？", "为什么被人评价的情境会让人产生明显压力反应？"], "sources": [{"book": "emotions", "chapter": "第5章 身体变化与情绪", "locator": "第5章 · The Hypothalamic–Pituitary–Adrenal Axis", "epubPath": "OPS/c05.xhtml#head-3-63"}], "candidateRelated": [{"title": "情绪评价理论", "reason": "事件被理解为威胁才进入具体应对过程"}, {"title": "易感性—压力模型", "reason": "把压力与长期脆弱性相结合"}], "sections": [{"heading": "核心解释", "text": "教材描述一条神经内分泌通路：应激事件经相关脑系统影响下丘脑，下丘脑作用于垂体，促肾上腺皮质激素进一步促使肾上腺释放皮质醇。这样的变化有助于身体调动资源应对挑战。实验中，受到负面社会评价以及担忧、威胁与不确定的评价，均与应激反应相关。"}, {"heading": "一个例子", "text": "理解用例：临时面对一组表情严肃的评委发言时，一个人既觉得自己正在被否定，也出现明显身体紧张；这类情境用于研究社会评价压力。"}, {"heading": "理解边界", "text": "激素水平不能单独告诉我们一个人正在体验哪种情绪。应激反应要结合时间、情境和其他测量理解，本卡不提供临床判断。"}], "markdown": "---\nid: \"emotion-hpa-axis\"\ntitle: \"HPA轴与应激反应\"\nenglish: \"Hypothalamic–Pituitary–Adrenal Axis\"\nkind: \"心理过程\"\ndomain: \"emotion\"\nsubdomain: \"身体与情绪\"\nsummary: \"HPA轴把威胁相关评价联系到皮质醇等身体应激变化，帮助调动短期应对资源；社会评价、不可控感和情境会影响其反应。\"\naliases: [\"下丘脑—垂体—肾上腺轴\"]\nkeywords: [\"HPA轴\", \"应激\", \"皮质醇\", \"下丘脑\", \"垂体\", \"肾上腺\", \"社会评价\", \"威胁\", \"压力\", \"Hypothalamic–Pituitary–Adrenal Axis\"]\nquestions: [\"心理上的威胁如何引起身体激素变化？\", \"为什么被人评价的情境会让人产生明显压力反应？\"]\nsources: [{\"book\": \"emotions\", \"chapter\": \"第5章 身体变化与情绪\", \"locator\": \"第5章 · The Hypothalamic–Pituitary–Adrenal Axis\", \"epubPath\": \"OPS/c05.xhtml#head-3-63\"}]\ncandidateRelated: [{\"title\": \"情绪评价理论\", \"reason\": \"事件被理解为威胁才进入具体应对过程\"}, {\"title\": \"易感性—压力模型\", \"reason\": \"把压力与长期脆弱性相结合\"}]\n---\n\n## 核心解释\n\n教材描述一条神经内分泌通路：应激事件经相关脑系统影响下丘脑，下丘脑作用于垂体，促肾上腺皮质激素进一步促使肾上腺释放皮质醇。这样的变化有助于身体调动资源应对挑战。实验中，受到负面社会评价以及担忧、威胁与不确定的评价，均与应激反应相关。\n\n## 一个例子\n\n理解用例：临时面对一组表情严肃的评委发言时，一个人既觉得自己正在被否定，也出现明显身体紧张；这类情境用于研究社会评价压力。\n\n## 理解边界\n\n激素水平不能单独告诉我们一个人正在体验哪种情绪。应激反应要结合时间、情境和其他测量理解，本卡不提供临床判断。\n"}, {"id": "emotion-ideal-affect", "title": "理想情感与情感评价", "english": "Affect Valuation and Ideal Affect", "kind": "理论", "domain": "emotion", "subdomain": "文化与情绪", "summary": "人们不仅有正在体验的情绪，也有希望体验的情绪；文化价值会使兴奋或平静等状态受到不同重视，并影响选择和互动。", "aliases": ["Affect Valuation Theory", "情感评估理论"], "keywords": ["理想情感", "情感评价", "Jeanne Tsai", "文化价值", "兴奋", "平静", "唤醒", "积极情绪", "ideal affect", "Affect Valuation and Ideal Affect"], "questions": ["为什么有些人追求兴奋，另一些人更向往平静？", "偏爱的情绪状态如何影响对他人的好感和选择？"], "sources": [{"book": "emotions", "chapter": "第3章 情绪的文化理解", "locator": "第3章 · Values", "epubPath": "OPS/c03.xhtml#head-3-35"}], "candidateRelated": [{"title": "独立与互依自我建构", "reason": "自我与文化价值影响偏爱的情绪"}, {"title": "情绪展示规则与情绪方言", "reason": "文化偏好也可能体现于情绪表达"}], "sections": [{"heading": "核心解释", "text": "教材介绍情感评价观点：更能服务某种文化价值的情绪也更受重视。强调表达与成就的环境可能更珍视高唤醒的积极情绪，强调和谐关系的环境可能更珍视平静与满足。理想情感因此会影响人对活动、表达方式和交往对象的偏好，它不等同于当下实际情绪。"}, {"heading": "一个例子", "text": "理解用例：安排周末时，两位朋友一位期待刺激的活动，另一位期待安静相处；他们都在追求积极体验，但心目中理想的积极状态不同。"}, {"heading": "理解边界", "text": "理想情感、实际体验及一般文化价值应区分测量。这里描述的是文化层面的相对趋势，不能据此认定个人只能喜欢一种状态。"}], "markdown": "---\nid: \"emotion-ideal-affect\"\ntitle: \"理想情感与情感评价\"\nenglish: \"Affect Valuation and Ideal Affect\"\nkind: \"理论\"\ndomain: \"emotion\"\nsubdomain: \"文化与情绪\"\nsummary: \"人们不仅有正在体验的情绪，也有希望体验的情绪；文化价值会使兴奋或平静等状态受到不同重视，并影响选择和互动。\"\naliases: [\"Affect Valuation Theory\", \"情感评估理论\"]\nkeywords: [\"理想情感\", \"情感评价\", \"Jeanne Tsai\", \"文化价值\", \"兴奋\", \"平静\", \"唤醒\", \"积极情绪\", \"ideal affect\", \"Affect Valuation and Ideal Affect\"]\nquestions: [\"为什么有些人追求兴奋，另一些人更向往平静？\", \"偏爱的情绪状态如何影响对他人的好感和选择？\"]\nsources: [{\"book\": \"emotions\", \"chapter\": \"第3章 情绪的文化理解\", \"locator\": \"第3章 · Values\", \"epubPath\": \"OPS/c03.xhtml#head-3-35\"}]\ncandidateRelated: [{\"title\": \"独立与互依自我建构\", \"reason\": \"自我与文化价值影响偏爱的情绪\"}, {\"title\": \"情绪展示规则与情绪方言\", \"reason\": \"文化偏好也可能体现于情绪表达\"}]\n---\n\n## 核心解释\n\n教材介绍情感评价观点：更能服务某种文化价值的情绪也更受重视。强调表达与成就的环境可能更珍视高唤醒的积极情绪，强调和谐关系的环境可能更珍视平静与满足。理想情感因此会影响人对活动、表达方式和交往对象的偏好，它不等同于当下实际情绪。\n\n## 一个例子\n\n理解用例：安排周末时，两位朋友一位期待刺激的活动，另一位期待安静相处；他们都在追求积极体验，但心目中理想的积极状态不同。\n\n## 理解边界\n\n理想情感、实际体验及一般文化价值应区分测量。这里描述的是文化层面的相对趋势， 体，观察者可能只把前者理解为真正感到羞惭。\n\n## 理解边界\n\n该概念描述观察者的归因偏差，不是外群体实际情绪能力的差异。它也不是所有去人性化的总称，需要明确研究所用的情绪类别。\n"}, {"id": "emotion-interoception", "title": "内感受", "english": "Interoception", "kind": "心理过程", "domain": "emotion", "subdomain": "身体与情绪", "summary": "内感受是对身体内部信号的觉察；客观识别能力、主观自认为敏感的程度，以及对自身准确性的了解，是需要分别考察的层面。", "aliases": [], "keywords": ["内感受", "身体觉察", "心跳", "呼吸", "前岛叶", "元认知", "准确性", "情绪体验", "身体信号", "Interoception"], "questions": ["觉得自己很能察觉身体变化就一定察觉得准确吗？", "身体内部信号怎样参与情绪体验？"], "sources": [{"book": "emotions", "chapter": "第5章 身体变化与情绪", "locator": "第5章 · Interoception", "epubPath": "OPS/c05.xhtml#head-3-66"}, {"book": "emotions", "chapter": "第7章 脑机制与情绪", "locator": "第7章 · Bodily Awareness and Subjective Feeling: The Anterior Insular Cortex", "epubPath": "OPS/c07.xhtml#head-2-72"}], "candidateRelated": [{"title": "詹姆斯—兰格理论", "reason": "身体变化进入体验的历史理论来源"}, {"title": "躯体标记假说", "reason": "身体信号可能参与决策"}], "sections": [{"heading": "核心解释", "text": "心血管、呼吸、内脏等身体变化持续向大脑提供信号，内感受描述人对这些内部状态的觉察。教材区分客观任务表现、主观敏感性和二者校准的元认知层面，并讨论前岛叶对身体信号与主观体验的参与。关注身体很多，不必然代表对身体变化的判断准确。"}, {"heading": "一个例子", "text": "理解用例：两人都说能感觉到自己的心跳，但把报告和实际记录相比后，准确性可能不同；是否了解自身判断可靠，也需要另行考察。"}, {"heading": "理解边界", "text": "身体觉察、测量准确性和情绪适应不是同一个指标。单一心跳任务不能概括全部内感受，脑区参与也不是情绪的唯一来源。"}], "markdown": "---\nid: \"emotion-interoception\"\ntitle: \"内感受\"\nenglish: \"Interoception\"\nkind: \"心理过程\"\ndomain: \"emotion\"\nsubdomain: \"身体与情绪\"\nsummary: \"内感受是对身体内部信号的觉察；客观识别能力、主观自认为敏感的程度，以及对自身准确性的了解，是需要分别考察的层面。\"\naliases: []\nkeywords: [\"内感受\", \"身体觉察\", \"心跳\", \"呼吸\", \"前岛叶\", \"元认知\", \"准确性\", \"情绪体验\", \"身体信号\", \"Interoception\"]\nquestions: [\"觉得自己很能察觉身体变化就一定察觉得准确吗？\", \"身体内部信号怎样参与情绪体验？\"]\nsources: [{\"book\": \"emotions\", \"chapter\": \"第5章 身体变化与情绪\", \"locator\": \"第5章 · Interoception\", \"epubPath\": \"OPS/c05.xhtml#head-3-66\"}, {\"book\": \"emotions\", \"chapter\": \"第7章 脑机制与情绪\", \"locator\": \"第7章 · Bodily Awareness and Subjective Feeling: The Anterior Insular Cortex\", \"epubPath\": \"OPS/c07.xhtml#head-2-72\"}]\ncandidateRelated: [{\"title\": \"詹姆斯—兰格理论\", \"reason\": \"身体变化进入体验的历史理论来源\"}, {\"title\": \"躯体标记假说\", \"reason\": \"身体信号可能参与决策\"}]\n---\n\n## 核心解释\n\n心血管、呼吸、内脏等身体变化持续向大脑提供信号，内感受描述人对这些内部状态的觉察。教材区分客观任务表现、主观敏感性和二者校准的元认知层面，并讨论前岛叶对身体信号与主观体验的参与。关注身体很多，不必然代表对身体变化的判断准确。\n\n## 一个例子\n\n理解用例：两人都说能感觉到自己的心跳，但把报告和实际记录相比后，准确性可能不同；是否了解自身判断可靠，也需要另行考察。\n\n## 理解边界\n\n身体觉察、测量准确性和情绪适应不是同一个指标。单一心跳任务不能概括全部内感受，脑区参与也不是情绪的唯一来源。\n"}, {"id": "emotion-james-lange", "title": "詹姆斯—兰格理论", "english": "James–Lange Theory", "kind": "理论", "domain": "emotion", "subdomain": "身体与情绪", "summary": "詹姆斯—兰格理论把情绪体验理解为对身体变化的感知，强调心跳、姿势、呼吸等身体反应参与构成我们的情绪感受。", "aliases": ["James-Lange理论", "身体情绪理论"], "keywords": ["詹姆斯", "兰格", "身体反馈", "生理唤醒", "心跳", "体验", "身体感知", "情绪产生", "James–Lange Theory"], "questions": ["我们先害怕才发抖，还是感受到发抖才体验害怕？", "身体反应在情绪体验中起什么作用？"], "sources": [{"book": "emotions", "chapter": "第1章 情绪的理解路径", "locator": "第1章 · William James: The Bodily Approach", "epubPath": "OPS/c01.xhtml#head-3-3"}, {"book": "emotions", "chapter": "第5章 身体变化与情绪", "locator": "第5章 · Early Theorizing About Emotion and Bodily Changes", "epubPath": "OPS/c05.xhtml#head-2-45"}], "candidateRelated": [{"title": "内感受", "reason": "细化对身体内部信号的觉察"}, {"title": "情绪建构观点", "reason": "同样关注身体体验，但加入概念与情境作用"}], "sections": [{"heading": "核心解释", "text": "这一理论改变了“先有情绪再有身体反应”的常识顺序：事件引起身体变化，对这些变化的知觉构成情绪体验。詹姆斯关注自主神经、肌肉和关节信号，认为抽去全部身体感觉会使情绪失去具体质感。这一路径推动了后来对生理反应与情绪体验联系的研究。"}, {"heading": "一个例子", "text": "理解用例：演讲前发现自己心跳加快、手心出汗、肩膀紧绷，理论会关注这些身体变化如何进入意识，并构成你所体验的紧张。"}, {"heading": "理解边界", "text": "这是重要的历史理论，不能据此断言一种身体反应只对应一种情绪。教材还讨论评价、情境及概念化，对身体路线形成补充。"}], "markdown": "---\nid: \"emotion-james-lange\"\ntitle: \"詹姆斯—兰格理论\"\nenglish: \"James–Lange Theory\"\nkind: \"理论\"\ndomain: \"emotion\"\nsubdomain: \"身体与情绪\"\nsummary: \"詹姆斯—兰格理论把情绪体验理解为对身体变化的感知，强调心跳、姿势、呼吸等身体反应参与构成我们的情绪感受。\"\naliases: [\"James-Lange理论\", \"身体情绪理论\"]\nkeywords: [\"詹姆斯\", \"兰格\", \"身体反馈\", \"生理唤醒\", \"心跳\", \"体验\", \"身体感知\", \"情绪产生\", \"James–Lange Theory\"]\nquestions: [\"我们先害怕才发抖，还是感受到发抖才体验害怕？\", \"身体反应在情绪体验中起什么作用？\"]\nsources: [{\"book\": \"emotions\", \"chapter\": \"第1章 情绪的理解路径\", \"locator\": \"第1章 · William James: The Bodily Approach\", \"epubPath\": \"OPS/c01.xhtml#head-3-3\"}, {\"book\": \"emotions\", \"chapter\": \"第5章 身体变化与情绪\", \"locator\": \"第5章 · Early Theorizing About Emotion and Bodily Changes\", \"epubPath\": \"OPS/c05.xhtml#head-2-45\"}]\ncandidateRelated: [{\"title\": \"内感受\", \"reason\": \"细化对身体内部信号的觉察\"}, {\"title\": \"情绪建构观点\", \"reason\": \"同样关注身体体验，但加入概念与情境作用\"}]\n---\n\n## 核心解释\n\n这一理论改变了“先有情绪再有身体反应”的常识顺序：事件引起身体变化，对这些变化的知觉构成情绪体验。詹姆斯关注自主神经、肌肉和关节信号，认为抽去全部身体感觉会使情绪失去具体质感。这一路径推动了后来对生理反应与情绪体验联系的研究。\n\n## 一个例子\n\n理解用例：演讲前发现自己心跳加快、手心出汗、肩膀紧绷，理论会关注这些身体变化如何进入意识，并构成你所体验的紧张。\n\n## 理解边界\n\n这是重要的历史理论，不能据此断言一种身体反应只对应一种情绪。教材还讨论评价、情境及概念化，对身体路线形成补充。\n"}, {"id": "emotion-meaningful-life", "title": "生活意义的心理来源", "english": "Sources of Meaning in Life", "kind": "模型", "domain": "emotion", "subdomain": "意义与福祉", "summary": "教材将生活意义联系到社会目的与关系，并借助自主、胜任、联结和善益四个方面，理解人为什么觉得某些活动值得持续投入。", "aliases": [], "keywords": ["生活意义", "自主", "胜任", "联结", "善益", "合作", "社会目的", "福祉", "意义感", "Sources of Meaning in Life"], "questions": ["有意义的活动与让人即时快乐的活动有什么区别？", "哪些心理经验会使人觉得自己所做的事值得？"], "sources": [{"book": "emotions", "chapter": "第14章 有意义的生活", "locator": "第14章 · Meaning in Life", "epubPath": "OPS/c14.xhtml#head-2-144"}], "candidateRelated": [{"title": "心流", "reason": "投入具体活动是理解意义的一条经验路径"}, {"title": "群体情绪与集体情绪", "reason": "共同身份与活动可以提供关系中的意义"}], "sections": [{"heading": "核心解释", "text": "教材把人的合作和关系视为意义的重要背景，并介绍自主、胜任、联结与善益的框架：人能拥有自己的行动、发挥和发展能力、与他人相连，并为别人带来好处时，活动更容易获得目的感。情绪在其中指示目标与关系是否得到支持，意义也不必限于重大成就。"}, {"heading": "一个例子", "text": "理解用例：持续参与一项小型社区活动可能并不时时轻松，但当人能自主贡献技能、建立关系并看到对他人的帮助时，仍可能觉得很值得。"}, {"heading": "理解边界", "text": "这是组织意义来源的心理框架，不是每个人都必须完成的清单。意义与愉悦可以重叠，但不应把暂时不快乐直接等同于没有意义。"}], "markdown": "---\nid: \"emotion-meaningful-life\"\ntitle: \"生活意义的心理来源\"\nenglish: \"Sources of Meaning in Life\"\nkind: \"模型\"\ndomain: \"emotion\"\nsubdomain: \"意义与福祉\"\nsummary: \"教材将生活意义联系到社会目的与关系，并借助自主、胜任、联结和善益四个方面，理解人为什么觉得某些活动值得持续投入。\"\naliases: []\nkeywords: [\"生活意义\", \"自主\", \"胜任\", \"联结\", \"善益\", \"合作\", \"社会目的\", \"福祉\", \"意义感\", \"Sources of Meaning in Life\"]\nquestions: [\"有意义的活动与让人即时快乐的活动有什么区别？\", \"哪些心理经验会使人觉得自己所做的事值得？\"]\nsources: [{\"book\": \"emotions\", \"chapter\": \"第14章 有意义的生活\", \"locator\": \"第14章 · Meaning in Life\", \"epubPath\": \"OPS/c14.xhtml#head-2-144\"}]\ncandidateRelated: [{\"title\": \"心流\", \"reason\": \"投入具体活动是理解意义的一条经验路径\"}, {\"title\": \"群体情绪与集体情绪\", \"reason\": \"共同身份与活动可以提供关系中的意义\"}]\n---\n\n## 核心解释\n\n教材把人的合作和关系视为意义的重要背景，并介绍自主、胜任、联结与善益的框架：人能拥有自己的行动、发挥和发展能力、与他人相连，并为别人带来好处时，活动更容易获得目的感。情绪在其中指示目标与关系是否得到支持，意义也不必限于重大成就。\n\n## 一个例子\n\n理解用例：持续参与一项小型社区活动可能并不时时轻松，但当人能自主贡献技能、建立关系并看到对他人的帮助时，仍可能觉得很值得。\n\n## 理解边界\n\n这是组织意义来源的心理框架，不是每个人都必须完成的清单。意义与愉悦可以重叠，但不应把暂时不快乐直接等同于没有意义。\n"}, {"id": "emotion-memory-reconstruction", "title": "情绪与重构性记忆", "english": "Emotion and Reconstructive Memory", "kind": "心理过程", "domain": "emotion", "subdomain": "情绪与记忆", "summary": "记忆并非原样回放：人用图式、突出细节和当下情绪重构过去，因此对以前感受的回忆可能随当前关系及心境发生偏移。", "aliases": [], "keywords": ["重构性记忆", "图式", "巴特利特", "情绪记忆", "回忆偏差", "当前情绪", "自传记忆", "记忆强度", "过去感受", "Emotion and Reconstructive Memory"], "questions": ["为什么现在的感受会改变对以前感受的回忆？", "记住情绪强烈的细节就意味着整体记忆准确吗？"], "sources": [{"book": "emotions", "chapter": "第10章 情绪与思维", "locator": "第10章 · Effects on Remembering", "epubPath": "OPS/c10.xhtml#head-3-134"}, {"book": "emotions", "chapter": "第10章 情绪与思维", "locator": "第10章 · Emotion‐Related Biases in Memory", "epubPath": "OPS/c10.xhtml#head-3-135"}], "candidateRelated": [{"title": "情感注入模型", "reason": "当前情绪可能影响信息的提取与整合"}, {"title": "反刍与情绪延续", "reason": "反复提取负面记忆可能参与低落的延续"}], "sections": [{"heading": "核心解释", "text": "教材以巴特利特的图式观点说明，回忆由残留细节、一般知识和情绪态度共同重建，而非复制原始记录。当前的悲伤、依恋或疏离也会改变对过去情绪的估计；一些研究还发现，人会低估过去体验的强度。因而研究情绪历史时，应区别当时报告与事后回忆。"}, {"heading": "一个例子", "text": "理解用例：一段友谊变得疏远后，一个人可能觉得“刚认识时就没那么喜欢他”，但当年的日记却记录了明显的亲近与兴奋。"}, {"heading": "理解边界", "text": "重构不表示所有记忆都不可信，也不是每次都会朝同一方向改变。准确性需要具体参照，情绪鲜明和确信程度都不能替代核对。"}], "markdown": "---\nid: \"emotion-memory-reconstruction\"\ntitle: \"情绪与重构性记忆\"\nenglish: \"Emotion and Reconstructive Memory\"\nkind: \"心理过程\"\ndomain: \"emotion\"\nsubdomain: \"情绪与记忆\"\nsummary: \"记忆并非原样回放：人用图式、突出细节和当下情绪重构过去，因此对以前感受的回忆可能随当前关系及心境发生偏移。\"\naliases: []\nkeywords: [\"重构性记忆\", \"图式\", \"巴特利特\", \"情绪记忆\", \"回忆偏差\", \"当前情绪\", \"自传记忆\", \"记忆强度\", \"过去感受\", \"Emotion and Reconstructive Memory\"]\nquestions: [\"为什么现在的感受会改变对以前感受的回忆？\", \"记住情绪强烈的细节就意味着整体记忆准确吗？\"]\nsources: [{\"book\": \"emotions\", \"chapter\": \"第10章 情绪与思维\", \"locator\": \"第10章 · Effects on Remembering\", \"epubPath\": \"OPS/c10.xhtml#head-3-134\"}, {\"book\": \"emotions\", \"chapter\": \"第10章 情绪与思维\", \"locator\": \"第10章 · Emotion‐Related Biases in Memory\", \"epubPath\": \"OPS/c10.xhtml#head-3-135\"}]\ncandidateRelated: [{\"title\": \"情感注入模型\", \"reason\": \"当前情绪可能影响信息的提取与整合\"}, {\"title\": \"反刍与情绪延续\", \"reason\": \"反复提取负面记忆可能参与低落的延续\"}]\n---\n\n## 核心解释\n\n教材以巴特利特的图式观点说明，回忆由残留细节、一般知识和情绪态度共同重建，而非复制原始记录。当前的悲伤、依恋或疏离也会改变对过去情绪的估计；一些研究还发现，人会低估过去体验的强度。因而研究情绪历史时，应区别当时报告与事后回忆。\n\n## 一个例子\n\n理解用例：一段友谊变得疏远后，一个人可能觉得“刚认识时就没那么喜欢他”，但当年的日记却记录了明显的亲近与兴奋。\n\n## 理解边界\n\n重构不表示所有记忆都不可信，也不是每次都会朝同一方向改变。准确性需要具体参照，情绪鲜明和确信程度都不能替代核对。\n"}, {"id": "emotion-mindfulness", "title": "正念与当下觉察", "english": "Mindfulness", "kind": "概念", "domain": "emotion", "subdomain": "注意与反思", "summary": "正念取向关注对当下身体、思想和情绪的觉察，以及不急于判断的关系；教材也比较了冥想传统与重视新视角的西方取向。", "aliases": [], "keywords": ["正念", "当下觉察", "不评判", "注意", "接纳", "思想", "情绪", "Kabat-Zinn", "Langer", "Mindfulness"], "questions": ["注意到一个念头与马上被它带着行动有何不同？", "正念是否就是让大脑完全没有想法？"], "sources": [{"book": "emotions", "chapter": "第14章 有意义的生活", "locator": "第14章 · Mindfulness, Ancient and Modern", "epubPath": "OPS/c14.xhtml#head-2-150"}], "candidateRelated": [{"title": "情绪调节过程模型", "reason": "注意与反应关系是调节的重要环节"}, {"title": "反刍与情绪延续", "reason": "关注与反复消极思考不同的心理关系"}], "sections": [{"heading": "核心解释", "text": "教材中的正念强调觉察正在发生的心理状态，并改变人与这些状态的关系，而不是要求思想和感受消失。源于冥想传统的取向重视非评判的接纳，兰格式取向重视对当前活动作出新区分和采用新视角。二者都可帮助人减少被单一解释或自动反应完全牵引。"}, {"heading": "一个例子", "text": "理解用例：注意到“别人一定不喜欢我”这个念头时，可以把它识别为正在出现的想法，而不立刻把它当作已确认事实；这里展示的是概念区别。"}, {"heading": "理解边界", "text": "正念不等于压抑情绪、放弃判断或保证始终平静。本卡仅解释教材概念及取向差别，不替代对具体心理困难的专业评估。"}], "markdown": "---\nid: \"emotion-mindfulness\"\ntitle: \"正念与当下觉察\"\nenglish: \"Mindfulness\"\nkind: \"概念\"\ndomain: \"emotion\"\nsubdomain: \"注意与反思\"\nsummary: \"正念取向关注对当下身体、思想和情绪的觉察，以及不急于判断的关系；教材也比较了冥想传统与重视新视角的西方取向。\"\naliases: []\nkeywords: [\"正念\", \"当下觉察\", \"不评判\", \"注意\", \"接纳\", \"思想\", \"情绪\", \"Kabat-Zinn\", \"Langer\", \"Mindfulness\"]\nquestions: [\"注意到一个念头与马上被它带着行动有何不同？\", \"正念是否就是让大脑完全没有想法？\"]\nsources: [{\"book\": \"emotions\", \"chapter\": \"第14章 有意义的生活\", \"locator\": \"第14章 · Mindfulness, Ancient and Modern\", \"epubPath\": \"OPS/c14.xhtml#head-2-150\"}]\ncandidateRelated: [{\"title\": \"情绪调节过程模型\", \"reason\": \"注意与反应关系是调节的重要环节\"}, {\"title\": \"反刍与情绪延续\", \"reason\": \"关注与反复消极思考不同的心理关系\"}]\n---\n\n## 核心解释\n\n教材中的正念强调觉察正在发生的心理状态，并改变人与这些状态的关系，而不是要求思想和感受消失。源于冥想传统的取向重视非评判的接纳，兰格式取向重视对当前活动作出新区分和采用新视角。二者都可帮助人减少被单一解释或自动反应完全牵引。\n\n## 一个例子\n\n理解用例：注意到“别人一定不喜欢我”这个念头时，可以把它识别为正在出现的想法，而不立刻把它当作已确认事实；这里展示的是概念区别。\n\n## 理解边界\n\n正念不等于压抑情绪、放弃判断或保证始终平静。本卡仅解释教材概念及取向差别，不替代对具体心理困难的专业评估。\n"}, {"id": "emotion-mood-memory", "title": "心境一致性与心境依赖记忆", "english": "Mood-congruent and mood-state-dependent memory", "kind": "效应", "domain": "emotion", "subdomain": "情绪与记忆", "summary": "情绪既可能改变哪些内容容易被回忆，也可能成为提取背景。与当前心境一致的内容，和在相似心境下学过的内容，是两种不同关系。", "aliases": ["Mood-congruent and mood-state-dependent memory"], "keywords": ["心境一致性与心境依赖记忆", "Mood-congruent and mood-state-dependent memory", "情绪与记忆", "情绪", "回忆", "心境", "正面", "负面", "状态依赖"], "questions": ["心境一致性与心境依赖记忆解释了什么心理现象？", "心境一致性与心境依赖记忆在什么条件下适用，有什么局限？"], "sources": [{"book": "cognitive", "chapter": "第15章 · 认知与情绪", "locator": "PDF 第 792–793 页", "pdfPages": [792, 793]}], "candidateRelated": [{"title": "情景记忆与语义记忆", "reason": "情绪影响经历信息的提取"}, {"title": "提取线索与编码联系", "reason": "状态相似可构成一种提取线索"}], "sections": [{"heading": "核心解释", "text": "心境一致性指当前情绪与材料情感色彩一致时更容易加工或回忆；心境依赖记忆指学习与提取时的心境相似有利于记忆。前者涉及内容匹配，后者涉及状态匹配。教材指出，这些效应并非总同样强，正向心境下往往更稳定。"}, {"heading": "一个例子", "text": "理解用例：心情愉快时更容易想起愉快往事，体现内容与心境一致；同一材料若在相似状态中学习和回忆更容易提取，则属于状态依赖。"}, {"heading": "理解边界", "text": "两种效应不能混用，也不是每次都会出现。记忆增强还涉及注意、控制和脑网络交互，不能把情绪作用归结为简单的情绪标签匹配。"}], "markdown": "---\nid: \"emotion-mood-memory\"\ntitle: \"心境一致性与心境依赖记忆\"\nenglish: \"Mood-congruent and mood-state-dependent memory\"\nkind: \"效应\"\ndomain: \"emotion\"\nsubdomain: \"情绪与记忆\"\nsummary: \"情绪既可能改变哪些内容容易被回忆，也可能成为提取背景。与当前心境一致的内容，和在相似心境下学过的内容，是两种不同关系。\"\naliases: [\"Mood-congruent and mood-state-dependent memory\"]\nkeywords: [\"心境一致性与心境依赖记忆\", \"Mood-congruent and mood-state-dependent memory\", \"情绪与记忆\", \"情绪\", \"回忆\", \"心境\", \"正面\", \"负面\", \"状态依赖\"]\nquestions: [\"心境一致性与心境依赖记忆解释了什么心理现象？\", \"心境一致性与心境依赖记忆在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"cognitive\", \"chapter\": \"第15章 · 认知与情绪\", \"locator\": \"PDF 第 792–793 页\", \"pdfPages\": [792, 793]}]\ncandidateRelated: [{\"title\": \"情景记忆与语义记忆\", \"reason\": \"情绪影响经历信息的提取\"}, {\"title\": \"提取线索与编码联系\", \"reason\": \"状态相似可构成一种提取线索\"}]\n---\n\n## 核心解释\n\n心境一致性指当前情绪与材料情感色彩一致时更容易加工或回忆；心境依赖记忆指学习与提取时的心境相似有利于记忆。前者涉及内容匹配，后者涉及状态匹配。教材指出，这些效应并非总同样强，正向心境下往往更稳定。\n\n## 一个例子\n\n理解用例：心情愉快时更容易想起愉快往事，体现内容与心境一致；同一材料若在相似状态中学习和回忆更容易提取，则属于状态依赖。\n\n## 理解边界\n\n两种效应不能混用，也不是每次都会出现。记忆增强还涉及注意、控制和脑网络交互，不能把情绪作用归结为简单的情绪标签匹配。\n"}, {"id": "emotion-p-factor", "title": "一般心理病理因素", "english": "General Psychopathology Factor", "kind": "模型", "domain": "clinical", "subdomain": "心理病理的理解", "summary": "一般心理病理因素用共同潜在维度描述多类症状为何共同出现；教材讨论情绪失调和负性情绪的可能作用，但其本质仍需检验。", "aliases": ["p factor"], "keywords": ["p因素", "一般心理病理", "共病", "潜变量", "跨诊断", "情绪失调", "负性情绪", "异质性", "共同风险", "General Psychopathology Factor"], "questions": ["为什么一些人会同时出现不同类别的心理困难？", "共同统计因素是否就是共同的单一病因？"], "sources": [{"book": "emotions", "chapter": "第12章 儿童情绪的心理病理", "locator": "第12章 · Comorbidity, Heterogeneity, and the “p” Factor", "epubPath": "OPS/c12.xhtml#head-3-167"}, {"book": "emotions", "chapter": "第12章 儿童情绪的心理病理", "locator": "第12章 · Homotypic and Heterotypic Continuity", "epubPath": "OPS/c12.xhtml#head-3-174"}], "candidateRelated": [{"title": "心理病理的类别与维度", "reason": "维度化理解有助于观察共有结构"}, {"title": "情绪问题的同型与异型连续性", "reason": "一般因素可能解释部分跨类别稳定性"}], "sections": [{"heading": "核心解释", "text": "频繁共病和同类诊断内部的异质性，促使研究者考察心理病理的层级结构。一般因素概括多种问题的共同变异，跨诊断取向则寻找共有的行为、心理与生物过程。教材讨论情绪反应和调节困难可能构成共同易感性，并联系到症状跨类别延续的现象。"}, {"heading": "一个例子", "text": "理解用例：一个儿童的注意、行为和低落问题共同变化，研究者可能检验是否有一般因素解释这种共同性，而不只分别计算每类问题。"}, {"heading": "理解边界", "text": "潜在因素是对共同变异的模型表达，不能直接当作已发现的实体或唯一病因。情绪失调是否足以解释它，需要进一步证据。"}], "markdown": "---\nid: \"emotion-p-factor\"\ntitle: \"一般心理病理因素\"\nenglish: \"General Psychopathology Factor\"\nkind: \"模型\"\ndomain: \"clinical\"\nsubdomain: \"心理病理的理解\"\nsummary: \"一般心理病理因素用共同潜在维度描述多类症状为何共同出现；教材讨论情绪失调和负性情绪的可能作用，但其本质仍需检验。\"\naliases: [\"p factor\"]\nkeywords: [\"p因素\", \"一般心理病理\", \"共病\", \"潜变量\", \"跨诊断\", \"情绪失调\", \"负性情绪\", \"异质性\", \"共同风险\", \"General Psychopathology Factor\"]\nquestions: [\"为什么一些人会同时出现不同类别的心理困难？\", \"共同统计因素是否就是共同的单一病因？\"]\nsources: [{\"book\": \"emotions\", \"chapter\": \"第12章 儿童情绪的心理病理\", \"locator\": \"第12章 · Comorbidity, Heterogeneity, and the “p” Factor\", \"epubPath\": \"OPS/c12.xhtml#head-3-167\"}, {\"book\": \"emotions\", \"chapter\": \"第12章 儿童情绪的心理病理\", \"locator\": \"第12章 · Homotypic and Heterotypic Continuity\", \"epubPath\": \"OPS/c12.xhtml#head-3-174\"}]\ncandidateRelated: [{\"title\": \"心理病理的类别与维度\", \"reason\": \"维度化理解有助于观察共有结构\"}, {\"title\": \"情绪问题的同型与异型连续性\", \"reason\": \"一般因素可能解释部分跨类别稳定性\"}]\n---\n\n## 核心解释\n\n频繁共病和同类诊断内部的异质性，促使研究者考察心理病理的层级结构。一般因素概括多种问题的共同变异，跨诊断取向则寻找共有的行为、心理与生物过程。教材讨论情绪反应和调节困难可能构成共同易感性，并联系到症状跨类别延续的现象。\n\n## 一个例子\n\n理解用例：一个儿童的注意、行为和低落问题共同变化，研究者可能检验是否有一般因素解释这种共同性，而不只分别计算每类问题。\n\n## 理解边界\n\n潜在因素是对共同变异的模型表达，不能直接当作已发现的实体或唯一病因。情绪失调是否足以解释它，需要进一步证据。\n"}, {"id": "emotion-regulation-development", "title": "儿童情绪调节的发展", "english": "Development of Emotion Regulation", "kind": "心理过程", "domain": "development", "subdomain": "儿童情绪发展", "summary": "儿童情绪调节从依赖照料者 otion Regulation", "kind": "模型", "domain": "emotion", "subdomain": "情绪调节", "summary": "情绪调节可以发生在情境、注意、解释和反应等不同位置；重评、分心与表达抑制的作用对象不同，效果也依赖情境和目标。", "aliases": ["Gross情绪调节模型"], "keywords": ["情绪调节", "Gross", "情境选择", "情境修改", "注意分配", "认知重评", "表达抑制", "分心", "调节策略", "Process Model of Emotion Regulation"], "questions": ["转移注意、换个角度想和忍住表情有什么不同？", "情绪调节是否总是让负面情绪变少？"], "sources": [{"book": "emotions", "chapter": "第6章 评价、体验与调节", "locator": "第6章 · Distraction, Reappraisal, Suppression", "epubPath": "OPS/c06.xhtml#head-3-86"}], "candidateRelated": [{"title": "情绪评价理论", "reason": "重评通过改变意义作用于情绪"}, {"title": "儿童情绪调节的发展", "reason": "不同调节方式的可用性随发展变化"}], "sections": [{"heading": "核心解释", "text": "格罗斯的过程模型区分情境选择、情境修改、注意分配、认知改变和反应调节。分心主要改变注意，重评改变事件的意义，表达抑制较晚作用于外在反应。调节既可能减弱也可能增强情绪；教材强调，应结合社会目标、关系和文化比较策略，不能只看是否表现得平静。"}, {"heading": "一个例子", "text": "理解用例：等待重要消息时，去做别的事是转移注意，提醒自己延期不等于失败是重评，而继续焦虑却装作镇定更接近表达抑制。"}, {"heading": "理解边界", "text": "外表平静不等于体验已减弱，单一实验中更有效的策略也不适用于所有场景。文化规范、任务与人际目标会改变策略的后果。"}], "markdown": "---\nid: \"emotion-regulation-process\"\ntitle: \"情绪调节过程模型\"\nenglish: \"Process Model of Emotion Regulation\"\nkind: \"模型\"\ndomain: \"emotion\"\nsubdomain: \"情绪调节\"\nsummary: \"情绪调节可以发生在情境、注意、解释和反应等不同位置；重评、分心与表达抑制的作用对象不同，效果也依赖情境和目标。\"\naliases: [\"Gross情绪调节模型\"]\nkeywords: [\"情绪调节\", \"Gross\", \"情境选择\", \"情境修改\", \"注意分配\", \"认知重评\", \"表达抑制\", \"分心\", \"调节策略\", \"Process Model of Emotion Regulation\"]\nquestions: [\"转移注意、换个角度想和忍住表情有什么不同？\", \"情绪调节是否总是让负面情绪变少？\"]\nsources: [{\"book\": \"emotions\", \"chapter\": \"第6章 评价、体验与调节\", \"locator\": \"第6章 · Distraction, Reappraisal, Suppression\", \"epubPath\": \"OPS/c06.xhtml#head-3-86\"}]\ncandidateRelated: [{\"title\": \"情绪评价理论\", \"reason\": \"重评通过改变意义作用于情绪\"}, {\"title\": \"儿童情绪调节的发展\", \"reason\": \"不同调节方式的可用性随发展变化\"}]\n---\n\n## 核心解释\n\n格罗斯的过程模型区分情境选择、情境修改、注意分配、认知改变和反应调节。分心主要改变注意，重评改变事件的意义，表达抑制较晚作用于外在反应。调节既可能减弱也可能增强情绪；教材强调，应结合社会目标、关系和文化比较策略，不能只看是否表现得平静。\n\n## 一个例子\n\n理解用例：等待重要消息时，去做别的事是转移注意，提醒自己延期不等于失败是重评，而继续焦虑却装作镇定更接近表达抑制。\n\n## 理解边界\n\n外表
