lish: \"ABC model of emotion\"\nkind: \"模型\"\ndomain: \"clinical\"\nsubdomain: \"认知与行为改变\"\nsummary: \"事件的情绪后果受到对事件的信念与解释影响。ABC模型把触发事件、相关信念和后果分开，帮助看清解释如何参与情绪反应。\"\naliases: [\"ABC model of emotion\"]\nkeywords: [\"ABC认知模型\", \"ABC model of emotion\", \"认知与行为改变\", \"信念\", \"解释\", \"情绪\", \"ABC\", \"认知治疗\", \"思维\"]\nquestions: [\"ABC认知模型解释了什么心理现象？\", \"ABC认知模型在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"general\", \"chapter\": \"第16章 · 心理障碍的治疗\", \"locator\": \"PDF 第 1392–1394 页\", \"pdfPages\": [1392, 1394]}]\ncandidateRelated: [{\"title\": \"情绪的认知评价理论\", \"reason\": \"两者都关注事件的主观意义\"}, {\"title\": \"绝望理论\", \"reason\": \"习惯解释可能参与情绪维持\"}]\n---\n\n## 核心解释\n\nEllis用A表示触发事件，B表示被激活的信念，C表示情绪和行为后果。模型认为，绝对化要求或习惯解释可能使情境更难应对，认知治疗因此关注识别并检验这些想法。它提供可讨论的过程框架，同时不意味着外在事件和现实条件可以被忽略。\n\n## 一个例子\n\n理解用例：收到一条批评后，若把它理解为“我必须让所有人满意，否则毫无价值”，产生的情绪可能不同于“这是一条需要核对的具体意见”。\n\n## 理解边界\n\n本条介绍理论，不是个人治疗方案。认知只是情绪形成的一部分，不能把痛苦简化成想法错误，也不能由一张卡判断适合哪种治疗。\n"}, {"id": "clinical-exposure-extinction", "title": "暴露与消退学习", "english": "Exposure and extinction learning", "kind": "心理过程", "domain": "clinical", "subdomain": "认知与行为改变", "summary": "在与原有预期不同的条件下重新接触线索，可能减弱先前的恐惧反应。教材用习惯化和消退解释部分暴露方法，并区分其学习来源。", "aliases": ["Exposure and extinction learning"], "keywords": ["暴露与消退学习", "Exposure and extinction learning", "认知与行为改变", "暴露", "消退", "恐惧", "学习", "反应减弱", "预期"], "questions": ["暴露与消退学习解释了什么心理现象？", "暴露与消退学习在什么条件下适用，有什么局限？"], "sources": [{"book": "general", "chapter": "第16章 · 心理障碍的治疗", "locator": "PDF 第 1388–1389 页", "pdfPages": [1388, 1389]}], "candidateRelated": [{"title": "经典条件作用", "reason": "消退涉及线索与结果关系的改变"}, {"title": "习惯化", "reason": "反应减弱可来自不同学习过程"}], "sections": [{"heading": "核心解释", "text": "教材将暴露理解为在安全的安排下接触恐惧对象或情境，并讨论现实、想象与虚拟呈现。未习得反应随重复接触减弱可称习惯化，条件反应因线索不再跟随后果而减弱称消退。理解机制时要区分反应减弱与原学习是否真正消失。"}, {"heading": "一个例子", "text": "理解用例：用于说明原理的实验中，某个声音曾预示不愉快刺激，后来声音多次单独出现，反应可能减弱；换情境后仍可能再次反应。"}, {"heading": "理解边界", "text": "消退通常不等于永久删除原有学习。临床安排依个体和问题而异，这里只提供学习原理的教材解释，不构成自行操作的建议。"}], "markdown": "---\nid: \"clinical-exposure-extinction\"\ntitle: \"暴露与消退学习\"\nenglish: \"Exposure and extinction learning\"\nkind: \"心理过程\"\ndomain: \"clinical\"\nsubdomain: \"认知与行为改变\"\nsummary: \"在与原有预期不同的条件下重新接触线索，可能减弱先前的恐惧反应。教材用习惯化和消退解释部分暴露方法，并区分其学习来源。\"\naliases: [\"Exposure and extinction learning\"]\nkeywords: [\"暴露与消退学习\", \"Exposure and extinction learning\", \"认知与行为改变\", \"暴露\", \"消退\", \"恐惧\", \"学习\", \"反应减弱\", \"预期\"]\nquestions: [\"暴露与消退学习解释了什么心理现象？\", \"暴露与消退学习在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"general\", \"chapter\": \"第16章 · 心理障碍的治疗\", \"locator\": \"PDF 第 1388–1389 页\", \"pdfPages\": [1388, 1389]}]\ncandidateRelated: [{\"title\": \"经典条件作用\", \"reason\": \"消退涉及线索与结果关系的改变\"}, {\"title\": \"习惯化\", \"reason\": \"反应减弱可来自不同学习过程\"}]\n---\n\n## 核心解释\n\n教材将暴露理解为在安全的安排下接触恐惧对象或情境，并讨论现实、想象与虚拟呈现。未习得反应随重复接触减弱可称习惯化，条件反应因线索不再跟随后果而减弱称消退。理解机制时要区分反应减弱与原学习是否真正消失。\n\n## 一个例子\n\n理解用例：用于说明原理的实验中，某个声音曾预示不愉快刺激，后来声音多次单独出现，反应可能减弱；换情境后仍可能再次反应。\n\n## 理解边界\n\n消退通常不等于永久删除原有学习。临床安排依个体和问题而异，这里只提供学习原理的教材解释，不构成自行操作的建议。\n"}, {"id": "clinical-hopelessness-rumination", "title": "绝望理论", "english": "Hopelessness Theory", "kind": "理论", "domain": "clinical", "subdomain": "情绪问题的解释", "summary": "绝望理论关注对负面事件作灾难性、自我贬低及稳定而广泛的归因；这种推断可能使未来显得无法改善，并与抑郁风险相联系。", "aliases": ["Hopelessness theory"], "keywords": ["绝望理论", "绝望", "抑郁", "归因", "稳定原因", "广泛原因", "灾难性后果", "自我评价", "Hopelessness Theory"], "questions": ["为什么一次挫折会被理解成未来都不会改善？", "绝望的解释模式与反复思考痛苦有什么不同？"], "sources": [{"book": "general", "chapter": "第15章 · 心理障碍", "locator": "PDF 第 1300、1301、1312 页", "pdfPages": [1300, 1301, 1312]}], "candidateRelated": [{"title": "焦虑、抑郁与认知偏向", "reason": "关注情绪与信息加工的循环"}, {"title": "ABC认知模型", "reason": "信念与情绪后果之间存在联系"}, {"title": "反刍与情绪延续", "reason": "绝望推断与重复思考痛苦是不同但相关的过程"}], "sections": [{"heading": "核心解释", "text": "绝望理论强调对负面事件的三类推断：预期灾难性后果，认为事件揭示自身缺陷，以及把原因看成稳定且影响广泛。这样的解释可能使人觉得未来无法改善。教材讨论其预测后续抑郁的证据，也区分消极思维是情绪状态的反映，还是参与困难形成的因素。"}, {"heading": "一个例子", "text": "理解用例：一次考试失利后，把它理解为“我没有能力，所有学习都会失败，以后也不会改变”，就把具体事件扩展成了广泛而稳定的自我判断。"}, {"heading": "理解边界", "text": "此框架解释的是部分风险与维持机制，不能把心理问题归咎于个人想法。预测关联不等于每个人都按相同路径发展，也不用于自行诊断。"}], "markdown": "---\nid: \"clinical-hopelessness-rumination\"\ntitle: \"绝望理论\"\nenglish: \"Hopelessness Theory\"\nkind: \"理论\"\ndomain: \"clinical\"\nsubdomain: \"情绪问题的解释\"\nsummary: \"绝望理论关注对负面事件作灾难性、自我贬低及稳定而广泛的归因；这种推断可能使未来显得无法改善，并与抑郁风险相联系。\"\naliases: [\"Hopelessness theory\"]\nkeywords: [\"绝望理论\", \"绝望\", \"抑郁\", \"归因\", \"稳定原因\", \"广泛原因\", \"灾难性后果\", \"自我评价\", \"Hopelessness Theory\"]\nquestions: [\"为什么一次挫折会被理解成未来都不会改善？\", \"绝望的解释模式与反复思考痛苦有什么不同？\"]\nsources: [{\"book\": \"general\", \"chapter\": \"第15章 · 心理障碍\", \"locator\": \"PDF 第 1300、1301、1312 页\", \"pdfPages\": [1300, 1301, 1312]}]\ncandidateRelated: [{\"title\": \"焦虑、抑郁与认知偏向\", \"reason\": \"关注情绪与信息加工的循环\"}, {\"title\": \"ABC认知模型\", \"reason\": \"信念与情绪后果之间存在联系\"}, {\"title\": \"反刍与情绪延续\", \"reason\": \"绝望推断与重复思考痛苦是不同但相关的过程\"}]\n---\n\n## 核心解释\n\n绝望理论强调对负面事件的三类推断：预期灾难性后果，认为事件揭示自身缺陷，以及把原因看成稳定且影响广泛。这样的解释可能使人觉得未来无法改善。教材讨论其预测后续抑郁的证据，也区分消极思维是情绪状态的反映，还是参与困难形成的因素。\n\n## 一个例子\n\n理解用例：一次考试失利后，把它理解为“我没有能力，所有学习都会失败，以后也不会改变”，就把具体事件扩展成了广泛而稳定的自我判断。\n\n## 理解边界\n\n此框架解释的是部分风险与维持机制，不能把心理问题归咎于个人想法。预测关联不等于每个人都按相同路径发展，也不用于自行诊断。\n"}, {"id": "clinical-three-ps", "title": "心理问题的三类原因框架", "english": "Predisposing, precipitating and perpetuating causes", "kind": "模型", "domain": "clinical", "subdomain": "心理问题的解释", "summary": "理解心理问题需要区别长期易感因素、近期诱发事件与使问题持续的条件。同一因素在不同阶段可能发挥不同作用，原因也常相互影响。", "aliases": ["Predisposing, precipitating and perpetuating causes"], "keywords": ["心理问题的三类原因框架", "Predisposing, precipitating and perpetuating causes", "心理问题的解释", "易感", "诱发", "维持", "压力", "多重原因", "风险"], "questions": ["心理问题的三类原因框架解释了什么心理现象？", "心理问题的三类原因框架在什么条件下适用，有什么局限？"], "sources": [{"book": "general", "chapter": "第15章 · 心理障碍", "locator": "PDF 第 1270–1274 页", "pdfPages": [1270, 1271, 1272, 1274]}], "candidateRelated": [{"title": "基因与环境交互", "reason": "多种来源可共同形成易感性"}, {"title": "绝望理论", "reason": "认知模式可能参与易感和维持"}], "sections": [{"heading": "核心解释", "text": "教材以三个P组织多重原因：易感因素先于问题出现，提高发生可能；诱发因素是接近起点的事件或变化；维持因素则让已有问题持续。遗传、早期环境、习惯性解释和当前社会条件可以在不同阶段参与其中，框架的目的在于厘清过程而非寻找唯一原因。"}, {"heading": "一个例子", "text": "理解用例：一个人的长期不安全感、最近的重大损失以及随后减少活动和支持，分别可能涉及易感、诱发与维持过程；具体归类还需了解时间顺序。"}, {"heading": "理解边界", "text": "这是组织解释的框架，不是诊断工具。单一因素并非充分或必要原因，不宜把事后相关因素自动视为已证实的个体病因。"}], "markdown": "---\nid: \"clinical-three-ps\"\ntitle: \"心理问题的三类原因框架\"\nenglish: \"Predisposing, precipitating and perpetuating causes\"\nkind: \"模型\"\ndomain: \"clinical\"\nsubdomain: \"心理问题的解释\"\nsummary: \"理解心理问题需要区别长期易感因素、近期诱发事件与使问题持续的条件。同一因素在不同阶段可能发挥不同作用，原因也常相互影响。\"\naliases: [\"Predisposing, precipitating and perpetuating causes\"]\nkeywords: [\"心理问题的三类原因框架\", \"Predisposing, precipitating and perpetuating causes\", \"心理问题的解释\", \"易感\", \"诱发\", \"维持\", \"压力\", \"多重原因\", \"风险\"]\nquestions: [\"心理问题的三类原因框架解释了什么心理现象？\", \"心理问题的三类原因框架在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"general\", \"chapter\": \"第15章 · 心理障碍\", \"locator\": \"PDF 第 1270–1274 页\", \"pdfPages\": [1270, 1271, 1272, 1274]}]\ncandidateRelated: [{\"title\": \"基因与环境交互\", \"reason\": \"多种来源可共同形成易感性\"}, {\"title\": \"绝望理论\", \"reason\": \"认知模式可能参与易感和维持\"}]\n---\n\n## 核心解释\n\n教材以三个P组织多重原因：易感因素先于问题出现，提高发生可能；诱发因素是接近起点的事件或变化；维持因素则让已有问题持续。遗传、早期环境、习惯性解释和当前社会条件可以在不同阶段参与其中，框架的目的在于厘清过程而非寻找唯一原因。\n\n## 一个例子\n\n理解用例：一个人的长期不安全感、最近的重大损失以及随后减少活动和支持，分别可能涉及易感、诱发与维持过程；具体归类还需了解时间顺序。\n\n## 理解边界\n\n这是组织解释的框架，不是诊断工具。单一因素并非充分或必要原因，不宜把事后相关因素自动视为已证实的个体病因。\n"}, {"id": "cognition-accountability", "title": "决策的社会功能观点", "english": "Social functionalist approach to decision-making", "kind": "理论", "domain": "cognition", "subdomain": "判断与决策", "summary": "做决定常常意味着需要向他人解释。对评价、责任与社会认可的考虑，可能改变人处理证据和选择理由的方式。", "aliases": ["Social functionalist approach to decision-making"], "keywords": ["决策的社会功能观点", "Social functionalist approach to decision-making", "判断与决策", "责任", "辩护", "评价", "理由", "决策", "社会期待"], "questions": ["决策的社会功能观点解释了什么心理现象？", "决策的社会功能观点在什么条件下适用，有什么局限？"], "sources": [{"book": "cognitive", "chapter": "第13章 · 判断与决策", "locator": "PDF 第 692–692 页", "pdfPages": [692]}], "candidateRel s": [207]}], "candidateRelated": [{"title": "知觉—动作双视觉系统", "reason": "共同关注视觉如何支持行动"}, {"title": "光流", "reason": "行动中的视觉信息是生态知觉的重要线索"}], "sections": [{"heading": "核心解释", "text": "Gibson把知觉放回行动中的观察者与真实环境，提出人能感知环境提供的用途和行动机会。台阶是否可攀登、缝隙是否可穿过，都与身体能力相关。这个视角提醒我们把知觉与行动联在一起，而不只研究静止图片的被动识别。"}, {"heading": "一个例子", "text": "理解用例：同一把椅子对成人可能意味着可以坐下，对幼儿也可能意味着可以攀爬；它提供的行动机会随身体尺寸、能力和目标改变。"}, {"heading": "理解边界", "text": "直接知觉观点可能低估对象知识与复杂加工的作用。行动机会不能简单等同于设计者规定的用途，也不表示人一定会采取该行动。"}], "markdown": "---\nid: \"cognition-affordances\"\ntitle: \"可供性\"\nenglish: \"Affordances\"\nkind: \"概念\"\ndomain: \"cognition\"\nsubdomain: \"知觉与行动\"\nsummary: \"环境中的对象不仅呈现颜色和形状，也为具有特定能力的行动者提供行动机会。可供性强调物体、身体能力与当前活动的关系。\"\naliases: [\"Affordances\"]\nkeywords: [\"可供性\", \"Affordances\", \"知觉与行动\", \"行动机会\", \"环境\", \"身体\", \"工具\", \"用途\"]\nquestions: [\"可供性解释了什么心理现象？\", \"可供性在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"cognitive\", \"chapter\": \"第4章 · 运动知觉与行动\", \"locator\": \"PDF 第 207–207 页\", \"pdfPages\": [207]}]\ncandidateRelated: [{\"title\": \"知觉—动作双视觉系统\", \"reason\": \"共同关注视觉如何支持行动\"}, {\"title\": \"光流\", \"reason\": \"行动中的视觉信息是生态知觉的重要线索\"}]\n---\n\n## 核心解释\n\nGibson把知觉放回行动中的观察者与真实环境，提出人能感知环境提供的用途和行动机会。台阶是否可攀登、缝隙是否可穿过，都与身体能力相关。这个视角提醒我们把知觉与行动联在一起，而不只研究静止图片的被动识别。\n\n## 一个例子\n\n理解用例：同一把椅子对成人可能意味着可以坐下，对幼儿也可能意味着可以攀爬；它提供的行动机会随身体尺寸、能力和目标改变。\n\n## 理解边界\n\n直接知觉观点可能低估对象知识与复杂加工的作用。行动机会不能简单等同于设计者规定的用途，也不表示人一定会采取该行动。\n"}, {"id": "cognition-agency", "title": "能动感", "english": "Sense of agency", "kind": "心理过程", "domain": "cognition", "subdomain": "意识", "summary": "人通常体验自己是行动及其后果的发起者。能动感涉及意图、行动与结果之间的联系判断，主观归因不一定完整反映实际产生过程。", "aliases": ["Sense of agency"], "keywords": ["能动感", "Sense of agency", "意识", "控制", "意图", "自我", "行动", "原因"], "questions": ["我如何判断一个结果是由自己造成的？", "能动感在什么条件下适用，有什么局限？"], "sources": [{"book": "cognitive", "chapter": "第16章 · 意识", "locator": "PDF 第 826–826 页", "pdfPages": [826]}], "candidateRelated": [{"title": "全局工作空间理论", "reason": "意识信息可能参与行动控制"}, {"title": "自我记忆系统", "reason": "关于自我的理解会整合行动经历"}], "sections": [{"heading": "核心解释", "text": "部分理论认为，先于行动出现、与行动一致且缺少竞争原因的想法，容易被体验为行动原因。实验显示这种体验可以受操纵，但教材提醒许多任务高度人工化。意识前的神经活动与后来的决定有关，也不足以单独否定有意识控制的作用。"}, {"heading": "一个例子", "text": "理解用例：你按下开关，灯随即亮起，便很自然地产生“是我打开了灯”的体验；若延迟很长或另有人同时操作，对因果归属可能变得不确定。"}, {"heading": "理解边界", "text": "行动归因可以出错，不等于所有能动体验都是幻觉。不能由特定实验中的时间先后，直接推出关于自由意志的普遍结论。"}], "markdown": "---\nid: \"cognition-agency\"\ntitle: \"能动感\"\nenglish: \"Sense of agency\"\nkind: \"心理过程\"\ndomain: \"cognition\"\nsubdomain: \"意识\"\nsummary: \"人通常体验自己是行动及其后果的发起者。能动感涉及意图、行动与结果之间的联系判断，主观归因不一定完整反映实际产生过程。\"\naliases: [\"Sense of agency\"]\nkeywords: [\"能动感\", \"Sense of agency\", \"意识\", \"控制\", \"意图\", \"自我\", \"行动\", \"原因\"]\nquestions: [\"我如何判断一个结果是由自己造成的？\", \"能动感在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"cognitive\", \"chapter\": \"第16章 · 意识\", \"locator\": \"PDF 第 826–826 页\", \"pdfPages\": [826]}]\ncandidateRelated: [{\"title\": \"全局工作空间理论\", \"reason\": \"意识信息可能参与行动控制\"}, {\"title\": \"自我记忆系统\", \"reason\": \"关于自我的理解会整合行动经历\"}]\n---\n\n## 核心解释\n\n部分理论认为，先于行动出现、与行动一致且缺少竞争原因的想法，容易被体验为行动原因。实验显示这种体验可以受操纵，但教材提醒许多任务高度人工化。意识前的神经活动与后来的决定有关，也不足以单独否定有意识控制的作用。\n\n## 一个例子\n\n理解用例：你按下开关，灯随即亮起，便很自然地产生“是我打开了灯”的体验；若延迟很长或另有人同时操作，对因果归属可能变得不确定。\n\n## 理解边界\n\n行动归因可以出错，不等于所有能动体验都是幻觉。不能由特定实验中的时间先后，直接推出关于自由意志的普遍结论。\n"}, {"id": "cognition-analogy", "title": "类比迁移", "english": "Analogical transfer", "kind": "心理过程", "domain": "cognition", "subdomain": "问题解决", "summary": "过去的解法可以启发新问题，前提是识别双方共享的关系结构。表面相似容易吸引注意，但深层结构相似往往更决定迁移是否有效。", "aliases": ["Analogical transfer"], "keywords": ["类比迁移", "Analogical transfer", "问题解决", "迁移", "类比", "启发", "相似性", "结构", "旧经验"], "questions": ["怎样从一个领域的案例想到另一个领域的问题？", "类比迁移在什么条件下适用，有什么局限？"], "sources": [{"book": "cognitive", "chapter": "第12章 · 问题解决与专长", "locator": "PDF 第 648–648 页", "pdfPages": [648]}], "candidateRelated": [{"title": "流体智力与晶体智力", "reason": "灵活识别关系与已有知识共同参与类比"}, {"title": "图式", "reason": "抽象结构有助于跨情境迁移"}], "sections": [{"heading": "核心解释", "text": "类比问题解决需要提取相关旧例，辨认对应关系，并将已有关系应用到当前问题。表面、结构和程序的相似性可能各有作用。教材指出，迁移失败经常来自没有想起相关案例，而非完全无法理解对应关系；主动表示问题的结构有助于检索。"}, {"heading": "一个例子", "text": "理解用例：两个案例分别涉及交通与信息传播，表面对象不同，却都存在瓶颈。若识别“流量经过有限通道”的关系，就可能借用相近的分析思路。"}, {"heading": "理解边界", "text": "相似不等于机制相同。需要核对因果关系与限制条件，避免把表面比喻当作证据；成功迁移也依赖知识与执行控制。"}], "markdown": "---\nid: \"cognition-analogy\"\ntitle: \"类比迁移\"\nenglish: \"Analogical transfer\"\nkind: \"心理过程\"\ndomain: \"cognition\"\nsubdomain: \"问题解决\"\nsummary: \"过去的解法可以启发新问题，前提是识别双方共享的关系结构。表面相似容易吸引注意，但深层结构相似往往更决定迁移是否有效。\"\naliases: [\"Analogical transfer\"]\nkeywords: [\"类比迁移\", \"Analogical transfer\", \"问题解决\", \"迁移\", \"类比\", \"启发\", \"相似性\", \"结构\", \"旧经验\"]\nquestions: [\"怎样从一个领域的案例想到另一个领域的问题？\", \"类比迁移在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"cognitive\", \"chapter\": \"第12章 · 问题解决与专长\", \"locator\": \"PDF 第 648–648 页\", \"pdfPages\": [648]}]\ncandidateRelated: [{\"title\": \"流体智力与晶体智力\", \"reason\": \"灵活识别关系与已有知识共同参与类比\"}, {\"title\": \"图式\", \"reason\": \"抽象结构有助于跨情境迁移\"}]\n---\n\n## 核心解释\n\n类比问题解决需要提取相关旧例，辨认对应关系，并将已有关系应用到当前问题。表面、结构和程序的相似性可能各有作用。教材指出，迁移失败经常来自没有想起相关案例，而非完全无法理解对应关系；主动表示问题的结构有助于检索。\n\n## 一个例子\n\n理解用例：两个案例分别涉及交通与信息传播，表面对象不同，却都存在瓶颈。若识别“流量经过有限通道”的关系，就可能借用相近的分析思路。\n\n## 理解边界\n\n相似不等于机制相同。需要核对因果关系与限制条件，避免把表面比喻当作证据；成功迁移也依赖知识与执行控制。\n"}, {"id": "cognition-audience-design", "title": "受众设计与共同基础", "english": "Audience design and common ground", "kind": "心理过程", "domain": "cognition", "subdomain": "语言交流", "summary": "说话者会根据听者知道什么来选择表达，但这种调整受记忆与加工资源限制。有效交流需要持续估计彼此共享的信息。", "aliases": ["Audience design and common ground"], "keywords": ["受众设计与共同基础", "Audience design and common ground", "语言交流", "交流", "共享知识", "听众", "表达", "指代", "沟通"], "questions": ["受众设计与共同基础解释了什么心理现象？", "受众设计与共同基础在什么条件下适用，有什么局限？"], "sources": [{"book": "cognitive", "chapter": "第11章 · 语言产生", "locator": "PDF 第 594–594 页", "pdfPages": [594]}], "candidateRelated": [{"title": "工作记忆模型", "reason": "追踪共享知识需要保持和控制"}, {"title": "心智理论", "reason": "理解他人知识状态与沟通调整有关"}], "sections": [{"heading": "核心解释", "text": "共同基础指双方共享的知识与信念，受众设计指说话者据此调整措辞、说明程度和指代。教材强调，人通常对听者需求有所反应，但追踪共享信息会消耗资源。手势、韵律和话语标记也参与帮助听者理解，而非只由词语承担交流功能。"}, {"heading": "一个例子", "text": "理解用例：向熟悉项目的同事说“用昨天那个版本”可能足够；向新加入者介绍时，你需要补充文件名和背景，否则相同指代表达会失去意义。"}, {"heading": "理解边界", "text": "共同基础并非自动、准确地被使用。记忆和注意限制会使说话者高估共享信息，手势也可能服务说话者自身的组织过程。"}], "markdown": "---\nid: \"cognition-audience-design\"\ntitle: \"受众设计与共同基础\"\nenglish: \"Audience design and common ground\"\nkind: \"心理过程\"\ndomain: \"cognition\"\nsubdomain: \"语言交流\"\nsummary: \"说话者会根据听者知道什么来选择表达，但这种调整受记忆与加工资源限制。有效交流需要持续估计彼此共享的信息。\"\naliases: [\"Audience design and common ground\"]\nkeywords: [\"受众设计与共同基础\", \"Audience design and common ground\", \"语言交流\", \"交流\", \"共享知识\", \"听众\", \"表达\", \"指代\", \"沟通\"]\nquestions: [\"受众设计与共同基础解释了什么心理现象？\", \"受众设计与共同基础在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"cognitive\", \"chapter\": \"第11章 · 语言产生\", \"locator\": \"PDF 第 594–594 页\", \"pdfPages\": [594]}]\ncandidateRelated: [{\"title\": \"工作记忆模型\", \"reason\": \"追踪共享知识需要保持和控制\"}, {\"title\": \"心智理论\", \"reason\": \"理解他人知识状态与沟通调整有关\"}]\n---\n\n## 核心解释\n\n共同基础指双方共享的知识与信念，受众设计指说话者据此调整措辞、说明程度和指代。教材强调，人通常对听者需求有所反应，但追踪共享信息会消耗资源。手势、韵律和话语标记也参与帮助听者理解，而非只由词语承担交流功能。\n\n## 一个例子\n\n理解用例：向熟悉项目的同事说“用昨天那个版本”可能足够；向新加入者介绍时，你需要补充文件名和背景，否则相同指代表达会失去意义。\n\n## 理解边界\n\n共同基础并非自动、准确地被使用。记忆和注意限制会使说话者高估共享信息，手势也可能服务说话者自身的组织过程。\n"}, {"id": "cognition-change-blindness", "title": "变化盲视与非注意盲视", "english": "Change blindness and inattentional blindness", "kind": "效应", "domain": "cognition", "subdomain": "注意与觉察", "summary": "视野中明显的变化或新对象也可能未被察觉。注意分配影响我们获得和比较哪些信息，主观上完整的视觉体验并不意味着记住所有细节。", "aliases": ["Change blindness and inattentional blindness"], "keywords": ["变化盲视与非注意盲视", "Change blindness and inattentional blindness", "注意与觉察", "漏看", "注意", "看不见", "变化", "分心", "觉察"], "questions": ["为什么眼前发生的明显变化，我却完全没发现？", "变化盲视与非注意盲视在什么条件下适用，有什么局限？"], "sources": [{"book": "cognitive", "chapter": "第4章 · 运动知觉与行动", "locator": "PDF 第 208–208 页", "pdfPages": [208]}], "candidateRelated": [{"title": "注意负荷理论", "reason": "任务负荷影响分心和注意选择"}, {"title": "全局工作空间理论", "reason": "联系信息怎样进入可报告的意识"}], "sections": [{"heading": "核心解释", "text": "变化盲视指未察觉场景前后的改变；非注意盲视指专注于另一任务时未察觉意外出现的对象。二者都显示视觉觉察受注意限制，但任务要求不同。变化检测还需要保持和比较信息，而非注意盲视特别体现当前目标如何限制被选中的内容。"}, {"heading": "一个例子", "text": "理解用例：你专心在一张图片中数红色物体，可能漏看进入画面的其他对象；两张近似图片交替出现时，也可能迟迟找不到被改动的位置。"}, {"heading": "理解边界", "text": "看向对象不保证检测到变化；周边视觉、记忆与场景稳定性也有影响。两种现象不应完全等同，也不能证明未察觉信息毫无加工。"}], "markdown": "---\nid: \"cognition-change-blindness\"\ntitle: \"变化盲视与非注意盲视\"\nenglish: \"Change blindness and inattentional blindness\"\nkind: \"效应\"\ndomain: \"cognition\"\nsubdomain: \"注意与觉察\"\nsummary: \"视野中明显的变化或新对象也可能未被察觉。注意分配影响我们获得和比较哪些信息，主观上完整的视觉体验并不意味着记住所有细节。\"\naliases: [\"Change blindness and inattentional blindness\"]\nkeywords: [\"变化盲视与非注意盲视\", \"Change blindness and inattentional blindness\", \"注意与觉察\", \"漏看\", \"注意\", \"看不见\", \"变化\", \"分心\", \"觉察\"]\nquestions: [\"为什么眼前发生的明显变化，我却完全没发现？\", \"变化盲视与非注意盲视在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"cognitive\", \"chapter\": \"第4章 · 运动知觉与行动\", \"locator\": \"PDF 第 208–208 页\", \"pdfPages\": [208]}]\ncandidateRelated: [{\"title\": \"注意负荷理论\", \"reason\": \"任务负荷影响分心和注意选择\"}, {\"title\": \"全局工作空间理论\", \"reason\": \"联系信息怎样进入可报告的意识\"}]\n---\n\n## 核心解释\n\n变化盲视指未察觉场景前后的改变；非注意盲视指专注于另一任务时未察觉意外出现的对象。二者都显示视觉觉察受注意限制，但任务要求不同。变化检测还需要保持和比较信息，而非注意盲视特别体现当前目标如何限制被选中的内容。\n\n## 一个例子\n\n理解用例：你专心在一张图片中数红色物体，可能漏看进入画面的其他对象；两张近似图片交替出现时，也可能迟迟找不到被改动的位置。\n\n## 理解边界\n\n看向对象不保证检测到变化；周边视觉、记忆与场景稳定性也有影响。两种现象不应完全等同，也不能证明未察觉信息毫无加工。\n"}, {"id": "cognition-color-opponent", "title": "颜色视觉的双过程理论", "english": "Dual-process theory of colour vision", "kind": "理论", "domain": "cognition", "subdomain": "视觉知觉", "summary": "颜色体验来自不同层次的编码：视锥细胞对波长的反应提供输入，后续对立加工则比较颜色通道，帮助解释后像与色觉差异。", "aliases": ["Dual-process theory of colour vision"], "keywords": ["颜色视觉的双过程理论", "Dual-process theory of colour vision", "视觉知觉", "颜色", "视锥", "后像", "色觉", "对立过程", "三色"], "questions": ["颜色视觉的双过程理论解释了什么心理现象？", "颜色视觉的双过程理论在什么条件下适用，有什么局限？"], "sources": [{"book": "cognitive", "chapter": "第2章 · 视觉知觉的基本过程", "locator": "PDF 第 123–123 页", "pdfPages": [123]}, {"book": "general", " dic and semantic memory"], "keywords": ["情景记忆与语义记忆", "Episodic and semantic memory", "长期记忆", "往事", "事实", "知识", "经历", "时间", "场景"], "questions": ["情景记忆与语义记忆解释了什么心理现象？", "情景记忆与语义记忆在什么条件下适用，有什么局限？"], "sources": [{"book": "cognitive", "chapter": "第7章 · 长期记忆系统", "locator": "PDF 第 371–372 页", "pdfPages": [371, 372]}], "candidateRelated": [{"title": "图式", "reason": "语义知识可以组织情景回忆"}, {"title": "自我记忆系统", "reason": "自传体记忆整合事件与自我知识"}], "sections": [{"heading": "核心解释", "text": "情景记忆帮助重现发生于特定情境的事件，语义记忆保存较脱离具体发生背景的概念与事实。不同患者的记忆损伤支持这种区分，但实际任务经常同时使用两者。随时间推移，经历的感官细节可能减少，而大意与图式知识在记忆中占据更大比重。"}, {"heading": "一个例子", "text": "理解用例：知道某城市是首都属于一般知识；记得第一次到那里参会时见到谁、坐在哪张桌边，则包含特定事件的情境信息。"}, {"heading": "理解边界", "text": "这不是两个完全隔绝的仓库，记忆任务往往需要两者合作。情景回忆具有建构性，生动感与情境细节都不保证完全准确。"}], "markdown": "---\nid: \"cognition-episodic-semantic\"\ntitle: \"情景记忆与语义记忆\"\nenglish: \"Episodic and semantic memory\"\nkind: \"概念\"\ndomain: \"cognition\"\nsubdomain: \"长期记忆\"\nsummary: \"个人经历的时间地点与一般事实知识属于可区分的记忆内容。回忆与知识相互支持，经历中的细节也可能逐渐转化为概括性认识。\"\naliases: [\"Episodic and semantic memory\"]\nkeywords: [\"情景记忆与语义记忆\", \"Episodic and semantic memory\", \"长期记忆\", \"往事\", \"事实\", \"知识\", \"经历\", \"时间\", \"场景\"]\nquestions: [\"情景记忆与语义记忆解释了什么心理现象？\", \"情景记忆与语义记忆在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"cognitive\", \"chapter\": \"第7章 · 长期记忆系统\", \"locator\": \"PDF 第 371–372 页\", \"pdfPages\": [371, 372]}]\ncandidateRelated: [{\"title\": \"图式\", \"reason\": \"语义知识可以组织情景回忆\"}, {\"title\": \"自我记忆系统\", \"reason\": \"自传体记忆整合事件与自我知识\"}]\n---\n\n## 核心解释\n\n情景记忆帮助重现发生于特定情境的事件，语义记忆保存较脱离具体发生背景的概念与事实。不同患者的记忆损伤支持这种区分，但实际任务经常同时使用两者。随时间推移，经历的感官细节可能减少，而大意与图式知识在记忆中占据更大比重。\n\n## 一个例子\n\n理解用例：知道某城市是首都属于一般知识；记得第一次到那里参会时见到谁、坐在哪张桌边，则包含特定事件的情境信息。\n\n## 理解边界\n\n这不是两个完全隔绝的仓库，记忆任务往往需要两者合作。情景回忆具有建构性，生动感与情境细节都不保证完全准确。\n"}, {"id": "cognition-expertise", "title": "专长、组块与刻意练习", "english": "Expertise, chunking and deliberate practice", "kind": "概念", "domain": "cognition", "subdomain": "问题解决", "summary": "专家借助大量领域知识迅速识别有意义的模式。针对弱点的练习能促进专长，但表现差异还取决于能力、经验结构与环境。 ion", "subdomain": "阅读", "summary": "阅读中的停留与眼跳部分受词汇加工进程控制。模型区分触发眼动准备的熟悉性检查，与促使注意转向下一个词的词汇提取。", "aliases": ["E-Z Reader model"], "keywords": ["E-Z Reader眼动模型", "E-Z Reader model", "阅读", "眼动", "注视", "词频", "眼跳", "注意"], "questions": ["E-Z Reader眼动模型解释了什么心理现象？", "E-Z Reader眼动模型在什么条件下适用，有什么局限？"], "sources": [{"book": "cognitive", "chapter": "第9章 · 言语知觉与阅读", "locator": "PDF 第 488–488 页", "pdfPages": [488]}], "candidateRelated": [{"title": "工作记忆模型", "reason": "更高层理解需要保持和整合信息"}, {"title": "自上而下与自下而上加工", "reason": "上下文可预测性参与阅读"}], "sections": [{"heading": "核心解释", "text": "E-Z Reader将词汇识别与眼动控制联结起来：当前词的初步熟悉性检查完成后，启动下一次眼跳的准备；更充分的词汇加工完成后，注意转向后一个词。模型据此解释词频、可预测性与注视时间之间的关系，并与并行词汇加工模型形成对照。"}, {"heading": "一个例子", "text": "理解用例：读到一个常见且可预测的词时，眼睛往往较快前移；遇到不熟悉的词可能停留更久。眼动节奏因此可以成为研究阅读加工的窗口。"}, {"heading": "理解边界", "text": "它主要模拟阅读中的眼动与词汇加工，对篇章理解和背景知识的说明较有限。眼睛位置与注意位置也不能简单画等号。"}], "markdown": "---\nid: \"cognition-ez-reader\"\ntitle: \"E-Z Reader眼动模型\"\nenglish: \"E-Z Reader model\"\nkind: \"模型\"\ndomain: \"cognition\"\nsubdomain: \"阅读\"\nsummary: \"阅读中的停留与眼跳部分受词汇加工进程控制。模型区分触发眼动准备的熟悉性检查，与促使注意转向下一个词的词汇提取。\"\naliases: [\"E-Z Reader model\"]\nkeywords: [\"E-Z Reader眼动模型\", \"E-Z Reader model\", \"阅读\", \"眼动\", \"注视\", \"词频\", \"眼跳\", \"注意\"]\nquestions: [\"E-Z Reader眼动模型解释了什么心理现象？\", \"E-Z Reader眼动模型在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"cognitive\", \"chapter\": \"第9章 · 言语知觉与阅读\", \"locator\": \"PDF 第 488–488 页\", \"pdfPages\": [488]}]\ncandidateRelated: [{\"title\": \"工作记忆模型\", \"reason\": \"更高层理解需要保持和整合信息\"}, {\"title\": \"自上而下与自下而上加工\", \"reason\": \"上下文可预测性参与阅读\"}]\n---\n\n## 核心解释\n\nE-Z Reader将词汇识别与眼动控制联结起来：当前词的初步熟悉性检查完成后，启动下一次眼跳的准备；更充分的词汇加工完成后，注意转向后一个词。模型据此解释词频、可预测性与注视时间之间的关系，并与并行词汇加工模型形成对照。\n\n## 一个例子\n\n理解用例：读到一个常见且可预测的词时，眼睛往往较快前移；遇到不熟悉的词可能停留更久。眼动节奏因此可以成为研究阅读加工的窗口。\n\n## 理解边界\n\n它主要模拟阅读中的眼动与词汇加工，对篇章理解和背景知识的说明较有限。眼睛位置与注意位置也不能简单画等号。\n"}, {"id": "cognition-face-recognition", "title": "面孔识别模型", "english": "Bruce and Young model of face recognition", "kind": "模型", "domain": "cognition", "subdomain": "面孔识别", "summary": "识别熟悉面孔涉及从视觉结构到熟悉感、人物知识和名字的多个环节。认出一个人、知道他的经历与想起名字可以出现不同表现。", "aliases": ["Bruce and Young model of face recognition"], "keywords": ["面孔识别模型", "Bruce and Young model of face recognition", "面孔识别", "面孔", "人脸", "名字", "眼熟", "表情", "失认"], "questions": ["面孔识别模型解释了什么心理现象？", "面孔识别模型在什么条件下适用，有什么局限？"], "sources": [{"book": "cognitive", "chapter": "第3章 · 物体与面孔识别", "locator": "PDF 第 170–170 页", "pdfPages": [170]}], "candidateRelated": [{"title": "情景记忆与语义记忆", "reason": "熟悉感、人物知识与事件回忆可以区分"}, {"title": "双重分离", "reason": "功能受损模式有助于区分加工阶段"}], "sections": [{"heading": "核心解释", "text": "Bruce与Young将面孔识别分成若干加工阶段，并区分身份与表情等信息的加工路径。患者的不同受损模式支持面孔识别并非单一步骤。熟悉面孔可以利用稳定的长期表征；不熟悉面孔则更容易受到照片角度、光照和表情变化的影响。"}, {"heading": "一个例子", "text": "理解用例：在街上遇到旧同学，你先觉得眼熟，随后想起共同上课的经历，却迟迟说不出名字。不同信息可能在不同环节被成功提取。"}, {"heading": "理解边界", "text": "模型的严格串行假设与身份、表情相互独立的假设都偏强。真实加工存在交互，陌生面孔图像的巨大变化也增加了识别难度。"}], "markdown": "---\nid: \"cognition-face-recognition\"\ntitle: \"面孔识别模型\"\nenglish: \"Bruce and Young model of face recognition\"\nkind: \"模型\"\ndomain: \"cognition\"\nsubdomain: \"面孔识别\"\nsummary: \"识别熟悉面孔涉及从视觉结构到熟悉感、人物知识和名字的多个环节。认出一个人、知道他的经历与想起名字可以出现不同表现。\"\naliases: [\"Bruce and Young model of face recognition\"]\nkeywords: [\"面孔识别模型\", \"Bruce and Young model of face recognition\", \"面孔识别\", \"面孔\", \"人脸\", \"名字\", \"眼熟\", \"表情\", \"失认\"]\nquestions: [\"面孔识别模型解释了什么心理现象？\", \"面孔识别模型在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"cognitive\", \"chapter\": \"第3章 · 物体与面孔识别\", \"locator\": \"PDF 第 170–170 页\", \"pdfPages\": [170]}]\ncandidateRelated: [{\"title\": \"情景记忆与语义记忆\", \"reason\": \"熟悉感、人物知识与事件回忆可以区分\"}, {\"title\": \"双重分离\", \"reason\": \"功能受损模式有助于区分加工阶段\"}]\n---\n\n## 核心解释\n\nBruce与Young将面孔识别分成若干加工阶段，并区分身份与表情等信息的加工路径。患者的不同受损模式支持面孔识别并非单一步骤。熟悉面孔可以利用稳定的长期表征；不熟悉面孔则更容易受到照片角度、光照和表情变化的影响。\n\n## 一个例子\n\n理解用例：在街上遇到旧同学，你先觉得眼熟，随后想起共同上课的经历，却迟迟说不出名字。不同信息可能在不同环节被成功提取。\n\n## 理解边界\n\n模型的严格串行假设与身份、表情相互独立的假设都偏强。真实加工存在交互，陌生面孔图像的巨大变化也增加了识别难度。\n"}, {"id": "cognition-feature-integration", "title": "特征整合理论", "english": "Feature integration theory", "kind": "理论", "domain": "cognition", "subdomain": "注意与控制", "summary": "颜色、方向等特征可以较快地并行加工，但把多个特征正确结合为同一对象往往需要集中注意。这解释了部分视觉搜索差异。", "aliases": ["Feature integration theory"], "keywords": ["特征整合理论", "Feature integration theory", "注意与控制", "视觉搜索", "特征", "颜色", "形状", "绑定", "整合"], "questions": ["特征整合理论解释了什么心理现象？", "特征整合理论在什么条件下适用，有什么局限？"], "sources": [{"book": "cognitive", "chapter": "第5章 · 注意与表现", "locator": "PDF 第 264–264 页", "pdfPages": [264]}], "candidateRelated": [{"title": "格式塔知觉组织", "reason": "都关心局部特征怎样组成对象"}, {"title": "注意负荷理论", "reason": "注意资源限制会改变整合和搜索"}], "sections": [{"heading": "核心解释", "text": "Treisman的特征整合理论将特征提取与对象整合区分开来。一个目标若凭单一鲜明特征即可识别，搜索通常较容易；若需要结合多个特征，注意的选择与绑定作用更突出。理论让“看到特征”与“知道这些特征属于谁”成为不同的问题。"}, {"heading": "一个例子", "text": "理解用例：从一排蓝色圆点中找红点通常很快；若画面同时含有红圆、蓝方和红方，寻找红方则需要正确结合颜色和形状。"}, {"heading": "理解边界", "text": "真实搜索还利用场景知识、周边视觉及目标可能位置。串行与并行并非绝对二分，结合搜索也不必每次都逐个检查所有对象。"}], "markdown": "---\nid: \"cognition-feature-integration\"\ntitle: \"特征整合理论\"\nenglish: \"Feature integration theory\"\nkind: \"理论\"\ndomain: \"cognition\"\nsubdomain: \"注意与控制\"\nsummary: \"颜色、方向等特征可以较快地并行加工，但把多个特征正确结合为同一对象往往需要集中注意。这解释了部分视觉搜索差异。\"\naliases: [\"Feature integration theory\"]\nkeywords: [\"特征整合理论\", \"Feature integration theory\", \"注意与控制\", \"视觉搜索\", \"特征\", \"颜色\", \"形状\", \"绑定\", \"整合\"]\nquestions: [\"特征整合理论解释了什么心理现象？\", \"特征整合理论在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"cognitive\", \"chapter\": \"第5章 · 注意与表现\", \"locator\": \"PDF 第 264–264 页\", \"pdfPages\": [264]}]\ncandidateRelated: [{\"title\": \"格式塔知觉组织\", \"reason\": \"都关心局部特征怎样组成对象\"}, {\"title\": \"注意负荷理论\", \"reason\": \"注意资源限制会改变整合和搜索\"}]\n---\n\n## 核心解释\n\nTreisman的特征整合理论将特征提取与对象整合区分开来。一个目标若凭单一鲜明特征即可识别，搜索通常较容易；若需要结合多个特征，注意的选择与绑定作用更突出。理论让“看到特征”与“知道这些特征属于谁”成为不同的问题。\n\n## 一个例子\n\n理解用例：从一排蓝色圆点中找红点通常很快；若画面同时含有红圆、蓝方和红方，寻找红方则需要正确结合颜色和形状。\n\n## 理解边界\n\n真实搜索还利用场景知识、周边视觉及目标可能位置。串行与并行并非绝对二分，结合搜索也不必每次都逐个检查所有对象。\n"}, {"id": "cognition-fluid-crystallized", "title": "流体智力与晶体智力", "english": "Fluid and crystallized intelligence", "kind": "理论", "domain": "cognition", "subdomain": "能力与个体差异", "summary": "面对新关系的灵活推理与依赖经验积累的知识能力，可以作为相关但不同的能力理解。二者对任务要求和生命历程的反应并不完全相同。", "aliases": ["Fluid and crystallized intelligence"], "keywords": ["流体智力与晶体智力", "Fluid and crystallized intelligence", "能力与个体差异", "智力", "推理", "知识", "经验", "陌生问题", "能力"], "questions": ["流体智力与晶体智力解释了什么心理现象？", "流体智力与晶体智力在什么条件下适用，有什么局限？"], "sources": [{"book": "general", "chapter": "第10章 · 问题解决：推理与智力", "locator": "PDF 第 837–838 页", "pdfPages": [837, 838]}], "candidateRelated": [{"title": "一般智力因素", "reason": "为共享能力提供更细的结构"}, {"title": "类比迁移", "reason": "识别关系与调用知识共同支持迁移"}], "sections": [{"heading": "核心解释", "text": "Cattell将一般能力进一步区分为流体与晶体成分。流体智力强调发现新关系、在不依赖特定学习内容时解决问题；晶体智力强调累积的词汇、文化知识和技能。现实任务常混合两者，因而测试时需检查成功是否主要依赖陌生推理还是先前知识。"}, {"heading": "一个例子", "text": "理解用例：发现陌生图形序列的规律较强调关系推理；解释一个专业术语则较依赖学习积累。读懂学术论文通常同时需要这两类能力。"}, {"heading": "理解边界", "text": "流体任务也不可能完全无经验，晶体能力也不只是死记硬背。两类能力相关且受环境影响，不能简单分别等同先天与后天。"}], "markdown": "---\nid: \"cognition-fluid-crystallized\"\ntitle: \"流体智力与晶体智力\"\nenglish: \"Fluid and crystallized intelligence\"\nkind: \"理论\"\ndomain: \"cognition\"\nsubdomain: \"能力与个体差异\"\nsummary: \"面对新关系的灵活推理与依赖经验积累的知识能力，可以作为相关但不同的能力理解。二者对任务要求和生命历程的反应并不完全相同。\"\naliases: [\"Fluid and crystallized intelligence\"]\nkeywords: [\"流体智力与晶体智力\", \"Fluid and crystallized intelligence\", \"能力与个体差异\", \"智力\", \"推理\", \"知识\", \"经验\", \"陌生问题\", \"能力\"]\nquestions: [\"流体智力与晶体智力解释了什么心理现象？\", \"流体智力与晶体智力在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"general\", \"chapter\": \"第10章 · 问题解决：推理与智力\", \"locator\": \"PDF 第 837–838 页\", \"pdfPages\": [837, 838]}]\ncandidateRelated: [{\"title\": \"一般智力因素\", \"reason\": \"为共享能力提供更细的结构\"}, {\"title\": \"类比迁移\", \"reason\": \"识别关系与调用知识共同支持迁移\"}]\n---\n\n## 核心解释\n\nCattell将一般能力进一步区分为流体与晶体成分。流体智力强调发现新关系、在不依赖特定学习内容时解决问题；晶体智力强调累积的词汇、文化知识和技能。现实任务常混合两者，因而测试时需检查成功是否主要依赖陌生推理还是先前知识。\n\n## 一个例子\n\n理解用例：发现陌生图形序列的规律较强调关系推理；解释一个专业术语则较依赖学习积累。读懂学术论文通常同时需要这两类能力。\n\n## 理解边界\n\n流体任务也不可能完全无经验，晶体能力也 一般智力因素", "english": "General intelligence factor (g)", "kind": "概念", "domain": "cognition", "subdomain": "能力与个体差异", "summary": "多种认知测验的成绩往往呈正相关。一般智力因素概括这种共同变化，但统计上的共同因素与唯一的心理或神经原因不是一回事。", "aliases": ["General intelligence factor (g)"], "keywords": ["一般智力因素", "General intelligence factor (g)", "能力与个体差异", "智力", "因素分析", "g", "能力", "测验", "正相关"], "questions": ["一般智力因素解释了什么心理现象？", "一般智力因素在什么条件下适用，有什么局限？"], "sources": [{"book": "general", "chapter": "第10章 · 问题解决：推理与智力", "locator": "PDF 第 836–836 页", "pdfPages": [836]}], "candidateRelated": [{"title": "流体智力与晶体智力", "reason": "对一般能力进一步区分"}, {"title": "信度、效度与操作化", "reason": "测验分数的解释需要测量证据"}], "sections": [{"heading": "核心解释", "text": "Spearman观察到，不同心智任务的表现通常共同变化，因而用因素分析提出一般智力因素g。每项任务既可反映共享因素，也可反映任务特定能力。使用多类测验有助于减少对单一技能的依赖，但研究仍需解释共同变化来自何种加工、知识与发展条件。"}, {"heading": "一个例子", "text": "理解用例：一个人在词汇、记忆和图形推理测验中都较好，这种跨任务优势可被共同因素概括；同时，他仍可能在某一类任务明显更强。"}, {"heading": "理解边界", "text": "因素是对相关结构的描述，不自动证明单一固定实体。测验范围、文化经验与发展机会会影响解释，也不能用分数概括一个人的全部价值或能力。"}], "markdown": "---\nid: \"cognition-general-intelligence\"\ntitle: \"一般智力因素\"\nenglish: \"General intelligence factor (g)\"\nkind: \"概念\"\ndomain: \"cognition\"\nsubdomain: \"能力与个体差异\"\nsummary: \"多种认知测验的成绩往往呈正相关。一般智力因素概括这种共同变化，但统计上的共同因素与唯一的心理或神经原因不是一回事。\"\naliases: [\"General intelligence factor (g)\"]\nkeywords: [\"一般智力因素\", \"General intelligence factor (g)\", \"能力与个体差异\", \"智力\", \"因素分析\", \"g\", \"能力\", \"测验\", \"正相关\"]\nquestions: [\"一般智力因素解释了什么心理现象？\", \"一般智力因素在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"general\", \"chapter\": \"第10章 · 问题解决：推理与智力\", \"locator\": \"PDF 第 836–836 页\", \"pdfPages\": [836]}]\ncandidateRelated: [{\"title\": \"流体智力与晶体智力\", \"reason\": \"对一般能力进一步区分\"}, {\"title\": \"信度、效度与操作化\", \"reason\": \"测验分数的解释需要测量证据\"}]\n---\n\n## 核心解释\n\nSpearman观察到，不同心智任务的表现通常共同变化，因而用因素分析提出一般智力因素g。每项任务既可反映共享因素，也可反映任务特定能力。使用多类测验有助于减少对单一技能的依赖，但研究仍需解释共同变化来自何种加工、知识与发展条件。\n\n## 一个例子\n\n理解用例：一个人在词汇、记忆和图形推理测验中都较好，这种跨任务优势可被共同因素概括；同时，他仍可能在某一类任务明显更强。\n\n## 理解边界\n\n因素是对相关结构的描述，不自动证明单一固定实体。测验范围、文化经验 个线索的竞争。\n\n## 一个例子\n\n理解用例：同样的一组小点，仅改变间距，就可能被看成几列或几行。网页上把相关卡片放得更近，也会让读者更容易把它们视作一组。\n\n## 理解边界\n\n这些原则主要描述常见组织趋势，不能完整说明背后的计算机制。不同原则可能相互竞争，经验与任务目标也能改变分组。\n"}, {"id": "cognition-global-workspace", "title": "全局工作空间理论", "english": "Global workspace theory", "kind": "理论", "domain": "cognition", "subdomain": "意识", "summary": "某些局部加工结果被选中并广泛共享后，成为可报告和可灵活使用的意识内容。意识在此被理解为跨系统的信息整合与广播。", "aliases": ["Global workspace theory"], "keywords": ["全局工作空间理论", "Global workspace theory", "意识", "广播", "整合", "注意", "全局", "觉察"], "questions": ["全局工作空间理论解释了什么心理现象？", "全局工作空间理论在什么条件下适用，有什么局限？"], "sources": [{"book": "cognitive", "chapter": "第16章 · 意识", "locator": "PDF 第 826–827 页", "pdfPages": [826, 827]}], "candidateRelated": [{"title": "阈下知觉", "reason": "比较局部无意识加工与可报告意识"}, {"title": "变化盲视与非注意盲视", "reason": "信息选择关系到觉察"}], "sections": [{"heading": "核心解释", "text": "全局工作空间观点认为，许多专门过程可以并行且无意识地运行，选择性注意使部分信息进入较广泛的整合状态。全局神经工作空间版本进一步讨论广泛脑区的协调活动。模型试图解释意识内容为什么可被语言报告、用于计划并与不同知识联系。"}, {"heading": "一个例子", "text": "理解用例：背景中的词句可能被局部加工；当一句与你有关的话吸引注意，你能复述它、思考含义并据此调整行动，信息获得了更广泛的可用性。"}, {"heading": "理解边界", "text": "研究较偏重视觉意识，未充分涵盖自我知识等形式。整合活动究竟是意识的前提还是后果，以及注意与意识的区别，仍需检验。"}], "markdown": "---\nid: \"cognition-global-workspace\"\ntitle: \"全局工作空间理论\"\nenglish: \"Global workspace theory\"\nkind: \"理论\"\ndomain: \"cognition\"\nsubdomain: \"意识\"\nsummary: \"某些局部加工结果被选中并广泛共享后，成为可报告和可灵活使用的意识内容。意识在此被理解为跨系统的信息整合与广播。\"\naliases: [\"Global workspace theory\"]\nkeywords: [\"全局工作空间理论\", \"Global workspace theory\", \"意识\", \"广播\", \"整合\", \"注意\", \"全局\", \"觉察\"]\nquestions: [\"全局工作空间理论解释了什么心理现象？\", \"全局工作空间理论在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"cognitive\", \"chapter\": \"第16章 · 意识\", \"locator\": \"PDF 第 826–827 页\", \"pdfPages\": [826, 827]}]\ncandidateRelated: [{\"title\": \"阈下知觉\", \"reason\": \"比较局部无意识加工与可报告意识\"}, {\"title\": \"变化盲视与非注意盲视\", \"reason\": \"信息选择关系到觉察\"}]\n---\n\n## 核心解释\n\n全局工作空间观点认为，许多专门过程可以并行且无意识地运行，选择性注意使部分信息进入较广泛的整合状态。全局神经工作空间版本进一步讨论广泛脑区的协调活动。模型试图解释意识内容为什么可被语言报告、用于计划并与不同知识联系。\n\n## 一个例子\n\n理解用例：背景中的词句可能被局部加工；当一句与你有关的话吸引注意，你能复述它、思考含义并据此调整行动，信息获得了更广泛的可用性。\n\n## 理解边界\n\n研究较偏重视觉意识，未充分涵盖自我知识等形式。整合活动究竟是意识的前提还是后果，以及注意与意识的区别，仍需检验。\n"}, {"id": "cognition-heuristics", "title": "可得性与代表性启发式", "english": "Availability and representativeness heuristics", "kind": "心理过程", "domain": "cognition", "subdomain": "判断与决策", "summary": "判断概率时，人可能依赖例子是否容易想起，或对象是否像某一类别的典型。这些简便线索有时有效，也可能使判断偏离基础概率。", "aliases": ["Availability and representativeness heuristics"], "keywords": ["可得性与代表性启发式", "Availability and representativeness heuristics", "判断与决策", "概率", "典型", "基准率", "容易想起", "鲜明", "判断"], "questions": ["为什么容易想起的事情会让我觉得更常见？", "可得性与代表性启发式在什么条件下适用，有什么局限？"], "sources": [{"book": "cognitive", "chapter": "第13章 · 判断与决策", "locator": "PDF 第 691–691 页", "pdfPages": [691]}], "candidateRelated": [{"title": "双加工理论", "reason": "简便判断与更费力检查可能互动"}, {"title": "图式", "reason": "类别原型与已有知识会影响相似性判断"}], "sections": [{"heading": "核心解释", "text": "可得性启发式以提取或想象实例的容易程度作为判断线索；代表性启发式则依据相似性判断类别或事件可能性。鲜明、近期和熟悉的例子容易被高估，典型描述也可能遮住基准率。教材强调，人并非始终忽略概率，信息格式、因果知识和动机会改变表现。"}, {"heading": "一个例子", "text": "理解用例：刚连续读到几则罕见事故报道，你可能觉得它更常发生；看到某人的描述很像某职业原型，也可能忽略该职业在人群中本来很少。"}, {"heading": "理解边界", "text": "启发式不是错误的同义词，线索在合适环境下可以有效。是否构成偏差要结合比较标准、信息呈现与任务需求判断。"}], "markdown": "---\nid: \"cognition-heuristics\"\ntitle: \"可得性与代表性启发式\"\nenglish: \"Availability and representativeness heuristics\"\nkind: \"心理过程\"\ndomain: \"cognition\"\nsubdomain: \"判断与决策\"\nsummary: \"判断概率时，人可能依赖例子是否容易想起，或对象是否像某一类别的典型。这些简便线索有时有效，也可能使判断偏离基础概率。\"\naliases: [\"Availability and representativeness heuristics\"]\nkeywords: [\"可得性与代表性启发式\", \"Availability and representativeness heuristics\", \"判断与决策\", \"概率\", \"典型\", \"基准率\", \"容易想起\", \"鲜明\", \"判断\"]\nquestions: [\"为什么容易想起的事情会让我觉得更常见？\", \"可得性与代表性启发式在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"cognitive\", \"chapter\": \"第13章 · 判断与决策\", \"locator\": \"PDF 第 691–691 页\", \"pdfPages\": [691]}]\ncandidateRelated: [{\"title\": \"双加工理论\", \"reason\": \"简便判断与更费力检查可能互动\"}, {\"title\": \"图式\", \"reason\": \"类别原型与已有知识会影响相似性判断\"}]\n---\n\n## 核心解释\n\n可得性启发式以提取或想象实例的容易程度作为判断线索；代表性启发式则依据相似性判断类别或事件可能性。鲜明、近期和熟悉的例子容易被高估，典型描述也可能遮住基准率。教材强调，人并非始终忽略概率，信息格式、因果知识和动机会改变表现。\n\n## 一个例子\n\n理解用例：刚连续读到几则罕见事故报道，你可能觉得它更常发生；看到某人的描述很像某职业原型，也可能忽略该职业在人群中本来很少。\n\n## 理解边界\n\n启发式不是错误的同义词，线索在合适环境下可以有效。是否构成偏差要结合比较标准、信息呈现与任务需求判断。\n"}, {"id": "cognition-implementation-intentions", "title": "实施意图", "english": "Implementation intentions", "kind": "心理过程", "domain": "cognition", "subdomain": "日常记忆", "summary": "把目标转化为遇到特定情境就采取特定行动的计划，能够帮助未来及时想起并执行意图。它把行动与明确的时间、地点或事件线索连接起来。", "aliases": ["执行意图", "如果—那么计划", "Implementation intentions"], "keywords": ["实施意图", "执行意图", "如果那么", "计划", "行动", "提醒", "意图执行", "前瞻记忆", "目标", "implementation intentions"], "questions": ["为什么有明确目标，到时候还是忘记行动？", "把行动绑定到具体情境，怎样帮助我记得执行计划？"], "sources": [{"book": "cognitive", "chapter": "第8章 · 日常记忆", "locator": "PDF 第 418 页", "pdfPages": [418]}], "candidateRelated": [{"id": "cognition-prospective-memory", "title": "前瞻记忆", "reason": "用情境线索帮助在适当时机提取和执行未来意图"}, {"id": "cognition-retrieval-cues", "title": "提取线索与编码联系", "reason": "明确建立情境与行动之间的提取联系"}, {"id": "cognition-working-memory", "title": "工作记忆模型", "reason": "线索触发可能减少持续保持和监控目标的负担"}], "sections": [{"heading": "核心解释", "text": "Gollwitzer提出，用明确的情境—反应连接把一般目标变为行动计划。相关研究发现，这类计划可能使人更聚焦任务线索、减少走神，并让线索出现时较自动地提取意图。它既说明具体计划为何比模糊愿望更易触发，也把目标执行与前瞻记忆联系起来。"}, {"heading": "一个例子", "text": "理解用例：与其只想着“明天记得还书”，你规定“明天经过图书馆入口时，我就进去还书”。入口成为提取行动的线索，帮助在恰当时刻重新激活计划。"}, {"heading": "理解边界", "text": "自动触发不等于始终有益。教材中的实验发现，即使被要求不再响应，原线索仍可能干扰当前任务；计划也不能替代行动条件和目标调整。"}], "markdown": "---\nid: \"cognition-implementation-intentions\"\ntitle: \"实施意图\"\nenglish: \"Implementation intentions\"\nkind: \"心理过程\"\ndomain: \"cognition\"\nsubdomain: \"日常记忆\"\nsummary: \"把目标转化为遇到特定情境就采取特定行动的计划，能够帮助未来及时想起并执行意图。它把行动与明确的时间、地点或事件线索连接起来。\"\naliases: [\"执行意图\", \"如果—那么计划\", \"Implementation intentions\"]\nkeywords: [\"实施意图\", \"执行意图\", \"如果那么\", \"计划\", \"行动\", \"提醒\", \"意图执行\", \"前瞻记忆\", \"目标\", \"implementation intentions\"]\nquestions: [\"为什么有明确目标，到时候还是忘记行动？\", \"把行动绑定到具体情境，怎样帮助我记得执行计划？\"]\nsources: [{\"book\": \"cognitive\", \"chapter\": \"第8章 · 日常记忆\", \"locator\": \"PDF 第 418 页\", \"pdfPages\": [418]}]\ncandidateRelated: [{\"id\": \"cognition-prospective-memory\", \"title\": \"前瞻记忆\", \"reason\": \"用情境线索帮助在适当时机提取和执行未来意图\"}, {\"id\": \"cognition-retrieval-cues\", \"title\": \"提取线索与编码联系\", \"reason\": \"明确建立情境与行动之间的提取联系\"}, {\"id\": \"cognition-working-memory\", \"title\": \"工作记忆模型\", \"reason\": \"线索触发可能减少持续保持和监控目标的负担\"}]\n---\n\n## 核心解释\n\nGollwitzer提出，用明确的情境—反应连接把一般目标变为行动计划。相关研究发现，这类计划可能使人更聚焦任务线索、减少走神，并让线索出现时较自动地提取意图。它既说明具体计划为何比模糊愿望更易触发，也把目标执行与前瞻记忆联系起来。\n\n## 一个例子\n\n理解用例：与其只想着“明天记得还书”，你规定“明天经过图书馆入口时，我就进去还书”。入口成为提取行动的线索，帮助在恰当时刻重新激活计划。\n\n## 理解边界\n\n自动触发不等于始终有益。教材中的实验发现，即使被要求不再响应，原线索仍可能干扰当前任务；计划也不能替代行动条件和目标调整。\n"}, {"id": "cognition-insight", "title": "顿悟与表征改变", "english": "Insight and representational change", "kind": "心理过程", "domain": "cognition", "subdomain": "问题解决", "summary": "突然想到解法，有时来自重新理解问题、放松自加的限制或改变对象的表示方式。顿悟感是主观体验，解决过程未必真的瞬间发生。", "aliases": ["Insight and representational change"], "keywords": ["顿悟与表征改变", "Insight and representational change", "问题解决", "顿悟", "灵感", "卡住", "思维定势", "功能固着", "换角度"], "questions": ["想不出答案时，换一种表示方式有什么用？", "顿悟与表征改变在什么条件下适用，有什么局限？"], "sources": [{"book": "cognitive", "chapter": "第12章 · 问题解决与专长", "locator": "PDF 第 647–647 页", "pdfPages": [647]}], "candidateRelated": [{"title": "图式", "reason": "熟悉表征可帮助也可能限制理解"}, {"title": "类比迁移", "reason": "两者都涉及重新表示问题结构"}], "sections": [{"heading": "核心解释", "text": "表征改变理论认为，一些难题之所以持续无解，是因为初始理解包含多余限制，或把对象固定在某种用法中。重新编码问题、放松约束可能让原先看不见的解法变得可用。暂时停下后的酝酿效应，也可能部分源于错误线索或无效策略逐渐被遗忘。"}, {"heading": "一个例子", "text": "理解用例：你一直把一个小盒子当作盛放物品的容器，换个角度把它当作支架之后，先前卡住的空间安排问题突然有了解法。"}, {"heading": "理解边界", "text": "顿悟难以直接测量，同一道题可被不同策略解出。突然的“明白了”不证明此前没有渐进加工，也不保证答案正确。"}], "markdown": "---\nid: \"cognition-insight\"\ntitle: \"顿悟与表征改变\"\nenglish: \"Insight and representational change\"\nkind: \"心理过程\"\ndomain: \"cognition\"\nsubdomain: \"问题解决\"\nsummary: \"突然想到解法，有时来自重新理解问题、放松自加的限制或改变对象的表示方式。顿悟感是主观体验，解决过程未必真的瞬间发生。\"\naliases: [\"Insight and representational change\"]\nkeywords: [\"顿悟与表征改变\", \"Insight and representational change\", \"问题解决\", \"顿悟\", \"灵感\", \"卡住\", \"思维定势\", \"功能固着\", \"换角度\"]\nquestions: [\"想不出答案时，换一种表示方式有什么用？\", \"顿悟与表征改变在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"cognitive\", \"chapter\": \"第12章 · 问题解决与专长\", \"locator\": \"PDF 第 647–647 页\", \"pdfPages\": [647]}]\ncandidateRelated: [{\"title\": \"图式\", \"reason\": \"熟悉表征可帮助也可能限制理解\"}, {\"title\": \"类比迁移\", \"reason\": \"两者都涉及重新表示问题结构\"}]\n---\n\n## 核心解释\n\n表征改变理论认为，一些难题之所以持续无解，是因为初始理解包含多余限制，或把对象固定在某种用法中。重新编码问题、放松约束可能让原先看不见的解法变得可用。暂时停下后的酝酿效应，也可能部分源于错误线索或无效策略逐渐被遗忘。\n\n## 一个例子\n\n理解用例：你一直把一个小盒子当作盛放物品的容器，换个角度把它当作支架之后，先前卡住的空间安排问题突然有了解法。\n\n## 理解边界\n\n顿悟难以直接测量，同一道题可被不同策略解出。突然的“明白了”不证明此前没有渐进加工，也不保证答案正确。\n"}, {"id": "cognition-load-theory", "title": "注意负荷理论", "english": "Load theory of attention", "kind": "理论", "domain": "cognition", "subdomain": "注意与控制", "summary": "分心程度取决于任务消耗哪一种资源。高知觉负荷可能减少无关刺激加工，高认知控制负荷却可能削弱抑制干扰的能力。", "aliases": ["Load theory of attention"], "keywords": ["注意负荷理论", "Load theory of attention", "注意与控制", "分心", "干扰", "忙碌", "负荷", "注意", "控制"], "questions": ["为什么忙着记东西时反而更容易分心？", "注意负荷理论在什么条件下适用，有什么局限？"], "sources": [{"book": "cognitive", "chapter": "第5章 · 注意与表现", "locator": "PDF 第 263–264 页", "pdfPages": [263, 264]}], "candidateRelated": [{"title": "工作记忆模型", "reason": "认知控制负荷与保持目标的资源有关"}, {"title": "变化盲视与非注意盲视", "reason": "注意限制可影响信息觉察"}], "sections": [{"heading": "核心解释", "text": "Lavie区分知觉负荷与认知控制负荷。知觉任务很简单时，剩余加工能力可能延伸到无关信息；知觉任务较繁重时，这种溢出减少。相反，当工作记忆等控制资源被占用时，人可能更难维持任务目标、排除干扰。因此“越忙越容易分心”并不是统一规律。"}, {"heading": "一个例子", "text": "理解用例：在复杂图形中找目标，可能顾不上旁边无关图案；但一边记住长号码一边完成简单搜索，反而可能更受旁边刺激干扰。"}, {"heading": "理解边界", "text": "两类负荷的定义与操作方式并不总是清楚，其效应也不总是彼此独立。解释具体任务时要检查所增加的究竟是哪一种要求。"}], "markdown": "---\nid: \"cognition-load-theory\"\ntitle: \"注意负荷理论\"\nenglish: \"Load theory of attention\"\nkind: \"理论\"\ndomain: \"cognition\"\nsubdomain: \"注意与控制\"\nsummary: \"分心程度取决于任务消耗哪一种资源。高知觉负荷可能减少无关刺激加工，高认知控制负荷却可能削弱抑制干扰的能力。\"\naliases: [\"Load theory of attention\"]\nkeywords: [\"注意负荷理论\", \"Load theory of attention\", \"注意与控制\", \"分心\", \"干扰\", \"忙碌\", \"负荷\", \"注意\", \"控制\"]\nquestions: [\"为什么忙着记东西时反而更容易分心？\", \"注意负荷理论在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"cognitive\", \"chapter\": \"第5章 · 注意与表现\", \"locator\": \"PDF 第 263–264 页\", \"pdfPages\": [263, 264]}]\ncandidateRelated: [{\"title\": \"工作记忆模型\", \"reason\": \"认知控制负荷与保持目标的资源有关\"}, {\"title\": \"变化盲视与非注意盲视\", \"reason\": \"注意限制可影响信息觉察\"}]\n---\n\n## 核心解释\n\nLavie区分知觉负荷与认知控制负荷。知觉任务很简单时，剩余加工能力可能延伸到无关信息；知觉任务较繁重时，这种溢出减少。相反，当工作记忆等控制资源被占用时，人可能更难维持任务目标、排除干扰。因此“越忙越容易分心”并不是统一规律。\n\n## 一个例子\n\n理解用例：在复杂图形中找目标，可能顾不上旁边无关图案；但一边记住长号码一边完成简单搜索，反而可能更受旁边刺激干扰。\n\n## 理解边界\n\n两类负荷的定义与操作方式并不总是清楚，其效应也不总是彼此独立。解释具体任务时要检查所增加的究竟是哪一种要求。\n"}, {"id": "cognition-mental-models", "title": "心智模型理论", "english": "Mental model theory", "kind": "理论", "domain": "cognition", "subdomain": "推理与信念", "summary": "推理时，人会构造与前提相容的可能情境，并依据这些模型判断结论。若只保留最容易想到的可能性，就可能忽略反例。", "aliases": ["Mental model theory"], "keywords": ["心智模型理论", "Mental model theory", "推理与信念", "反例", "逻辑", "可能性", "推理", "前提", "判断"], "questions": ["心智模型理论解释了什么心理现象？", "心智模型理论在什么条件下适用，有什么局限？"], "sources": [{"book": "cognitive", "chapter": "第14章 · 推理与假设检验", "locator": "PDF 第 737–737 页", "pdfPages": [737]}], "candidateRelated": [{"title": "工作记忆模型", "reason": "维持多个可能情境需要资源"}, {"title": "确认偏误", "reason": "忽略反例会使初始判断延续"}], "sections": [{"heading": "核心解释", "text": "Johnson-Laird认为人用内部模型表示前提描述的关系，并检查候选结论是否在可能情境中成立。为节约工作记忆，人通常只明确表征被认为真实的信息，未必充分展开所有替代情境。需要多个模型或搜索反例的任务因此常更加困难。"}, {"heading": "一个例子", "text": "理解用例：“有些学生会法语，有些学生会德语”并不能推出有人同时会两者。若只想起两组重叠的情境，却没考虑两组完全分开，就可能误推。"}, {"heading": "理解边界", "text": "理论对模型如何形成的过程说明仍不够充分，人也比理论假设更少主动寻找反例。日常推理同时受知识、目的与概率判断影响。"}], "markdown": "---\nid: \"cognition-mental-models\"\ntitle: \"心智模型理论\"\nenglish: \"Mental model theory\"\nkind: \"理论\"\ndomain: \"cognition\"\nsubdomain: \"推理与信念\"\nsummary: \"推理时，人会构造与前提相容的可能情境，并依据这些模型判断结论。若只保留最容易想到的可能性，就可能忽略反例。\"\naliases: [\"Mental model theory\"]\nkeywords: [\"心智模型理论\", \"Mental model theory\", \"推理与信念\", \"反例\", \"逻辑\", \"可能性\", \"推理\", \"前提\", \"判断\"]\nquestions: [\"心智模型理论解释了什么心理现象？\", \"心智模型理论在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"cognitive\", \"chapter\": \"第14章 · 推理与假设检验\", \"locator\": \"PDF 第 737–737 页\", \"pdfPages\": [737]}]\ncandidateRelated: [{\"title\": \"工作记忆模型\", \"reason\": \"维持多个可能情境需要资源\"}, {\"title\": \"确认偏误\", \"reason\": \"忽略反例会使初始判断延续\"}]\n---\n\n## 核心解释\n\nJohnson-Laird认为人用内部模型表示前提描述的关系，并检查候选结论是否在可能情境中成立。为节约工作记忆，人通常只明确表征被认为真实的信息，未必充分展开所有替代情境。需要多个模型或搜索反例的任务因此常更加困难。\n\n## 一个例子\n\n理解用例：“有些学生会法语，有些学生会德语”并不能推出有人同时会两者。若只想起两组重叠的情境，却没考虑两组完全分开，就可能误推。\n\n## 理解边界\n\n理论对模型如何形成的过程说明仍不够充分，人也比理论假设更少主动寻找反例。日常推理同时受知识、目的与概率判断影响。\n"}, {"id": "cognition-misinformation", "title": "误导信息效应", "english": "Misinformation effect", "kind": "效应", "domain": "cognition", "subdomain": "日常记忆", "summary": "经历事件后接触的误导信息，可能改变后续报告。记忆并非原样播放，提问方式、后来听到的描述和来源判断都可能影响回忆。", "aliases": ["Misinformation effect"], "keywords": ["误导信息效应", "Misinformation effect", "日常记忆", "记错", "误导", "暗示", "目击", "证词", "假记忆"], "questions": ["后来听到的描述会改变我对原事件的记忆吗？", "误导信息效应在什么条件下适用，有什么局限？"], "sources": [{"book": "cognitive", "chapter": "第8章 · 日常记忆", "locator": "PDF 第 421–421 页", "pdfPages": [421]}], "candidateRelated": [{"title": "图式", "reason": "已有知识和后来信息都可能影响重建"}, {"title": "确认偏误", "reason": "预期可能影响目击信息的解释"}], "sections": [{"heading": "核心解释", "text": "目击记忆研究发现，事件后的信息可以影响人报告看到了什么。错误描述可能与原事件混淆，也可能影响回答判断。教材强调，这不总意味着原始记忆痕迹被永久改写；有时误导材料反而提示两种描述的差异，促使人重新提取准确的信息。"}, {"heading": "一个例子", "text": "理解用例：看完一段交通视频后，若别人反复提到画面里并不存在的标志，你后来可能把这段描述当成自己看见的细节，需要回查原始画面。"}, {"heading": "理解边界", "text": "后续报告失真不能单独证明原记忆已经消失。信息来源、信心测量时间与提取线索都会影响结果，不能把所有记忆错误归因于暗示。"}], "markdown": "---\nid: \"cognition-misinformation\"\ntitle: \"误导信息效应\"\nenglish: \"Misinformation effect\"\nkind: \"效应\"\ndomain: \"cognition\"\nsubdomain: \"日常记忆\"\nsummary: \"经历事件后接触的误导信息，可能改变后续报告。记忆并非原样播放，提问方式、后来听到的描述和来源判断都可能影响回忆。\"\naliases: [\"Misinformation effect\"]\nkeywords: [\"误导信息效应\", \"Misinformation effect\", \"日常记忆\", \"记错\", \"误导\", \"暗示\", \"目击\", \"证词\", \"假记忆\"]\nquestions: [\"后来听到的描述会改变我对原事件的记忆吗？\", \"误导信息效应在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"cognitive\", \"chapter\": \"第8章 · 日常记忆\", \"locator\": \"PDF 第 421–421 页\", \"pdfPages\": [421]}]\ncandidateRelated: [{\"title\": \"图式\", \"reason\": \"已有知识和后来信息都可能影响重建\"}, {\"title\": \"确认偏误\", \"reason\": \"预期可能影响目击信息的解释\"}]\n---\n\n## 核心解释\n\n目击记忆研究发现，事件后的信息可以影响人报告看到了什么。错误描述可能与原事件混淆，也可能影响回答判断。教材强调，这不总意味着原始记忆痕迹被永久改写；有时误导材料反而提示两种描述的差异，促使人重新提取准确的信息。\n\n## 一个例子\n\n理解用例：看完一段交通视频后，若别人反复提到画面里并不存在的标志，你后来可能把这段描述当成自己看见的细节，需要回查原始画面。\n\n## 理解边界\n\n后续报告失真不能单独证明原记忆已经消失。信息来源、信心测量时间与提取线索都会影响结果，不能把所有记忆错误归因于暗示。\n"}, {"id": "cognition-multiple-resources", "title": "多重资源理论", "english": "Multiple resource theory", "kind": "理论", "domain": "cognition", "subdomain": "注意与控制", "summary": "同时完成两项任务的困难程度，不只取决于总难度，还取决于它们是否争用同一类加工资源。任务相似时更可能互相干扰。", "aliases": ["Multiple resource theory"], "keywords": ["多重资源理论", "Multiple resource theory", "注意与控制", "多任务", "干扰", "分心", "同时", "资源", "协调"], "questions": ["多重资源理论解释了什么心理现象？", "多重资源理论在什么条件下适用，有什么局限？"], "sources": [{"book": "cognitive", "chapter": "第5章 · 注意与表现", "locator": "PDF 第 265–265 页", "pdfPages": [265]}], "candidateRelated": [{"title": "工作记忆模型", "reason": "资源保持和中央控制影响多任务"}, {"title": "注意负荷理论", "reason": "两者都区分不同加工要求"}], "sections": [{"heading": "核心解释", "text": "多重资源理论认为认知资源有不同类别，两项任务若依赖相同输入通道、表征或反应资源，便更容易发生竞争。任务使用不同资源时可能较顺利地并行，但协调任务本身仍有成本。这提供了分析多任务表现的框架，而非保证人能无限同时处理事情。"}, {"heading": "一个例子", "text": "理解用例：听简单提示音同时看地图，可能比同时阅读两段复杂文字容易；但如果两项任务都要求连续判断和决策，即使输入通道不同仍可能冲突。"}, {"heading": "理解边界", "text": "理论可能低估监控与协调任务所需的高级控制。资源划分必须通过证据检验，不能仅凭任务标签就预测干扰大小。"}], "markdown": "---\nid: \"cognition-multiple-resources\"\ntitle: \"多重资源理论\"\nenglish: \"Multiple resource theory\"\nkind: \"理论\"\ndomain: \"cognition\"\nsubdomain: \"注意与控制\"\nsummary: \"同时完成两项任务的困难程度，不只取决于总难度，还取决于它们是否争用同一类加工资源。任务相似时更可能互相干扰。\"\naliases: [\"Multiple resource theory\"]\nkeywords: [\"多重资源理论\", \"Multiple resource theory\", \"注意与控制\", \"多任务\", \"干扰\", \"分心\", \"同时\", \"资源\", \"协调\"]\nquestions: [\"多重资源理论解释了什么心理现象？\", \"多重资源理论在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"cognitive\", \"chapter\": \"第5章 · 注意与表现\", \"locator\": \"PDF 第 265–265 页\", \"pdfPages\": [265]}]\ncandidateRelated: [{\"title\": \"工作记忆模型\", \"reason\": \"资源保持和中央控制影响多任务\"}, {\"title\": \"注意负荷理论\", \"reason\": \"两者都区分不同加工要求\"}]\n---\n\n## 核心解释\n\n多重资源理论认为认知资源有不同类别，两项任务若依赖相同输入通道、表征或反应资源，便更容易发生竞争。任务使用不同资源时可能较顺利地并行，但协调任务本身仍有成本。这提供了分析多任务表现的框架，而非保证人能无限同时处理事情。\n\n## 一个例子\n\n理解用例：听简单提示音同时看地图，可能比同时阅读两段复杂文字容易；但如果两项任务都要求连续判断和决策，即使输入通道不同仍可能冲突。\n\n## 理解边界\n\n理论可能低估监控与协调任务所需的高级控制。资源划分必须通过证据检验，不能仅凭任务标签就预测干扰大小。\n"}, {"id": "cognition-optic-flow", "title": "光流与运动知觉", "english": "Optic flow", "kind": "心理过程", "domain": "cognition", "subdomain": "知觉与行动", "summary": "观察者移动时，视野中的纹理与对象形成系统性的变化。这些动态线索帮助估计前进方向及接近物体的速度，支持行动控制。", "aliases": ["Optic flow"], "keywords": ["光流与运动知觉", "Optic flow", "知觉与行动", "光流", "运动", "速度", "距离", "驾驶", "接触时间"], "questions": ["光流与运动知觉解释了什么心理现象？", "光流与运动知觉在什么条件下适用，有什么局限？"], "sources": [{"book": "cognitive", "chapter": "第4章 · 运动知觉与行动", "locator": "PDF 第 207–207 页", "pdfPages": [207]}], "candidateRelated": [{"title": "可供性", "reason": "同属生态知觉的行动取向"}, {"title": "知觉—动作双视觉系统", "reason": "动态视觉线索参与在线行动控制"}], "sections": [{"heading": "核心解释", "text": "Gibson强调，人在环境中移动所产生的光流提供运动方向的信息。物体的视觉扩张还可帮助估计接触时间。不过，视网膜上的运动同时包含头部与眼球运动的影响，因此实际判断需要把光流与双眼视差、熟悉大小以及行动目标等线索结合。"}, {"heading": "一个例子", "text": "理解用例：向前走过走廊时，两侧墙面似乎向后流动，近处变化更快。驾驶时，前方物体在视野中迅速扩大也会帮助判断接近程度。"}, {"heading": "理解边界", "text": "光流是重要线索，但不是唯一线索。目光移动、物体自身运动、目标和安全余量都会改变判断，不能把自然行为归结为单一计算。"}], "markdown": "---\nid: \"cognition-optic-flow\"\ntitle: \"光流与运动知觉\"\nenglish: \"Optic flow\"\nkind: \"心理过程\"\ndomain: \"cognition\"\nsubdomain: \"知觉与行动\"\nsummary: \"观察者移动时，视野中的纹理与对象形成系统性的变化。这些动态线索帮助估计前进方向及接近物体的速度，支持行动控制。\"\naliases: [\"Optic flow\"]\nkeywords: [\"光流与运动知觉\", \"Optic flow\", \"知觉与行动\", \"光流\", \"运动\", \"速度\", \"距离\", \"驾驶\", \"接触时间\"]\nquestions: [\"光流与运动知觉解释了什么心理现象？\", \"光流与运动知觉在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"cognitive\", \"chapter\": \"第4章 · 运动知觉与行动\", \"locator\": \"PDF 第 207–207 页\", \"pdfPages\": [207]}]\ncandidateRelated: [{\"title\": \"可供性\", \"reason\": \"同属生态知觉的行动取向\"}, {\"title\": \"知觉—动作双视觉系统\", \"reason\": \"动态视觉线索参与在线行动控制\"}]\n---\n\n## 核心解释\n\nGibson强调，人在环境中移动所产生的光流提供运动方向的信息。物体的视觉扩张还可帮助估计接触时间。不过，视网膜上的运动同时包含头部与眼球运动的影响，因此实际判断需要把光流与双眼视差、熟悉大小以及行动目标等线索结合。\n\n## 一个例子\n\n理解用例：向前走过走廊时，两侧墙面似乎向后流动，近处变化更快。驾驶时，前方物体在视野中迅速扩大也会帮助判断接近程度。\n\n## 理解边界\n\n光流是重要线索，但不是唯一线索。目光移动、物体自身运动、目标和安全余量都会改变判断，不能把自然行为归结为单一计算。\n"}, {"id": "cognition-pain-gate", "title": "疼痛闸门控制理论", "english": "Gate-control theory of pain", "kind": "理论", "domain": "cognition", "subdomain": "感觉与知觉", "summary": "疼痛体验不只是受损部位信号的被动读取。脊髓与脑的调节可以改变疼痛信息传递，感觉、情绪和预期因此共同参与体验。", "aliases": ["Gate-control theory of pain"], "keywords": ["疼痛闸门控制理论", "Gate-control theory of pain", "感觉与知觉", "痛觉", "疼痛", "调节", "注意", "闸门", "预期"], "questions": ["疼痛闸门控制理论解释了什么心理现象？", "疼痛闸门控制理论在什么条件下适用，有什么局限？"], "sources": [{"book": "general", "chapter": "第6章 · 嗅觉、味觉、痛觉、听觉与心理物理学", "locator": "PDF 第 488–488 页", "pdfPages": [488]}], "candidateRelated": [{"title": "自上而下与自下而上加工", "reason": "知觉结合外周输入与中央调节"}, {"title": "情绪的认知评价理论", "reason": "意义和情绪会影响体验"}], "sections": [{"heading": "核心解释", "text": "闸门控制理论把疼痛传递理解为可调节的过程：外周输入进入中枢时受到神经机制筛选，上行与下行活动共同影响最终体验。教材还讨论内源性阿片系统、注意与信念对疼痛的影响，说明相近伤害在不同情境中未必产生相同痛感。"}, {"heading": "一个例子", "text": "理解用例：同样程度的不适，在专心活动时与持续担心它时，主观感受可能不同。这并不表示疼痛是虚构，而是传递与解释受到多层调节。"}, {"heading": "理解边界", "text": "疼痛调节不等于没有身体损伤，也不能凭心理因素解释所有疼痛。本条只用于理解教材中的机制框架，不提供诊断或处理方案。"}], "markdown": "---\nid: \"cognition-pain-gate\"\ntitle: \"疼痛闸门控制理论\"\nenglish: \"Gate-control theory of pain\"\nkind: \"理论\"\ndomain: \"cognition\"\nsubdomain: \"感觉与知觉\"\nsummary: \"疼痛体验不只是受损部位信号的被动读取。脊髓与脑的调节可以改变疼痛信息传递，感觉、情绪和预期因此共同参与体验。\"\naliases: [\"Gate-control theory of pain\"]\nkeywords: [\"疼痛闸门控制理论\", \"Gate-control theory of pain\", \"感觉与知觉\", \"痛觉\", \"疼痛\", \"调节\", \"注意\", \"闸门\", \"预期\"]\nquestions: [\"疼痛闸门控制理论解释了什么心理现象？\", \"疼痛闸门控制理论在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"general\", \"chapter\": \"第6章 · 嗅觉、味觉、痛觉、听觉与心理物理学\", \"locator\": \"PDF 第 488–488 页\", \"pdfPages\": [488]}]\ncandidateRelated: [{\"title\": \"自上而下与自下而上加工\", \"reason\": \"知觉结合外周输入与中央调节\"}, {\"title\": \"情绪的认知评价理论\", \"reason\": \"意义和情绪会影响体验\"}]\n---\n\n## 核心解释\n\n闸门控制理论把疼痛传递理解为可调节的过程：外周输入进入中枢时受到神经机制筛选，上行与下行活动共同影响最终体验。教材还讨论内源性阿片系统、注意与信念对疼痛的影响，说明相近伤害在不同情境中未必产生相同痛感。\n\n## 一个例子\n\n理解用例：同样程度的不适，在专心活动时与持续担心它时，主观感受可能不同。这并不表示疼痛是虚构，而是传递与解释受到多层调节。\n\n## 理解边界\n\n疼痛调节不等于没有身体损伤，也不能凭心理因素解释所有疼痛。本条只用于理解教材中的机制框架，不提供诊断或处理方案。\n"}, {"id": "cognition-perception-action", "title": "知觉—动作双视觉系统", "english": "Perception-action model", "kind": "模型", "domain": "cognition", "subdomain": "视觉知觉", "summary": "视觉既帮助我们识别对象，也支持实时行动。双系统模型将这两种功能分别联系到腹侧和背侧通路，但两者持续交换信息。", "aliases": ["Perception-action model"], "keywords": ["知觉—动作双视觉系统", "Perception-action model", "视觉知觉", "抓握", "腹侧", "背侧", "行动", "视觉", "双通路"], "questions": ["知觉—动作双视觉系统解释了什么心理现象？", "知觉—动作双视觉系统在什么条件下适用，有什么局限？"], "sources": [{"book": "cognitive", "chapter": "第2章 · 视觉知觉的基本过程", "locator": "PDF 第 123–123 页", "pdfPages": [123]}], "candidateRelated": [{"title": "双重分离", "reason": "利用患者功能分离检验系统划分"}, {"title": "可供性", "reason": "都强调知觉与行动的联系"}], "sections": [{"heading": "核心解释", "text": "Milner与Goodale提出，腹侧通路偏重形成可用于识别的对象表征，背侧通路偏重利用眼前信息控制抓握和指向。视觉损伤患者与错觉任务提供了区分两者的证据。不过，行动常常同时需要对象知识、当前位置及多个视觉通路的配合。"}, {"heading": "一个例子", "text": "理解用例：你判断一个杯子看起来有多宽，与伸手抓住它并实时调整手指，是两种有关联但要求不同的任务。视觉错觉对两者的影响可能不同。"}, {"heading": "理解边界", "text": "两条通路不是互不联系的独立系统，患者双重分离证据也并非完全一致。延迟行动、复杂工具使用等任务会依赖更多交互加工。"}], "markdown": "---\nid: \"cognition-perception-action\"\ntitle: \"知觉—动作双视觉系统\"\nenglish: \"Perception-action model\"\nkind: \"模型\"\ndomain: \"cognition\"\nsubdomain: \"视觉知觉\"\nsummary: \"视觉既帮助我们识别对象，也支持实时行动。双系统模型将这两种功能分别联系到腹侧和背侧通路，但两者持续交换信息。\"\naliases: [\"Perception-action model\"]\nkeywords: [\"知觉—动作双视觉系统\", \"Perception-action model\", \"视觉知觉\", \"抓握\", \"腹侧\", \"背侧\", \"行动\", \"视觉\", \"双通路\"]\nquestions: [\"知觉—动作双视觉系统解释了什么心理现象？\", \"知觉—动作双视觉系统在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"cognitive\", \"chapter\": \"第2章 · 视觉知觉的基本过程\", \"locator\": \"PDF 第 123–123 页\", \"pdfPages\": [123]}]\ncandidateRelated: [{\"title\": \"双重分离\", \"reason\": \"利用患者功能分离检验系统划分\"}, {\"title\": \"可供性\", \"reason\": \"都强调知觉与行动的联系\"}]\n---\n\n## 核心解释\n\nMilner与Goodale提出，腹侧通路偏重形成可用于识别的对象表征，背侧通路偏重利用眼前信息控制抓握和指向。视觉损伤患者与错觉任务提供了区分两者的证据。不过，行动常常同时需要对象知识、当前位置及多个视觉通路的配合。\n\n## 一个例子\n\n理解用例：你判断一个杯子看起来有多宽，与伸手抓住它并实时调整手指，是两种有关联但要求不同的任务。视觉错觉对两者的影响可能不同。\n\n## 理解边界\n\n两条通路不是互不联系的独立系统，患者双重分离证据也并非完全一致。延迟行动、复杂工具使用等任务会依赖更多交互加工。\n"}, {"id": "cognition-perceptual-constancy", "title": "知觉恒常性", "english": "Perceptual constancy", "kind": "心理过程", "domain": "cognition", "subdomain": "视觉知觉", "summary": "距离、角度和照明变化时，感官输入持续改变，但对象往往仍显得大小、形状或颜色稳定。知觉利用环境关系超越当下的局部投影。", "aliases": ["Perceptual constancy"], "keywords": ["知觉恒常性", "Perceptual constancy", "视觉知觉", "恒常性", "大小", "距离", "深度", "视觉", "错觉"], "questions": ["知觉恒常性解释了什么心理现象？", "知觉恒常性在什么条件下适用，有什么局限？"], "sources": [{"book": "general", "chapter": "第7章 · 视觉心理学", "locator": "PDF 第 580–580 页", "pdfPages": [580]}], "candidateRelated": [{"title": "颜色视觉的双过程理论", "reason": "颜色恒常还依赖场景与照明"}, {"title": "自上而下与自下而上加工", "reason": "输入与背景信息共同塑造稳定知觉"}], "sections": [{"heading": "核心解释", "text": "大小恒常性说明，同一对象离得更远、视网膜影像变小时，人仍可能判断它大小未变。视觉系统结合距离线索和其他信息形成对象表征，而不是把投影尺寸直接当作实际尺寸。某些错觉也显示，当距离推断被特定场景线索引导时，大小判断会随之变化。"}, {"heading": "一个例子", "text": "理解用例：朋友沿走廊走远时，视网膜上的影像越来越小，你通常不会认为他真的缩小了；相同大小的图形放在不同深度背景中却可能显得不同。"}, {"heading": "理解边界", "text": "恒常性通常是适应性结果，不是绝对不变的规则。距离与大小之间的关系受多种线索影响，也不能由一种错觉解释全部视觉计算。"}], "markdown": "---\nid: \"cognition-perceptual-constancy\"\ntitle: \"知觉恒常性\"\nenglish: \"Perceptual constancy\"\nkind: \"心理过程\"\ndomain: \"cognition\"\nsubdomain: \"视觉知觉\"\nsummary: \"距离、角度和照明变化时，感官输入持续改变，但对象往往仍显得大小、形状或颜色稳定。知觉利用环境关系超越当下的局部投影。\"\naliases: [\"Perceptual constancy\"]\nkeywords: [\"知觉恒常性\", \"Perceptual constancy\", \"视觉知觉\", \"恒常性\", \"大小\", \"距离\", \"深度\", \"视觉\", \"错觉\"]\nquestions: [\"知觉恒常性解释了什么心理现象？\", \"知觉恒常性在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"general\", \"chapter\": \"第7章 · 视觉心理学\", \"locator\": \"PDF 第 580–580 页\", \"pdfPages\": [580]}]\ncandidateRelated: [{\"title\": \"颜色视觉的双过程理论\", \"reason\": \"颜色恒常还依赖场景与照明\"}, {\"title\": \"自上而下与自下而上加工\", \"reason\": \"输入与背景信息共同塑造稳定知觉\"}]\n---\n\n## 核心解释\n\n大小恒常性说明，同一对象离得更远、视网膜影像变小时，人仍可能判断它大小未变。视觉系统结合距离线索和其他信息形成对象表征，而不是把投影尺寸直接当作实际尺寸。某些错觉也显示，当距离推断被特定场景线索引导时，大小判断会随之变化。\n\n## 一个例子\n\n理解用例：朋友沿走廊走远时，视网膜上的影像越来越小，你通常不会认为他真的缩小了；相同大小的图形放在不同深度背景中却可能显得不同。\n\n## 理解边界\n\n恒常性通常是适应性结果，不是绝对不变的规则。距离与大小之间的关系受多种线索影响，也不能由一种错觉解释全部视觉计算。\n"}, {"id": "cognition-priming", "title": "启动效应", "english": "Priming", "kind": "效应", "domain": "cognition", "subdomain": "长期记忆", "summary": "先前接触某个刺激，可能改变后来对相关刺激的加工速度或表现，即使不主动回忆先前经历。启动是研究经验如何影响当前加工的入口。", "aliases": ["Priming"], "keywords": ["启动效应", "Priming", "长期记忆", "启动", "熟悉", "反应时间", "重复", "无意识", "关联"], "questions": ["启动效应解释了什么心理现象？", "启动效应在什么条件下适用，有什么局限？"], "sources": [{"book": "cognitive", "chapter": "第7章 · 长期记忆系统", "locator": "PDF 第 373–373 页", "pdfPages": [373]}, {"book": "general", "chapter": "第9章 · 记忆、注意与意识", "locator": "PDF 第 718–718 页", "pdfPages": [718]}], "candidateRelated": [{"title": "阈下知觉", "reason": "启动任务可用于检验弱意识条件下的加工"}, {"title": "情景记忆与语义记忆", "reason": "表现影响与有意识事件回忆可区分"}], "sections": [{"heading": "核心解释", "text": "启动通常通过比较先前接触与未接触条件下的后续表现来观察。重复启动可以体现先前加工使识别更有效，语义启动则表现为有关意义的项目影响目标加工。教材将部分启动归入非陈述性记忆，同时指出同一个任务仍可能混合有意识与无意识过程。"}, {"heading": "一个例子", "text": "理解用例：刚刚见过一个模糊词的清晰版本，稍后再辨认模糊版本时可能更快。你不必先有意识地回忆上次看到它的具体场景。"}, {"heading": "理解边界", "text": "启动不是单一机制，不同任务涉及的过程可能不同。简单刺激识别的结果不能直接推广到复杂社会行为，是否涉及意识也需专门测量。"}], "markdown": "---\nid: \"cognition-priming\"\ntitle: \"启动效应\"\nenglish: \"Priming\"\nkind: \"效应\"\ndomain: \"cognition\"\nsubdomain: \"长期记忆\"\nsummary: \"先前接触某个刺激，可能改变后来对相关刺激的加工速度或表现，即使不主动回忆先前经历。启动是研究经验如何影响当前加工的入口。\"\naliases: [\"Priming\"]\nkeywords: [\"启动效应\", \"Priming\", \"长期记忆\", \"启动\", \"熟悉\", \"反应时间\", \"重复\", \"无意识\", \"关联\"]\nquestions: [\"启动效应解释了什么心理现象？\", \"启动效应在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"cognitive\", \"chapter\": \"第7章 · 长期记忆系统\", \"locator\": \"PDF 第 373–373 页\", \"pdfPages\": [373]}, {\"book\": \"general\", \"chapter\": \"第9章 · 记忆、注意与意识\", \"locator\": \"PDF 第 718–718 页\", \"pdfPages\": [718]}]\ncandidateRelated: [{\"title\": \"阈下知觉\", \"reason\": \"启动任务可用于检验弱意识条件下的加工\"}, {\"title\": \"情景记忆与语义记忆\", \"reason\": \"表现影响与有意识事件回忆可区分\"}]\n---\n\n## 核心解释\n\n启动通常通过比较先前接触与未接触条件下的后续表现来观察。重复启动可以体现先前加工使识别更有效，语义启动则表现为有关意义的项目影响目标加工。教材将部分启动归入非陈述性记忆，同时指出同一个任务仍可能混合有意识与无意识过程。\n\n## 一个例子\n\n理解用例：刚刚见过一个模糊词的清晰版本，稍后再辨认模糊版本时可能更快。你不必先有意识地回忆上次看到它的具体场景。\n\n## 理解边界\n\n启动不是单一机制，不同任务涉及的过程可能不同。简单刺激识别的结果不能直接推广到复杂社会行为，是否涉及意识也需专门测量。\n"}, {"id": "cognition-prospect-theory", "title": "前景理论", "english": "Prospect theory", "kind": "理论", "domain": "cognition", "subdomain": "判断与决策", "summary": "人在风险选择中往往相对于参照点评估得失，对损失与同量收益的反应并不对称。结果的描述方式因而可能改变选择。", "aliases": ["Prospect theory"], "keywords": ["前景理论", "Prospect theory", "判断与决策", "损失厌恶", "框架", "参照点", "风险", "得失", "决策"], "questions": ["为什么失去与得到同样的东西感觉不同？", "前景理论在什么条件下适用，有什么局限？"], "sources": [{"book": "cognitive", "chapter": "第13章 · 判断与决策", "locator": "PDF 第 692–692 页", "pdfPages": [692]}], "candidateRelated": [{"title": "可得性与代表性启发式", "reason": "同属有限资源下的判断研究"}, {"title": "情绪的认知评价理论", "reason": "结果如何被解释会影响主观意义"}], "sections": [{"heading": "核心解释", "text": "前景理论强调价值依赖相对于参照点的变化，而非只由最终财富决定，并用损失厌恶等假设解释某些风险偏好与框架效应。获得与失去的描述会改变备选项的心理意义，帮助理解数学上接近的选项为什么产生不同吸引力。"}, {"heading": "一个例子", "text": "理解用例：一项方案被描述为“保住已有机会”或“获得同量新机会”时，你可能产生不同感觉；究竟把现状还是预期结果当作参照点也会影响判断。"}, {"heading": "理解边界", "text": "参照点有时难以明确，风险偏好也不总按收益保守、损失冒险的模式变化。来自实际经验与来自文字描述的决策可能不同。"}], "markdown": "---\nid: \"cognition-prospect-theory\"\ntitle: \"前景理论\"\nenglish: \"Prospect theory\"\nkind: \"理论\"\ndomain: \"cognition\"\nsubdomain: \"判断与决策\"\nsummary: \"人在风险选择中往往相对于参照点评估得失，对损失与同量收益的反应并不对称。结果的描述方式因而可能改变选择。\"\naliases: [\"Prospect theory\"]\nkeywords: [\"前景理论\", \"Prospect theory\", \"判断与决策\", \"损失厌恶\", \"框架\", \"参照点\", \"风险\", \"得失\", \"决策\"]\nquestions: [\"为什么失去与得到同样的东西感觉不同？\", \"前景理论在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"cognitive\", \"chapter\": \"第13章 · 判断与决策\", \"locator\": \"PDF 第 692–692 页\", \"pdfPages\": [692]}]\ncandidateRelated: [{\"title\": \"可得性与代表性启发式\", \"reason\": \"同属有限资源下的判断研究\"}, {\"title\": \"情绪的认知评价理论\", \"reason\": \"结果如何被解释会影响主观意义\"}]\n---\n\n## 核心解释\n\n前景理论强调价值依赖相对于参照点的变化，而非只由最终财富决定，并用损失厌恶等假设解释某些风险偏好与框架效应。获得与失去的描述会改变备选项的心理意义，帮助理解数学上接近的选项为什么产生不同吸引力。\n\n## 一个例子\n\n理解用例：一项方案被描述为“保住已有机会”或“获得同量新机会”时，你可能产生不同感觉；究竟把现状还是预期结果当作参照点也会影响判断。\n\n## 理解边界\n\n参照点有时难以明确，风险偏好也不总按收益保守、损失冒险的模式变化。来自实际经验与来自文字描述的决策可能不同。\n"}, {"id": "cognition-prospective-memory", "title": "前瞻记忆", "english": "Prospective memory", "kind": "心理过程", "domain": "cognition", "subdomain": "日常记忆", "summary": "前瞻记忆是记得在未来合适的时候执行意图。它需要形成计划、发现线索、提取意图并付诸行动，失败不一定来自忘记任务内容。", "aliases": ["Prospective memory"], "keywords": ["前瞻记忆", "Prospective memory", "日常记忆", "忘事", "意图", "提醒", "计划", "中断", "执行"], "questions": ["为什么明明知道要做什么，到时候还是忘了？", "前瞻记忆在什么条件下适用，有什么局限？"], "sources": [{"book": "cognitive", "chapter": "第8章 · 日常记忆", "locator": "PDF 第 421–421 页", "pdfPages": [421]}, {"book": "general", "chapter": "第9章 · 记忆、注意与意识", "locator": "PDF 第 781–781 页", "pdfPages": [781]}], "candidateRelated": [{"title": "工作记忆模型", "reason": "主动监控会消耗注意与控制资源"}, {"title": "实施意图", "reason": "将情境与行动连接可帮助触发意图"}], "sections": [{"heading": "核心解释", "text": "前瞻记忆包括基于事件的任务与基于时间的任务。外部事件可能自动触发意图，也可能需要主动监控环境与时间。动态多过程观点强调，两种路径会随任务和情境灵活配合；中断后未重新形成计划，或缺少恰当线索，都可能使意图无法执行。"}, {"heading": "一个例子", "text": "理解用例：你知道要归还一本书，却在路过图书馆时忘了进去。把“见到图书馆入口就还书”与具体线索连接，能帮助到时重新激活意图。"}, {"heading": "理解边界", "text": "记住任务内容与在正确时机想起它不同。监控不是始终必要，也会占用资源；实验室短期任务与生活中长期意图的要求并不相同。"}], "markdown": "---\nid: \"cognition-prospective-memory\"\ntitle: \"前瞻记忆\"\nenglish: \"Prospective memory\"\nkind: \"心理过程\"\ndomain: \"cognition\"\nsubdomain: \"日常记忆\"\nsummary: \"前瞻记忆是记得在未来合适的时候执行意图。它需要形成计划、发现线索、提取意图并付诸行动，失败不一定来自忘记任务内容。\"\naliases: [\"Prospective memory\"]\nkeywords: [\"前瞻记忆\", \"Prospective memory\", \"日常记忆\", \"忘事\", \"意图\", \"提醒\", \"计划\", \"中断\", \"执行\"]\nquestions: [\"为什么明明知道要做什么，到时候还是忘了？\", \"前瞻记忆在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"cognitive\", \"chapter\": \"第8章 · 日常记忆\", \"locator\": \"PDF 第 421–421 页\", \"pdfPages\": [421]}, {\"book\": \"general\", \"chapter\": \"第9章 · 记忆、注意与意识\", \"locator\": \"PDF 第 781–781 页\", \"pdfPages\": [781]}]\ncandidateRelated: [{\"title\": \"工作记忆模型\", \"reason\": \"主动监控会消耗注意与控制资源\"}, {\"title\": \"实施意图\", \"reason\": \"将情境与行动连接可帮助触发意图\"}]\n---\n\n## 核心解释\n\n前瞻记忆包括基于事件的任务与基于时间的任务。外部事件可能自动触发意图，也可能需要主动监控环境与时间。动态多过程观点强调，两种路径会随任务和情境灵活配合；中断后未重新形成计划，或缺少恰当线索，都可能使意图无法执行。\n\n## 一个例子\n\n理解用例：你知道要归还一本书，却在路过图书馆时忘了进去。把“见到图书馆入口就还书”与具体线索连接，能帮助到时重新激活意图。\n\n## 理解边界\n\n记住任务内容与在正确时机想起它不同。监控不是始终必要，也会占用资源；实验室短期任务与生活中长期意图的要求并不相同。\n"}, {"id": "cognition-recognition-components", "title": "成分识别理论", "english": "Recognition-by-components theory", "kind": "理论", "domain": "cognition", "subdomain": "物体识别", "summary": "物体可以通过基本几何成分及其空间关系被识别。这种结构描述解释了为什么即使视角变化或局部遮挡，人仍可能认出对象类别。", "aliases": ["Recognition-by-components theory"], "keywords": ["成分识别理论", "Recognition-by-components theory", "物体识别", "形状", "几何", "识别", "遮挡", "视角", "geons"], "questions": ["成分识别理论解释了什么心理现象？", "成分识别理论在什么条件下适用，有什么局限？"], "sources": [{"book": "cognitive", "chapter": "第3章 · 物体与面孔识别", "locator": "PDF 第 169–170 页", "pdfPages": [169, 170]}], "candidateRelated": [{"title": "格式塔知觉组织", "reason": "两者均重视刺激内部的组织关系"}, {"title": "面孔识别模型", "reason": "面孔识别更依赖整体与个体差异"}], "sections": [{"heading": "核心解释", "text": "Biederman提出，视觉加工可从边缘信息提取基本形状单元，再依据这些单元之间的关系识别对象。只要关键成分及其关系仍可辨认，识别便可能跨越视角变化。理论对区分普通物体类别很有启发，但对识别同类对象中的具体个体解释力较弱。"}, {"heading": "一个例子", "text": "理解用例：一把茶壶即使转过角度，只要壶身、把手与壶嘴的配置仍可辨认，你通常还能认出它；辨认是哪一把茶壶则需要更多细节。"}, {"heading": "理解边界", "text": "物体表征同时可能包含依赖视角和不依赖视角的信息。该理论弱化了上下文与经验的作用，不能把所有识别任务简化成几何拼装。"}], "markdown": "---\nid: \"cognition-recognition-components\"\ntitle: \"成分识别理论\"\nenglish: \"Recognition-by-components theory\"\nkind: \"理论\"\ndomain: \"cognition\"\nsubdomain: \"物体识别\"\nsummary: \"物体可以通过基本几何成分及其空间关系被识别。这种结构描述解释了为什么即使视角变化或局部遮挡，人仍可能认出对象类别。\"\naliases: [\"Recognition-by-components theory\"]\nkeywords: [\"成分识别理论\", \"Recognition-by-components theory\", \"物体识别\", \"形状\", \"几何\", \"识别\", \"遮挡\", \"视角\", \"geons\"]\nquestions: [\"成分识别理论解释了什么心理现象？\", \"成分识别理论在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"cognitive\", \"chapter\": \"第3章 · 物体与面孔识别\", \"locator\": \"PDF 第 169–170 页\", \"pdfPages\": [169, 170]}]\ncandidateRelated: [{\"title\": \"格式塔知觉组织\", \"reason\": \"两者均重视刺激内部的组织关系\"}, {\"title\": \"面孔识别模型\", \"reason\": \"面孔识别更依赖整体与个体差异\"}]\n---\n\n## 核心解释\n\nBiederman提出，视觉加工可从边缘信息提取基本形状单元，再依据这些单元之间的关系识别对象。只要关键成分及其关系仍可辨认，识别便可能跨越视角变化。理论对区分普通物体类别很有启发，但对识别同类对象中的具体个体解释力较弱。\n\n## 一个例子\n\n理解用例：一把茶壶即使转过角度，只要壶身、把手与壶嘴的配置仍可辨认，你通常还能认出它；辨认是哪一把茶壶则需要更多细节。\n\n## 理解边界\n\n物体表征同时可能包含依赖视角和不依赖视角的信息。该理论弱化了上下文与经验的作用，不能把所有识别任务简化成几何拼装。\n"}, {"id": "cognition-retrieval-cues", "title": "提取线索与编码联系", "english": "Retrieval cues and encoding associations", "kind": "心理过程", "domain": "cognition", "subdomain": "记忆与学习", "summary": "信息能否被想起，取决于当下线索与学习时形成的联系。遗忘有时是缺少有效入口，熟悉环境或自行生成的提示可能重新激活记忆。", "aliases": ["Retrieval cues and encoding associations"], "keywords": ["提取线索与编码联系", "Retrieval cues and encoding associations", "记忆与学习", "回忆", "线索", "环境", "忘记", "提醒", "关联"], "questions": ["提取线索与编码联系解释了什么心理现象？", "提取线索与编码联系在什么条件下适用，有什么局限？"], "sources": [{"book": "general", "chapter": "第9章 · 记忆、注意与意识", "locator": "PDF 第 769–781 页", "pdfPages": [769, 770, 781]}], "candidateRelated": [{"title": "心境一致性与心境依赖记忆", "reason": "内在状态也可能成为提取背景"}, {"title": "提取练习效应", "reason": "练习提取可加强访问路径"}], "sections": [{"heading": "核心解释", "text": "编码时形成的关联为后来的提取提供路径。线索越能连接目标信息，越可能帮助回忆；自己生成的线索可能尤其贴近个人编码方式。环境背景也能参与提取。因此记忆表现不仅反映储存了多少，还反映当前任务是否提供了与已有表征相配的访问条件。"}, {"heading": "一个例子", "text": "理解用例：你在书桌前忘了刚才要找什么，回到厨房却突然想起。场景恢复可能提供与原意图相连的线索，而不是记忆凭空重新产生。"}, {"heading": "理解边界", "text": "一个线索可能关联多个目标，效果因编码方式和干扰而异。想不起来不证明痕迹消失，想起来也仍需检查内容是否准确。"}], "markdown": "---\nid: \"cognition-retrieval-cues\"\ntitle: \"提取线索与编码联系\"\nenglish: \"Retrieval cues and encoding associations\"\nkind: \"心理过程\"\ndomain: \"cognition\"\nsubdomain: \"记忆与学习\"\nsummary: \"信息能否被想起，取决于当下线索与学习时形成的联系。遗忘有时是缺少有效入口，熟悉环境或自行生成的提示可能重新激活记忆。\"\naliases: [\"Retrieval cues and encoding associations\"]\nkeywords: [\"提取线索与编码联系\", \"Retrieval cues and encoding associations\", \"记忆与学习\", \"回忆\", \"线索\", \"环境\", \"忘记\", \"提醒\", \"关联\"]\nquestions: [\"提取线索与编码联系解释了什么心理现象？\", \"提取线索与编码联系在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"general\", \"chapter\": \"第9章 · 记忆、注意与意识\", \"locator\": \"PDF 第 769–781 页\", \"pdfPages\": [769, 770, 781]}]\ncandidateRelated: [{\"title\": \"心境一致性与心境依赖记忆\", \"reason\": \"内在状态也可能成为提取背景\"}, {\"title\": \"提取练习效应\", \"reason\": \"练习提取可加强访问路径\"}]\n---\n\n## 核心解释\n\n编码时形成的关联为后来的提取提供路径。线索越能连接目标信息，越可能帮助回忆；自己生成的线索可能尤其贴近个人编码方式。环境背景也能参与提取。因此记忆表现不仅反映储存了多少，还反映当前任务是否提供了与已有表征相配的访问条件。\n\n## 一个例子\n\n理解用例：你在书桌前忘了刚才要找什么，回到厨房却突然想起。场景恢复可能提供与原意图相连的线索，而不是记忆凭空重新产生。\n\n## 理解边界\n\n一个线索可能关联多个目标，效果因编码方式和干扰而异。想不起来不证明痕迹消失，想起来也仍需检查内容是否准确。\n"}, {"id": "cognition-self-memory", "title": "自我记忆系统", "english": "Self-memory system", "kind": "模型", "domain": "cognition", "subdomain": "日常记忆", "summary": "自传体记忆按不同抽象层级组织，并与当前目标和自我理解相联系。回忆既保留经历，也参与维持一个连续、可理解的自我。", "aliases": ["Self-memory system"], "keywords": ["自我记忆系统", "Self-memory system", "日常记忆", "自我", "自传", "目标", "往事", "人生", "回忆"], "questions": ["自我记忆系统解释了什么心理现象？", "自我记忆系统在什么条件下适用，有什么局限？"], "sources": [{"book": "cognitive", "chapter": "第8章 · 日常记忆", "locator": "PDF 第 420–420 页", "pdfPages": [420]}], "candidateRelated": [{"title": "情景记忆与语义记忆", "reason": "自传体记忆整合具体事件与概括知识"}, {"title": "图式", "reason": "自我知识会组织回忆"}], "sections": [{"heading": "核心解释", "text": "Conway的自我记忆系统把自传体知识与工作自我联系起来：当前目标影响哪些记忆被检索以及如何组织。回忆可以由线索直接触发，也可以通过逐步搜索形成。人生时期、一般事件和具体经历提供不同层次的信息，帮助把个人故事与当下需要联系起来。"}, {"heading": "一个例子", "text": "理解用例：准备写个人陈述时，你可能优先想起能够说明自己为何选择某项工作的经历；换成与老友聊天，浮现的又可能是其他往事。"}, {"heading": "理解边界", "text": "目标影响回忆不等于所有记忆都被随意改写。回忆同时受事件痕迹、线索和控制过程约束，生动和自我一致也不等于完全准确。"}], "markdown": "---\nid: \"cognition-self-memory\"\ntitle: \"自我记忆系统\"\nenglish: \"Self-memory system\"\nkind: \"模型\"\ndomain: \"cognition\"\nsubdomain: \"日常记忆\"\nsummary: \"自传体记忆按不同抽象层级组织，并与当前目标和自我理解相联系。回忆既保留经历，也参与维持一个连续、可理解的自我。\"\naliases: [\"Self-memory system\"]\nkeywords: [\"自我记忆系统\", \"Self-memory system\", \"日常记忆\", \"自我\", \"自传\", \"目标\", \"往事\", \"人生\", \"回忆\"]\nquestions: [\"自我记忆系统解释了什么心理现象？\", \"自我记忆系统在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"cognitive\", \"chapter\": \"第8章 · 日常记忆\", \"locator\": \"PDF 第 420–420 页\", \"pdfPages\": [420]}]\ncandidateRelated: [{\"title\": \"情景记忆与语义记忆\", \"reason\": \"自传体记忆整合具体事件与概括知识\"}, {\"title\": \"图式\", \"reason\": \"自我知识会组织回忆\"}]\n---\n\n## 核心解释\n\nConway的自我记忆系统把自传体知识与工作自我联系起来：当前目标影响哪些记忆被检索以及如何组织。回忆可以由线索直接触发，也可以通过逐步搜索形成。人生时期、一般事件和具体经历提供不同层次的信息，帮助把个人故事与当下需要联系起来。\n\n## 一个例子\n\n理解用例：准备写个人陈述时，你可能优先想起能够说明自己为何选择某项工作的经历；换成与老友聊天，浮现的又可能是其他往事。\n\n## 理解边界\n\n目标影响回忆不等于所有记忆都被随意改写。回忆同时受事件痕迹、线索和控制过程约束，生动和自我一致也不等于完全准确。\n"}, {"id": "cognition-signal-detection", "title": "信号检测论", "english": "Signal detection theory", "kind": "理论", "domain": "cognition", "subdomain": "感觉与判断", "summary": "判断某个信号是否存在，既取决于区分信号与噪声的能力，也取决于愿意在多大不确定性下回答“有”。漏报与误报体现不同决策代价。", "aliases": ["Signal detection theory"], "keywords": ["信号检测论", "Signal detection theory", "感觉与判断", "误报", "漏报", "命中", "敏感性", "阈值", "标准"], "questions": ["为什么更谨慎报告会减少误报却增加漏报？", "信号检测论在什么条件下适用，有什么局限？"], "sources": [{"book": "general", "chapter": "第6章 · 嗅觉、味觉、痛觉、听觉与心理物理学", "locator": "PDF 第 457–459 页", "pdfPages": [457, 458, 459]}], "candidateRelated": [{"title": "阈下知觉", "reason": "意识报告同样受标准影响"}, {"title": "意识内容与意识报告", "reason": "报告不是体验的透明副本"}], "sections": [{"heading": "核心解释", "text": "信号检测论把知觉敏感性与反应标准区分开。证据强度可能在有信号和无信号时重叠，观察者依据标准作答，因此会出现命中、漏报、误报与正确拒绝。期待、动机和错误成本可以改变标准，而不一定改变实际分辨能力。"}, {"heading": "一个例子", "text": "理解用例：安静地等待门铃时，你可能把微小声音当作铃声；若担心打扰别人，则可能只在十分确定时才报告。两种标准交换了误报与漏报风险。"}, {"heading": "理解边界", "text": "报告更多信号不必然意味着感觉更敏锐。应用时需要适合的任务和模型假设，不能只凭命中比例就分清敏感性与判断标准。"}], "markdown": "---\nid: \"cognition-signal-detection\"\ntitle: \"信号检测论\"\nenglish: \"Signal detection theory\"\nkind: \"理论\"\ndomain: \"cognition\"\nsubdomain: \"感觉与判断\"\nsummary: \"判断某个信号是否存在，既取决于区分信号与噪声的能力，也取决于愿意在多大不确定性下回答“有”。漏报与误报体现不同决策代价。\"\naliases: [\"Signal detection theory\"]\nkeywords: [\"信号检测论\", \"Signal detection theory\", \"感觉与判断\", \"误报\", \"漏报\", \"命中\", \"敏感性\", \"阈值\", \"标准\"]\nquestions: [\"为什么更谨慎报告会减少误报却增加漏报？\", \"信号检测论在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"general\", \"chapter\": \"第6章 · 嗅觉、味觉、痛觉、听觉与心理物理学\", \"locator\": \"PDF 第 457–459 页\", \"pdfPages\": [457, 458, 459]}]\ncandidateRelated: [{\"title\": \"阈下知觉\", \"reason\": \"意识报告同样受标准影响\"}, {\"title\": \"意识内容与意识报告\", \"reason\": \"报告不是体验的透明副本\"}]\n---\n\n## 核心解释\n\n信号检测论把知觉敏感性与反应标准区分开。证据强度可能在有信号和无信号时重叠，观察者依据标准作答，因此会出现命中、漏报、误报与正确拒绝。期待、动机和错误成本可以改变标准，而不一定改变实际分辨能力。\n\n## 一个例子\n\n理解用例：安静地等待门铃时，你可能把微小声音当作铃声；若担心打扰别人，则可能只在十分确定时才报告。两种标准交换了误报与漏报风险。\n\n## 理解边界\n\n报告更多信号不必然意味着感觉更敏锐。应用时需要适合的任务和模型假设，不能只凭命中比例就分清敏感性与判断标准。\n"}, {"id": "cognition-situation-model", "title": "情境模型", "english": "Situation model", "kind": "模型", "domain": "cognition", "subdomain": "语言理解", "summary": "理解文本不仅要记住字句，还要形成关于人物、地点、时间和事件关系的表征。情境模型随故事变化更新，支持连贯理解和推断。", "aliases": ["Situation model"], "keywords": ["情境模型", "Situation model", "语言理解", "故事", "篇章", "连贯", "情境", "事件", "推断"], "questions": ["情境模型解释了什么心理现象？", "情境模型在什么条件下适用，有什么局限？"], "sources": [{"book": "cognitive", "chapter": "第10章 · 语言理解", "locator": "PDF 第 541–541 页", "pdfPages": [541]}], "candidateRelated": [{"title": "图式", "reason": "背景知识参与情境建构"}, {"title": "工作记忆模型", "reason": "保持和更新人物关系需要认知资源"}], "sections": [{"heading": "核心解释", "text": "篇章理解研究区分表面文字、文本命题与所描述情境的表征。读者结合句子和背景知识建立当前事件模型，并在人物目标、时间或地点发生变化时更新它。事件索引与事件分段观点关注这种更新过程，说明理解为什么超出逐句识字与机械记忆。"}, {"heading": "一个例子", "text": "理解用例：故事先写人物离开家，随后写他走进车站。你会更新人物的位置，并把后文的“那里”理解为车站，即使没有重新描述全部场景。"}, {"heading": "理解边界", "text": "这些模型较适于简单叙事，复杂论证与说明文还需要其他解释。读者目的、知识和阅读能力影响模型形成，不是文本唯一决定。"}], "markdown": "---\nid: \"cognition-situation-model\"\ntitle: \"情境模型\"\nenglish: \"Situation model\"\nkind: \"模型\"\ndomain: \"cognition\"\nsubdomain: \"语言理解\"\nsummary: \"理解文本不仅要记住字句，还要形成关于人物、地点、时间和事件关系的表征。情境模型随故事变化更新，支持连贯理解和推断。\"\naliases: [\"Situation model\"]\nkeywords: [\"情境模型\", \"Situation model\", \"语言理解\", \"故事\", \"篇章\", \"连贯\", \"情境\", \"事件\", \"推断\"]\nquestions: [\"情境模型解释了什么心理现象？\", \"情境模型在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"cognitive\", \"chapter\": \"第10章 · 语言理解\", \"locator\": \"PDF 第 541–541 页\", \"pdfPages\": [541]}]\ncandidateRelated: [{\"title\": \"图式\", \"reason\": \"背景知识参与情境建构\"}, {\"title\": \"工作记忆模型\", \"reason\": \"保持和更新人物关系需要认知资源\"}]\n---\n\n## 核心解释\n\n篇章理解研究区分表面文字、文本命题与所描述情境的表征。读者结合句子和背景知识建立当前事件模型，并在人物目标、时间或地点发生变化时更新它。事件索引与事件分段观点关注这种更新过程，说明理解为什么超出逐句识字与机械记忆。\n\n## 一个例子\n\n理解用例：故事先写人物离开家，随后写他走进车站。你会更新人物的位置，并把后文的“那里”理解为车站，即使没有重新描述全部场景。\n\n## 理解边界\n\n这些模型较适于简单叙事，复杂论证与说明文还需要其他解释。读者目的、知识和阅读能力影响模型形成，不是文本唯一决定。\n"}, {"id": "cognition-speech-spreading", "title": "言语产生的扩散激活模型", "english": "Spreading-activation theory of speech production", "kind": "模型", "domain": "cognition", "subdomain": "语言产生", "summary": "说话时意义、词汇和语音表征可能并行激活并相互影响。口误为观察这些竞争过程提供线索，揭示流利表达背后的选择与协调。", "aliases": ["Spreading-activation theory of speech production"], "keywords": ["言语产生的扩散激活模型", "Spreading-activation theory of speech production", "语言产生", "口误", "言语", "词汇", "激活", "竞争", "语音"], "questions": ["言语产生的扩散激活模型解释了什么心理现象？", "言语产生的扩散激活模型在什么条件下适用，有什么局限？"], "sources": [{"book": "cognitive", "chapter": "第11章 · 语言产生", "locator": "PDF 第 593–594 页", "pdfPages": [593, 594]}], "candidateRelated": [{"title": "联结主义", "reason": "共享激活传播的建模语言"}, {"title": "WEAVER++言语产生模型", "reason": "二者对串行与交互的假设不同"}], "sections": [{"heading": "核心解释", "text": "Dell的模型以网络激活解释从想表达的意思到词语和声音的产生。相关表征相互传播激活，使某个候选词或音位更可能被选中。语义相关或语音相似的项目有时发生竞争，这帮助解释替换、交换等口误，而不必把每个口误理解为隐藏动机。"}, {"heading": "一个例子", "text": "理解用例：你想说某个水果名，却说出了另一种语义接近的水果；或者把两个词的开头声音交换。这样的错误可反映网络中的竞争与选择。"}, {"heading": "理解边界", "text": "模型对许多口误有解释力，但可能高估层级间的交互。说话还依赖注意、短时保持和自我监控，不能只用词汇网络解释。"}], "markdown": "---\nid: \"cognition-speech-spreading\"\ntitle: \"言语产生的扩散激活模型\"\nenglish: \"Spreading-activation theory of speech production\"\nkind: \"模型\"\ndomain: \"cognition\"\nsubdomain: \"语言产生\"\nsummary: \"说话时意义、词汇和语音表征可能并行激活并相互影响。口误为观察这些竞争过程提供线索，揭示流利表达背后的选择与协调。\"\naliases: [\"Spreading-activation theory of speech production\"]\nkeywords: [\"言语产生的扩散激活模型\", \"Spreading-activation theory of speech production\", \"语言产生\", \"口误\", \"言语\", \"词汇\", \"激活\", \"竞争\", \"语音\"]\nquestions: [\"言语产生的扩散激活模型解释了什么心理现象？\", \"言语产生的扩散激活模型在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"cognitive\", \"chapter\": \"第11章 · 语言产生\", \"locator\": \"PDF 第 593–594 页\", \"pdfPages\": [593, 594]}]\ncandidateRelated: [{\"title\": \"联结主义\", \"reason\": \"共享激活传播的建模语言\"}, {\"title\": \"WEAVER++言语产生模型\", \"reason\": \"二者对串行与交互的假设不同\"}]\n---\n\n## 核心解释\n\nDell的模型以网络激活解释从想表达的意思到词语和声音的产生。相关表征相互传播激活，使某个候选词或音位更可能被选中。语义相关或语音相似的项目有时发生竞争，这帮助解释替换、交换等口误，而不必把每个口误理解为隐藏动机。\n\n## 一个例子\n\n理解用例：你想说某个水果名，却说出了另一种语义接近的水果；或者把两个词的开头声音交换。这样的错误可反映网络中的竞争与选择。\n\n## 理解边界\n\n模型对许多口误有解释力，但可能高估层级间的交互。说话还依赖注意、短时保持和自我监控，不能只用词汇网络解释。\n"}, {"id": "cognition-subliminal", "title": "阈下知觉", "english": "Subliminal perception", "kind": "心理过程", "domain": "cognition", "subdomain": "知觉与意识", "summary": "刺激可能在没有可报告的清晰意识体验时影响表现。研究重点是区分真正无意识加工，与微弱但未被准确报告的意识经验。", "aliases": ["Subliminal perception"], "keywords": ["阈下知觉", "Subliminal perception", "知觉与意识", "无意识", "看不见", "掩蔽", "刺激", "报告", "阈值"], "questions": ["阈下知觉解释了什么心理现象？", "阈下知觉在什么条件下适用，有什么局限？"], "sources": [{"book": "cognitive", "chapter": "第2章 · 视觉知觉的基本过程", "locator": "PDF 第 122–124 页", "pdfPages": [122, 124]}], "candidateRelated": [{"title": "启动效应", "reason": "以表现变化检测此前刺激的影响"}, {"title": "信号检测论", "reason": "帮助区分知觉敏感性与回答标准"}], "sections": [{"heading": "核心解释", "text": "阈下知觉研究通过短暂呈现、掩蔽等方式限制刺激进入意识，再观察辨别或反应是否仍受影响。教材总结了行为和神经成像证据，同时强调意识测量的敏感性：没有报告看到，并不必然等于毫无意识，回答标准、注意和记忆限制都可能造成漏报。"}, {"heading": "一个例子", "text": "理解用例：一个词在画面中短暂出现后立刻被遮挡。参与者说没看清，却对随后相关词反应更快；还需额外测量其实际辨认能力。"}, {"heading": "理解边界", "text": "阈下加工的存在不等于隐蔽信息能够任意控制复杂行为。不同掩蔽方法产生不同结果，研究结论应保留对意识测量和反应偏向的限定。"}], "markdown": "---\nid: \"cognition-subliminal\"\ntitle: \"阈下知觉\"\nenglish: \"Subli 区分权威型、专制型、放任型与忽视型，常以温暖、回应和要求控制组织这些类型。教材报告某些方式与儿童表现的关联，同时强调双向因果：儿童的气质和行为也会影响父母反应，家庭中的作用随时间相互强化或改变。"}, {"heading": "一个例子", "text": "理解用例：两位家长都要求按时完成任务，一位解释规则并回应困难，另一位只要求服从。相同要求强度并不代表相同互动方式。"}, {"heading": "理解边界", "text": "类型是概括工具，不是对家庭的固定评价。相关研究受儿童特征、文化和其他条件影响，应与干预和纵向证据一起判断。"}], "markdown": "---\nid: \"development-parenting\"\ntitle: \"教养方式\"\nenglish: \"Parenting styles\"\nkind: \"概念\"\ndomain: \"development\"\nsubdomain: \"关系与社会发展\"\nsummary: \"教养研究常用温暖与控制来描述互动方式。两种维度的组合比“严格还是宽松”更细，但儿童特征与家庭互动会相互塑造。\"\naliases: [\"Parenting styles\"]\nkeywords: [\"教养方式\", \"Parenting styles\", \"关系与社会发展\", \"教养\", \"温暖\", \"控制\", \"家庭\", \"儿童\", \"双向影响\"]\nquestions: [\"教养方式解释了什么心理现象？\", \"教养方式在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"general\", \"chapter\": \"第12章 · 社会发展\", \"locator\": \"PDF 第 1003–1004 页\", \"pdfPages\": [1003, 1004]}]\ncandidateRelated: [{\"title\": \"实验研究与相关研究\", \"reason\": \"教养关联存在反向与共同原因问题\"}, {\"title\": \"成人依恋的焦虑与回避\", \"reason\": \"照护关系与行为管教有关但并非同一概念\"}]\n---\n\n## 核心解释\n\nBaumrind等研究区分权威型、专制型、放任型与忽视型，常以温暖、回应和要求控制组织这些类型。教材报告某些方式与儿童表现的关联，同时强调双向因果：儿童的气质和行为也会影响父母反应，家庭中的作用随时间相互强化或改变。\n\n## 一个例子\n\n理解用例：两位家长都要求按时完成任务，一位解释规则并回应困难，另一位只要求服从。相同要求强度并不代表相同互动方式。\n\n## 理解边界\n\n类型是概括工具，不是对家庭的固定评价。相关研究受儿童特征、文化和其他条件影响，应与干预和纵向证据一起判断。\n"}, {"id": "development-piaget", "title": "皮亚杰的认知发展理论", "english": "Piaget’s theory of cognitive development", "kind": "理论", "domain": "development", "subdomain": "认知发展", "summary": "儿童在与环境互动中主动组织知识。同化把新经验纳入已有图式，顺应则修改图式；发展因而既是经验增加，也是理解方式改变。", "aliases": ["Piaget’s theory of cognitive development"], "keywords": ["皮亚杰的认知发展理论", "Piaget’s theory of cognitive development", "认知发展", "儿童", "发展", "同化", "顺应", "图式", "阶段"], "questions": ["皮亚杰的认知发展理论解释了什么心理现象？", "皮亚杰的认知发展理论在什么条件下适用，有什么局限？"], "sources": [{"book": "general", "chapter": "第11章 · 身体、思维与语言的发展", "locator": "PDF 第 903–934 页", "pdfPages": [903, 904, 934]}], "candidateRelated": [{"title": "图式", "reason": "发展涉及知识组织方式的形成与调整"}, {"title": "社会文化发展理论", "reason": "两者强调的环境与学习关系不同"}], "sections": [{"headin
