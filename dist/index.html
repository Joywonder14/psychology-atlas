\"自我肯定理论\"\nenglish: \"Self-Affirmation Theory\"\nkind: \"理论\"\ndomain: \"social\"\nsubdomain: \"态度与自我\"\nsummary: \"当某个行为威胁积极自我评价时，人可以通过确认其他重要价值缓解威胁。自我肯定理论强调维护整体自我价值，不只是为受到质疑的行为寻找辩护。\"\naliases: []\nkeywords: [\"自我肯定\", \"自尊\", \"价值\", \"失调\", \"威胁\", \"合理化\", \"自我完整\", \"应对\"]\nquestions: [\"为什么想到其他重要价值能改变对一次失误的反应？\", \"自我肯定与替错误辩护有什么区别？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"第6章 态度行为与合理化\", \"locator\": \"PDF 第 289 页\", \"pdfPages\": [289]}]\ncandidateRelated: [{\"concept\": \"认知失调理论\", \"reason\": \"自我肯定可以缓解其中的威胁\"}, {\"concept\": \"社会计量器假说\", \"reason\": \"从另一路径理解自尊变化\"}]\n---\n\n## 核心解释\n\n教材将自我肯定作为应对失调和自尊威胁的一种方式：个体可以直接处理问题，也可以回顾自己在其他领域的重要价值与良好品质。后者使一次不足不再等于整体自我失败，因而可能减少立即合理化的需要。它强调自我价值的多个来源，而不是反复宣称某项行为正确。\n\n## 一个例子\n\n理解用例：你在合作中犯错后，先承认错误，同时想起自己长期认真帮助同伴。这个用例说明，保留整体自我价值可能让人不必急着否认本次失误。\n\n## 理解边界\n\n自我肯定不等于自夸，也不自动解决实际问题。确认其他价值可能缓解威胁，但不能据此断定原来的行为合理。\n"}, {"id": "social-self-discrepancy", "title": "自我差异理论", "english": "Self-Discrepancy Theory", "kind": "理论", "domain": "social", "subdomain": "自我调节", "summary": "现实中的自己与理想、责任标准之间可能存在差距。自我差异理论区分理想自我与应该自我，用以理解不同的情绪体验和自我调节方向。", "aliases": [], "keywords": ["自我", "理想自我", "应该自我", "现实自我", "差距", "促进", "预防", "调节"], "questions": ["为什么同一次失败会引发沮丧或不安？", "理想自我与应该自我有什么不同？"], "sources": [{"book": "social", "chapter": "第3章 社会自我", "locator": "PDF 第 158 页", "pdfPages": [158]}], "candidateRelated": [{"concept": "陈述性自我", "reason": "包含可以描述的自我认识"}, {"concept": "认知失调理论", "reason": "同样涉及不一致但解释对象不同"}], "sections": [{"heading": "核心解释", "text": "现实自我是对当前自己的认识，理想自我代表希望成为的样子，应该自我代表认为必须履行的责任。教材说明，实际状态与不同标准的差距会关联到不同情绪：未达到理想更容易带来沮丧，未达到责任要求更容易带来不安。相应调节可侧重争取积极结果或避免负面结果。"}, {"heading": "一个例子", "text": "理解用例：同一次作业没有做好，有人难过于未能达到自己期待的水平，也有人担心辜负已经承诺的任务。两人关注的自我标准可能不同。"}, {"heading": "理解边界", "text": "这些标准可以同时存在，情绪也可能混合。不能只凭一次焦虑或失落，就断定是哪一种自我差异造成了反应。"}], "markdown": "---\nid: \"social-self-discrepancy\"\ntitle: \"自我差异理论\"\nenglish: \"Self-Discrepancy Theory\"\nkind: \"理论\"\ndomain: \"social\"\nsubdomain: \"自我调节\"\nsummary: \"现实中的自己与理想、责任标准之间可能存在差距。自我差异理论区分理想自我与应该自我，用以理解不同的情绪体验和自我调节方向。\"\naliases: []\nkeywords: [\"自我\", \"理想自我\", \"应该自我\", \"现实自我\", \"差距\", \"促进\", \"预防\", \"调节\"]\nquestions: [\"为什么同一次失败会引发沮丧或不安？\", \"理想自我与应该自我有什么不同？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"第3章 社会自我\", \"locator\": \"PDF 第 158 页\", \"pdfPages\": [158]}]\ncandidateRelated: [{\"concept\": \"陈述性自我\", \"reason\": \"包含可以描述的自我认识\"}, {\"concept\": \"认知失调理论\", \"reason\": \"同样涉及不一致但解释对象不同\"}]\n---\n\n## 核心解释\n\n现实自我是对当前自己的认识，理想自我代表希望成为的样子，应该自我代表认为必须履行的责任。教材说明，实际状态与不同标准的差距会关联到不同情绪：未达到理想更容易带来沮丧，未达到责任要求更容易带来不安。相应调节可侧重争取积极结果或避免负面结果。\n\n## 一个例子\n\n理解用例：同一次作业没有做好，有人难过于未能达到自己期待的水平，也有人担心辜负已经承诺的任务。两人关注的自我标准可能不同。\n\n## 理解边界\n\n这些标准可以同时存在，情绪也可能混合。不能只凭一次焦虑或失落，就断定是哪一种自我差异造成了反应。\n"}, {"id": "social-self-fulfilling-prophecy", "title": "自我实现预言", "english": "Self-Fulfilling Prophecy", "kind": "心理过程", "domain": "social", "subdomain": "社会互动与预期", "summary": "一个人的预期可能改变他对待别人的方式，并引出符合预期的反应。自我实现预言因此不是准确预见的另一名字，而是信念参与塑造了后来的现实。", "aliases": [], "keywords": ["预言", "预期", "互动", "循环", "行为确认", "刻板印象", "反馈", "自我实现"], "questions": ["我们对他人的预期怎样反过来塑造他人的表现？", "自我实现预言与准确预测有什么区别？"], "sources": [{"book": "social", "chapter": "第10章 刻板印象偏见与歧视", "locator": "PDF 第 486 页", "pdfPages": [486]}], "candidateRelated": [{"concept": "教师期望效应", "reason": "教育中的相关表现"}, {"concept": "确认偏差", "reason": "同样可维持原信念但过程不同"}], "sections": [{"heading": "核心解释", "text": "教材用自我实现预言说明刻板印象如何被维持：个体依据预期对待他人，对方受到这种互动影响后，产生了看似证实预期的行为。例如，预先认为他人冷漠而表现防备，可能让对方也变得疏远。解释关键是预期改变互动，再由互动改变结果，而不只是发现二者相关。"}, {"heading": "一个例子", "text": "理解用例：你以为新成员不愿交流，于是很少邀请他加入讨论；他因此更少发言，你又把沉默当成原判断的证据。用例展示预期可能形成的循环。"}, {"heading": "理解边界", "text": "预期后来应验不自动证明存在自我实现过程。还要区分原本准确的判断，以及预期引发的对待方式是否改变了结果。"}], "markdown": "---\nid: \"social-self-fulfilling-prophecy\"\ntitle: \"自我实现预言\"\nenglish: \"Self-Fulfilling Prophecy\"\nkind: \"心理过程\"\ndomain: \"social\"\nsubdomain: \"社会互动与预期\"\nsummary: \"一个人的预期可能改变他对待别人的方式，并引出符合预期的反应。自我实现预言因此不是准确预见的另一名字，而是信念参与塑造了后来的现实。\"\naliases: []\nkeywords: [\"预言\", \"预期\", \"互动\", \"循环\", \"行为确认\", \"刻板印象\", \"反馈\", \"自我实现\"]\nquestions: [\"我们对他人的预期怎样反过来塑造他人的表现？\", \"自我实现预言与准确预测有什么区别？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"第10章 刻板印象偏见与歧视\", \"locator\": \"PDF 第 486 页\", \"pdfPages\": [486]}]\ncandidateRelated: [{\"concept\": \"教师期望效应\", \"reason\": \"教育中的相关表现\"}, {\"concept\": \"确认偏差\", \"reason\": \"同样可维持原信念但过程不同\"}]\n---\n\n## 核心解释\n\n教材用自我实现预言说明刻板印象如何被维持：个体依据预期对待他人，对方受到这种互动影响后，产生了看似证实预期的行为。例如，预先认为他人冷漠而表现防备，可能让对方也变得疏远。解释关键是预期改变互动，再由互动改变结果，而不只是发现二者相关。\n\n## 一个例子\n\n理解用例：你以为新成员不愿交流，于是很少邀请他加入讨论；他因此更少发言，你又把沉默当成原判断的证据。用例展示预期可能形成的循环。\n\n## 理解边界\n\n预期后来应验不自动证明存在自我实现过程。还要区分原本准确的判断，以及预期引发的对待方式是否改变了结果。\n"}, {"id": "social-self-perception", "title": "自我知觉理论", "english": "Self-Perception Theory", "kind": "理论", "domain": "social", "subdomain": "态度与行为", "summary": "当自己的态度不够清楚时，人可能像观察别人一样，通过行为及其发生条件推断自己喜欢什么。自我知觉理论不把不舒服的冲突作为必需前提。", "aliases": [], "keywords": ["自我知觉", "态度", "行为", "推断", "观察", "外部理由", "偏好", "动机"], "questions": ["为什么观察自己的行动能帮助认识偏好？", "外在奖励会怎样影响我们从行为推断态度？"], "sources": [{"book": "social", "chapter": "第6章 态度行为与合理化", "locator": "PDF 第 305 页", "pdfPages": [305]}], "candidateRelated": [{"concept": "认知失调理论", "reason": "同一结果可能有不同过程"}, {"concept": "陈述性自我", "reason": "形成可以描述的自我认识"}], "sections": [{"heading": "核心解释", "text": "自我知觉理论认为，人可以观察自己做了什么，以及行动是否受到明显外部要求，再由此推断原先不明确的态度。行为因此不只是态度的表达，也能成为认识态度的线索。教材把它与认知失调相比较：态度微弱或含混时，这种推断尤其适用，而强烈冲突常需要另加动机解释。"}, {"heading": "一个例子", "text": "理解用例：你起初说不清自己是否喜欢讲解，却注意到在没有要求时也经常主动帮助同学理解题目，于是推断自己可能喜欢教学。这不必先伴随明显的不适。"}, {"heading": "理解边界", "text": "若行为有强烈奖励或限制，就不宜直接推断内心偏好。自我知觉与失调可能解释不同条件下的变化，不能互相简单取代。"}], "markdown": "---\nid: \"social-self-perception\"\ntitle: \"自我知觉理论\"\nenglish: \"Self-Perception Theory\"\nkind: \"理论\"\ndomain: \"social\"\nsubdomain: \"态度与行为\"\nsummary: \"当自己的态度不够清楚时，人可能像观察别人一样，通过行为及其发生条件推断自己喜欢什么。自我知觉理论不把不舒服的冲突作为必需前提。\"\naliases: []\nkeywords: [\"自我知觉\", \"态度\", \"行为\", \"推断\", \"观察\", \"外部理由\", \"偏好\", \"动机\"]\nquestions: [\"为什么观察自己的行动能帮助认识偏好？\", \"外在奖励会怎样影响我们从行为推断态度？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"第6章 态度行为与合理化\", \"locator\": \"PDF 第 305 页\", \"pdfPages\": [305]}]\ncandidateRelated: [{\"concept\": \"认知失调理论\", \"reason\": \"同一结果可能有不同过程\"}, {\"concept\": \"陈述性自我\", \"reason\": \"形成可以描述的自我认识\"}]\n---\n\n## 核心解释\n\n自我知觉理论认为，人可以观察自己做了什么，以及行动是否受到明显外部要求，再由此推断原先不明确的态度。行为因此不只是态度的表达，也能成为认识态度的线索。教材把它与认知失调相比较：态度微弱或含混时，这种推断尤其适用，而强烈冲突常需要另加动机解释。\n\n## 一个例子\n\n理解用例：你起初说不清自己是否喜欢讲解，却注意到在没有要求时也经常主动帮助同学理解题目，于是推断自己可能喜欢教学。这不必先伴随明显的不适。\n\n## 理解边界\n\n若行为有强烈奖励或限制，就不宜直接推断内心偏好。自我知觉与失调可能解释不同条件下的变化，不能互相简单取代。\n"}, {"id": "social-social-exchange", "title": "社会交换理论", "english": "Social Exchange Theory", "kind": "理论", "domain": "social", "subdomain": "亲密关系", "summary": "社会交换理论从奖励、成本和比较标准理解关系评价。人既会考虑关系满足了什么期待，也会考虑其他可能选择，因此相同关系未必被不同人同样评价。", "aliases": [], "keywords": ["社会交换", "关系", "奖励", "成本", "比较水平", "替代", "满意", "互惠"], "questions": ["为什么相同的关系可能让不同人满意程度不同？", "期待标准与替代关系标准有什么区别？"], "sources": [{"book": "social", "chapter": "第9章 关系与吸引", "locator": "PDF 第 409–410 页", "pdfPages": [409, 410]}], "candidateRelated": [{"concept": "关系承诺投资模型", "reason": "进一步解释承诺与投入"}, {"concept": "互惠利他", "reason": "同样涉及跨时间的合作"}], "sections": [{"heading": "核心解释", "text": "社会交换理论认为，人会寻求能够带来满足的互动，并为获得奖励承担一定成本。教材区分比较水平与替代选择的比较水平：前者是自己期待从关系得到什么，后者是认为其他关系能够提供什么。它们共同帮助解释满意与去留，奖励也可以是陪伴和理解，而不只是物质资源。"}, {"heading": "一个例子", "text": "理解用例：一次合作对某人来说已有足够支持，对另一个人却低于期待，因为两人原先习惯和可选伙伴不同。用例说明关系评价依赖比较标准。"}, {"heading": "理解边界", "text": "模型不要求人每次都清醒算账，也不能概括所有关系规范。教材特别提醒，部分交换解释的适用性会受到文化价值影响。"}], "markdown": "---\nid: \"social-social-exchange\"\ntitle: \"社会交换理论\"\nenglish: \"Social Exchange Theory\"\nkind: \"理论\"\ndomain: \"social\"\nsubdomain: \"亲密关系\"\nsummary: \"社会交换理论从奖励、成本和比较标准理解关系评价。人既会考虑关系满足了什么期待，也会考虑其他可能选择，因此相同关系未必被不同人同样评价。\"\naliases: []\nkeywords: [\"社会交换\", \"关系\", \"奖励\", \"成本\", \"比较水平\", \"替代\", \"满意\", \"互惠\"]\nquestions: [\"为什么相同的关系可能让不同人满意程度不同？\", \"期待标准与替代关系标准有什么区别？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"第9章 关系与吸引\", \"locator\": \"PDF 第 409–410 页\", \"pdfPages\": [409, 410]}]\ncandidateRelated: [{\"concept\": \"关系承诺投资模型\", \"reason\": \"进一步解释承诺与投入\"}, {\"concept\": \"互惠利他\", \"reason\": \"同样涉及跨时间的合作\"}]\n---\n\n## 核心解释\n\n社会交换理论认为，人会寻求能够带来满足的互动，并为获得奖励承担一定成本。教材区分比较水平与替代选择的比较水平：前者是自己期待从关系得到什么，后者是认为其他关系能够提供什么。它们共同帮助解释满意与去留，奖励也可以是陪伴和理解，而不只是物质资源。\n\n## 一个例子\n\n理解用例：一次合作对某人来说已有足够支持，对另一个人却低于期待，因为两人原先习惯和可选伙伴不同。用例说明关系评价依赖比较标准。\n\n## 理解边界\n\n模型不要求人每次都清醒算账，也不能概括所有关系规范。教材特别提醒，部分交换解释的适用性会受到文化价值影响。\n"}, {"id": "social-social-facilitation", "title": "社会助长", "english": "Social Facilitation", "kind": "效应", "domain": "social", "subdomain": "群体表现", "summary": "他人在场可能改善熟练任务的表现，也可能妨碍新颖或困难任务。社会助长关注唤醒与优势反应的联系，因此并不意味着有观众时总会做得更好。", "aliases": ["社会促进", "Social facilitation and social interference", "社会促进与社会干扰"], "keywords": ["社会助长", "观众", "在场", "唤醒", "优势反应", "熟练", "困难", "表现", "社会促进与社会干扰", "Social facilitation and social interference", "他人在场", "紧张"], "questions": ["为什么观众有时帮助表现、有时反而妨碍？", "社会助长与社会惰化有什么不同？", "为什么观众有时让我发挥更好，有时更差？", "社会促进与社会干扰在什么条件下适用，有什么局限？"], "sources": [{"book": "social", "chapter": "第12章 群体", "locator": "PDF 第 606 页", "pdfPages": [606]}, {"book": "general", "chapter": "第13章 · 社会心理学", "locator": "PDF 第 1104–1105 页", "pdfPages": [1104, 1105]}], "candidateRelated": [{"concept": "群体极化", "reason": "同样关注群体情境的影响"}, {"concept": "人与情境交互作用", "reason": "任务条件改变行为结果"}, {"title": "专长、组块与刻意练习", "reason": "熟练程度改变优势反应的质量"}, {"title": "多重资源理论", "reason": "他人在场可能改变注意和协调要求"}], "sections": [{"heading": "核心解释", "text": "教材用优势反应解释他人在场对表现的双向影响：社会情境提高唤醒，使较自然、较熟练的反应更容易出现。简单任务上优势反应往往正确，因此表现改善；新颖困难任务中，最容易出现的反应可能错误，因此表现下降。被评价的担忧等条件还可能加强这种影响。"}, {"heading": "一个例子", "text": "理解用例：熟练弹奏的一段旋律，在朋友观看时可能更流畅；刚学的新曲却可能更容易出错。同样是有人在场，任务熟练程度会改变用例中的预期方向。"}, {"heading": "理解边界", "text": "社会助长与集体任务中的社会惰化不同。前者关注他人在场和任务反应，后者关注个人贡献不易被识别时的努力变化。"}], "markdown": "---\nid: \"social-social-facilitation\"\ntitle: \"社会助长\"\nenglish: \"Social Facilitation\"\nkind: \"效应\"\ndomain: \"social\"\nsubdomain: \"群体表现\"\nsummary: \"他人在场可能改善熟练任务的表现，也可能妨碍新颖或困难任务。社会助长关注唤醒与优势反应的联系，因此并不意味着有观众时总会做得更好。\"\naliases: [\"社会促进\", \"Social facilitation and social interference\", \"社会促进与社会干扰\"]\nkeywords: [\"社会助长\", \"观众\", \"在场\", \"唤醒\", \"优势反应\", \"熟练\", \"困难\", \"表现\", \"社会促进与社会干扰\", \"Social facilitation and social interference\", \"他人在场\", \"紧张\"]\nquestions: [\"为什么观众有时帮助表现、有时反而妨碍？\", \"社会助长与社会惰化有什么不同？\", \"为什么观众有时让我发挥更好，有时更差？\", \"社会促进与社会干扰在什么条件下适用，有什么局限？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"第12章 群体\", \"locator\": \"PDF 第 606 页\", \"pdfPages\": [606]}, {\"book\": \"general\", \"chapter\": \"第13章 · 社会心理学\", \"locator\": \"PDF 第 1104–1105 页\", \"pdfPages\": [1104, 1105]}]\ncandidateRelated: [{\"concept\": \"群体极化\", \"reason\": \"同样关注群体情境的影响\"}, {\"concept\": \"人与情境交互作用\", \"reason\": \"任务条件改变行为结果\"}, {\"title\": \"专长、组块与刻意练习\", \"reason\": \"熟练程度改变优势反应的质量\"}, {\"title\": \"多重资源理论\", \"reason\": \"他人在场可能改变注意和协调要求\"}]\n---\n\n## 核心解释\n\n教材用优势反应解释他人在场对表现的双向影响：社会情境提高唤醒，使较自然、较熟练的反应更容易出现。简单任务上优势反应往往正确，因此表现改善；新颖困难任务中，最容易出现的反应可能错误，因此表现下降。被评价的担忧等条件还可能加强这种影响。\n\n## 一个例子\n\n理解用例：熟练弹奏的一段旋律，在朋友观看时可能更流畅；刚学的新曲却可能更容易出错。同样是有人在场，任务熟练程度会改变用例中的预期方向。\n\n## 理解边界\n\n社会助长与集体任务中的社会惰化不同。前者关注他人在场和任务反应，后者关注个人贡献不易被识别时的努力变化。\n"}, {"id": "social-social-identity", "title": "社会认同理论", "english": "Social Identity Theory", "kind": "理论", "domain": "social", "subdomain": "群际关系", "summary": "人对自我的理解与评价也来自所属群体。社会认同理论把群体地位、成就和内群体偏爱联系起来，说明为何群体的得失可能具有个人意义。", "aliases": ["社会身份理论"], "keywords": ["社会认同", "群体", "身份", "内群体", "自尊", "偏爱", "归属", "最简群体"], "questions": ["为什么群体的成功会让没有直接参与的人自豪？", "群体偏爱一定来自实际资源竞争吗？"], "sources": [{"book": "social", "chapter": "第10章 刻板印象偏见与歧视", "locator": "PDF 第 473–479 页", "pdfPages": [473, 474, 475, 476, 477, 478, 479]}], "candidateRelated": [{"concept": "现实群体冲突理论", "reason": "提供群际冲突的另一解释"}, {"concept": "社会计量器假说", "reason": "同样连接社会关系与自我价值"}], "sections": [{"heading": "核心解释", "text": "社会认同理论认为，个人身份之外，群体归属也构成自我概念和自尊的来源。若群体表现被纳入自我评价，提升群体地位或偏爱群体成员就可能帮助维持积极自我感受。教材将这一解释与最简群体研究相联系，同时讨论借助群体成功获得自豪和面对群体批评时的反应。"}, {"heading": "一个例子", "text": "理解用例：你并未参加校队比赛，却在球队获胜后说“我们赢了”，并更愿意穿校队服装。这个用例展示群体成就如何进入自我体验，而非把所有球迷反应视为相同。"}, {"heading": "理解边界", "text": "群体归属不必然带来外群体敌意。教材也讨论资源竞争和分类过程，不能用单一自尊动机解释所有群际行为。"}], "markdown": "---\nid: \"social-social-identity\"\ntitle: \"社会认同理论\"\nenglish: \"Social Identity Theory\"\nkind: \"理论\"\ndomain: \"social\"\nsubdomain: \"群际关系\"\nsummary: \"人对自我的理解与评价也来自所属群体。社会认同理论把群体地位、成就和内群体偏爱联系起来，说明为何群体的得失可能具有个人意义。\"\naliases: [\"社会身份理论\"]\nkeywords: [\"社会认同\", \"群体\", \"身份\", \"内群体\", \"自尊\", \"偏爱\", \"归属\", \"最简群体\"]\nquestions: [\"为什么群体的成功会让没有直接参与的人自豪？\", \"群体偏爱一定来自实际资源竞争吗？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"第10章 刻板印象偏见与歧视\", \"locator\": \"PDF 第 473–479 页\", \"pdfPages\": [473, 474, 475, 476, 477, 478, 479]}]\ncandidateRelated: [{\"concept\": \"现实群体冲突理论\", \"reason\": \"提供群际冲突的另一解释\"}, {\"concept\": \"社会计量器假说\", \"reason\": \"同样连接社会关系与自我价值\"}]\n---\n\n## 核心解释\n\n社会认同理论认为，个人身份之外，群体归属也构成自我概念和自尊的来源。若群体表现被纳入自我评价，提升群体地位或偏爱群体成员就可能帮助维持积极自我感受。教材将这一解释与最简群体研究相联系，同时讨论借助群体成功获得自豪和面对群体批评时的反应。\n\n## 一个例子\n\n理解用例：你并未参加校队比赛，却在球队获胜后说“我们赢了”，并更愿意穿校队服装。这个用例展示群体成就如何进入自我体验，而非把所有球迷反应视为相同。\n\n## 理解边界\n\n群体归属不必然带来外群体敌意。教材也讨论资源竞争和分类过程，不能用单一自尊动机解释所有群际行为。\n"}, {"id": "social-social-loafing", "title": "社会惰化", "english": "Social Loafing", "kind": "效应", "domain": "social", "subdomain": "群体表现", "summary": "当集体任务中个人贡献难以识别时，个体可能比单独行动时减少努力。社会惰化关注贡献的可见性与重要性感受，而不等于群体成员一定缺乏能力。", "aliases": ["社会懈怠"], "keywords": ["社会惰化", "群体任务", "努力", "贡献", "可识别", "合作", "评价", "责任"], "questions": ["为什么个人贡献难以识别时可能减少努力？", "社会惰化与社会助长为什么不是同一个现象？"], "sources": [{"book": "social", "chapter": "第12章 群体", "locator": "PDF 第 571 页", "pdfPages": [571]}], "candidateRelated": [{"concept": "社会助长", "reason": "关注他人在场与优势反应"}, {"concept": "旁观者效应与责任分散", "reason": "另一个责任分散的相关情境"}], "sections": [{"heading": "核心解释", "text": "社会惰化是个体在群体任务中减少投入的倾向，特别是在个人贡献难以监测和评价时。教材指出，人可能觉得自己的努力对结果并不关键，或认为别人会承担更多工作。这一现象与他人在场提高唤醒的社会助长不同，解释中心是合作任务中努力如何被组织和看见。"}, {"heading": "一个例子", "text": "理解用例：共同整理一份材料时，任务没有明确分工，也看不出谁做了什么，一些成员便减少投入并等别人补齐。用例展示贡献不可识别时的努力变化。"}, {"heading": "理解边界", "text": "团队表现下降不一定来自惰化，也可能是协调困难或任务分工问题。不能把贡献看不见直接等同于某个人懒惰。"}], "markdown": "---\nid: \"social-social-loafing\"\ntitle: \"社会惰化\"\nenglish: \"Social Loafing\"\nkind: \"效应\"\ndomain: \"social\"\nsubdomain: \"群体表现\"\nsummary: \"当集体任务中个人贡献难以识别时，个体可能比单独行动时减少努力。社会惰化关注贡献的可见性与重要性感受，而不等于群体成员一定缺乏能力。\"\naliases: [\"社会懈怠\"]\nkeywords: [\"社会惰化\", \"群体任务\", \"努力\", \"贡献\", \"可识别\", \"合作\", \"评价\", \"责任\"]\nquestions: [\"为什么个人贡献难以识别时可能减少努力？\", \"社会惰化与社会助长为什么不是同一个现象？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"第12章 群体\", \"locator\": \"PDF 第 571 页\", \"pdfPages\": [571]}]\ncandidateRelated: [{\"concept\": \"社会助长\", \"reason\": \"关注他人在场与优势反应\"}, {\"concept\": \"旁观者效应与责任分散\", \"reason\": \"另一个责任分散的相关情境\"}]\n---\n\n## 核心解释\n\n社会惰化是个体在群体任务中减少投入的倾向，特别是在个人贡献难以监测和评价时。教材指出，人可能觉得自己的努力对结果并不关键，或认为别人会承担更多工作。这一现象与他人在场提高唤醒的社会助长不同，解释中心是合作任务中努力如何被组织和看见。\n\n## 一个例子\n\n理解用例：共同整理一份材料时，任务没有明确分工，也看不出谁做了什么，一些成员便减少投入并等别人补齐。用例展示贡献不可识别时的努力变化。\n\n## 理解边界\n\n团队表现下降不一定来自惰化，也可能是协调困难或任务分工问题。不能把贡献看不见直接等同于某个人懒惰。\n"}, {"id": "social-sociometer", "title": "社会计量器假说", "english": "Sociometer Hypothesis", "kind": "理论", "domain": "social", "subdomain": "自我与关系", "summary": "自尊可以被理解为反映社会接纳状况的信号。社会计量器假说把自尊变化与他人是否重视、接纳自己联系起来，而不只看成个人的自我赞许。", "aliases": [], "keywords": ["自尊", "接纳", "排斥", "关系", "社会地位", "自我价值", "归属", "计量器"], "questions": ["为什么他人的接纳会影响我们对自己的看法？", "低自尊一定说明一个人真的被排斥了吗？"], "sources": [{"book": "social", "chapter": "第3章 社会自我", "locator": "PDF 第 158 页", "pdfPages": [158]}], "candidateRelated": [{"concept": "社会认同理论", "reason": "群体关系也能成为自我价值来源"}, {"concept": "拒绝敏感性", "reason": "关注关系威胁线索"}], "sections": [{"heading": "核心解释", "text": "社会计量器假说提出，自尊具有监测关系状态的作用：个体会依据自己是否被接纳、是否受到重视来调整对自我价值的感受。这样，自尊降低可能提示关系受到威胁，使人注意自己的社会处境。教材将这种解释与自尊在不同重要生活领域中的变化联系起来。"}, {"heading": "一个例子", "text": "理解用例：一位同学原本对自己评价稳定，却在连续未被邀请参加小组活动后感到自己不受欢迎。这里可以把自尊变化理解为对接纳线索的回应。"}, {"heading": "理解边界", "text": "自尊还涉及个人重视的领域及文化差异。一次低落不能直接证明真实遭到排斥，也不能据此反推出单一关系原因。"}], "markdown": "---\nid: \"social-sociometer\"\ntitle: \"社会计量器假说\"\nenglish: \"Sociometer Hypothesis\"\nkind: \"理论\"\ndomain: \"social\"\nsubdomain: \"自我与关系\"\nsummary: \"自尊可以被理解为反映社会接纳状况的信号。社会计量器假说把自尊变化与他人是否重视、接纳自己联系起来，而不只看成个人的自我赞许。\"\naliases: []\nkeywords: [\"自尊\", \"接纳\", \"排斥\", \"关系\", \"社会地位\", \"自我价值\", \"归属\", \"计量器\"]\nquestions: [\"为什么他人的接纳会影响我们对自己的看法？\", \"低自尊一定说明一个人真的被排斥了吗？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"第3章 社会自我\", \"locator\": \"PDF 第 158 页\", \"pdfPages\": [158]}]\ncandidateRelated: [{\"concept\": \"社会认同理论\", \"reason\": \"群体关系也能成为自我价值来源\"}, {\"concept\": \"拒绝敏感性\", \"reason\": \"关注关系威胁线索\"}]\n---\n\n## 核心解释\n\n社会计量器假说提出，自尊具有监测关系状态的作用：个体会依据自己是否被接纳、是否受到重视来调整对自我价值的感受。这样，自尊降低可能提示关系受到威胁，使人注意自己的社会处境。教材将这种解释与自尊在不同重要生活领域中的变化联系起来。\n\n## 一个例子\n\n理解用例：一位同学原本对自己评价稳定，却在连续未被邀请参加小组活动后感到自己不受欢迎。这里可以把自尊变化理解为对接纳线索的回应。\n\n## 理解边界\n\n自尊还涉及个人重视的领域及文化差异。一次低落不能直接证明真实遭到排斥，也不能据此反推出单一关系原因。\n"}, {"id": "social-stereotype-threat", "title": "刻板印象威胁", "english": "Stereotype Threat", "kind": "心理过程", "domain": "social", "subdomain": "偏见的影响", "summary": "担心自己的表现会证实关于所属群体的负面看法，可能增加表现压力。刻板印象威胁关注评价情境中的担忧，而不把表现差异直接当作能力差异。", "aliases": [], "keywords": ["刻板印象威胁", "评价", "压力", "群体", "表现", "担忧", "任务", "能力"], "questions": ["为什么担心代表整个群体会影响任务表现？", "低分本身能证明发生了刻板印象威胁吗？"], "sources": [{"book": "social", "chapter": "第11章 生活在偏见世界中", "locator": "PDF 第 556 页", "pdfPages": [556]}], "candidateRelated": [{"concept": "归因模糊性", "reason": "另一种偏见相关心理负担"}, {"concept": "智力的内隐理论", "reason": "涉及能力解释与学习反应"}], "sections": [{"heading": "核心解释", "text": "刻板印象威胁指个体在特定评价场合担心自己的行为会印证群体负面刻板印象。教材说明，这种担忧可以干扰正在进行的任务，使能力与当场表现之间出现差距。理解这一过程需要查看群体刻板印象是否在情境中变得突出，以及评价是否对当事人具有相关意义。"}, {"heading": "一个例子", "text": "理解用例：一位擅长某门课程的学生，在测试前听到关于自己所属群体“不擅长此类题”的说法后，开始担心错误会代表整个群体，注意因此被额外担忧占据。"}, {"heading": "理解边界", "text": "这不是说明群体负面刻板印象正确，也不能解释所有表现差异。不能只凭分数较低就判定发生了刻板印象威胁。"}], "markdown": "---\nid: \"social-stereotype-threat\"\ntitle: \"刻板印象威胁\"\nenglish: \"Stereotype Threat\"\nkind: \"心理过程\"\ndomain: \"social\"\nsubdomain: \"偏见的影响\"\nsummary: \"担心自己的表现会证实关于所属群体的负面看法，可能增加表现压力。刻板印象威胁关注评价情境中的担忧，而不把表现差异直接当作能力差异。\"\naliases: []\nkeywords: [\"刻板印象威胁\", \"评价\", \"压力\", \"群体\", \"表现\", \"担忧\", \"任务\", \"能力\"]\nquestions: [\"为什么担心代表整个群体会影响任务表现？\", \"低分本身能证明发生了刻板印象威胁吗？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"第11章 生活在偏见世界中\", \"locator\": \"PDF 第 556 页\", \"pdfPages\": [556]}]\ncandidateRelated: [{\"concept\": \"归因模糊性\", \"reason\": \"另一种偏见相关心理负担\"}, {\"concept\": \"智力的内隐理论\", \"reason\": \"涉及能力解释与学习反应\"}]\n---\n\n## 核心解释\n\n刻板印象威胁指个体在特定评价场合担心自己的行为会印证群体负面刻板印象。教材说明，这种担忧可以干扰正在进行的任务，使能力与当场表现之间出现差距。理解这一过程需要查看群体刻板印象是否在情境中变得突出，以及评价是否对当事人具有相关意义。\n\n## 一个例子\n\n理解用例：一位擅长某门课程的学生，在测试前听到关于自己所属群体“不擅长此类题”的说法后，开始担心错误会代表整个群体，注意因此被额外担忧占据。\n\n## 理解边界\n\n这不是说明群体负面刻板印象正确，也不能解释所有表现差异。不能只凭分数较低就判定发生了刻板印象威胁。\n"}, {"id": "social-stress-appraisal", "title": "压力的认知评价", "english": "Psychological Stress and Appraisal", "kind": "心理过程", "domain": "social", "subdomain": "压力与健康", "summary": "压力与个体如何比较环境要求和自身资源有关。把同一任务理解为超出能力或尚可应对，可能伴随不同反应，因此压力不只由事件名称决定。", "aliases": [], "keywords": ["压力", "评价", "要求", "资源", "应对", "紧张", "反刍", "情境"], "questions": ["为什么同一任务会让不同人感到不同压力？", "环境要求与资源评价怎样共同参与压力体验？"], "sources": [{"book": "social", "chapter": "应用模块1 社会心理学与健康", "locator": "PDF 第 719 页", "pdfPages": [719]}], "candidateRelated": [{"concept": "知觉控制", "reason": "可影响对应付能力的理解"}, {"concept": "情境解释", "reason": "说明相同事件的不同意义"}], "sections": [{"heading": "核心解释", "text": "教材把心理压力描述为挑战与要求超过自身能力、资源和精力的感受。这个界定把外部要求与主观评价联系起来，也帮助区分短期反应和持续压力。反复回想压力事件可能延长紧张体验；理解压力时因此需要同时观察环境负担、可用资源以及个体对两者关系的判断。"}, {"heading": "一个例子", "text": "理解用例：同一份临近截止日期的作业，对已有资料和同伴支持的人可能仍可管理，对缺少准备与时间的人则可能显得难以应付。用例说明资源评价的重要性。"}, {"heading": "理解边界", "text": "主观评价重要不代表压力完全出于想象。实际工作量和资源限制仍需考虑，这张卡也不用于判断个人健康状况。"}], "markdown": "---\nid: \"social-stress-appraisal\"\ntitle: \"压力的认知评价\"\nenglish: \"Psychological Stress and Appraisal\"\nkind: \"心理过程\"\ndomain: \"social\"\nsubdomain: \"压力与健康\"\nsummary: \"压力与个体如何比较环境要求和自身资源有关。把同一任务理解为超出能力或尚可应对，可能伴随不同反应，因此压力不只由事件名称决定。\"\naliases: []\nkeywords: [\"压力\", \"评价\", \"要求\", \"资源\", \"应对\", \"紧张\", \"反刍\", \"情境\"]\nquestions: [\"为什么同一任务会让不同人感到不同压力？\", \"环境要求与资源评价怎样共同参与压力体验？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"应用模块1 社会心理学与健康\", \"locator\": \"PDF 第 719 页\", \"pdfPages\": [719]}]\ncandidateRelated: [{\"concept\": \"知觉控制\", \"reason\": \"可影响对应付能力的理解\"}, {\"concept\": \"情境解释\", \"reason\": \"说明相同事件的不同意义\"}]\n---\n\n## 核心解释\n\n教材把心理压力描述为挑战与要求超过自身能力、资源和精力的感受。这个界定把外部要求与主观评价联系起来，也帮助区分短期反应和持续压力。反复回想压力事件可能延长紧张体验；理解压力时因此需要同时观察环境负担、可用资源以及个体对两者关系的判断。\n\n## 一个例子\n\n理解用例：同一份临近截止日期的作业，对已有资料和同伴支持的人可能仍可管理，对缺少准备与时间的人则可能显得难以应付。用例说明资源评价的重要性。\n\n## 理解边界\n\n主观评价重要不代表压力完全出于想象。实际工作量和资源限制仍需考虑，这张卡也不用于判断个人健康状况。\n"}, {"id": "social-teacher-expectancy", "title": "教师期望效应", "english": "Teacher Expectancy Effect", "kind": "效应", "domain": "learning", "subdomain": "社会学习环境", "summary": "教师对学生的预期可能通过后续互动影响学生表现。期望效应提示，评价者并非总在被动观察能力，其对待方式也可能参与所观察结果的形成。", "aliases": ["皮格马利翁效应"], "keywords": ["期望", "教师", "学生", "反馈", "互动", "自我实现", "机会", "表现"], "questions": ["教师是预测学生表现，还是也参与塑造表现？", "怎样区分准确判断与自我实现的预言？"], "sources": [{"book": "social", "chapter": "应用模块2 社会心理学与教育", "locator": "PDF 第 722 页", "pdfPages": [722]}, {"book": "social", "chapter": "应用模块2 社会心理学与教育", "locator": "PDF 第 734 页", "pdfPages": [734]}], "candidateRelated": [{"concept": "人格判断的汇聚验证", "reason": "评价是否准确需多种证据"}, {"concept": "信息性社会影响", "reason": "他人的判断可被作为线索"}], "sections": [{"heading": "核心解释", "text": "教材讨论教师相信某些学生将出现能力进步后，学生后续表现发生变化的情形。期望可能进入日常对待方式、机会和反馈，使原本的判断参与塑造结果。理解时要区分准确预测与自我实现：前者是发现已有差异，后者是评价引发的互动又促成了预期结果。"}, {"heading": "一个例子", "text": "理解用例：一位教师预期某名学生能进步，因此更愿意耐心听其回答并给予练习机会；学生随后表现改善。用例展示预期可能通过互动生效的路径。"}, {"heading": "理解边界", "text": "教材指出效应并非普遍同样大，操纵时机与年级会改变结果。还须区分准确预测原有能力和期望本身带来的额外影响。"}], "markdown": "---\nid: \"social-teacher-expectancy\"\ntitle: \"教师期望效应\"\nenglish: \"Teacher Expectancy Effect\"\nkind: \"效应\"\ndomain: \"learning\"\nsubdomain: \"社会学习环境\"\nsummary: \"教师对学生的预期可能通过后续互动影响学生表现。期望效应提示，评价者并非总在被动观察能力，其对待方式也可能参与所观察结果的形成。\"\naliases: [\"皮格马利翁效应\"]\nkeywords: [\"期望\", \"教师\", \"学生\", \"反馈\", \"互动\", \"自我实现\", \"机会\", \"表现\"]\nquestions: [\"教师是预测学生表现，还是也参与塑造表现？\", \"怎样区分准确判断与自我实现的预言？\"]\nsources: [{\"book\": \"social\", \"chapter\": \"应用模块2 社会心理学与教育\", \"locator\": \"PDF 第 722 页\", \"pdfPages\": [722]}, {\"book\": \"social\", \"chapter\": \"应用模块2 社会心理学与教育\", \"locator\": \"PDF 第 734 页\", \"pdfPages\": [734]}]\ncandidateRelated: [{\"concept\": \"人格判断的汇聚验证\", \"reason\": \"评价是否准确需多种证据\"}, {\"concept\": \"信息性社会影响\", \"reason\": \"他人的判断可被作为线索\"}]\n---\n\n## 核心解释\n\n教材讨论教师相信某些学生将出现能力进步后，学生后续表现发生变化的情形。期望可能进入日常对待方式、机会和反馈，使原本的判断参与塑造结果。理解时要区分准确预测与自我实现：前者是发现已有差异，后者是评价引发的互动又促成了预期结果。\n\n## 一个例子\n\n理解用例：一位教师预期某名学生能进步，因此更愿意耐心听其回答并给予练习机会；学生随后表现改善。用例展示预期可能通过互动生效的路径。\n\n## 理解边界\n\n教材指出效应并非普遍同样大，操纵时机与年级会改变结果。还须区分准确预测原有能力和期望本身带来的额外影响。\n"}], "relations": [{"source": "emotion-unfolding-process", "target": "emotion-appraisal", "reason": "展开过程以事件与关切的评价为起点", "kind": "关联阅读"}, {"source": "emotion-unfolding-process", "target": "emotion-regulation-process", "reason": "解释人在展开过程的不同位置如何调节情绪", "kind": "关联阅读"}, {"source": "emotion-james-lange", "target": "emotion-interoception", "reason": "细化对身体内部信号的觉察", "kind": "关联阅读"}, {"source": "emotion-james-lange", "target": "emotion-constructed-emotion", "reason": "同样关注身体体验，但加入概念与情境作用", "kind": "关联阅读"}, {"source": "emotion-affect-timescales", "target": "emotion-temperament", "reason": "解释长期情绪倾向", "kind": "关联阅读"}, {"source": "emotion-affect-timescales", "target": "emotion-affect-as-information", "reason": "心境可以影响与其起因无关的评价", "kind": "关联阅读"}, {"source": "emotion-evolutionary-adaptation", "target": "emotion-disgust", "reason": "进化功能分析的具体案例", "kind": "关联阅读"}, {"source": "emotion-evolutionary-adaptation", "target": "emotion-attachment", "reason": "照料脆弱后代相关的情绪系统", "kind": "关联阅读"}, {"source": "emotion-disgust", "target": "emotion-infrahumanization", "reason": "排斥和去人性化可以在群际关系中相互关联", "kind": "关联阅读"}, {"source": "emotion-disgust", "target": "emotion-social-intuition", "reason": "说明情绪反应如何进入道德判断", "kind": "关联阅读"}, {"source": "emotion-attachment", "target": "emotion-regulation-development", "reason": "安全关系为外部调节向自我调节提供条件", "kind": "关联阅读"}, {"source": "emotion-attachment", "target": "emo       points.set(focus.id,{x:380,y:300,r:30});
      neighbors.forEach((c,i)=>{const a=-Math.PI/2+i*2*Math.PI/Math.max(neighbors.length,1);points.set(c.id,{x:380+245*Math.cos(a),y:300+200*Math.sin(a),r:19})});
      edges=D.relations.filter(e=>(e.source===focus.id||e.target===focus.id)&&points.has(e.source)&&points.has(e.target));
    }else{
      cards=D.cards.filter(c=>!route.graphDomain||c.domain===route.graphDomain);
      const domains=D.domains.filter(d=>cards.some(c=>c.domain===d.id));
      domains.forEach((d,i)=>{
        const a=-Math.PI/2+i*2*Math.PI/Math.max(domains.length,1);
        const center=domains.length===1?{x:550,y:350}:{x:550+360*Math.cos(a),y:350+230*Math.sin(a)};
        const group=cards.filter(c=>c.domain===d.id);
        const radius=domains.length===1?250:Math.min(110,Math.max(65,Math.sqrt(group.length)*17));
        group.forEach((c,j)=>{const theta=j*2.399963;const r=radius*Math.sqrt((j+.6)/group.length);points.set(c.id,{x:center.x+Math.cos(theta)*r*(domains.length===1?1.4:1),y:center.y+Math.sin(theta)*r,r:domains.length===1?10:6+Math.min(related(c.id).length,8)*.45})});
      });
      edges=D.relations.filter(e=>points.has(e.source)&&points.has(e.target));
    }
    const visibleIds=new Set(cards.map(c=>c.id));
    let svg=`<svg class="network-svg ${focus?'focus-network':''}" viewBox="${focus?'0 0 760 620':'0 0 1100 710'}" role="group" aria-label="${focus?esc(focus.title)+'的关联网络':'心理学卡片知识网络'}"><g id="graph-layer" data-cx="${centerX}" data-cy="${centerY}" transform="translate(${centerX} ${centerY}) scale(${zoom}) translate(-${centerX} -${centerY})">`;
    svg+=edges.map(e=>{const a=points.get(e.source),b=points.get(e.target);return `<line class="edge" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" style="${focus?'opacity:.5;stroke-width:1.5':''}"/>`}).join('');
    if(!focus){const domains=D.domains.filter(d=>cards.some(c=>c.domain===d.id));svg+=domains.map((d,i)=>{const a=-Math.PI/2+i*2*Math.PI/domains.length;const x=domains.length===1?550:550+360*Math.cos(a),y=domains.length===1?32:350+230*Math.sin(a)-Math.min(110,Math.max(65,Math.sqrt(cards.filter(c=>c.domain===d.id).length)*17))-19;return `<text class="domain-label" x="${x}" y="${Math.max(y,24)}">${d.name}</text>`}).join('')}
    svg+=cards.map(c=>{const p=points.get(c.id);const center=c.id===focus?.id;const showLabel=!!focus||cards.length<35;return `<g class="node ${center?'center':''}" role="button" tabindex="0" data-focus="${c.id}" aria-label="${esc(c.title)}，${related(c.id).length} 个关联"><title>${esc(c.title)} · ${esc(c.english)}</title><circle cx="${p.x}" cy="${p.y}" r="${p.r}" fill="${byDomain[c.domain].color}" opacity="${center?1:.88}"/>${showLabel?`<text class="node-label" x="${p.x}" y="${p.y+p.r+23}">${esc(c.title.length>(compact?5:13)?c.title.slice(0,compact?4:12)+'…':c.title)}</text>`:''}</g>`}).join('');
    return svg+'</g></svg>';
  }
  function showCard(c){
    const d=byDomain[c.domain];const rel=related(c.id);
    dialog.innerHTML=`<div class="dialog-top"><span class="domain-tag" style="--color:${d.color}"><i class="domain-dot"></i>${d.name} / ${esc(c.subdomain)}</span><div class="dialog-actions"><button class="icon-button" data-action="export-card" aria-label="下载这张卡片的 Markdown">${icon('download')}</button><button class="icon-button" data-action="close-card" aria-label="关闭卡片" autofocus>${icon('close')}</button></div></div><article class="dialog-body" style="--color:${d.color}"><header class="dialog-heading"><span class="kind">${esc(c.kind)}</span><h1 id="dialog-title">${esc(c.title)}</h1><div class="english">${esc(c.english)}</div></header><p class="card-lead">${esc(c.summary)}</p>${c.sections.map(s=>`<section class="detail-section"><h2>${esc(s.heading)}</h2><p>${esc(s.text)}</p></section>`).join('')}<section class="detail-section"><h2>关联知识</h2><div class="dialog-related">${rel.map(r=>`<button class="relation-item" data-card="${r.other}"><strong>${esc(byId[r.other].title)}</strong><span>${esc(r.reason)}</span></button>`).join('')||'<p>后续阅读中继续补充关联。</p>'}</div></section><section class="detail-section"><h2>教材出处</h2>${c.sources.map(s=>{const b=byBook[s.book];return `<div class="source-box"><strong>${esc(b.title)} · ${esc(b.edition)}</strong><p>${esc(s.chapter)}<br>${esc(s.locator)}</p>${location.protocol==='file:'?`<a href="../../books/${encodeURIComponent(b.filename)}${s.pdfPages?.length?'#page='+s.pdfPages[0]:''}" target="_blank" rel="noopener">打开本地原书</a>`:''}</div>`}).join('')}<p class="dialog-note">PDF 页码为文件页序；EPUB 使用章节与小节定位。例子中的“理解用例”为辅助理解的自编情境。</p></section><div class="detail-tags">${(c.keywords||[]).slice(0,8).map(t=>`<button data-search="${esc(t)}">${esc(t)}</button>`).join('')}</div></article><div class="dialog-footer"><button class="button" data-focus="${c.id}">${icon('nodes')}在网络中查看</button><button class="button secondary" data-action="export-card">${icon('download')}下载 Markdown</button></div>`;
    if(!dialog.open){lastFocus=document.activeElement;dialog.showModal();document.body.classList.add('body-lock')}
    dialog.scrollTop=0;
  }
  function render(){
    const view=route.view||'domains';
    document.title=(route.q?'搜索 · ':route.domain&&byDomain[route.domain]?byDomain[route.domain].name+' · ':titles[view]+' · ')+'心理学图谱';
    main.innerHTML=route.q?searchPage():view==='network'?networkPage():view==='collections'?collectionPage():view==='books'?booksPage():home();
    document.getElementById('breadcrumbs').innerHTML=`<span>知识库</span><span class="separator">/</span><strong>${esc(route.q?'搜索':route.domain&&byDomain[route.domain]?byDomain[route.domain].name:titles[view]||titles.domains)}</strong>`;
    document.querySelectorAll('.sidebar [data-view]').forEach(b=>{const active=b.dataset.view===view&&!route.domain&&!route.q;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
    document.querySelectorAll('.sidebar [data-domain]').forEach(b=>{const active=b.dataset.domain===route.domain&&!route.q;b.classList.toggle('active',active);if(active)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
    if(document.activeElement!==searchInput)searchInput.value=route.q||'';
    document.getElementById('search-clear').hidden=!route.q;
    if(route.card&&byId[route.card])showCard(byId[route.card]);
    else if(dialog.open){dialog.close();document.body.classList.remove('body-lock');if(lastFocus?.isConnected)lastFocus.focus()}
  }
  function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2600)}
  function download(filename,text){const url=URL.createObjectURL(new Blob([text],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('Markdown 已准备下载')}
  function cardMarkdown(c){let text=`# ${c.title}\n\n${c.english}\n\n${c.kind} / ${byDomain[c.domain].name} / ${c.subdomain}\n\n${c.summary}\n`;c.sections.forEach(s=>text+=`\n## ${s.heading}\n\n${s.text}\n`);text+='\n## 教材出处\n\n';c.sources.forEach(s=>text+=`- ${byBook[s.book].title}，${byBook[s.book].edition}；${s.chapter}；${s.locator}\n`);if(related(c.id).length){text+='\n## 关联知识\n\n';related(c.id).forEach(r=>text+=`- ${byId[r.other].title}：${r.reason}\n`)}return text}
  function exportAll(){let text=`# 心理学图谱\n\n更新：${D.updated}\n\n${D.books.length} 本教材 · ${D.cards.length} 张卡片 · ${D.chapters.length} 个章节与模块\n\n`;D.domains.forEach(d=>{text+=`\n# ${d.name}\n\n`;D.cards.filter(c=>c.domain===d.id).forEach(c=>text+=cardMarkdown(c).replace(/^#/gm,'##')+'\n---\n')});download('心理学知识库.md',text)}
  function closeMenu(){document.getElementById('sidebar').classList.remove('open');document.querySelector('[data-action="menu"]').setAttribute('aria-expanded','false')}
  function clickHandler(event){
    const el=event.target.closest('[data-view],[data-domain],[data-sub],[data-card],[data-search],[data-collection],[data-focus],[data-action]');if(!el)return;
    if(el.dataset.view){limit=24;zoom=1;navigate({view:el.dataset.view});closeMenu();window.scrollTo(0,0)}
    else if(el.dataset.domain){limit=24;navigate({view:'domains',domain:el.dataset.domain});closeMenu();window.scrollTo(0,0)}
    else if('sub' in el.dataset){limit=24;navigate({view:'domains',domain:route.domain,sub:el.dataset.sub})}
    else if(el.dataset.card){navigate({...route,card:el.dataset.card})}
    else if(el.dataset.search){limit=24;searchInput.value=el.dataset.search;navigate({view:'domains',q:el.dataset.search});window.scrollTo(0,0)}
    else if(el.dataset.collection){limit=24;navigate({view:'collections',collection:el.dataset.collection});window.scrollTo(0,0)}
    else if(el.dataset.focus){zoom=1;navigate({view:'network',focus:el.dataset.focus});window.scrollTo(0,0)}
    else {switch(el.dataset.action){
      case'menu':document.getElementById('sidebar').classList.toggle('open');el.setAttribute('aria-expanded',document.getElementById('sidebar').classList.contains('open'));break;
      case'close-menu':closeMenu();break;
      case'close-card':{const{card,...rest}=route;navigate(rest,true);break}
      case'clear-search':searchInput.value='';limit=24;navigate({view:'domains'},true);searchInput.focus();break;
      case'load-more':limit+=24;render();break;
      case'export-all':exportAll();break;
      case'export-card':if(byId[route.card])download(byId[route.card].title+'.md',cardMarkdown(byId[route.card]));break;
      case'zoom-in':zoom=Math.min(zoom+.2,2);updateZoom();break;
      case'zoom-out':zoom=Math.max(zoom-.2,.6);updateZoom();break;
      case'graph-reset':zoom=1;navigate({view:'network'});break;
    }}
  }
  function updateZoom(){const layer=document.getElementById('graph-layer');if(layer){const{x,y}={x:layer.dataset.cx,y:layer.dataset.cy};layer.setAttribute('transform',`translate(${x} ${y}) scale(${zoom}) translate(-${x} -${y})`)}}
  document.addEventListener('click',clickHandler);
  document.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();if(dialog.open){const{card,...rest}=route;navigate(rest,true)}searchInput.focus();searchInput.select()}if((event.key==='Enter'||event.key===' ')&&event.target.matches('g.node')){event.preventDefault();event.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
  searchInput.addEventListener('input',()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{limit=24;navigate({view:'domains',q:searchInput.value.trim()},true)},180)});
  document.getElementById('search-form').addEventListener('submit',event=>{event.preventDefault();clearTimeout(searchTimer);limit=24;navigate({view:'domains',q:searchInput.value.trim()},true)});
  document.addEventListener('change',event=>{if(event.target.id==='network-domain'){zoom=1;navigate({view:'network',graphDomain:event.target.value})}});
  dialog.addEventListener('cancel',event=>{event.preventDefault();const{card,...rest}=route;navigate(rest,true)});
  dialog.addEventListener('click',event=>{if(event.target===dialog){const box=dialog.getBoundingClientRect();if(event.clientX<box.left||event.clientX>box.right||event.clientY<box.top||event.clientY>box.bottom){const{card,...rest}=route;navigate(rest,true)}}});
  window.addEventListener('hashchange',()=>{route=readRoute();render()});
  render();
  if(['localhost','127.0.0.1'].includes(location.hostname)){
    fetch('/__version').then(r=>r.ok?r.json():null).then(first=>{
      if(!first)return;
      setInterval(()=>fetch('/__version',{cache:'no-store'}).then(r=>r.json()).then(next=>{if(next.version!==first.version)location.reload()}).catch(()=>{}),2500);
    }).catch(()=>{});
  }
})();
</script>
</body>
